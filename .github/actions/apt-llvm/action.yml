name: apt.llvm.org tool
description: Installs one version-pinned LLVM tool from apt.llvm.org.

inputs:
  tool:
    description: The tool to install, unversioned. clang-format, clang-tidy.
    required: true
  major:
    description: The LLVM major version to pin it to.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        . /etc/os-release
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
          sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-${{ inputs.major }} main" |
          sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y "${{ inputs.tool }}-${{ inputs.major }}"
