name: node
description: Installs the Node .nvmrc names, the one version every job runs.

inputs:
  cache:
    description: setup-node's `cache`, `pnpm` where the workspace's dependencies follow.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache }}
