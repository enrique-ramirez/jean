# Nothing in the ordinary build runs the generator, so a spec edit and the committed types
# drifting apart is exactly what would otherwise go unnoticed. The conformance suite is not run
# here: it drives a player over HTTP, and there is no player on a runner. `contract/README.md`
# is the rest.
#
# `types` waits on `gate`, which skips it for a push whose head commit is the one scripts/release.sh
# makes: it changes one line of contract/openapi.yaml, and only once the checks on its parent were
# green. .github/actions/release-commit is what recognises that commit.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.commit.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: commit
        uses: ./.github/actions/release-commit

  types:
    needs: gate
    if: needs.gate.outputs.release == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pnpm-install

      - run: pnpm types:api

      - name: the committed types still match the contract
        run: git diff --exit-code
