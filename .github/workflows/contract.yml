# Nothing in the ordinary build runs the generator, so a spec edit and the committed types
# drifting apart is exactly what would otherwise go unnoticed. The conformance suite is not run
# here: it drives a player over HTTP, and there is no player on a runner. `contract/README.md`
# is the rest.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm types:api

      - name: the committed types still match the contract
        run: git diff --exit-code
