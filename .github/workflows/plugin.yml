# foo_jean's own suite, which nothing else here runs: `contract.yml` checks the generated types and
# `site.yml` builds the page. src/core/ and tests/ compile on any machine, so a runner covers them.
# src/fb2k/ does not: it needs the foobar2000 SDK and an operating system the plugin runs on, so the
# `windows` and `macos` jobs build it the way release.yml does. scripts/build.ps1 lints the Windows
# build with clang-tidy afterwards and the `macos` job lints src/fb2k/ with scripts/lint.sh.

name: plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugins/fb2k/**'
      - 'contract/openapi.yaml'
      - 'contract/docs/**'
      - '.github/workflows/plugin.yml'
      - '.github/actions/windows-llvm/**'
      - '.github/actions/apt-llvm/**'
      - '.github/actions/pnpm-install/**'
  pull_request:
    paths:
      - 'plugins/fb2k/**'
      - 'contract/openapi.yaml'
      - 'contract/docs/**'
      - '.github/workflows/plugin.yml'
      - '.github/actions/windows-llvm/**'
      - '.github/actions/apt-llvm/**'
      - '.github/actions/pnpm-install/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # scripts/lint.sh carries the authoritative pin and refuses any other major, so this follows it.
  llvm_major: '23'

jobs:
  address-sanitizer:
    runs-on: ubuntu-24.04
    env:
      JEAN_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-address-gcc-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-address-gcc-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-

      - run: plugins/fb2k/scripts/fetch-opus.sh
      - run: plugins/fb2k/scripts/test.sh --sanitize=address

      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-address-gcc-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-${{ github.run_id }}

  thread-sanitizer:
    runs-on: ubuntu-24.04
    env:
      JEAN_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-thread-gcc-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-thread-gcc-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-

      - run: plugins/fb2k/scripts/fetch-opus.sh
      - run: plugins/fb2k/scripts/test.sh --sanitize=thread

      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-thread-gcc-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-${{ github.run_id }}

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/apt-llvm
        with:
          tool: clang-format
          major: ${{ env.llvm_major }}

      # Nothing is compiled here, so this needs neither the codec sources nor a compiler.
      - run: CLANG_FORMAT="clang-format-$llvm_major" plugins/fb2k/scripts/format.sh --check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/lint.sh finds clang-tidy-$llvm_major on its own and refuses anything else, and
      # clang-tidy-cache preprocesses each file with clang++ of the same major to key its cache.
      - uses: ./.github/actions/apt-llvm
        with:
          tool: clang-tidy clang
          major: ${{ env.llvm_major }}

      - run: plugins/fb2k/scripts/fetch-opus.sh

      - run: plugins/fb2k/scripts/fetch-ctcache.sh

      # Restored and saved apart, so a run with a finding still keeps every clean file's entry.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/fb2k/bin/ctcache
          key: ctcache-${{ runner.os }}-llvm${{ env.llvm_major }}-${{ hashFiles('plugins/fb2k/.clang-tidy', 'plugins/fb2k/tests/.clang-tidy', 'plugins/fb2k/src/fb2k/.clang-tidy') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ctcache-${{ runner.os }}-llvm${{ env.llvm_major }}-${{ hashFiles('plugins/fb2k/.clang-tidy', 'plugins/fb2k/tests/.clang-tidy', 'plugins/fb2k/src/fb2k/.clang-tidy') }}-
            ctcache-${{ runner.os }}-llvm${{ env.llvm_major }}-

      - run: plugins/fb2k/scripts/lint.sh

      # ctcache touches an entry on every hit, so anything older than this run is one no file asked for.
      - if: ${{ !cancelled() }}
        run: find plugins/fb2k/bin/ctcache -type f -mmin +120 -delete

      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/fb2k/bin/ctcache
          key: ctcache-${{ runner.os }}-llvm${{ env.llvm_major }}-${{ hashFiles('plugins/fb2k/.clang-tidy', 'plugins/fb2k/tests/.clang-tidy', 'plugins/fb2k/src/fb2k/.clang-tidy') }}-${{ github.run_id }}-${{ github.run_attempt }}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pnpm-install

      - run: pnpm --dir ui build

      - run: node plugins/fb2k/scripts/embed-ui.mjs

      - run: .\scripts\fetch-sdk.ps1
        working-directory: plugins/fb2k

      - run: .\scripts\fetch-wtl.ps1
        working-directory: plugins/fb2k

      - run: .\scripts\fetch-opus.ps1
        working-directory: plugins/fb2k

      - uses: ./.github/actions/windows-llvm

      - run: .\scripts\build.ps1 -Project src\foo_jean.vcxproj
        working-directory: plugins/fb2k

      # Windows Server images carry Media Foundation's AAC encoder only if the feature is installed, so
      # the suite may say "unavailable on this machine" here; "no AAC encoder is built into this suite"
      # means the SDK was not fetched.
      - run: |
          .\scripts\test.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\suite.log"
          $line = Select-String -Path "$env:RUNNER_TEMP\suite.log" -Pattern 'AAC (tested|not tested)' |
            Select-Object -First 1 -ExpandProperty Line
          Write-Host "AAC line: $line"
          if ($line -notmatch "AAC tested through this platform's codec\.|unavailable on this machine") {
            throw 'The suite did not test AAC and did not report the encoder unavailable.'
          }
        working-directory: plugins/fb2k

  macos:
    runs-on: macos-15
    env:
      JEAN_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pnpm-install

      - run: pnpm --dir ui build

      - run: node plugins/fb2k/scripts/embed-ui.mjs

      - run: plugins/fb2k/scripts/fetch-sdk.sh

      - run: plugins/fb2k/scripts/fetch-opus.sh

      - run: plugins/fb2k/scripts/build-mac.sh

      - run: brew install ccache

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-plain-appleclang-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-plain-appleclang-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-

      # AudioToolbox is on every macOS runner, so anything but the "tested" line means the suite
      # was built without it. `shell: bash` adds -o pipefail, which the default shell lacks, so a
      # failing suite fails the pipe rather than tee's exit status hiding it.
      - shell: bash
        run: |
          plugins/fb2k/scripts/test.sh | tee "$RUNNER_TEMP/suite.log"
          grep -F "AAC tested through this platform's codec." "$RUNNER_TEMP/suite.log"

      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-plain-appleclang-${{ hashFiles('plugins/fb2k/scripts/lib/compile-flags.sh', 'plugins/fb2k/scripts/lib/tests.mk') }}-${{ github.run_id }}

      # Homebrew keeps the newest LLVM under `llvm` and adds `llvm@N` only once N+1 is out. Both are
      # keg-only, and scripts/lint.sh looks in each and refuses any major but $llvm_major.
      - run: brew install "llvm@$llvm_major" || brew install llvm

      - run: plugins/fb2k/scripts/lint.sh plugins/fb2k/src/fb2k/*.cpp
