# foo_jean's own suite, which nothing else here runs: `contract.yml` checks the generated types and
# `site.yml` builds the page. src/core/ and tests/ compile on any machine, so a runner covers them.
# src/fb2k/ does not: it needs the foobar2000 SDK and Windows, and `plugins/fb2k/CONTRIBUTING.md`
# says a change there is reviewed rather than tested until scripts/build.ps1 has run.
#
# The runner is pinned to a release rather than ubuntu-latest because apt.llvm.org publishes one
# channel per Ubuntu codename, and the lint job installs from it.

name: plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugins/fb2k/**'
      - 'contract/openapi.yaml'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'plugins/fb2k/**'
      - 'contract/openapi.yaml'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: plugins/fb2k/scripts/fetch-opus.sh

      - run: plugins/fb2k/scripts/test.sh

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # scripts/lint.sh refuses any clang-tidy but the one version this tree is clean against, and
      # Ubuntu's own archive carries an older one.
      - name: clang-tidy from apt.llvm.org
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y clang-tidy-23

      - run: plugins/fb2k/scripts/fetch-opus.sh

      - run: plugins/fb2k/scripts/lint.sh
