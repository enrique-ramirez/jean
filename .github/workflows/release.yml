# Builds ui/, compiles it into foo_jean.dll and packages foo_jean.fb2k-component, on the Windows
# toolchain src/fb2k/ needs; plugin.yml's `windows` job builds and lints the same way on every change.
# Every push to main uploads the component as a workflow artifact; a v* tag also publishes it as
# a GitHub Release, once scripts/release-tag.sh confirms the tag names the version
# plugins/fb2k/src/core/version.h carries. That check runs first, on the Windows runner's own
# bash, so a wrong tag fails before any of the build below runs rather than after. contract.yml
# is where the Node setup below is copied from.

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: github.ref_type == 'tag'
        shell: bash
        run: bash plugins/fb2k/scripts/release-tag.sh "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --dir ui build

      - run: .\scripts\fetch-sdk.ps1
        working-directory: plugins/fb2k

      - run: .\scripts\fetch-wtl.ps1
        working-directory: plugins/fb2k

      - run: .\scripts\fetch-opus.ps1
        working-directory: plugins/fb2k

      - uses: ./.github/actions/windows-llvm

      # Embeds ui/dist as a Windows resource before compiling; see scripts/embed-ui.ps1.
      - run: .\scripts\build.ps1 -Project src\foo_jean.vcxproj
        working-directory: plugins/fb2k

      - run: .\scripts\package.ps1
        working-directory: plugins/fb2k

      # archive: false uploads dist/foo_jean.fb2k-component as itself, not zipped a second time.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: plugins/fb2k/dist/foo_jean.fb2k-component
          archive: false

  # Its own job for the same reason as release below: the OIDC token that signs the provenance
  # reaches nothing that builds the DLL or can write to the repository.
  attest:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foo_jean.fb2k-component
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/foo_jean.fb2k-component

  # A separate job, so contents: write reaches gh release create and nothing that fetches, builds
  # or packages the DLL.
  release:
    needs: [build, attest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foo_jean.fb2k-component
          path: dist

      - working-directory: dist
        run: sha256sum foo_jean.fb2k-component > SHA256SUMS

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/foo_jean.fb2k-component dist/SHA256SUMS --generate-notes
