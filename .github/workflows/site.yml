# Publishes the landing page and the demo together. `site/CLAUDE.md` is what the page is
# built out of, and why it is built at all.

name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned here rather than through a `packageManager` field, which would also start policing
      # every local pnpm the repo is used with.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typechecked before it is bundled, the way `pnpm build` does it: Vite never typechecks, so
      # nothing else would.
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
