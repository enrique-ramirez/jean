  /queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: The play queue, in the player's own order.
      description: |
        Every queued entry, in the order the player will play them, with the fields a client draws a row from and the revision they were read at. `revision` is `GET /state`'s `queueRevision` as of this read: refetch when the one a client holds has moved, and not otherwise.

        A queued library track carries `libraryPath` and no `location`. A queued playlist row carries `location`, and `libraryPath` too where the media library also holds that track. Either may be missing on its own, and both are missing for a track queued from a playlist row or a whole playlist since removed: the core keeps such an entry rather than dropping it, so this reports it with `location: null` rather than a stale position.

        Naming a detached session, this is that session's queue, read at its own revision: the `queueRevision` a poll naming the session answers. Every entry's `location` is `null`, since a session holds what it queued by handle and not by a playlist row.

        **`cover`.** A request that names roles as query parameters beside the route's own, as `GET /library/summary` takes them, gets a `cover` on every entry: the library-relative path `GET /artwork?track=` takes, of the cover track of the row's album, or `null` where the media library does not hold the row, where the declaration does not hold a role's expression, or where no snapshot is ready. A request naming no role gets no `cover` at all. The roles are the ones `GET /library/search` takes; a role that is unknown, empty or named twice is a `400` as it is there.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/RoleTrackNumber"
        - $ref: "#/components/parameters/RoleDiscNumber"
        - $ref: "#/components/parameters/RoleTitle"
        - $ref: "#/components/parameters/RoleArtist"
        - $ref: "#/components/parameters/RoleAlbum"
        - $ref: "#/components/parameters/RoleAlbumArtist"
        - $ref: "#/components/parameters/RoleDuration"
        - $ref: "#/components/parameters/RolePlayCount"
        - $ref: "#/components/parameters/RoleLastPlayed"
        - $ref: "#/components/parameters/RoleRating"
        - $ref: "#/components/parameters/RoleYear"
        - $ref: "#/components/parameters/RoleGenre"
        - $ref: "#/components/parameters/RoleCodec"
        - $ref: "#/components/parameters/RoleBitrate"
        - $ref: "#/components/parameters/RolePlayCountLocal"
        - $ref: "#/components/parameters/RoleLastPlayedLocal"
        - $ref: "#/components/parameters/RoleAdded"
        - $ref: "#/components/parameters/RoleArtists"
        - $ref: "#/components/parameters/RoleArtistIds"
        - $ref: "#/components/parameters/RoleAlbumArtists"
        - $ref: "#/components/parameters/RoleAlbumArtistIds"
        - $ref: "#/components/parameters/RoleArtistSort"
      responses:
        "200":
          description: The queue, read whole.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueRead" }
              examples:
                default:
                  value:
                    revision: 4
                    entries:
                      - title: Imaginary Track
                        artist: Fictional Artist
                        duration: 214.5
                        album: Imaginary Album
                        albumArtist: Various Fictional Artists
                        libraryPath: "Fictional Artist/Imaginary Album/01 Track.flac"
                        location: null
                      - title: Another Track
                        artist: Another Artist
                        duration: 187.0
                        album: Another Album
                        albumArtist: Another Artist
                        libraryPath: null
                        location: { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, index: 7 }
        "400": { $ref: "#/components/responses/LibraryRefused" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
    post:
      tags: [queue]
      operationId: queueTracks
      summary: Queue playlist rows or library tracks.
      description: |
        Takes exactly one of two bodies, named below: `QueuePlaylistRowsRequest` queues rows from a user's playlist, by position; `QueueLibraryTracksRequest` queues tracks from the media library, by handle, resolved against `structure` the same way `POST /playlists/{id}/items` resolves a fill. Naming fields from both, or from neither, is a `400`.

        A position or an ordinal repeated in the request is queued twice, exactly as foobar2000's own *Add to playback queue* allows for a row. One job either way, so a multi-select is never left half-queued.

        Omit `at` to queue at the end. Send it with `revision`, the queue revision it was chosen against from `GET /state`'s `queueRevision`, to queue at that position instead; `at` without `revision` is a `400`, decided here rather than by the player.

        Whether `playlistId` names a playlist, and whether a row or `at` names a position past what it addresses -- a row past the playlist's end, `at` past the queue's end -- are answered by the player rather than judged here: only it knows which playlists exist and how many rows or queue entries each holds. A `structure` that has moved is a `409`, the same as a fill's.

        Naming a detached session, the tracks join that session's queue and no other, taken by handle when the request is answered, and `revision` is that session's `queueRevision`. A session's queue holds at most 10000 entries.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/QueuePlaylistRowsRequest"
                - $ref: "#/components/schemas/QueueLibraryTracksRequest"
            examples:
              atTheEnd:
                summary: Three rows, queued in the order clicked.
                value: { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, positions: [7, 2, 5] }
              atAPosition:
                summary: One row, queued second in the queue.
                value:
                  playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
                  positions: [4]
                  at: 1
                  revision: 9
              libraryTracks:
                summary: Three library tracks, queued in the order clicked, by handle.
                value: { structure: 41, ordinals: [9, 0, 1] }
      responses:
        "204":
          description: Queued.
        "400":
          description: |
            The component judged the request for itself before the player was involved -- a body that is not JSON, a body naming both a playlist and the library or naming neither, a missing or unusable `playlistId`, an empty or unusable `positions`, an ordinal set that is not exactly one of `runs`, `bitset` and `ordinals` or that is empty, an ordinal outside the library while its `structure` is still the current one, or an `at` sent without a `revision` -- or the player found a row or `at` past the end of what it addresses. The schemas below tell the two apart.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404":
          description: |
            No playlist has that id, or `session` names no session this device may see. The `error` string tells them apart, and the second answers in the same bytes as `NoSuchSession`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PlaylistFailed"
                  - $ref: "#/components/schemas/Error"
              examples:
                noSuchPlaylist:
                  value: { error: no such playlist, detail: "" }
                noSuchSession:
                  value: { error: no such session }
        "409":
          description: |
            Either the `structure` a library-tracks request named has moved -- tracks were added to or removed from the library, so every ordinal it carries has shifted -- or `at` was sent with a `revision` the queue has moved past or never reached. `error` tells the two apart: re-read `GET /state`'s `library.structure` and resolve the ordinals again for the first, or re-read `GET /queue` and try again for the second. Naming a detached session, a request that would take its queue past 10000 entries is refused whole, and changes nothing.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PlaylistFailed"
                  - $ref: "#/components/schemas/Error"
              examples:
                restructured:
                  value: { error: "tracks were added or removed; read the state and ask again", detail: "" }
                queueMoved:
                  value: { error: "the queue changed since that revision; read it again", detail: "" }
                sessionQueueFull:
                  value: { error: "the session's queue is full" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: |
            The queue is not available in this build, or, for a library-tracks request, the media library is not available or its first snapshot has not been built yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
    delete:
      tags: [queue]
      operationId: clearQueue
      summary: Empty the queue.
      description: |
        Removes every entry. Emptying the queue means the same thing against any view of it, so this carries no revision and is never refused for one that has moved. Naming a detached session, it empties that session's queue and no other.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Cleared.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }

  /queue/move:
    post:
      tags: [queue]
      operationId: moveQueueEntry
      summary: Move one queue entry.
      description: |
        Takes the entry out at `from` and puts it back at `to`, its index once the queue is that one entry shorter -- the same plan Jean's queue panel makes for a drag. `revision` is the queue revision the move was planned against, from `GET /state`'s `queueRevision` or `GET /queue`'s own `revision`, and is required: unlike `POST /queue`'s `at`, a move has no "the end" to fall back to that needs no revision. Naming a detached session, it moves an entry in that session's queue, and `revision` is that session's `queueRevision`.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveQueueRequest" }
            examples:
              default:
                summary: The fourth entry, moved to the head.
                value: { from: 3, to: 0, revision: 9 }
      responses:
        "204":
          description: Moved.
        "400":
          description: |
            The component judged the request for itself before the player was involved -- a body that is not JSON, or a missing or unusable `from`, `to` or `revision` -- or the player found `from` or `to` past the end of the queue.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "409":
          description: |
            `revision` is not the queue's current one: it has moved past what a client planned this against, or has not reached it yet. Re-read `GET /queue` and try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }

