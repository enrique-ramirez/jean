  /library/summary:
    get:
      tags: [library]
      operationId: getLibrarySummary
      summary: The numbers and shelves Home draws, computed from the held snapshot.
      description: |
        One small document about the whole library: its size and span, its top genres, its most played album, artist and tracks, and a few shelves of albums. It is computed from the snapshot the component already holds, so it formats nothing and walks no files, and it is the widest of the aggregate routes here, beside the runs, the values, the credits and the four set questions.

        Each query parameter names one **role**, what a declared column means to the summary, and its value is a title-formatting expression the client declared through `POST /library/rows`. The component reads the column it already holds under that expression. A role left out is unresolved on every track: a summary with no play count has no plays, and no shelf that needs one.

        **Albums.** Two tracks belong to one album exactly when their album tags match and their credited artists match. The credited artist is the album artist, or the artist where there is no album artist. Two tags match when their keys are equal, and a key is the tag with leading and trailing whitespace removed, lower-cased as ECMAScript's `String.prototype.toLowerCase` does, and with every run of whitespace replaced by one space. An album's `album` and `artist` are the spellings carried by the track with the lowest dictionary id for that tag, the album artist's before the artist's. The `cover` of an album is the library-relative path of its first track by disc, then track number, then ordinal, and `null` where it has none. `ordinals` lists every track of the album in ascending order, at the document's `structure`.

        **Timestamps.** A timestamp tag reads as `YYYY-MM-DD HH:MM:SS`, optionally followed by spaces, in the local time of the machine the component runs on. Anything else in that tag is no timestamp, and reads as `0`. Every timestamp in the document is milliseconds since the epoch.

        **Windows.** The windows below are measured against the component's clock at the moment the document is computed: recently played is 30 days, recently added 28 days, and not played for a year and a half is 1.5 years of 365.25 days.

        **Shelves.** `shelves` holds, in this order, `added`, `recent`, `top`, `rated`, `loved`, `upgrade` and `unopened`, only those that reach their minimum, each with at most 24 albums in the order the shelf means. A shelf's membership, order and minimum are the component's own and are not parameters; the conformance cases hold them. `added` and `recent` are measured by the windows above. Where no other shelf appears, `starter` does: up to 24 albums in the order the library first presents them, shuffled by Fisher-Yates over SplitMix64 seeded with the local calendar date as the integer `YYYYMMDD` and nothing else. Two documents on one date over the same albums give the same order, whatever was played or edited between them.

        **Held per day.** A document is computed at most once per pair, role set and calendar day on the machine the component runs on, and served from what is held after that. Two requests arriving together for a document not yet held compute it once. The `ETag` names the pair, the role set, the date and the coding, so a pair that moves or a date that changes gives a new one and a request repeating it is answered `304`.

        **Refusals come in this order.** A role that is unknown, empty or named twice in two spellings is a `400`; a byte-identical pair sent twice is collapsed by the server before the component sees it and is accepted. A component that does not serve the media library is a `503`. The route's own budget is a `429`: a burst of 200, refilling one every 50 milliseconds, a budget of its own, and a request refused for what it asks spends nothing. A component with no snapshot ready, or one that was not built with a declared role's expression, answers `202` and starts no build; the client declares through `POST /library/rows` and asks again when `GET /state` reports the library ready. An expression the declaration does not hold is a `409` naming it.
      parameters:
        - { name: genres, in: query, required: false, description: "`true` adds `genres`, every genre of the library with its track count and up to two cover tracks, to the document. `false` or absent leaves it out. Any other value is a `400`, `unacceptable question`. The `ETag` names it.", schema: { type: boolean } }
        - $ref: "#/components/parameters/RoleTrackNumber"
        - $ref: "#/components/parameters/RoleDiscNumber"
        - $ref: "#/components/parameters/RoleTitle"
        - $ref: "#/components/parameters/RoleArtist"
        - $ref: "#/components/parameters/RoleAlbum"
        - $ref: "#/components/parameters/RoleAlbumArtist"
        - $ref: "#/components/parameters/RoleDuration"
        - $ref: "#/components/parameters/RolePlayCount"
        - $ref: "#/components/parameters/RoleLastPlayed"
        - $ref: "#/components/parameters/RoleRating"
        - $ref: "#/components/parameters/RoleYear"
        - $ref: "#/components/parameters/RoleGenre"
        - $ref: "#/components/parameters/RoleCodec"
        - $ref: "#/components/parameters/RoleBitrate"
        - $ref: "#/components/parameters/RolePlayCountLocal"
        - $ref: "#/components/parameters/RoleLastPlayedLocal"
        - $ref: "#/components/parameters/RoleAdded"
      responses:
        "200":
          description: |
            The summary. `Cache-Control` is `private, no-cache`, and `Content-Encoding` is `gzip` whenever the request offered it. See *Compression*.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`."
            Content-Encoding:
              schema: { type: string, enum: [gzip] }
              description: Present only when the request offered gzip. Absent means the bytes as they stand.
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The pair, the role set, the date on the player's machine, and the coding, quoted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibrarySummary" }
        "202": { $ref: "#/components/responses/LibraryNotReady" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/LibraryRefused" }
        "409": { $ref: "#/components/responses/LibraryUndeclared" }
        "429": { $ref: "#/components/responses/LibrarySummaryTooFast" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /library/search:
    get:
      tags: [library]
      operationId: searchLibrary
      summary: What a search matches, and the artists, albums and genres it names.
      description: |
        The tracks that match `query`, the best of them in rank order, and up to `entityLimit` artists, albums and genres each, ranked, computed from the snapshot the component already holds.

        The cases file defines this answer.

        **`query`.** Up to 1024 bytes of UTF-8, and it may be empty. It is folded whole and split into words, and a track matches when every word is found in its title, its artist, its album artist or its album, a word never spanning two of those. A query that folds to nothing answers `matched` `null`. So does any query on a library that holds no tracks, with `matchCount` `0` and every section empty.

        **`matched` and `matchCount`.** `matched` is every matching track as a set, or `null` where the query folds to nothing or the library holds no tracks. `matchCount` is the size of `matched`, and `0` where it is `null`.

        **`best`.** The best `limit` of the matching tracks as ordinals in rank order, fewer where fewer match, none where `limit` is `0`. Unlike `matched`, it is not ascending.

        **`artists`, `albums` and `genres`.** Each is `{ total, top }`: `total` is how many entities the section admits and `top` is the first `entityLimit` of them in rank order, none where `entityLimit` is `0`. A section admits nothing that matches below the rank of a whole word, so a misspelling fills no section, while a name a section catches with its spaces and punctuation set aside, such as `acdc` for *AC/DC*, is admitted. An artist carries `name`, `trackCount`, the tracks credited to it that are not guest credits, `guestCount`, its guest credits, `albumCount` and `cover`. An album carries `album`, `artist`, `trackCount` and `cover`, named as `SummaryAlbum` names them. A genre carries `name` and `trackCount`. `splitsCredits` says whether a credit line holding several names counts each of them as an artist (`true`) or the line as one name (`false`).

        **`namesATrack`.** `true` where a matching track's title folds to the same text as the query, trimmed, does; `false` where the query folds to nothing.
      parameters:
        - { name: query, in: query, required: true, description: "What was typed. Up to 1024 bytes as UTF-8, and it may be empty.", schema: { type: string } }
        - { name: limit, in: query, required: true, description: "How many matching tracks `best` lists at most.", schema: { type: integer, minimum: 0 } }
