openapi: 3.1.0

# The HTTP surface of foo_jean, in full.
#
# Hand-written, and the contract. The component does not serve it: code generation happens at build time, and an unauthenticated route describing this component's own surface adds nothing a reader of the repository does not already have. Fetch it from the repo.
#
# Generate a TypeScript client with:
#
#   pnpm types:api
#
# `plugins/fb2k/tests/api_contract_test.cpp` pins the exact key set of every document the component produces. `plugins/fb2k/scripts/test.sh` checks that the version below matches `plugins/fb2k/src/core/version.h`.

info:
  title: foo_jean
  version: 0.3.0
  summary: The media library, playlists, the queue, tag writing and a live stream of the player's output, for foobar2000, over HTTP.
  description: |
    A foobar2000 component exposing over HTTP what a client cannot otherwise reach: writing metadata tags, the whole media library in one piece, every playlist and autoplaylist addressed by foobar2000's own GUID, the play queue, cover art, what the player is doing, and a live encode of its output.

    ## Playlists and playback

    Playlists are read and edited here and nowhere else. `GET /playlists` is the listing: every playlist the player holds, with its title, its item count, its position in the player's list, whether it is an autoplaylist, and the two generations that say what a client has to read again. There is no second answer to join it against. See `PlaylistAnnotation`.

    The playback commands are here: `/playback/*` for pause, next, previous, stop, seek and the playback mode, `/volume` for the level, a step and mute, and `POST /playlists/{id}/items/{index}/play` for starting a row, because a row is addressed by playlist.

    ## Versioning

    `apiVersion` is the number to branch on. It moves independently of the component version: a patch release does not move it, a breaking change to any shape here does. Read it from `GET /status` and refuse a number the client does not understand.

    ## Admission

    Every route, `OPTIONS` and `GET /status` included, requires a private source address (RFC1918, loopback and link-local, and their IPv6 equivalents) and a `Host` the component recognises: an IPv4 or IPv6 literal, `localhost`, a name with no dot, a name ending `.lan`, `.local` or `.home.arpa`, or a name listed in `allowedHosts` in `<profile>/foo_jean/config.json`. Either check failing is `403`, before anything else about the request is read.

    Every `POST` requires `Content-Type: application/json`, with or without a body; without it the answer is `415`. `DELETE` carries no such rule, since a browser preflights every cross-origin `DELETE` on its own.

    `GET /stream` requires one credential of its own beside admission: a ticket from `POST /stream/ticket`.

    ## Reachability

    `bindAddress` defaults to `0.0.0.0`, every local interface, so a browser on another device on the same network reaches the component without configuration. It can be narrowed to `127.0.0.1`.

    No answer at all to `GET /status`, rather than a refusal, means `bindAddress` has narrowed the component off this network or a firewall is in the way, not necessarily that foo_jean is not installed.

    ## CORS

    No origin is reflected with `allowedOrigins` empty: another port on the same host is another origin, and any service listening there could reach every route this component answers. A listed origin is reflected on every route: `Vary: Origin` is set on every response, and the origin is echoed rather than answered with a literal `*`, which would forbid credentialed mode.

    **A browser hands script only the CORS-safelisted response headers**, so an answer to a listed origin carries `Access-Control-Expose-Headers: ETag, Retry-After`. Those are the two a client is told to act on and neither is safelisted: without the first no cross-origin page can read a validator at all, and without the second a `429` cannot be backed off from as documented. `Cache-Control` and `Content-Type` are safelisted and are not named.

    `If-None-Match` is the other half of the same problem and is a *request* header, which no safelist covers either, so the preflight answers `Access-Control-Allow-Headers: Content-Type, If-None-Match`. Without it a page could hold a validator and never send one, and the revision poll, the snapshot, the delta and a cover would each be a full download from a browser and a `304` from a command line.

    CORS decides which page may read a response. Admission decides who is served at all: the source and `Host` checks run before CORS is even consulted, and neither one is a CORS header a non-browser client would have to honour.

    Set `allowedOrigins` in `<profile>/foo_jean/config.json` to the origins a page may be served from, matched on the whole origin string and case-insensitively.

    `OPTIONS` preflight is answered `204` without a credential, identically for every path, so it reveals nothing about which routes exist.

    ## The media library

    `GET /state` is a small JSON document a client polls, carrying the library's two generations under `library`. The library itself is a binary snapshot from `GET /library/export`, patched afterwards by `GET /library/changes`. There is no paged route: a client holds the whole library and asks the questions locally. `GET /track/library` is the one per-entity route, and it reads a single track back after a write rather than standing in for a browse.

    Two generations say what changed. `structure` moves when tracks are added or removed, which shifts every ordinal after the change, so a client throws its arrays away and exports again. `revision` moves when rows change in place, which leaves ordinals alone, so a client fetches a delta and patches. Modifications are constant, roughly one per track played; additions and removals are rare and the user just caused them.

    An **ordinal** is a track's position in the snapshot, counted from zero, and it is the only handle these routes use. Ordinals are in library-relative path order, compared the way the player compares paths itself rather than byte by byte: a run of digits counts as a number and case does not count at all, so `2 Mello` comes before `10cc`. Ties are broken by subsong and then by the player's own canonical path, so the order is total and does not shuffle between rebuilds. An ordinal means nothing across a `structure` change.

    ### Who declares the columns

    The client, and the export request is the declaration. `GET /library/export?columns=…` names the title-formatting expressions the client wants, and the component evaluates exactly those. Nothing here parses or interprets one: that keeps the component general and it keeps a client's own capability detection working.

    The loop is: ask, and get either the blob or a `202`; on a `202` poll `GET /state` until `library.columns` match what was asked for and `library.ready` is true; then ask again. **The first export after the component starts, and the first after a declaration changes, is the slow one.** It walks and formats every track in the library. Every export after that is served from what is already built.

    Order does not matter when comparing: `columns` from `GET /state`'s `library` and the set a client declared are the same declaration when they have the same members. Order decides only where a column lands in the header's `columns` array.

    Every later rebuild reuses the last declared set, whether the player raised a change notification or somebody called `POST /library/refresh`. Two clients wanting different sets will therefore take the snapshot from each other; at most two builds are kept, so a third evicts rather than accumulating.

    ### The snapshot format

    Both `GET /library/export` and `GET /library/changes` answer in one format, `application/octet-stream`:

    ```
    offset 0   4 bytes    the ASCII letters JLIB
    offset 4   4 bytes    headerLength, unsigned little-endian
    offset 8   headerLength bytes    the header, UTF-8 JSON, right-padded with ASCII spaces
    offset 8 + headerLength           the blob, to the end of the body
    ```

    Every integer in the body is unsigned and little-endian. The header's padding is what makes `8 + headerLength` a multiple of four, and `headerLength` counts it, so the blob begins on a four-byte boundary. Every `offset` in the header is measured from the first byte of the blob and is itself a multiple of four. That is what lets a client take `new Uint32Array(buffer, blobStart + offset, count)` over the bytes in place: a typed array over a byte offset that is not a multiple of its element size throws in every browser.

    The header parses with `JSON.parse` and is small. Its shape is `LibraryHeader`.

    ### Compression

    `GET /library/export` and `GET /library/changes` are gzipped when the request offers gzip, and sent as they stand when it does not. This is the largest thing the component produces and it is several times smaller compressed, so a client SHOULD offer gzip; every browser does by default.

    Negotiation is RFC 9110's: `Accept-Encoding: gzip` gets `Content-Encoding: gzip`, `Accept-Encoding: gzip;q=0` is a refusal and gets the bytes as they stand, and no `Accept-Encoding` at all is also a refusal. Only `gzip` is offered; `br`, `zstd` and `deflate` are not, and `*` is read as offering nothing rather than as offering everything.

    Every answer from these routes carries `Vary: Accept-Encoding`, and **the `ETag` names the coding**: `"s41-r903-i9231704662185031702-gzip"` and `"s41-r903-i9231704662185031702-identity"` are two representations of one snapshot and never share a validator. A client passes back whichever tag it holds and keeps asking with the same `Accept-Encoding` it asked with before. `GET /state` is `ETag`ged on the same terms, coding and all, because it is compressed on the same terms. The middle segment is fixed when the component starts and differs between runs of it, so a tag a browser cached before a restart never matches what the new run answers.

    The size ceiling is on the snapshot **as serialised**, before any compression: a library over it is a `413` however small it would have gzipped to, because the number that matters is what the client has to hold once it has decoded.

    ### Reading one column

    A column is a dictionary of distinct values plus one dictionary id per row. Nothing else: there is no type system here, no numbers and no nulls, because the component never parses, normalises or types what the player produced. A field the player could not resolve arrives as the single character `?`, an empty tag arrives as `""`, and a tag whose value is literally `N/A` arrives as `N/A`. Telling those three apart is the whole of a client's capability detection, so a client MUST NOT coerce them.

    - `ids` is one id per ordinal: `ids.count` entries of `ids.width` bytes each, where the width is 1, 2 or 4. In a snapshot `ids.count` equals `trackCount`.
    - `dict.text` is `dict.text.length` bytes of UTF-8, every distinct value concatenated with nothing between them. Decode it with one `TextDecoder` call and slice lazily: materialising a quarter of a million strings up front costs more than drawing them does.
    - `dict.ends` is `dict.ends.count` entries of `dict.ends.width` bytes, entry *i* being the offset within `dict.text` at which value *i* ends. Value *i* therefore spans `[ends[i - 1], ends[i])`, with `ends[-1]` read as `0`.

    Widths are chosen from the measured cardinality, so a client MUST read them rather than assume: `ids.width` is the narrowest of 1, 2 and 4 that holds every id from `0` to `distinct - 1`, and `dict.ends.width` the narrowest that holds `dict.text.length`.

    Each column also carries what a client would otherwise learn by sampling rows and guessing. `distinct` is the number of values in the whole dictionary, `hasUnresolved` says whether `?` is one of them, and `allUnresolved` says whether it is the only one. A field that resolves on one track in ten thousand is therefore detected exactly rather than missed, which sampling cannot promise.

    ### The spine

    Three columns the component always builds, under `spine` rather than in `columns`, and they read exactly like any other column.

    `directory` and `filename` are the track's path relative to the library root, forward-slashed on every platform, split in two because directories repeat heavily. `directory` keeps its trailing slash, so the whole relative path is the two concatenated. The library root itself never appears: an absolute path is the player's business and this API does not publish one here. `subsong` is the player's own subsong number for that row, as decimal text, and it is `0` for an ordinary file. It is a value the player assigned rather than a position among the rows at one path, and a cue sheet's subsongs number from 1, so a client MUST NOT work one out by counting. plugins/fb2k/ARCHITECTURE.md, *Facts about the player*, has which files the player splits.

    ### Reading a delta

    A delta carries only the columns that moved, and each of them carries only the rows that moved. A client patches those typed arrays and leaves every other column's array identity alone, which is what stops a play count moving from invalidating everything derived from titles.

    - `ordinals` is `ordinals.count` ascending ordinals, and `ids` is one new id for each of them, in the same order. `ids.count` equals `ordinals.count`. `ordinals.width` is the narrowest that holds every ordinal from `0` to `trackCount - 1`, which is a different number from the one `ids.width` comes from.
    - Dictionaries are append-only within a `structure` generation, so a delta never restates one. `dict.base` is the number of entries the client already holds, and `dict.text` and `dict.ends` carry only what was appended after it: `dict.ends.count` is `distinct - dict.base`, not `distinct`. Append them and the client's dictionary is current again.

    A value that stops being used leaves an entry behind. The next `structure` rebuild compacts it, and nothing before then does.

    ## Artwork

    `GET /artwork` is one front cover, addressed by the library-relative path of a track that has it: the snapshot's `directory` and `filename` concatenated, exactly as it published them. There is no ordinal here. An ordinal means nothing across a `structure` change, so a URL built from one would have to name the generation as well and would then change every time a track was added anywhere in the library, emptying a browser's cache of every cover at once. A relative path survives a rebuild, a restart and a change of column set.

    **Point every row of an album at one URL.** A client picks one track to stand for a record and addresses that one from the sleeve, the row, the shelf and the now-playing pane alike. One URL in every view is what lets the browser store, deduplicate and revalidate a cover once instead of once per screen. That is also why this route takes a track rather than an album: the player resolves art per track, from the file's own tags or from an image beside it, and which of the two it is varies inside one library.

    The address is a lookup key and never a path. It is matched against what the player reported for the tracks in the snapshot and is joined to nothing, so there is no file outside the media library to name and nothing to traverse out of. An address the snapshot does not carry is a `404`, and never another record's sleeve.

    The body is `image/jpeg`, `image/png`, `image/gif`, `image/webp` or `image/bmp`, read from the bytes rather than from a filename. A picture in anything else is a `404`: a type nothing recognised is not one a client should be told to draw.

    ### The playing cover

    `GET /artwork/playing` is the front cover of whatever the player is playing right now, addressed by nothing: no path, no index, no handle. It answers what `GET /artwork` cannot, because there is no library-relative path to address a stream, a CD track or a file the library has never indexed by: the player's own now-playing loader resolves a picture embedded in the file's own tags exactly as readily as one sitting beside it on disk, and this route is a window onto that loader rather than onto the snapshot.

    The picture is held rather than loaded per request: this component folds it once with the same validator `GET /artwork` computes, the moment the player's loader hands it over, and a conditional request that already holds the current cover costs a comparison of two strings and touches no file. The address does not move when the track does, so the next track of the same album revalidates to a `304`.

    `GET /artwork` is unchanged by this. Everything that addresses a cover by library key keeps using it.

    ### The positional fallback

    `GET /artwork/playlists/{id}/{row}` is the front cover of a playlist row `GET /artwork` cannot address: one with no library-relative path. A client names a playlist and a position; the player resolves the two to a handle, so nothing here becomes a filesystem path and nothing addresses a track the player did not itself find at that row. A row the media library does hold a path for is refused rather than answered: one album is one address, and a position is not that address.

    ### Revalidating a cover

    `GET /artwork` answers a present cover with `Cache-Control: private, max-age=15552000`, 180 days, and a `404` with `private, max-age=600`, ten minutes. The long lifetime is what the one-URL-per-album design is for: a client holding a sleeve spends no request on it again for months. The short one is what tells a client to look again: a cover dropped into an album's folder after the last ask is drawn within ten minutes, with no reload. `private` keeps both out of a cache that is not the client's own, since nothing here should be redistributed to another client through a shared cache.

    `GET /artwork/playing` and `GET /artwork/playlists/{id}/{row}` answer `Cache-Control: private, no-cache` on every outcome, present cover or refusal alike: the address names nothing durable, a track playing now or a position in a playlist, so the picture behind it changes without the URL changing and a lifetime would hand a client the wrong sleeve. `no-cache` asks a client to revalidate before it draws the copy it holds rather than forbidding the copy outright, so a client SHOULD still keep the bytes and send the `ETag` back as `If-None-Match`.

    The validator is strong, quoted and opaque, and it is a fold of the picture itself, so it moves when and only when the cover does. That catches the change nothing else can see: an image file sitting beside the music, replaced in place, alters no tag and no track and is announced to nobody. The player loads the cover to answer at all, so a `304` saves the transfer and the redraw rather than the work at the player.

    A cover is never compressed. These are already compressed formats, so there is no `Vary: Accept-Encoding` here and no coding suffix on the validator.

    ## Errors

    Every response with a status of 400 or above is `application/json` carrying at least an `error` string, including the unrouted `404` and the oversized `413` that cpp-httplib generates itself.

    Responses from `POST /tags` also carry `written: false`, except the `413`, which is refused before the route is reached. Branch on the status rather than on the presence of `written`.

  contact:
    name: foo_jean
    url: https://github.com/enrique-ramirez/foo_jean
  license:
    name: TBD

servers:
  - url: http://{host}:{port}/api
    description: The component. It also serves Jean itself, from the same origin.
    variables:
      host:
        default: 127.0.0.1
        description: The machine running foobar2000.
      port:
        default: "8881"
        description: Set by `port` in `<profile>/foo_jean/config.json`.

tags:
  - name: connection
    description: Finding the component and asking what it can do.
  - name: player
    description: |
      What the player is doing, polled rather than pushed.
  - name: tags
    description: Writing metadata to files the player already manages.
  - name: playlists
    description: |
      Autoplaylists, and which playlists are autoplaylists.
  - name: library
    description: |
      The player's media library, as one columnar snapshot and a stream of patches to it.
  - name: queue
    description: |
      The play queue: read whole, refetched on its own revision, added to, reordered, trimmed one entry at a time, or emptied outright.
  - name: artwork
    description: |
      Cover art: one route addressed by a track the media library holds, one addressed by whatever is playing, and one addressed by a playlist and a position for a track that reaches neither.
  - name: stream
    description: |
      Listening to the player's own output. foobar2000 decodes and sequences; this carries the result to a browser.

paths:
  /status:
    get:
      tags: [connection]
      operationId: getStatus
      summary: Identify the component.
      description: |
        Tells "foo_jean is here" from "nothing is listening", for a script or a person checking this origin exists before asking it anything else.

        It reports nothing a port scan would not. The field allowlist is absent from it; ask `GET /capabilities` for it.
      responses:
        "200":
          description: The component is listening.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
              examples:
                default:
                  value:
                    name: foo_jean
                    version: 0.3.0
                    apiVersion: 1

  /capabilities:
    get:
      tags: [connection]
      operationId: getCapabilities
      summary: What this install permits, and what does not change while it runs.
      description: |
        The write allowlist, the streaming and autoplaylist limits, what this install permits, and the player's own name, version and volume range. A client reads this once and draws the player from it; none of it rides `GET /state`. A client SHOULD render controls for the fields named here and nothing else, rather than being configured with its own copy of the list.
      responses:
        "200":
          description: What may be written, and what a client needs to draw the player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
              examples:
                ratingOnly:
                  summary: The default install.
                  value:
                    apiVersion: 1
                    allowedFields: ["rating"]
                    canWrite: true
                    canWritePlaylists: true
                    canControlPlayback: true
                    canChangeOutput: true
                    maxAutoPlaylists: 100
                    canCreateAutoPlaylists: true
                    canStream: true
                    streamFormats: ["opus", "aac"]
                    canMuteWhileStreaming: true
                    canReadLibrary: true
                    playerName: foobar2000
                    playerVersion: 2.25.3
                    volumeMin: -100
                    volumeMax: 0
                    volumeUnit: db
                writesDisabled:
                  summary: allowedFields emptied, writePlaylists and changeOutput both turned off, and maxAutoPlaylists zeroed in config.json.
                  value:
                    apiVersion: 1
                    allowedFields: []
                    canWrite: false
                    canWritePlaylists: false
                    canControlPlayback: true
                    canChangeOutput: false
                    maxAutoPlaylists: 0
                    canCreateAutoPlaylists: false
                    canStream: true
                    streamFormats: ["opus", "aac"]
                    canMuteWhileStreaming: true
                    canReadLibrary: true
                    playerName: foobar2000
                    playerVersion: 2.25.3
                    volumeMin: -100
                    volumeMax: 0
                    volumeUnit: db

  /tags:
    post:
      tags: [tags]
      operationId: writeTags
      summary: Write metadata to one track.
      description: |
        The player performs the write, through `metadb_io_v2`, so foobar2000's own database is current when this returns and the next read of the value, through this API or any other, sees the new one.

        The track is named by exactly one of three addresses, and never by a filesystem path. The library form is `track` with `subsong`, the library-relative key `GET /artwork?track=` takes, resolved against the media library snapshot. The ordinal form is `ordinal` with `structure`, a position in that snapshot, which names one track where a relative path can name two. The playlist form is `playlist`, `index` and `structure`, one row of a playlist by position. Sending none of them, sending two, or sending a field of any with the wrong type is a `400`, the rule `POST /playlists/{id}/items` applies to `runs`, `bitset` and `ordinals`.

        **A client holding a row's `libraryPath` SHOULD send the library form, playlist row or not.** A relative path survives a reorder, a rebuild and a restart, and a position survives none of them, so the playlist form is what a row the media library does not hold falls back to.

        Three conditions must hold, and they fail with different statuses:

        1. Every field is on the allowlist (`403`). Names are compared case-insensitively.
        2. The request carries exactly one address (`400`).
        3. Something holds a track at it (`404`): the snapshot, at that relative path and subsong, or that playlist, at that position. An `ordinal` the snapshot does not hold answers `409` instead, for the reason below.

        The first two are decided before the player is involved.

        **Three conditions answer a `409`, and nothing is written for any of them.** A `structure` that is no longer that playlist's current one, checked before the handle is read so that a write aimed at one row never lands on another. An ordinal form that resolves to nothing, which is a `structure` a rebuild has moved, an ordinal past the end of the snapshot at the generation named, or a component that has built no snapshot at all. And a `track` address the snapshot holds more than one track at, which two media library roots holding one relative path produce: the component refuses rather than pick one, and a client SHOULD retry once with the `ordinal` it read that row at. The error string tells the three apart.

        Only the named fields are touched; everything else in the file is left alone. An empty string removes a field rather than setting it to empty, which is how a rating is cleared rather than set to `"0"`.

        Writes are not batched. One track per request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagWriteRequest" }
            examples:
              setRating:
                summary: Rate a track the media library holds four stars.
                value:
                  track: "Fictional Artist/Imaginary Album/01 Track.flac"
                  fields: { rating: "4" }
              clearRating:
                summary: Remove the rating tag entirely.
                value:
                  track: "Fictional Artist/Imaginary Album/01 Track.flac"
                  fields: { rating: "" }
              subsong:
                summary: One track inside a cue sheet or disc image.
                value:
                  track: "Fictional Artist/Imaginary Album/disc.flac"
                  subsong: 3
                  fields: { rating: "5" }
              ordinal:
                summary: The same track by its position in the media library snapshot, which is what a client retries an ambiguous address with.
                value:
                  ordinal: 1904
                  structure: 41
                  fields: { rating: "4" }
              playlistRow:
                summary: A row the media library does not hold, by position and the generation it was read at.
                value:
                  playlist: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                  index: 3
                  structure: "9204739866101318923"
                  fields: { rating: "4" }
      responses:
        "200":
          description: |
            Written, and foobar2000's database is current. The body echoes what was written, so a client that updated its own view optimistically can reconcile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagWritten" }
              examples:
                library:
                  summary: The address as it was sent, and the values as they were written.
                  value:
                    written: true
                    track: "Fictional Artist/Imaginary Album/01 Track.flac"
                    subsong: 0
                    fields: { rating: "4" }
                ordinal:
                  summary: An ordinal comes back alone, naming a subsong already.
                  value:
                    written: true
                    ordinal: 1904
                    fields: { rating: "4" }
                playlist:
                  value:
                    written: true
                    playlist: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                    index: 3
                    fields: { rating: "4" }
        "400":
          description: |
            The request is malformed, carries no address or carries two, carries a field of one of them with the wrong type, or has nothing to write. Retrying it unchanged will not help.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagRefused" }
              examples:
                bothAddresses:
                  summary: Two addresses, refused rather than one of them preferred.
                  value:
                    written: false
                    error: unacceptable address
                    detail: "a request names one of 'track', 'ordinal' and 'playlist', never two"
                caseCollision:
                  summary: Two spellings of one tag, refused rather than guessed at.
                  value:
                    written: false
                    error: malformed request
                    detail: "'rating' is named twice, differing only in case"
        "403":
          description: |
            The field is not on this install's allowlist. A `403` rather than a `400` because the request was understood and retrying it unchanged will never work. `field` names the offending field, and a client SHOULD stop offering that control.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagRefused" }
              examples:
                notAllowed:
                  value:
                    written: false
                    error: field not allowed
                    detail: artist
                    field: artist
        "404":
          description: |
            Nothing holds a track at that address: the snapshot carries no track at that relative path and subsong, or the playlist does not exist, or `index` is at or past its end. Nothing was written. An `ordinal` the snapshot does not hold is the `409` rather than this.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
              examples:
                unknown:
                  value: { written: false, error: foobar2000 does not know that track }
        "409":
          description: |
            The address no longer names what the client read it at, and nothing was written. The error string says which of three, and each has its own remedy.

            The `structure` the playlist form named is no longer that playlist's current one, so the row at `index` may be another track: read the playlist's rows again from the generation `GET /playlists` now reports, and send the position that names.

            The ordinal form resolved to nothing, for one of three reasons the component cannot tell apart. The `structure` it named is no longer the media library's, so every ordinal held against it names another track. Or the snapshot at that generation holds no ordinal that high. Or no snapshot is built, which is where a component sits between starting and its first one. One resolver serves the ordinal here and the ones `POST /playlists/{id}/items` and the queue routes take, and it reports all three as a miss, so the error string names the rebuild alone. Export the library again and send the ordinal that names; where the `structure` sent is the one `GET /state` reports, the ordinal itself was wrong and exporting again will not help.

            The `track` address names a track under more than one media library root, so nothing about it says which was meant: send the `ordinal` the row was read at instead. A client SHOULD retry once, and on this refusal only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
              examples:
                restructured:
                  value:
                    written: false
                    error: "the playlist's rows were added, removed or reordered; read them again"
                rebuilt:
                  value:
                    written: false
                    error: the media library was rebuilt; export it again
                ambiguous:
                  value:
                    written: false
                    error: the media library holds more than one track at that address
        "413":
          description: |
            The body exceeds 256 KB and was refused before it was parsed. The component answers and closes while the rest of the body may still be in flight, so a client sending something very large may see a dropped connection instead of this response. Both mean refused.

            The one response from `POST /tags` that does not carry `written`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The player could not write the tags. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
        "503":
          description: Tag writing is unavailable in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
        "504":
          description: |
            The player did not finish within 30 seconds. The write MAY still complete afterwards, so a client MUST re-read the value rather than assume it did not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }

  /playlists:
    get:
      tags: [playlists]
      operationId: getPlaylists
      summary: Every playlist the player holds.
      description: |
        One entry per playlist, in playlist order: the GUID every route here addresses a playlist by, its title, how many rows it holds, whether it is an autoplaylist, the role where this component keeps the playlist for a purpose of its own, and the two numbers that say whether rows a client already holds are still current.

        ### The two numbers

        `structure` moves when a playlist's rows are added, removed, reordered or replaced, so rows held against an older one sit at positions that have moved. `revision` moves when a row already in the playlist would answer differently, a tag, a rating or a play count, and the rows stay where they are.

        Both are counters kept for as long as this component runs rather than anything the player stores, and both are seeded so that no value either has published comes back after a restart, so a client holding a pair from an earlier run reads the playlist again.

        **Both travel as strings of decimal digits, and a client MUST NOT read either as a number.** That seeding puts them far above 2^53, and a JSON number is an IEEE 754 double, exact only that far: parsed as a number, four consecutive generations round to one value and a structural edit becomes invisible to the client that was watching for it. Compare a pair for equality, hand it back as it arrived, and never order, count or do arithmetic on one. Every other counter this API publishes is inside 2^53 and is a number.
      responses:
        "200":
          description: One entry per playlist.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [playlists]
                properties:
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist at the end of the player's list, holding a set or nothing.
      description: |
        An ordinary playlist, not an autoplaylist: nothing keeps it filled and `POST /autoplaylists` is what makes one that does. It lands last in the player's own list and carries `title` exactly as somebody looking at foobar2000 will read it.

        The set is optional and is the fill's own: `runs`, `bitset` or `ordinals` resolved against a `structure` for media library tracks, exactly as `POST /playlists/{id}/items` reads them, or `source` and `runs` for the rows of a playlist that already exists. A body naming neither creates the playlist holding nothing, and needs no media library to do it.

        **The playlist is created and filled in one operation of the player's.** A client saving a set as a playlist sends this one request: there is no window in which the playlist exists empty, and nothing here has to be followed by a fill.

        Refused with `403` under the read-only-playlists setting: the playlist it makes would hold the user's music.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlaylistRequest" }
            examples:
              empty:
                summary: A playlist holding nothing, which is what the sidebar's own *New playlist* sends.
                value: { title: "Road trip" }
              libraryRows:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { title: "Road trip", structure: 41, runs: [[0, 2], [9, 1]] }
              playlistRows:
                summary: Rows 1, 2 and 4 of a playlist that already exists.
                value:
                  title: "Road trip"
                  source: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                  runs: [[1, 2], [4, 1]]
      responses:
        "200":
          description: Created. The body is the annotation, as `GET /playlists` would report it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400":
          description: |
            The request was understood and declined: a body that is not JSON, a missing, empty, unprintable or over-long `title`, a `source` this component did not issue, a set that is not exactly one of `runs`, `bitset` and `ordinals`, one naming an ordinal outside the library while its `structure` is still the current one, a `source` row past the end of that playlist, or a `source` selection resolving to more than 1,500,000 rows, an engineered ceiling on what one request may resolve to, set far above any selection made in a playlist view; the real playlist length is checked again once the player has answered. The schemas below tell the last of those from the rest.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/WritesDisabled" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/StructureMoved" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503":
          description: |
            A set of media library tracks arrived and this install either does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or has built no snapshot yet to resolve it against. A create carrying no such set is answered `503` only where the component cannot reach the player's playlists at all, which `PlaylistWritesUnavailable` describes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                off:
                  value: { error: the media library is not available }
                nothingYet:
                  value: { error: the library snapshot has not been built yet, detail: "" }
                noPlayer:
                  value: { error: playlist changes are not available }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists:
    post:
      tags: [playlists]
      operationId: createAutoPlaylist
      summary: Create an autoplaylist.
      description: |
        Creates a playlist and hands it to foobar2000's own autoplaylist client, so the core keeps it filled and keeps it after this component is uninstalled.

        An autoplaylist filters the Media Library and nothing else. On an install with no Media Library configured every autoplaylist is empty and nothing in the player says why. Call `POST /autoplaylists/preview` first and read its `libraryEnabled`.

        The playlist is real and visible in foobar2000's own playlist tabs, so `title` is what somebody looking at the player will read. Nothing in this API parses it, no prefix is required or implied, and the user may rename it freely. What a title means -- whether a playlist is a client's own plumbing or the user's music -- is the client's to decide and the client's to encode.

        Existing playlists are never converted. There is no route that turns an existing playlist into an autoplaylist, because the core replaces the contents of a playlist when it takes one over.

        Refused with `403` under the read-only-playlists setting: every playlist this creates would hold the user's music, and the setting refuses every write but the component's own scratch playlist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoPlaylistRequest" }
            examples:
              keyed:
                summary: Tagged with a key the client recognises later, so it can find its own again.
                value:
                  title: "Rock"
                  key: "folder:genre:Rock"
                  query: "%genre% IS Rock"
              sorted:
                summary: Kept in order by the core, which also stops the user reordering it by hand.
                value:
                  title: "Recently Added"
                  query: "%added% DURING LAST 4 WEEKS"
                  sort: "%added%"
                  forceSort: true
      responses:
        "200":
          description: Created. The body is the annotation, as `GET /playlists` would report it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/WritesDisabled" }
        "409": { $ref: "#/components/responses/PlaylistConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists/preview:
    post:
      tags: [playlists]
      operationId: previewQuery
      summary: Try a query without creating anything.
      description: |
        Compiles the query with foobar2000's own parser and counts what it matches in the Media Library. Nothing is created and nothing changes.

        A query that does not parse is a `200` here, carrying `valid: false` and the player's own message. This is the route a client calls while somebody is typing, so an unreadable query is data rather than an error. Creating with the same query is a `400`.

        A client SHOULD debounce this: it runs on foobar2000's main thread, and one request per keystroke is one main-thread callback per keystroke. A client SHOULD also read `libraryEnabled` — `matches: 0` with `libraryEnabled: false` means the install has no Media Library, and any autoplaylist created from the query will be empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 4096
                  description: |
                    foobar2000 query syntax. MUST NOT be empty: the player reads an empty query as matching everything.
            examples:
              default:
                value: { query: "%genre% IS Rock" }
      responses:
        "200":
          description: The query was tried. Read `valid` before `matches`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryPreview" }
              examples:
                matched:
                  value: { valid: true, error: "", matches: 412, libraryEnabled: true }
                unreadable:
                  value:
                    valid: false
                    error: "Query syntax error"
                    matches: 0
                    libraryEnabled: true
                noLibrary:
                  summary: A valid query on an install with no Media Library.
                  value: { valid: true, error: "", matches: 0, libraryEnabled: false }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: updateAutoPlaylist
      summary: Point an autoplaylist at a different query.
      description: |
        Replaces the specification. `query`, `sort`, `key` and `forceSort` end up exactly as this request states them, so a client MUST send the whole record rather than only the parts being changed; omitting `key` clears it. The `managed` object from `GET /playlists` has that shape, so read-modify-write is the way to call this.

        `title` is the exception: omit it to leave the name alone. Resending a remembered title would undo a rename made in the player.

        The playlist itself is kept, and with it its id and its position in the player's list. Deleting and recreating changes both.

        Only playlists this component created can be updated, and that is a `403` whatever `writePlaylists` says. The same status also answers when `writePlaylists` is `false`, checked first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoPlaylistRequest" }
            examples:
              requeried:
                summary: Change what it collects, leave what it is called.
                value: { query: "%genre% IS Jazz" }
      responses:
        "200":
          description: Updated. The body is the annotation as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/NotOurs" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: |
            The player refused. If the new query compiles but the core then declines to attach it, the playlist is left as an ordinary playlist that this component still recognises as its own; sending the request again with a query the player accepts restores it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: removeAutoPlaylist
      summary: Delete an autoplaylist this component created.
      description: |
        Removes the playlist and the autoplaylist client with it.

        Only playlists this component created. Anything else is a `403`, including an autoplaylist made in foobar2000 itself, whatever `writePlaylists` says. The same status also answers when `writePlaylists` is `false`, checked first. Any other playlist is deleted through `DELETE /playlists/{id}`.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed, id]
                properties:
                  removed: { type: boolean, const: true }
                  id: { type: string }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/NotOurs" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/own/{role}/items:
    parameters:
      - name: role
        in: path
        required: true
        description: |
          Which of the component's own playlists to fill. `scratch` is the only one: it is emptied first, so the insert leaves it holding only this request's rows. Not reached by the read-only-playlists setting: this is how this component works, not the user's music. A `role` other than `scratch` is a `400`.
        schema:
          type: string
          enum: [scratch]
        example: scratch
    post:
      tags: [playlists]
      operationId: fillOwnPlaylist
      summary: Insert library rows into one of the component's own playlists, making it first if it is not there.
      description: |
        Resolves `role` to a playlist through the component's own marker rather than through a title, so a playlist renamed at the player is still found and one somebody hand-titled to look like it is not adopted. Makes the playlist, carrying `title`, if the role has none yet.

        The set to insert is named by exactly one of `runs`, `bitset` and `ordinals`, resolved against the `structure` sent alongside it. Sending more than one, or none, is a `400`. `runs` and `bitset` are inserted in ascending ordinal order — neither can carry any other — and `ordinals` is inserted in exactly the order it is given, which is the form a client holding a click-ordered set, such as a multi-select or a queue, MUST use to keep that order.

        The read-only-playlists setting never refuses this operation: it protects a user's own playlists, and neither of the component's own holds any. `controlPlayback` does: playing a set is playback, and this is refused with a `403` while it is off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FillOwnPlaylistRequest" }
            examples:
              runs:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { title: "Scratch", structure: 41, runs: [[0, 2], [9, 1]] }
              bitset:
                summary: The same three ordinals as a bitmap.
                value: { title: "Scratch", structure: 41, bitset: "AwI=" }
              ordinals:
                summary: The same three ordinals in click order, which only this form can carry.
                value: { title: "Scratch", structure: 41, ordinals: [9, 0, 1] }
      responses:
        "200":
          description: Inserted. `positions` names where each row landed, and `structure` the generation the target now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FillResult" }
              examples:
                default:
                  summary: Two rows inserted into the scratch playlist.
                  value:
                    playlistId: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                    structure: "9204739866101318924"
                    positions: [0, 1]
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "409": { $ref: "#/components/responses/FillConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/FillUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: emptyOwnPlaylist
      summary: Take every row out of one of the component's own playlists, keeping the playlist.
      description: |
        Removes every item rather than the playlist itself, the same choice a replacing fill of `scratch` makes: the playlist keeps its id, its position in the player's list and the marker that `role` resolves through, and deleting it would cost all three. The play queue plays no part in that and is not touched here; `DELETE /playlists/{id}` has what the player does with a queued entry whose playlist goes.

        Idempotent: a role with no playlist yet is not made one just to answer this, and reports success regardless, exactly as `DELETE /stream/hold` reports success whether or not there was a hold to release.

        The read-only-playlists setting never refuses this operation, for the reason it never refuses a fill of `scratch`: it holds none of the user's music. `controlPlayback` does, for the same reason it refuses the fill.
      responses:
        "204":
          description: Emptied, or already empty because there was nothing to empty.
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/OwnPlaylistsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: renamePlaylist
      summary: Retitle a playlist.
      description: |
        Any playlist, not only one this component made: `title` ends up exactly as somebody looking at foobar2000's own tabs will read it. The playlist keeps its `id`, its position, its rows and both its version numbers, none of which a title bears on.

        `title` is held to the same rule `POST /playlists` holds a new one to, because a title a client cannot create is one it cannot rename to either.

        Nothing comes back. The list a client draws comes from `GET /playlists`, which `GET /state`'s `playlistsRevision` tells it to read again.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where the `id` is one of this component's own playlists, and with `409` where another component has locked the playlist against a rename.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenamePlaylistRequest" }
            examples:
              renamed:
                summary: What the sidebar sends when somebody finishes typing over a playlist's name.
                value: { title: "Road trip" }
      responses:
        "204":
          description: Renamed.
        "400":
          description: |
            An id this component did not issue, a body that is not JSON, a field the schema does not declare, or a missing, empty, unprintable or over-long `title`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistRefusal" }
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistLocked" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistWritesUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: removePlaylist
      summary: Delete a playlist.
      description: |
        Any playlist, unlike `DELETE /autoplaylists/{id}`, which touches only the records this component keeps. The rows go with it; the files do not.

        **The play queue is not touched, and a client MUST NOT empty it first.** foobar2000 keeps a queued entry whose whole playlist is deleted rather than dropping it, and such an entry still plays when it reaches the head: plugins/fb2k/ARCHITECTURE.md, *Facts about the player*, has what the player does and what reading one carelessly costs. `GET /queue` answers those entries from their handles, so the queue a client draws afterwards is the queue the player will play.

        Nothing comes back.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where the `id` is one of this component's own playlists, and with `409` where another component has locked the playlist against being deleted.
      responses:
        "204":
          description: Deleted.
        "400":
          description: An id this component did not issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistRefusal" }
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistLocked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistWritesUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/move:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: movePlaylist
      summary: Move a playlist to a position in the player's list.
      description: |
        `index` is where the playlist ends up, counting from zero, and every playlist it passes shifts by one to make room. It is a position in the list as it stands, so moving the first of three playlists to `2` puts it last; `3` is one past the end and a `400`.

        Nothing comes back, and the `index` each playlist now carries is read from `GET /playlists`. Every playlist between the two positions has one it did not have before, so a client holding the list MUST read it again rather than patching the one entry it moved.

        Refused with `403` under the read-only-playlists setting, and with `403` whatever that setting says where the `id` is one of this component's own playlists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovePlaylistRequest" }
            examples:
              toTheTop:
                summary: Make it the first playlist in the player's list.
                value: { index: 0 }
      responses:
        "204":
          description: Moved.
        "400":
          description: |
            An id this component did not issue, a body that is not JSON, an `index` missing or not a whole number in range, or one the player found past the end of its list. The schemas below tell the last of those from the rest.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistWritesUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    get:
      tags: [playlists]
      operationId: getPlaylistItems
      summary: A page of a playlist's rows, in the columns the client declares.
      description: |
        Every column is evaluated against the row's own handle, so a file dragged into a playlist from outside the media library draws like every other row. `libraryPath` is the library-relative path `GET /artwork?track=` takes, and it is `null` for exactly those rows the media library does not hold.

        The answer carries the playlist's whole `totalCount` alongside the page, and the `structure` and `revision` it was read at. Rows held against an older `structure` sit at positions that have moved and MUST be read again; a moved `revision` alone means the rows are where they were and their content is what changed.

        A `count` reaching past the end answers the rows that remain, and an `offset` at or past the end answers no rows at all. Both still carry `totalCount`, `structure` and `revision`, so a client wanting only those asks for a `count` of zero.
      parameters:
        - name: offset
          in: query
          required: true
          description: The position of the first row to answer, counting from zero.
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
          example: 0
        - name: count
          in: query
          required: true
          description: How many rows to answer at most. Zero answers the counts and no rows.
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
          example: 100
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. Each row answers one value per column, in the order declared.

            Passed to foobar2000's title-formatting compiler untouched, under the same gate `GET /library/export` puts on a declaration: at most 64, each 1 to 1024 printable characters, and no repeats.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: The page, and the counts the whole playlist stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistPage" }
              examples:
                default:
                  summary: Two rows of a five-row playlist, the second of them outside the media library.
                  value:
                    structure: "9204739866101318923"
                    revision: "9204739866101318977"
                    totalCount: 5
                    items:
                      - columns: ["Imaginary Track", "Fictional Artist"]
                        libraryPath: "Fictional Artist/Imaginary Album/01 Track.flac"
                        subsong: 0
                      - columns: ["Dragged in", "Somebody Else"]
                        libraryPath: null
                        subsong: 0
        "400":
          description: |
            The request was understood and declined before the player was asked: an id this component did not issue, no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, the same column twice, or an `offset` or `count` that is missing, not a whole number or larger than 4294967295. The schemas below tell the column refusals from the other two.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LibraryRefusal"
                  - $ref: "#/components/schemas/PlaylistRefusal"
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    post:
      tags: [playlists]
      operationId: fillPlaylist
      summary: Insert library rows into a user's own playlist.
      description: |
        Always appends: nothing here empties the playlist first. A fill that replaces what it holds is `POST /playlists/own/scratch/items`, which only ever addresses the component's own.

        The set to insert is named by exactly one of `runs`, `bitset` and `ordinals`, resolved against the `structure` sent alongside it. Sending more than one, or none, is a `400`. `runs` and `bitset` are inserted in ascending ordinal order — neither can carry any other — and `ordinals` is inserted in exactly the order it is given, which is the form a client holding a click-ordered set, such as a multi-select, MUST use to keep that order.

        Refused with `403` under the read-only-playlists setting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FillPlaylistRequest" }
            examples:
              runs:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { structure: 41, runs: [[0, 2], [9, 1]] }
              bitset:
                summary: The same three ordinals as a bitmap.
                value: { structure: 41, bitset: "AwI=" }
              ordinals:
                summary: The same three ordinals in click order, which only this form can carry.
                value: { structure: 41, ordinals: [9, 0, 1] }
      responses:
        "200":
          description: Inserted. `positions` names where each row landed, and `structure` the generation the target now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FillResult" }
              examples:
                default:
                  summary: Three rows appended to a playlist that held four.
                  value:
                    playlistId: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                    structure: "9204739866101318924"
                    positions: [4, 5, 6]
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/WritesDisabled" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/FillConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/FillUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/changes:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    get:
      tags: [playlists]
      operationId: getPlaylistItemChanges
      summary: The rows of a playlist whose content moved since a revision.
      description: |
        The patch between the `revision` a client holds for one playlist and the current one. It carries only the rows whose content would answer differently, each at the position it sits at, so a client patches what it holds rather than reading the page again.

        A row here does **not** come in the shape `GET /playlists/{id}/items` answers a row in. The values are lifted out into one dictionary per column, distinct within this response, and each row carries one id into each dictionary. `PlaylistChanges` has why and how to read it.

        Call this when `GET /state`'s `playlistsRevision` has moved and `GET /playlists` reports the same `structure` and a different `revision` for this playlist. A different `structure` is a `409`: rows were added, removed or reordered, so every position the client holds names something else.

        `structure` and `revision` are strings of decimal digits here as everywhere, and a client compares them for equality rather than for order. `PlaylistAnnotation.structure` has why. This component is the one side that reads them as numbers, and it is where the window is judged.

        A revision nothing has changed since is a `200` carrying no rows, never an error.

        The component keeps a bounded window of which positions changed at each revision and drops a playlist's window when its `structure` moves. Falling behind that window is a `410`. Both refusals have the same remedy, and it is this playlist's page rather than the library export `GET /library/changes` sends a client to.
      parameters:
        - name: structure
          in: query
          required: true
          description: |
            The `structure` generation the client's positions were read at, from the page or the delta it holds. Required rather than defaulted to the current one: a client patching by position always knows which generation its positions belong to, and a request that does not name one cannot be told from a stale one.

            A run of decimal digits, sent exactly as it arrived. It is a 64-bit counter for the reason `PlaylistAnnotation.structure` gives, so a client that holds it as a number sends a neighbour of the value it meant and is refused. Anything but digits is a `400`. This is not the `structure` a fill sends, which names the media library's generation and is a number.
          schema: { type: string, pattern: "^[0-9]+$" }
          example: "9204739866101318923"
        - name: since
          in: query
          required: true
          description: |
            The `revision` the client currently holds for this playlist, as a run of decimal digits, on the same terms as `structure` above. Unlike `GET /library/changes`'s `since`, which names the media library's revision and is a number, this one is a playlist's own.
          schema: { type: string, pattern: "^[0-9]+$" }
          example: "9204739866101318976"
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, on the same terms as `GET /playlists/{id}/items`: repeated once per column, never comma-separated, at most 64, each 1 to 1024 printable characters, and no repeats. Send the set the held page was read with, or the patched rows will carry different values from the rows around them.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: The rows that moved, and the revision they bring the client up to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistChanges" }
              examples:
                default:
                  summary: |
                    Three rows retagged since the revision the request named, one of them outside the media library. They were asked for as `%title%` and `%album artist%`, and two of the three share an artist, so that artist is carried once.
                  value:
                    revision: "9204739866101318977"
                    columns:
                      - text: ["Imaginary Track", "Another Track", "Dragged in"]
                        ids: [0, 1, 2]
                      - text: ["Fictional Artist", "Somebody Else"]
                        ids: [0, 0, 1]
                    items:
                      - position: 1
                        libraryPath: "Fictional Artist/Imaginary Album/02 Track.flac"
                        subsong: 0
                      - position: 4
                        libraryPath: "Fictional Artist/Imaginary Album/05 Track.flac"
                        subsong: 0
                      - position: 7
                        libraryPath: null
                        subsong: 0
                caughtUp:
                  summary: Nothing has changed since the revision asked from.
                  value: { revision: "9204739866101318976", columns: [], items: [] }
        "400":
          description: |
            The request was understood and declined before the player was asked: an id this component did not issue, no `columns` at all or a set the column gate refuses, a missing `since`, or a `structure` or `since` that is not a run of decimal digits inside 64 bits. The schemas below tell the column and revision refusals from the other two.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LibraryRefusal"
                  - $ref: "#/components/schemas/PlaylistRefusal"
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistRowsMoved" }
        "410": { $ref: "#/components/responses/PlaylistRevisionGone" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/copy:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The playlist the rows are appended to, by the `id` a `PlaylistAnnotation` carries: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: copyPlaylistItems
      summary: Append rows of one playlist to the end of another.
      description: |
        The rows are copied, so `source` keeps every row it lent, and they land at the end in ascending position order, which is the only order `runs` can carry. Sending the same playlist as `source` and as `id` appends a copy of those rows to itself.

        **The request names no generation and answers one.** An append addresses no position in the target, so there is nothing for a generation to protect on the way in; what comes back is the `structure` the target stands at once the rows have landed, alongside where each one landed. Those two are what an undo removes exactly these rows against, through `POST /playlists/{id}/items/remove`, and they are why this answers a document rather than nothing.

        One operation of the player's: nothing here reads an item count before or after the write.

        `runs` naming no rows at all is accepted and appends nothing. A body naming no `source` is a `400` rather than a copy of the target onto itself.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where `id` is one of this component's own playlists, and with `409` where another component has locked the target against having rows added. The `source` is only read from, so neither a lock on it nor a `role` it carries bears on anything here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyPlaylistRowsRequest" }
            examples:
              rows:
                summary: Rows 1, 2 and 4 of another playlist.
                value:
                  source: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                  runs: [[1, 2], [4, 1]]
      responses:
        "200":
          description: Appended. `positions` names where each row landed, and `structure` the generation the target now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopiedRows" }
              examples:
                default:
                  summary: Three rows appended to a playlist that held four.
                  value: { structure: "9204739866101318924", positions: [4, 5, 6] }
        "400":
          description: |
            The request was understood and declined before the player was asked: a body that is not JSON, a missing `source` or one this component did not issue, a missing or malformed `runs`, a field the schema does not declare, a `runs` entry naming a row past the end of the source playlist, or a selection resolving to more than 1,500,000 rows, an engineered ceiling on what one request may resolve to, set far above any selection made in a playlist view; the real playlist length is checked again once the player has answered. A create from the same source is refused in the same words.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404":
          description: |
            Neither the target nor the source is a playlist the player holds. Which of the two is not said: either way the rows asked for are not there to copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "409": { $ref: "#/components/responses/PlaylistLocked" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/remove:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The playlist the rows are removed from, by the `id` a `PlaylistAnnotation` carries: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: removePlaylistItems
      summary: Remove rows of a playlist, named by position.
      description: |
        The set is the fill's own, read here as row positions rather than library ordinals, and `structure` is the playlist's own generation rather than the library's: the one `GET /playlists` reports for it, or the one a page, a delta or a copy answered.

        **A `structure` that is no longer the playlist's current one is a `409` and nothing is removed.** The check runs before a row is touched, so a client that asked for three rows never has three others go instead. Read the playlist's rows again from the generation `GET /playlists` now reports, and send the positions that names.

        What comes back is the generation the rows left behind, so a client that holds the rows it just removed re-keys what it has rather than reading the playlist again.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where the `id` is one of this component's own playlists, and with the same `409` where another component has locked the playlist against having rows removed. The two share a status and carry different `error` strings, because one is answered by reading the playlist again and the other by releasing the lock at the player.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemovePlaylistRowsRequest" }
            examples:
              runs:
                summary: Rows 1 and 2 of a playlist read at the generation named.
                value: { structure: "9204739866101318923", runs: [[1, 2]] }
              ordinals:
                summary: The same two rows as a plain list.
                value: { structure: "9204739866101318923", ordinals: [1, 2] }
      responses:
        "200":
          description: Removed. `structure` is the generation the playlist now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemovedRows" }
              examples:
                default:
                  value: { structure: "9204739866101318924" }
        "400":
          description: |
            The request was understood and declined before the player was asked: a body that is not JSON, a `structure` missing or not a string of decimal digits inside 64 bits, a set that is not exactly one of `runs`, `bitset` and `ordinals`, a field the schema does not declare, a position past the end of the playlist, or a selection resolving to more than 1,500,000 rows, an engineered ceiling on what one request may resolve to, set far above any selection made in a playlist view; the real playlist length is checked again once the player has answered. A fill sent the same set is refused in the same words.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409":
          description: |
            Either the `structure` the request named is no longer the playlist's current one, or another component has locked the playlist against having rows removed. The `error` string tells them apart; nothing is removed in either case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
              examples:
                restructured:
                  value:
                    error: "the playlist's rows were added, removed or reordered; read them again"
                    detail: ""
                locked:
                  value:
                    error: "another component has locked that playlist against that edit"
                    detail: ""
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/{index}/play:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
      - name: index
        in: path
        required: true
        description: The row's position in the playlist, `0` being the first, at the `structure` the client read it at.
        schema: { type: integer, minimum: 0, maximum: 4294967295 }
        example: 3
    post:
      tags: [playlists]
      operationId: playPlaylistRow
      summary: Start playback at one row of a playlist.
      description: |
        The one playback command here: every other one is addressed by the player rather than by a playlist. The row is named by position, so a client sending one it read at a `structure` the playlist has moved past plays whatever sits there now.

        Nothing comes back. Where playback landed reaches a client through `GET /state`'s `playingLocation`, on the player's own report rather than on this answer, so a track started at the player and a track started here arrive the same way.

        This writes nothing and the read-only-playlists setting does not refuse it. `controlPlayback` does: this is playback, not a playlist write.
      responses:
        "204":
          description: Playing.
        "400":
          description: |
            An id this component did not issue, an `index` that is not a whole number or is larger than 4294967295, or the player found `index` past the end of that playlist.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playback/play-pause:
    post:
      tags: [player]
      operationId: playPause
      summary: Toggle between playing and paused.
      description: |
        Whether that means resuming a paused track or starting one again from a stop is foobar2000's own call; this route asks for the toggle and does not choose. The answer comes once the player has been handed this command and run it, and nothing comes back beyond the status. Where playback landed reaches a client through `GET /state`'s `playback`, not this answer.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      responses:
        "204":
          description: Toggled.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/next:
    post:
      tags: [player]
      operationId: nextTrack
      summary: Advance to the next track.
      description: |
        Which track that is, and in what order, is foobar2000's own current playback mode; this route does not read or choose one. The answer comes once the player has been handed this command and run it. Where playback landed reaches a client through `GET /state`'s `playingLocation`, not this answer.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      responses:
        "204":
          description: Advanced.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/previous:
    post:
      tags: [player]
      operationId: previousTrack
      summary: Move to the previous track.
      description: |
        The answer comes once the player has been handed this command and run it. Where playback landed reaches a client through `GET /state`'s `playingLocation`, not this answer.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      responses:
        "204":
          description: Moved.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/stop:
    post:
      tags: [player]
      operationId: stop
      summary: Stop playback.
      description: |
        The answer comes once the player has been handed this command and run it. `GET /state`'s `playback` reports `stopped` once the player has caught up.

        This route takes no body. One sent is ignored.
      responses:
        "204":
          description: Stopped.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/seek:
    post:
      tags: [player]
      operationId: seek
      summary: Move the playing track's position.
      description: |
        Exactly one of `seconds`, an absolute position, and `relativeSeconds`, an offset from wherever the player is now. Naming both or naming neither is a `400`, read off which field is present and never off what it holds: `{"seconds": 0}` is a seek to the start and is not the same as sending nothing.

        The answer comes once the player has been handed this command and run it. Where the seek landed reaches a client through `GET /state`'s `position`, not this answer.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackSeekRequest" }
            examples:
              absolute:
                summary: Jump to 90 seconds in.
                value: { seconds: 90 }
              relative:
                summary: Back up ten seconds.
                value: { relativeSeconds: -10 }
      responses:
        "204":
          description: Sought.
        "400":
          description: |
            The body is not JSON, names neither `seconds` nor `relativeSeconds`, names both, carries one of them with the wrong type, carries a negative `seconds`, or carries a `seconds` or `relativeSeconds` too large for the body to hold, such as `1e999`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSeekRefusal" }
              examples:
                twoForms:
                  value: { error: unacceptable seek, detail: "'seconds' and 'relativeSeconds' were both present; send exactly one" }
                neitherForm:
                  value: { error: unacceptable seek, detail: "send exactly one of 'seconds' and 'relativeSeconds'" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/mode:
    post:
      tags: [player]
      operationId: setPlaybackMode
      summary: Put the player into a playback order, by name.
      description: |
        `mode` is one of the seven names `PlaybackMode` publishes. Neither foobar2000's own string nor its ordinal ever crosses this API in either direction: the name is resolved to the player's own order index inside the component, off the same list `GET /capabilities`'s `playbackModes` is built from.

        A name outside `PlaybackMode` is a `400`. A name inside it that this install does not offer, because it is missing from `GET /capabilities`'s `playbackModes`, is a `409`: the request is well formed and the player is the reason it cannot be met, the same reading `POST /tags` already gives an address it cannot place.

        The answer comes once the player has been handed this command and run it. Where the mode landed reaches a client through `GET /state`'s `playbackMode`, not this answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackModeRequest" }
            examples:
              shuffle:
                value: { mode: shuffleTracks }
      responses:
        "204":
          description: Set.
        "400":
          description: |
            The body is not JSON, carries no `mode`, or names something that is not one of `PlaybackMode`'s own values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackModeRefusal" }
              examples:
                unknownName:
                  value: { error: unacceptable mode, detail: "'shuffleRecords' is not a playback mode this API knows" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "409": { $ref: "#/components/responses/PlaybackModeUnavailable" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /outputs:
    get:
      tags: [player]
      operationId: getOutputs
      summary: The output devices foobar2000 offers, and which one is set.
      description: |
        Read straight from the player on every call rather than held between them: a device can appear or disappear at the operating system without foobar2000 telling this component first, so there is nothing here worth caching.

        `active` is the id of the device the player is currently paired with, or `null` where that pairing matches none of `devices`, which is what a device unplugged since the last switch looks like from here.
      responses:
        "200":
          description: The devices this install can send sound to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outputs" }
              examples:
                default:
                  value:
                    devices:
                      - { id: "D41D2423-FBB0-4635-B233-7054F79814AB:44761B90-C842-41F7-86E5-645DE2EEA6DC", name: "Speakers (Realtek High Definition Audio)" }
                      - { id: "D41D2423-FBB0-4635-B233-7054F79814AB:00000000-0000-0000-0000-000000000000", name: "Primary Sound Driver" }
                    active: "D41D2423-FBB0-4635-B233-7054F79814AB:44761B90-C842-41F7-86E5-645DE2EEA6DC"
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/OutputsUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /outputs/active:
    post:
      tags: [player]
      operationId: setActiveOutput
      summary: Switch the player's output device.
      description: |
        `deviceId` is one of the ids `GET /outputs` last listed. There is no output type alongside it: foobar2000 picks the module and the device together, off the pair the id itself carries, so a type field would only restate what the id already says.

        The answer comes once the player has been handed this command and run it. Where the switch landed reaches a client through `GET /state`'s `outputDeviceId`, not this answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveOutputRequest" }
            examples:
              switch:
                value: { deviceId: "D41D2423-FBB0-4635-B233-7054F79814AB:00000000-0000-0000-0000-000000000000" }
      responses:
        "204":
          description: Switched.
        "400":
          description: |
            The body is not JSON, carries no `deviceId`, carries it with the wrong type, or carries a field the schema does not declare.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveOutputRefusal" }
              examples:
                noDeviceId:
                  value: { error: unacceptable output device, detail: "'deviceId' is required and must be a string" }
        "403": { $ref: "#/components/responses/OutputChangeDisabled" }
        "409": { $ref: "#/components/responses/OutputDeviceNotListed" }
        "415":
          description: The body was not `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/OutputsUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /volume:
    post:
      tags: [player]
      operationId: setVolume
      summary: Set the player's level, step it, or mute it.
      description: |
        Exactly one of `value`, a level in `GET /capabilities`'s `volumeMin`..`volumeMax`; `step`, one player-defined nudge in the direction named; and `muted`, set rather than toggled. Naming two of them or naming none is a `400`, read off which field is present and never off what it holds: `{"value": 0}` is a legal level and `{"muted": false}` is a legal unmute, and a check written against truthiness refuses both.

        `step`'s size is whatever foobar2000 is configured to step by; this route does not invent one, through `playback_control::volume_up`/`volume_down`.

        The answer comes once the player has been handed this command and run it. Where the level and the mute flag landed reach a client through `GET /state`'s `volume` and `muted`, not this answer.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeRequest" }
            examples:
              level:
                summary: Set the level directly, at the mute floor.
                value: { value: -100 }
              stepUp:
                value: { step: up }
              mute:
                value: { muted: true }
      responses:
        "204":
          description: Set.
        "400":
          description: |
            The body is not JSON, names none of `value`, `step` and `muted`, names more than one of them, `step` is anything but `"up"` or `"down"`, a named field carries the wrong type, `value` is outside `volumeMin`..`volumeMax`, or `value` is too large for the body to hold, such as `1e999`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeRefusal" }
              examples:
                twoForms:
                  value: { error: unacceptable volume, detail: "send exactly one of 'value', 'step' and 'muted'" }
                badStep:
                  value: { error: unacceptable volume, detail: "'step' must be 'up' or 'down'" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/VolumeUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /state:
    get:
      tags: [player, library]
      operationId: getState
      summary: What the player is doing, and the library's two generations.
      description: |
        The document a client polls. It is small, it is `ETag`ged, and a poll that finds nothing new is a `304` with no body.

        Read `library.structure` and `library.revision` from here and compare them with the ones in the header of the snapshot already held. A different `structure` means export again. A higher `revision` with the same `structure` means fetch a delta. Both the same means there is nothing to do.

        `library.ready` is `false` between the component starting and its first snapshot being built, and also on an install with no media library at all: the two are indistinguishable from this document alone. This is also what a client polls after a `202` from `GET /library/export`: wait until `library.ready` is true and `library.columns` has the same members as the set declared, then ask for the export again.

        This route never answers `503`: a player with no library is still a player, so it answers `200` with `library.ready` false and a populated `player` section. The three routes under `/library` keep their own `503` when there is no library to serve.

        Its `ETag` names the content coding, exactly as the two binary routes do. See *Compression*.
      responses:
        "200":
          description: |
            The current state of the snapshot. `Cache-Control` is `private, no-cache`, as on every route here that sets a validator: this must stay current, so no cache but the client's own may hold it, and a client revalidates before drawing the copy it holds rather than reusing it blind.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`."
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The generations and the coding, quoted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
              examples:
                built:
                  value:
                    configGeneration: 3
                    library:
                      ready: true
                      structure: 41
                      revision: 903
                      trackCount: 30441
                      columns: ["%title%", "%album artist%", "%play_count%"]
                    player:
                      playback: playing
                      path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.flac'
                      subsong: 0
                      libraryPath: "Fictional Artist/Imaginary Album/01 Track.flac"
                      position: { seconds: 83.4, ageSeconds: 0.2 }
                      duration: 214.0
                      volume: -8.5
                      muted: false
                      playbackMode: inOrder
                      outputDeviceId: "D41D2423-FBB0-4635-B233-7054F79814AB:44761B90-C842-41F7-86E5-645DE2EEA6DC"
                      title: Imaginary Track
                      artist: Fictional Artist
                      album: Imaginary Album
                      albumArtist: Various Fictional Artists
                      playingLocation:
                        { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, index: 3 }
                      currentPlaylistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
                      queueRevision: 4
                      playlistsRevision: 7
                      timelineRevision: 12
                building:
                  summary: The component is up and the first walk has not finished.
                  value:
                    configGeneration: 0
                    library:
                      { ready: false, structure: 0, revision: 0, trackCount: 0, columns: [] }
                    player:
                      playback: stopped
                      path: ""
                      subsong: 0
                      libraryPath: null
                      position: { seconds: 0, ageSeconds: 0 }
                      duration: 0
                      volume: 0
                      muted: false
                      playbackMode: inOrder
                      outputDeviceId: null
                      title: null
                      artist: null
                      album: null
                      albumArtist: null
                      playingLocation: null
                      currentPlaylistId: null
                      queueRevision: 0
                      playlistsRevision: 0
                      timelineRevision: 0
        "304": { $ref: "#/components/responses/NotModified" }
        "429": { $ref: "#/components/responses/StatePolledTooFast" }

  /queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: The play queue, in the player's own order.
      description: |
        Every queued entry, in the order the player will play them, with the fields a client draws a row from and the revision they were read at. `revision` is `GET /state`'s `queueRevision` as of this read: refetch when the one a client holds has moved, and not otherwise.

        A queued library track carries `libraryPath` and no `location`. A queued playlist row carries `location`, and `libraryPath` too where the media library also holds that track. Either may be missing on its own, and both are missing for a track queued from a playlist row or a whole playlist since removed: the core keeps such an entry rather than dropping it, so this reports it with `location: null` rather than a stale position.
      responses:
        "200":
          description: The queue, read whole.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueRead" }
              examples:
                default:
                  value:
                    revision: 4
                    entries:
                      - title: Imaginary Track
                        artist: Fictional Artist
                        duration: 214.5
                        album: Imaginary Album
                        albumArtist: Various Fictional Artists
                        libraryPath: "Fictional Artist/Imaginary Album/01 Track.flac"
                        location: null
                      - title: Another Track
                        artist: Another Artist
                        duration: 187.0
                        album: Another Album
                        albumArtist: Another Artist
                        libraryPath: null
                        location: { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, index: 7 }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
    post:
      tags: [queue]
      operationId: queueTracks
      summary: Queue playlist rows or library tracks.
      description: |
        Takes exactly one of two bodies, named below: `QueuePlaylistRowsRequest` queues rows from a user's playlist, by position; `QueueLibraryTracksRequest` queues tracks from the media library, by handle, resolved against `structure` the same way `POST /playlists/{id}/items` resolves a fill. Naming fields from both, or from neither, is a `400`.

        A position or an ordinal repeated in the request is queued twice, exactly as foobar2000's own *Add to playback queue* allows for a row. One job either way, so a multi-select is never left half-queued.

        Omit `at` to queue at the end. Send it with `revision`, the queue revision it was chosen against from `GET /state`'s `queueRevision`, to queue at that position instead; `at` without `revision` is a `400`, decided here rather than by the player.

        Whether `playlistId` names a playlist, and whether a row or `at` names a position past what it addresses -- a row past the playlist's end, `at` past the queue's end -- are answered by the player rather than judged here: only it knows which playlists exist and how many rows or queue entries each holds. A `structure` that has moved is a `409`, the same as a fill's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/QueuePlaylistRowsRequest"
                - $ref: "#/components/schemas/QueueLibraryTracksRequest"
            examples:
              atTheEnd:
                summary: Three rows, queued in the order clicked.
                value: { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, positions: [7, 2, 5] }
              atAPosition:
                summary: One row, queued second in the queue.
                value:
                  playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
                  positions: [4]
                  at: 1
                  revision: 9
              libraryTracks:
                summary: Three library tracks, queued in the order clicked, by handle.
                value: { structure: 41, ordinals: [9, 0, 1] }
      responses:
        "204":
          description: Queued.
        "400":
          description: |
            The component judged the request for itself before the player was involved -- a body that is not JSON, a body naming both a playlist and the library or naming neither, a missing or unusable `playlistId`, an empty or unusable `positions`, an ordinal set that is not exactly one of `runs`, `bitset` and `ordinals` or that is empty, an ordinal outside the library while its `structure` is still the current one, or an `at` sent without a `revision` -- or the player found a row or `at` past the end of what it addresses. The schemas below tell the two apart.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409":
          description: |
            Either the `structure` a library-tracks request named has moved -- tracks were added to or removed from the library, so every ordinal it carries has shifted -- or `at` was sent with a `revision` the queue has moved past or never reached. `error` tells the two apart: re-read `GET /state`'s `library.structure` and export again for the first, or re-read `GET /queue` and try again for the second.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: |
            The queue is not available in this build, or, for a library-tracks request, the media library is not available or its first snapshot has not been built yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
    delete:
      tags: [queue]
      operationId: clearQueue
      summary: Empty the queue.
      description: |
        Removes every entry. Emptying the queue means the same thing against any view of it, so this carries no revision and is never refused for one that has moved.
      responses:
        "204":
          description: Cleared.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }

  /queue/move:
    post:
      tags: [queue]
      operationId: moveQueueEntry
      summary: Move one queue entry.
      description: |
        Takes the entry out at `from` and puts it back at `to`, its index once the queue is that one entry shorter -- the same plan Jean's queue panel makes for a drag. `revision` is the queue revision the move was planned against, from `GET /state`'s `queueRevision` or `GET /queue`'s own `revision`, and is required: unlike `POST /queue`'s `at`, a move has no "the end" to fall back to that needs no revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveQueueRequest" }
            examples:
              default:
                summary: The fourth entry, moved to the head.
                value: { from: 3, to: 0, revision: 9 }
      responses:
        "204":
          description: Moved.
        "400":
          description: |
            The component judged the request for itself before the player was involved -- a body that is not JSON, or a missing or unusable `from`, `to` or `revision` -- or the player found `from` or `to` past the end of the queue.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "409":
          description: |
            `revision` is not the queue's current one: it has moved past what a client planned this against, or has not reached it yet. Re-read `GET /queue` and try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }

  /queue/{index}:
    parameters:
      - name: index
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
        description: The entry's position in the queue, `0` being the head.
      - name: revision
        in: query
        required: true
        schema: { type: integer }
        description: |
          The queue revision `index` was read at, from `GET /state`'s `queueRevision` or `GET /queue`'s own `revision`.
    delete:
      tags: [queue]
      operationId: removeQueueEntry
      summary: Remove one queue entry.
      responses:
        "204":
          description: Removed.
        "400":
          description: |
            `index` or `revision` is not a whole number, or the player found `index` past the end of the queue.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "409":
          description: |
            `revision` is not the queue's current one: it has moved past what a client planned this against, or has not reached it yet. Re-read `GET /queue` and try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }

  /library/export:
    get:
      tags: [library]
      operationId: exportLibrary
      summary: Declare a column set, and take the whole library in one binary snapshot.
      description: |
        Every track, every declared column, in one response. The format is in the description at the top of this document, under *The media library*; the header's shape is `LibraryHeader`.

        `columns` is the declaration, and it is required. A `200` means a snapshot of exactly that set is built and this is it. A `202` means one is not, that the component has started building it, and that the client should poll `GET /state` until `library.columns` match and `library.ready` is true, then ask again. **The first export after the component starts, and the first after the declared set changes, is the slow one**: it walks and formats every track. Nothing else on this API is affected while it runs.

        There is no paged variant and none is planned. Paging a library needs a stable sorted order, producing one needs a full pass, and the component is where the whole database already sits in memory. A client that holds everything answers its own searches, counts and shelves without another request.

        The response is `ETag`ged on the two generations, so a client that polls `GET /state` and finds nothing new never gets here, and one that arrives anyway is answered `304`.

        Large. Expect single-digit megabytes for a library of thirty thousand tracks, growing roughly linearly. A client MUST read it as an `ArrayBuffer` rather than as text.
      parameters:
        - name: columns
          in: query
          required: true
          description: |
            The columns to build, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. Required: an export with none is a `400` rather than a rebuild from nothing.

            Passed to foobar2000's title-formatting compiler untouched. The three spine columns are always built and MUST NOT be named here.

            At most 64, each 1 to 1024 printable characters, and no repeats. Two spellings of one column, such as `a` and `%61`, are a repeat and are refused. An identical pair sent twice is not: the server collapses it before the component sees it, so it is accepted.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: |
            The snapshot. `Cache-Control` is `private, no-cache`, so no cache but the client's own may hold it and a client revalidates with `If-None-Match` rather than reusing it blind, and `Content-Encoding` is `gzip` whenever the request offered it. See *Compression*.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`."
            Content-Encoding:
              schema: { type: string, enum: [gzip] }
              description: Present only when the request offered gzip. Absent means the bytes as they stand.
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The generations and the coding, quoted.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "202":
          description: |
            No snapshot of that set exists and one is being built. The body is the `Library` object `GET /state` carries under `library`, as it stands now, so a client can see what it is waiting to change.

            Asking again for a set already being built is another `202` and does not start a second build. A client SHOULD poll `GET /state` rather than re-asking here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/LibraryRefused" }
        "413": { $ref: "#/components/responses/LibraryTooLarge" }
        "429": { $ref: "#/components/responses/LibraryRefreshedTooFast" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /library/changes:
    get:
      tags: [library]
      operationId: getLibraryChanges
      summary: What has changed since a revision, per column.
      description: |
        The patch between the revision a client holds and the current one, in the same binary format as the snapshot. It carries only the columns that moved and, within each, only the rows that moved, so the common case of a play count and a last-played date advancing touches two columns and leaves the rest of a client's arrays untouched by identity as well as by value.

        Call this when `GET /state` reports the same `library.structure` and a higher `library.revision`. A different `structure` is a `409`: ordinals have shifted and the patch would be meaningless, so export again.

        There is no `columns` here, because `since` already names the generation. A rebuild with a different set moves `structure`, so a client whose declaration is stale reaches the `409` and exports, which is where it declares again.

        The component keeps a bounded window of past revisions, and falling behind it is a `410`, whose description is where that window's reach is written down. The answer is the same one: export again. A client that polls at any sane interval will not see it.

        There is no promise of freshness the player cannot keep. A component storing its data privately and publishing it through a title-formatting hook, which is how several play-count components work, changes a value with no notification to anybody; foobar2000's own playlist columns show the same stale value. The snapshot catches up when that track next plays or when somebody calls `POST /library/refresh`.
      parameters:
        - name: since
          in: query
          required: true
          description: |
            The `revision` the client currently holds. A whole number. `revision` values are contiguous, so this is exactly what the last snapshot or delta header reported.
          schema: { type: integer, minimum: 0 }
          example: 900
      responses:
        "200":
          description: |
            The delta. Its header carries `since`, so a client can confirm what it was patched from. A revision that moved with no id changing is not a revision at all, so an answer here always has something in it. `Cache-Control` is `private, no-cache`, and the bytes are gzipped on the same terms as the snapshot; see *Compression*.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`."
            Content-Encoding:
              schema: { type: string, enum: [gzip] }
              description: Present only when the request offered gzip. Absent means the bytes as they stand.
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The generations, the revision patched from, and the coding, quoted.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/LibraryRefused" }
        "409": { $ref: "#/components/responses/LibraryConflict" }
        "410": { $ref: "#/components/responses/LibraryRevisionGone" }
        "413": { $ref: "#/components/responses/LibraryTooLarge" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /library/refresh:
    post:
      tags: [library]
      operationId: refreshLibrary
      summary: Rebuild the snapshot from the player.
      description: |
        Asks foobar2000 to walk its media library again and replaces the snapshot with the result. This is the hand on the wheel behind the two automatic mechanisms, the player's own change notifications and the re-read of every track as it stops playing, and it is what recovers a value neither of those can see.

        It rebuilds the column set last declared by an export, so it takes no body. On a component nothing has declared to since it started, it rebuilds the set already built, which is why a refresh cannot cost a client the snapshot it is using.

        Expensive: it re-queries and re-formats every track. Rate limited to a burst of three, refilling one every thirty seconds, which is what a person pressing a button needs and a looping client does not get.

        The answer is `202` rather than `200`. The rebuild may still be running, and the body carries the generations as they stand at the moment of the request, so a client watches `GET /state`'s `library.structure` for it to move past them. It MUST NOT treat the answer as the finished rebuild.
      responses:
        "202":
          description: |
            The rebuild was asked for. The body is the `Library` object `GET /state` carries under `library`, as it stands now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "429": { $ref: "#/components/responses/LibraryRefreshedTooFast" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /track/library:
    get:
      tags: [library]
      operationId: getLibraryTrack
      summary: One track's columns, addressed the way a cover is, or by its position.
      description: |
        The columns a client declares, evaluated against the one track the address names. The address is exactly one of two: `track` with `subsong`, `GET /artwork?track=`'s address word for word, or `ordinal` with `structure`, a position in the media library snapshot, resolved the way `POST /tags` resolves the same pair because it names one track where a relative path can name two. Sending both forms, or neither, is a `400`, and so is sending half of the ordinal form. The answer is the positional `columns` array `GET /playlists/{id}/items` gives a row.

        This is what reads one value back. The library arrives in bulk and is patched by delta, so a client that has just written a tag and wants to know what landed has nothing else to ask: a delta carries the change when the player notices it, which is not when the client is asking. The ordinal form is what that read-back sends after a write the library form answered `409` for, or after a write retried by ordinal and then timed out.

        `libraryPath` is not echoed. The caller supplied the address, so the answer carries only what it did not already have.

        The player compiles and evaluates these columns itself, so a set the snapshot was never built with is answered here without rebuilding anything and without disturbing what the snapshot holds. It answers one track, and reading many this way costs a request and a job at the player each, where the snapshot costs neither.
      parameters:
        - name: track
          in: query
          required: false
          description: |
            The library form's address: the track's path relative to the media library root, forward-slashed on every platform: the snapshot's `directory` and `filename` for that row, concatenated, or a playlist row's `libraryPath`. Percent-encode it.

            At most 4096 printable characters. It is a lookup key rather than a path, so `..` in it is neither refused nor meaningful: it matches nothing. Required unless `ordinal` is sent, and sending both is a `400`.
          schema: { type: string, minLength: 1, maxLength: 4096 }
          example: Artist/Album/01 A Title.flac
        - name: subsong
          in: query
          required: false
          description: |
            Which track inside the file, for cue sheets and disc images: the number the player assigned it, never a position among the tracks at one path. Every subsong of one file shares a `track` address, so this is what tells them apart. Meaningful only with `track`; an ordinal already names a subsong.

            Omitted is read as `0`, which is an ordinary file. A cue sheet's subsongs number from 1, so omitting it for a file the player splits is a `404` rather than that file's first track. Send the `subsong` the row carries.
          schema: { type: integer, minimum: 0 }
          example: 0
        - name: ordinal
          in: query
          required: false
          description: |
            The precise form's address: the track's position in the media library snapshot `structure` names, from `GET /library/export` or a delta. It names one track and one subsong, where a `track` address can name one under each of two media library roots.

            Requires `structure`; sending `track` as well is a `400`. A `structure` the player has moved past is a `409`; an ordinal past the end of the snapshot at that generation is the `404` an unknown address gets.
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
          example: 1904
        - name: structure
          in: query
          required: false
          description: |
            The media library's own generation the `ordinal` was read at: `library.structure` in `GET /state`, or the `structure` an export or a delta carried. Required with `ordinal`, and meaningless without it.
          schema: { type: integer, minimum: 0 }
          example: 41
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. The answer carries one value per column, in the order declared.

            Passed to foobar2000's title-formatting compiler untouched, under the same gate `GET /library/export` puts on a declaration: at most 64, each 1 to 1024 printable characters, and no repeats.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: The track, in the columns the request declared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryTrack" }
              examples:
                default:
                  summary: A track asked for as `%title%` and `%artist%`.
                  value:
                    columns: ["Imaginary Track", "Fictional Artist"]
        "400":
          description: |
            The request was understood and declined before the player was asked: neither `track` nor `ordinal` (a `structure` sent alone answers as neither), both of them, a `track` longer than 4096 characters or carrying a control character, a `subsong` that is not a whole number, `ordinal` sent without `structure`, an `ordinal` that is not a whole number or is past what 32 bits hold, no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, or the same column twice. A `track` sent alongside a `structure` with no `ordinal` is the library form and `structure` is ignored, the way `POST /tags` also ignores it there: that is a `200`, not this. The schemas below tell the column refusals from the address ones. They are `anyOf` rather than the `oneOf` this document pairs schemas with elsewhere, because `Error` is open and a `LibraryRefusal` body satisfies both.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/LibraryRefusal"
                  - $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NoSuchLibraryTrack" }
        "409":
          description: |
            The address no longer names one definite track, and nothing was answered. The `error` string says which of two.

            An address given without an ordinal names a track under more than one media library root, so answering one of them would confirm a value that may belong to the other. The client asked this route to find out what a write did, so the wrong track's columns are worse than none. `POST /tags` refuses the same address in the same words, and a client that read the row from an export holds the `ordinal` that names one track instead.

            Or the `ordinal` form's `structure` is no longer the media library's current one, which is also the answer while no snapshot has been built at all: tracks were added or removed since the generation it names, so every ordinal read against it has shifted. Export the library again and send the ordinal that names. An ordinal past the end of that generation is the `404` an unknown address gets, not this.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
              examples:
                ambiguous:
                  value:
                    error: the media library holds more than one track at that address
                    detail: ""
                structureMoved:
                  value:
                    error: "tracks were added or removed; export the library again"
                    detail: ""
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /track/playing:
    get:
      tags: [player]
      operationId: getPlayingTrack
      summary: The playing track's columns, addressed by nothing.
      description: |
        The columns a client declares, evaluated against whatever the player is playing right now: no path, no index, no handle. `GET /artwork/playing` is why this exists beside `GET /track/library`, in the same words: there is no library-relative path to address a stream, a CD track or a file the library has never indexed by, so a client that wants a value from one of those has nothing else to ask.

        The request named no track, so the answer carries `path` and `subsong` beside `columns`, spelled and valued exactly as `GET /state`'s `player.path` and `player.subsong`. A client checks the two against the track it asked about before drawing anything the answer carries: an answer that lands after the next track started still names the track that was playing when this component read it, and never the one the client now cares about.

        The columns are evaluated through the player's own now-playing formatting rather than against the playing file's stored tags, so a station announcing a song answers the song.

        This route reads nothing from the media library snapshot. It answers while `library.ready` is false, and for a track the library holds no path for, and it never answers `503`, unlike every route under `/library/`, which does answer that status in the same window.

        A paused player is answered like a playing one; only a stopped player is a `404`.

        Unlike `GET /artwork/playing`, this route sets no `ETag` and never answers `304`: there is nothing held here to fold a validator from, so a conditional request would cost the same job at the player as a fresh one.

        Every response carries `Cache-Control: private, no-cache`, refusals included: the address names nothing durable, so what sits behind it changes without the URL changing.
      parameters:
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. The answer carries one value per column, in the order declared.

            Passed to foobar2000's title-formatting compiler untouched, under the same gate `GET /track/library` puts on a declaration: at most 64, each 1 to 1024 printable characters, and no repeats.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: The playing track, in the columns the request declared, beside the identity of the track that answered.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`: revalidate on every request, since this URL names a different track once the player does."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayingTrackColumns" }
              examples:
                default:
                  summary: A track asked for as `%title%` and `%artist%`.
                  value:
                    path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.flac'
                    subsong: 0
                    columns: ["Imaginary Track", "Fictional Artist"]
        "400":
          description: |
            The request was understood and declined before the player was asked: no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, or the same column twice.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`, as on the `200`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryRefusal" }
              examples:
                noColumns:
                  value: { error: unacceptable column, detail: "'columns' is required" }
        "404": { $ref: "#/components/responses/NoTrackPlaying" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /artwork:
    get:
      tags: [artwork]
      operationId: getArtwork
      summary: The front cover of a track the media library holds.
      description: |
        One picture, addressed by a track's library-relative path, revalidated rather than re-fetched. *Artwork* at the top of this document is the whole of it: how to address a cover, why every row of an album should point at one URL, and what the validator is computed from.

        The address is resolved against the snapshot already in memory, with no scan of the library and no walk of the filesystem. The cover itself is loaded on every request, a conditional one included, for the reason *Revalidating a cover* gives.
      parameters:
        - name: track
          in: query
          required: true
          description: |
            The track's path relative to the media library root, forward-slashed on every platform: the snapshot's `directory` and `filename` for that row, concatenated. Percent-encode it.

            At most 4096 printable characters. It is a lookup key rather than a path, so `..` in it is neither refused nor meaningful: it matches nothing.
          schema: { type: string, minLength: 1, maxLength: 4096 }
          example: Artist/Album/01 A Title.flac
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`private, max-age=15552000`, 180 days: this album's cover is fresh for months, and never in a cache but that client's."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/ArtworkNotModified" }
        "400": { $ref: "#/components/responses/ArtworkRefused" }
        "404": { $ref: "#/components/responses/NoArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }
        "503": { $ref: "#/components/responses/ArtworkUnavailable" }

  /artwork/playing:
    get:
      tags: [artwork]
      operationId: getPlayingArtwork
      summary: The front cover of whatever is playing.
      description: |
        One picture, addressed by nothing. *The playing cover* above is the whole of it: why it exists beside `GET /artwork`, what it resolves that the snapshot cannot, and why revalidating it costs no file access.
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the track does."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/RevalidatedArtworkNotModified" }
        "404": { $ref: "#/components/responses/NoPlayingArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }

  /artwork/playlists/{id}/{row}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
      - name: row
        in: path
        required: true
        description: The row's position in the playlist, `0` being the first.
        schema: { type: integer, minimum: 0, maximum: 4294967295 }
        example: 0
    get:
      tags: [artwork]
      operationId: getPlaylistRowArtwork
      summary: The front cover of a playlist row with no library-relative path.
      description: |
        The fallback for a row `GET /artwork` cannot address. *The positional fallback* above is the whole of it: why a playlist and a position stand in for a path, and why a row the media library does hold a path for is refused rather than answered.

        A query string carrying `track` is ignored: the client's whole say in this request is the playlist and the position, and the player resolves the handle behind them.
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the row does."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/RevalidatedArtworkNotModified" }
        "400":
          description: An `id` this component did not issue, or a `row` that is not a whole number or is larger than 4294967295.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "404": { $ref: "#/components/responses/NoPositionalArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/ArtworkUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /stream/ticket:
    post:
      tags: [stream]
      operationId: issueStreamTicket
      summary: Get a short-lived credential for one stream connection.
      description: |
        An `<audio>` element cannot send a header at all, so the credential for `GET /stream` travels in the query string. That makes it a capability URL, and a short lifetime is what bounds it: a ticket expires in `expiresIn` seconds and grants nothing but the audio already being played.

        A ticket is not single-use. Safari's media element probes a source with a `Range: bytes=0-1` request before fetching it for real, so one playback start is two requests and a single-use ticket cannot serve Safari at all. A ticket is good until it expires; `maxConcurrentStreams` bounds how many streams may be open at once.

        A client SHOULD call this immediately before opening the stream rather than at page load, and MUST request a fresh ticket when reconnecting. Clients MUST NOT store a ticket or log it.

        This is also where a device says who it is, because it is the only part of opening a stream a client controls: an `<audio>` element sends no body and no header of its own. The identity rides the ticket to the connection it opens, so `GET /stream/listeners` can group sockets into devices. A request with no body is an anonymous listener rather than a refusal.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIdentity" }
      responses:
        "200":
          description: A ticket, good until it expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTicket" }
              examples:
                issued:
                  value:
                    ticket: 8f14e45fceea167a5a36dedd4bea2543f14e45fceea167a5a36dedd4bea2543a
                    expiresIn: 120
        "400":
          description: A body that is not a JSON object, or a `deviceId` or `name` that is not short text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: A body was sent and was not `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

  /stream/listeners:
    get:
      tags: [stream]
      operationId: getStreamListeners
      summary: Who is listening, and whether the player was silenced for them.
      description: |
        The audience, counted two ways at once. **Connections** are what cost a thread and what `maxConcurrentStreams` bounds. **Devices** are what a person reads, and one device is routinely two connections — Safari probes a source with `Range: bytes=0-1` before fetching it for real — or three across a reconnect. A client MUST count devices anywhere it says how many people are listening.

        This is a roster and not a set of targets. Audio cannot be sent to a device that is not already asking for it: starting playback in a browser needs a gesture on that browser, so there is nothing here for a client to press.

        Nothing in it names a network address or a user agent. A device is called what it called itself.
      responses:
        "200":
          description: The audience as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamListeners" }
              examples:
                twoDevices:
                  value:
                    devices:
                      - deviceId: 3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8
                        name: Android phone
                        format: opus
                        connections: 1
                        listeningFor: 412
                      - deviceId: 9d21b7f4-8c60-4e15-a3b2-77c1e0f5a9d3
                        name: null
                        format: aac
                        connections: 2
                        listeningFor: 18
                    connections: 3
                    maxConnections: 8
                    playerMuted: true

  /stream/hold:
    delete:
      tags: [stream]
      operationId: releaseOutputHold
      summary: Ask for the player to be audible alongside the listeners.
      description: |
        While anybody is listening this component silences the player, so that choosing a device moves the sound rather than doubling it. This asks for both at once instead.

        There is no route that *takes* the hold. A client says it wants both outputs; when they should be one is the component's to decide, and it decides again the moment everybody has stopped listening — the choice is scoped to the spell of listening it was made in, not to a connection, so a reconnect does not undo it and the next session does not inherit it.

        Clients SHOULD warn before offering this. The stream runs a second or two behind the player, which is fine a room apart and an echo in the same room; `GET /stream/timeline` is how a client can say by how much rather than hedging.

        Idempotent, and it says nothing about whether there was a hold to release: with nobody listening there is nothing to give back and nothing has gone wrong.
      responses:
        "204":
          description: Noted.
        "503":
          description: This install does not mute the player, so there is never a hold. `canMuteWhileStreaming` says so in advance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stream/leave:
    post:
      tags: [stream]
      operationId: leaveStream
      summary: Say that a device stopped listening on purpose.
      description: |
        A closed socket does not say why it closed. A handoff back to the player and a wireless dropout look identical from here, and they want opposite answers: the first should give the player its sound back at once, the second must not unmute into a gap the client is about to reconnect across. So a device that stopped deliberately says so, and everything else waits out the linger.

        Best effort, and never required. A client that crashes, a tab that closes and a request that fails all end the same way a moment later. Ignored while the device still holds a connection, and it can only ever end its own linger — a `deviceId` nobody sent is not a way to unmute the player.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIdentity" }
      responses:
        "204":
          description: Noted, whether or not there was anything to end.
        "400":
          description: No `deviceId`, or a body that is not a JSON object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body was not `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stream/timeline:
    get:
      tags: [stream]
      operationId: getStreamTimeline
      summary: What is audible, in the stream's own clock.
      description: |
        The player's reported position is not what a listener is hearing: the stream runs a second or two behind it, so a progress bar or lyrics driven from `GET /state`'s `player.position` run ahead of the audio. This route is how a client corrects that.

        `audio.currentTime` counts rendered audio: it advances only as sound leaves the speaker. The only unknown is the stream time of the first sample the element played, and it is recoverable:

        ```js
        // once, when the element starts playing
        const connectedAt = performance.now();
        const { streamTime } = await (await fetch(base + "/stream/timeline", auth)).json();
        const anchor = streamTime - (performance.now() - connectedAt) / 1000;

        // any time after
        const audible = anchor + player.currentTime;
        const mark = marks.findLast(m => m.at <= audible);
        const position = mark ? mark.position + (audible - mark.at) : null;
        ```

        A client MUST re-anchor after every reconnect, because `currentTime` restarts. It MAY re-poll occasionally and re-derive `anchor` to shed clock drift, which is milliseconds over a few minutes.

        Browsers differ over whether `currentTime` starts at zero or at the stream's own granule position, which is a large number for a listener joining a long-running stream. Deriving `anchor` as above works either way, and a client can tell which it got from whether `anchor` came out near zero.
      responses:
        "200":
          description: The stream clock, and where the last few tracks began.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTimeline" }
              examples:
                midTrack:
                  value:
                    streamTime: 491.46
                    marks:
                      - at: 402.1
                        path: 'C:\Music\Émile Fictif\Canción Inventada\06 Café Imaginario.mp3'
                        subsong: 0
                        position: 0
        "503": { $ref: "#/components/responses/StreamUnavailable" }

  /stream:
    get:
      tags: [stream]
      operationId: openStream
      summary: Listen to what foobar2000 is playing.
      description: |
        A single unbounded response carrying the player's own output: the same audio the speakers get, with its DSP chain and ReplayGain applied. There is no length, no `Range` and no seeking. Seeking means asking foobar2000 to seek, which moves every listener at once.

        The response is chunked and ends when the client disconnects, the component stops, or the listener falls too far behind to be sent contiguous audio. A client MUST reconnect rather than treat the end as a stop: a dropped connection is ordinary on a wireless network, and an `<audio>` element does not retry by itself.

        This route takes a ticket because an `<audio>` element cannot send a header at all: without one, anything that can address this origin, a cross-origin `<audio src>` included, could open a stream. Without a valid ticket it answers `401`.
      parameters:
        - name: ticket
          in: query
          required: true
          description: From `POST /stream/ticket`. Valid until it expires, not consumed by this request.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: |
            One of the `streamFormats` from `GET /capabilities`. Omit it to get the first, which is the best this install offers. A format the install does not encode is a `400` rather than a silent substitution.
          schema: { type: string }
          examples:
            safari: { value: aac }
      responses:
        "200":
          description: |
            Audio, until something ends it. `Cache-Control` is `no-store`, there is no
            `Content-Length`, and `Accept-Ranges` is `none` — a live stream has no length
            to take a range of, and a `Range` request is answered with the stream from the
            live edge like any other.
          content:
            audio/ogg:
              schema: { type: string, format: binary }
            audio/aac:
              schema: { type: string, format: binary }
        "400":
          description: A format this install does not encode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            No ticket, an unknown ticket, or an expired one. All three answer identically, so a caller cannot sort guesses into wrong and too late.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

components:
  responses:
    PlaylistRefused:
      description: |
        The request was understood and declined before the player was involved: a body that is not JSON, a missing or unusable `title`, `query`, `sort` or `key`, an id this component did not issue, or an ordinal set that is not exactly one of `runs`, `bitset` and `ordinals`, or that names an ordinal outside the library while its `structure` is still the current one. A `structure` that has moved is a `409` instead, whether the library grew or shrank.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistRefusal" }
          examples:
            noQuery:
              value: { error: unacceptable query, detail: "'query' is required" }
            queryTooLong:
              value: { error: unacceptable query, detail: "'query' must be printable text of at most 4096 characters" }
            notJson:
              value: { error: malformed request, detail: "could not parse it as JSON: [json.exception.parse_error.101] parse error at line 1, column 1: syntax error while parsing value - invalid literal; last read: 'n'" }
            twoForms:
              value: { error: unacceptable ordinal set, detail: "'runs' and 'bitset' were both present; send exactly one" }

    NotOurs:
      description: |
        The target was not created by this component: `POST /autoplaylists` is the only route that makes a playlist these two can touch, so anything else, including an autoplaylist made in foobar2000 itself, is refused here whatever `writePlaylists` says. There is no remedy: a client asking either route to convert a hand-built playlist would have `beginUpdate` replace the user's own rows with a query's results.

        The same status also answers when `writePlaylists` is `false` in `config.json`, checked before the target is looked at. A client tells the two apart by `error`, which the examples below give both of.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            notOurs:
              value: { error: that playlist was not created by foo_jean, detail: "" }
            writesDisabled:
              value: { error: this install has playlist writes turned off; turn on writePlaylists in config.json to allow them, detail: "" }

    WritesDisabled:
      description: |
        This install has `writePlaylists` set to `false` in `config.json`. That is a player owner's own choice, made to keep every playlist but this component's own scratch playlist read-only; setting it back to `true` is what grants the write.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: this install has playlist writes turned off; turn on writePlaylists in config.json to allow them, detail: "" }

    OwnPlaylistAddressed:
      description: |
        The edit addresses one of this component's own playlists, found by the `role` a `PlaylistAnnotation` carries and never by its title. Jean plays a set through the scratch, so retitling, deleting, moving or changing the rows of one by `id` would take apart the playlist somebody is listening from. `POST /playlists/own/{role}/items` fills one and `DELETE /playlists/own/{role}/items` empties it; those two are the whole of what may change it, and `writePlaylists` being `true` buys nothing here.

        Reading is not addressing. Such a playlist stays a legal `source` for `POST /playlists/{id}/items/copy` and for `POST /playlists`, and its rows are readable as any other playlist's, which is what lets *Add to playlist* and *Save as playlist* work over results Jean played through the scratch.

        The same status also answers when `writePlaylists` is `false` in `config.json`, checked before the playlist is looked at. A client tells the two apart by `error`, which the examples below give both of.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            ownPlaylist:
              value: { error: that playlist is foo_jean's own; address it by its role rather than by its id, detail: "" }
            writesDisabled:
              value: { error: this install has playlist writes turned off; turn on writePlaylists in config.json to allow them, detail: "" }

    PlaybackDisabled:
      description: |
        This install has `controlPlayback` set to `false` in `config.json`. That is a player owner's own choice, made to keep the transport, the queue and the component's own scratch playlist untouched from here; setting it back to `true` is what grants the write. Reading the state and the queue is unaffected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: this install has playback control turned off; turn on controlPlayback in config.json to allow it, detail: "" }

    OutputChangeDisabled:
      description: |
        This install has `changeOutput` set to `false` in `config.json`. That is a player owner's own choice; setting it back to `true` is what grants the write. `GET /outputs` is unaffected either way, and so are the volume, the mute flag and every playback command, which follow `controlPlayback` instead.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: this install has output device changes turned off; turn on changeOutput in config.json to allow them, detail: "" }

    OutputDeviceNotListed:
      description: |
        The `deviceId` sent is not one `GET /outputs` currently lists. The request is well formed and the player is the reason it cannot be met, the same reading `POST /playback/mode` already gives a mode this install does not offer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: the player does not list that output device; read the outputs again, detail: "" }

    OutputsUnavailable:
      description: |
        The component could not reach the part of the player the output device list and the active device are read from.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: output devices are not available }

    NoSuchPlaylist:
      description: No playlist has that id. It may have been deleted in the player.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistConflict:
      description: |
        Another playlist already has that `key`, or this install is at `maxAutoPlaylists`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            keyInUse:
              value: { error: another playlist already has that key, detail: "folder:genre:Rock" }
            tooMany:
              value: { error: this install's autoplaylist limit is reached, detail: "this install allows 100 and already has 100" }

    StructureMoved:
      description: |
        The `structure` the request named is no longer the current one: tracks were added to or removed from the library, so every ordinal it carries has shifted and inserting them would land the wrong rows. This is the same `409` `GET /api/library/changes` answers for the same reason, and the remedy is the same: export the library again and resolve the set against the `structure` that export reports.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; export the library again"
                detail: ""

    FillConflict:
      description: |
        The `structure` the request named is no longer the current one, or another component has locked the target playlist against having rows added. The `error` string distinguishes them. The first is the same `409` `GET /library/changes` answers, and the remedy is the same: export the library again and resolve the set against the `structure` it reports. The second is released at the player, by whatever put it there, and nothing a client sends changes that.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; export the library again"
                detail: ""
            locked:
              value:
                error: "another component has locked that playlist against that edit"
                detail: ""

    TooManyRequests:
      description: |
        Playlist changes or queue changes are arriving faster than this component will make them. The limit bounds how fast a client bug can flood the player with playlists or queue entries; it is not a security control.

        A burst of thirty is allowed, refilling at one a second, one budget shared across creating, renaming, moving and deleting a playlist, copying rows into one and removing them, and across queueing, moving, removing and clearing the queue. Reading and previewing are not limited. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistRefusal" }

    BodyTooLarge:
      description: |
        The body is larger than 256 KiB and was refused before it was parsed, the same ceiling and the same refusal `POST /tags` answers: one `set_payload_max_length` covers every route this component accepts a body on. No set a library view can produce needs to reach it — `bitset` costs about one byte per eight ordinals in the library whatever the set, which is the form to reach for once a scattered set would cost more as `runs`.

        The component answers and closes while the rest of the body may still be in flight, so a client sending something very large may see a dropped connection instead of this response. Both mean refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: request too large }

    PlayerRefused:
      description: |
        The player refused. No reason is given, because error text leaks filesystem paths.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlayerTooSlow:
      description: |
        The player did not finish within 30 seconds. The work MAY still complete afterwards, so a client MUST re-read `GET /playlists` rather than assume it did not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistUnavailable:
      description: |
        Autoplaylists are not available in this install, either because the component could not reach that part of the player or because `maxAutoPlaylists` is `0` in `config.json`. `GET /capabilities` reports this in advance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistWritesUnavailable:
      description: |
        The component could not reach the part of the player a playlist is created, renamed, moved or deleted through. Unrelated to autoplaylists, whose own unavailability is `PlaylistUnavailable`: a request naming none should not send a player owner to `maxAutoPlaylists`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: playlist changes are not available }

    FillUnavailable:
      description: |
        Either this install does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or no snapshot has been built yet. Both mean there is nothing to resolve the set against.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the media library is not available }
            nothingYet:
              value: { error: the library snapshot has not been built yet, detail: "" }

    PlaylistRowsMoved:
      description: |
        The `structure` the request named is no longer the playlist's current one: its rows were added, removed or reordered, so every position the client holds names a different track and patching one would draw the wrong row. Read the playlist's rows again, from the `structure` `GET /playlists` now reports.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            restructured:
              value:
                error: "the playlist's rows were added, removed or reordered; read them again"
                detail: ""

    PlaylistLocked:
      description: |
        Some other component has locked the playlist against this edit, and foobar2000 refuses it on that component's behalf. Nothing a client sends changes that: the lock is released at the player, by whatever put it there. A playlist reports its locks per edit, so one that refuses a rename may still take rows.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            locked:
              value:
                error: "another component has locked that playlist against that edit"
                detail: ""

    PlaylistRevisionGone:
      description: |
        The revision asked to catch up from is outside the window this playlist retains, or it is ahead of the current one, which is what a client holding rows across a component restart sees. The remedy is the same as the `409`'s: read the playlist's rows again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            gone:
              value:
                error: "that revision is not one this playlist can catch up from; read its rows again"
                detail: ""

    PlaylistRowsUnavailable:
      description: |
        The component could not reach the part of the player a playlist's rows are read from. Unrelated to autoplaylists, whose own unavailability is `PlaylistUnavailable`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the playlist's rows are not available }

    OwnPlaylistsUnavailable:
      description: |
        The component could not reach the playlist machinery its own scratch playlist depends on. Unrelated to autoplaylists, whose own unavailability is `PlaylistUnavailable`, and unrelated to the read-only-playlists setting, which never reaches this route.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the component's own playlists are not available }

    StreamUnavailable:
      description: |
        Either this install does not stream, because no encoder started or `streamingEnabled` is false, or it is already serving as many connections as `maxConcurrentStreams` allows. The `error` string distinguishes them, and a client SHOULD present the second as busy and retry rather than as unsupported. `GET /capabilities` reports the first in advance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotModified:
      description: |
        The client already holds this representation. No body. `ETag` is repeated so a client can keep validating against it.

        cpp-httplib evaluates `If-None-Match` for static files alone, so these routes answer it themselves. The tag is strong, it is quoted, and `*` is accepted. It is not a hash of the bytes: it is the generations the representation was built from, plus the content coding it was sent in, and both of those move whenever the bytes do. A validator held from an identity answer therefore does not revalidate a gzipped one, which is deliberate.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`, as on the `200`."
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried, coding suffix and all.
        Vary:
          schema: { type: string }
          description: "`Accept-Encoding`."

    StatePolledTooFast:
      description: |
        Polls of `GET /state` are arriving faster than this component will answer them: a burst of 30, refilling one every 100 milliseconds, per source address. An ordinary poll on its own interval never meets this; a client stuck in a loop does.

        The refusal is decided before the document is built, so it carries no `ETag` and neither the `player` nor the `library` section. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    PlaybackUnavailable:
      description: |
        The component could not reach the part of the player these transport commands run through.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: playback commands are not available }

    PlaybackTooSlow:
      description: |
        The player did not finish within 30 seconds. The command MAY still land afterwards, so a client MUST read `GET /state` rather than assume it did not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaybackModeUnavailable:
      description: |
        `mode` is a `PlaybackMode` this API knows, but this install's own order list, `GET /capabilities`'s `playbackModes`, does not carry it. The request is well formed and the player is the reason it cannot be met; nothing was changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notOffered:
              value: { error: this install does not offer that playback mode }

    VolumeUnavailable:
      description: |
        The component could not reach the part of the player the level and the mute flag are read from and written to.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: volume is not available }

    LibraryRefused:
      description: |
        The request was understood and declined before the snapshot was touched: no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, the same column twice, or a `since` that is missing or not a whole number.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryRefusal" }
          examples:
            noColumns:
              value: { error: unacceptable column, detail: "'columns' is required" }
            noSince:
              value: { error: unacceptable revision, detail: "'since' is required" }
            repeated:
              value: { error: duplicate column, detail: "column 3 repeats an earlier one" }

    LibraryConflict:
      description: |
        `structure` has moved since the revision named in `since`, so ordinals have shifted and a patch would be meaningless. Export again, which is also where a client declares its columns afresh.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; export the library again"
                detail: ""

    LibraryRevisionGone:
      description: |
        The revision asked to catch up from is outside the retained window of 1920, or it is ahead of the current one, which is what a client that kept a snapshot across a component restart sees. Both mean the same thing: export again.

        That window is spent by listening rather than by the clock. Every track that stops playing is re-read and moves `revision`, and nothing moves it while nobody is listening, so a client asleep overnight comes back inside it. One away across days of playback does not, and exports again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }

    LibraryTooLarge:
      description: |
        The snapshot serialises to more than 64 MiB and this component will not send it. The ceiling is on the serialised bytes rather than on what crosses the wire, so gzip does not buy room underneath it. That is a ceiling on the *response*; `413` on a request body is a different limit and a different number.

        Nothing a client can do about it. It means a library far larger than this format was measured against, and it is worth reporting.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    LibraryRefreshedTooFast:
      description: |
        Rebuilds are arriving faster than this component will make them: a burst of three, refilling one every thirty seconds, shared between `POST /library/refresh` and the builds an export declares. A rebuild re-queries and re-formats every track in the library, so this bounds what a looping client, or one varying the set it asks for, can do to the player.

        Asking again for a set already being built costs nothing here, so an ordinary client never meets this.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    LibraryUnavailable:
      description: |
        Either this install does not serve the media library at all, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or `GET /library/changes` was asked for a patch on a component with no snapshot yet.

        The `error` string tells them apart: `the media library is not available` is the first, `the library snapshot has not been built yet` the second. `GET /library/export` answers the second case with a `202` instead, because there the client has just said what to build.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the media library is not available }
            nothingYet:
              value: { error: the library snapshot has not been built yet, detail: "" }

    NoSuchLibraryTrack:
      description: |
        The snapshot holds no track at that address, which is what a client sees after tracks moved on disk or after a rebuild it has not read yet, and never another track's values. An `ordinal` past the end of the snapshot at the `structure` it named answers the same way.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no such track }

    NoTrackPlaying:
      description: |
        The player is stopped. `GET /artwork/playing` answers `404` the same way for the same reason, and a paused player is answered like a playing one, here as there.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`: revalidate on every request, since this URL names a different track once the player does."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: nothing is playing }

    ArtworkNotModified:
      description: |
        The cover is byte for byte the one the client was last sent, so there is no body.

        `ETag` is repeated so a client can keep validating against it, and `Cache-Control` is repeated so a stored copy that has just been confirmed keeps its instruction.
      headers:
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried.
        Cache-Control:
          schema: { type: string }
          description: "`private, max-age=15552000`, as on the `200`."

    RevalidatedArtworkNotModified:
      description: |
        The cover is byte for byte the one the client was last sent, so there is no body.

        `ETag` is repeated so a client can keep validating against it, and `Cache-Control` is repeated so a stored copy that has just been confirmed still revalidates next time.
      headers:
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried.
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`, as on the `200`."

    ArtworkRefused:
      description: |
        The address was declined before the snapshot was consulted: no `track` at all, one longer than 4096 characters, or one carrying a control character.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noTrack:
              value: { error: "'track' is required" }

    NoArtwork:
      description: |
        There is no picture to send. Either the snapshot holds no track at that address, which is what a client sees after tracks moved on disk, or the player has no front cover for the one it holds, or the cover is in a format this component does not publish.

        The `error` string tells them apart. All three are ordinary: an album without a sleeve is not a fault, and a client SHOULD fall back to whatever it draws for a record with no art rather than report an error.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, max-age=600`, ten minutes: a cover added at the player is drawn within that window with no reload."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no artwork for that track }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    NoPlayingArtwork:
      description: |
        There is no picture to send for whatever is playing: nothing is playing yet, the player has no front cover for what is, or the cover is in a format this component does not publish.

        The `error` string is the same one `GET /artwork` answers with for the second and third of those, because from a reader's side it is the same fact. A client SHOULD fall back to whatever it draws for a record with no art rather than report an error.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the track does."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no artwork for that track }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    NoPositionalArtwork:
      description: |
        There is no picture to send from a playlist and a position: the playlist does not exist, the position is past its end, the media library already holds a path for that row, the player has no front cover for what it found there, or the cover is in a format this component does not publish.

        The `error` string tells them apart. All five are ordinary and a client SHOULD fall back to whatever it draws for a record with no art rather than report an error.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the row does."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noSuchPlaylist:
              value: { error: no such playlist }
            positionPastEnd:
              value: { error: that position is past the end }
            nothing:
              value: { error: no artwork for that track }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    ArtworkTooLarge:
      description: |
        The picture is larger than 16 MiB and this component will not send it. A ceiling on the *response*; `413` on a request body is a different limit and a different number.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ArtworkRequestedTooFast:
      description: |
        Covers are arriving faster than this component will read them: a burst of 300, refilling one every 50 milliseconds. A screenful of covers at once is the case this exists to allow, so a client drawing a grid never meets it; a client looping does.

        A client that meets this SHOULD back off rather than retry, and MUST NOT treat it as "no artwork". `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ArtworkUnavailable:
      description: |
        This install does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`. Artwork is addressed through the snapshot, so there is nothing to address without one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: artwork is not available }

  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [name, version, apiVersion]
      properties:
        name:
          type: string
          const: foo_jean
          description: Always this value, which is what confirms the answering origin is foo_jean rather than something else on it.
        version:
          type: string
          description: The component's own version. Informational; branch on apiVersion instead.
          examples: ["0.3.0"]
        apiVersion:
          type: integer
          description: The shape of this API. A client MUST refuse a number it does not understand.
          examples: [1]

    Capabilities:
      type: object
      additionalProperties: false
      required:
        [apiVersion, allowedFields, canWrite, canWritePlaylists, canControlPlayback,
         canChangeOutput, maxAutoPlaylists, canCreateAutoPlaylists, canStream, streamFormats,
         canMuteWhileStreaming, canReadLibrary, playerName, playerVersion, volumeMin,
         volumeMax, volumeUnit, playbackModes]
      properties:
        apiVersion:
          type: integer
          examples: [1]
        allowedFields:
          type: array
          description: |
            Tag names this install permits, lower case by convention and matched case-insensitively. Anything not named here is refused with a `403`.
          items: { type: string }
          examples: [["rating"]]
        canWrite:
          type: boolean
          description: |
            Exactly `allowedFields.length > 0`. A convenience, not a second source of truth.
        canWritePlaylists:
          type: boolean
          description: |
            Whether this install permits a write to a playlist or autoplaylist it did not create itself: create, add, edit, delete or reorder. `writePlaylists` in `config.json`, defaulting to `true`. A component predating this field reports nothing, and a client MUST read absence as writable.

            The component's own scratch playlist stays writable regardless: this governs the user's playlists, not the component's own plumbing. The play queue is unaffected either way, since it is addressed through `/queue` rather than through a playlist.
        canControlPlayback:
          type: boolean
          description: |
            Whether this install permits driving playback from here: the transport, seeking, the playback mode, the volume, playing a row and every queue write. `controlPlayback` in `config.json`, defaulting to `true`. Reading the state and the queue is unaffected either way, and so is the component's own scratch playlist, which follows this rather than `canWritePlaylists`.
        canChangeOutput:
          type: boolean
          description: |
            Whether this install permits switching the player's output device. `changeOutput` in `config.json`, defaulting to `true`. It refuses `POST /outputs/active` alone: `GET /outputs` stays open regardless, and the volume, the mute flag and every playback command answer to `controlPlayback` instead.
        maxAutoPlaylists:
          type: integer
          minimum: 0
          description: |
            How many autoplaylists this component will keep at once, counting only the ones it created. `0` switches creation off.

            The cap bounds a client bug rather than an attacker; anything admitted onto this origin can already write tags.
          examples: [100]
        canCreateAutoPlaylists:
          type: boolean
          description: |
            True only when `canWritePlaylists` is true and `maxAutoPlaylists` is above zero. False under either alone, so a client gates a single control on this field rather than checking both itself.
        canStream:
          type: boolean
          description: |
            Exactly `streamFormats.length > 0`. False on an install where the component loaded but no encoder started, where `streamingEnabled` is false, and on any component version that predates streaming. A client MUST hide the listen control when it is false rather than offer it and fail.
        streamFormats:
          type: array
          items: { type: string }
          description: |
            What `GET /stream?format=` accepts, best first. `opus` is Ogg Opus, which every current browser except older Safari plays. `aac` is AAC-LC in ADTS, for Safari before 18.4.

            A client SHOULD omit `format` and take the first entry unless it knows the browser needs otherwise. The list varies by install: one whose Windows has no AAC encoder reports `opus` alone.
          examples: [["opus", "aac"]]
        canMuteWhileStreaming:
          type: boolean
          description: |
            Whether this install silences the player while somebody is listening to the stream. `muteWhileStreaming` in `config.json`, and the player owner's decision rather than a client's: there is no route that changes it.

            The capture is taken before the player's volume, so muting leaves the stream at full level. False makes the player one more speaker alongside every listener, which is fine a room apart from them and an echo in the same one — the stream runs a second or two behind.
        canReadLibrary:
          type: boolean
          description: |
            Whether this install serves the media library. False on a component that loaded without the feature and on any version predating it, and every route under `/library` then answers `503`, as does `GET /artwork`, which addresses a cover through the snapshot. `GET /state` answers `200` regardless, with `library.ready` false. A client MUST hide the library rather than offer it and fail.

            True says the routes are there, not that a snapshot is built yet. `GET /state` reports `library.ready` for that.
        playerName:
          type: string
          description: |
            The player's own name, read once at startup and static for as long as it runs. foo_jean loads in foobar2000 alone, so this is the player identifying itself rather than a client needing to guess.
          examples: ["foobar2000"]
        playerVersion:
          type: string
          description: The player's own version string, read the same way.
          examples: ["2.25.3"]
        volumeMin:
          type: number
          description: |
            The floor of the range `PlayerState.volume` in `GET /state` moves within. A client draws the fader's whole length against `volumeMin`..`volumeMax` rather than assuming any particular scale.
          examples: [-100]
        volumeMax:
          type: number
          description: The ceiling of that range.
          examples: [0]
        volumeUnit:
          type: string
          description: What `volumeMin`, `volumeMax` and `PlayerState.volume` are all measured in.
          examples: ["db"]
        playbackModes:
          type: array
          items: { $ref: "#/components/schemas/PlaybackMode" }
          description: |
            The playback modes this install can be put into, in the order the player itself lists them. An order the player reports that this component has no Jean name for is missing from here rather than guessed at, and an install reporting none answers an empty array.
          examples: [["inOrder", "repeatAll", "repeatOne", "random", "shuffleTracks", "shuffleAlbums", "shuffleFolders"]]

    PlaybackMode:
      type: string
      description: |
        Jean's own name for a playback order. `foo_jean` maps it both ways against whatever the player calls its own orders; neither foobar2000's own string nor its ordinal ever crosses this API.
      enum: [inOrder, repeatAll, repeatOne, random, shuffleTracks, shuffleAlbums, shuffleFolders]

    PlaybackSeekRequest:
      description: |
        Exactly one of `seconds` and `relativeSeconds`. Naming both or naming neither is a `400`.
      type: object
      additionalProperties: false
      properties:
        seconds:
          type: number
          minimum: 0
          description: An absolute position in the playing track, in seconds from its start.
          examples: [90]
        relativeSeconds:
          type: number
          description: An offset from wherever the player is now, in seconds. Negative moves backward.
          examples: [-10]

    PlaybackModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/PlaybackMode" }

    VolumeRequest:
      description: |
        Exactly one of `value`, `step` and `muted`. Naming two of them or naming none is a `400`, read off which field is present and never off what it holds.
      type: object
      additionalProperties: false
      properties:
        value:
          type: number
          description: |
            A level in `GET /capabilities`'s `volumeMin`..`volumeMax`, in `volumeUnit`. `0` is a legal level like any other in that range, read off its presence rather than its truth, and never the absence of one. A level outside that range is refused, never clamped onto it.
          examples: [-8.5]
        step:
          type: string
          enum: [up, down]
          description: |
            One player-defined nudge, sized however foobar2000 is configured to step: never a number, so the size stays the player's.
          examples: [up]
        muted:
          type: boolean
          description: |
            Set rather than toggled: `true` mutes and `false` unmutes, whatever the player's mute state was before this arrived.
          examples: [true]

    PlaybackSeekRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable seek]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    PlaybackModeRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable mode]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    VolumeRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable volume]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    Outputs:
      type: object
      additionalProperties: false
      required: [devices, active]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/OutputDevice" }
        active:
          type: [string, "null"]
          description: |
            The id of the device foobar2000 is currently paired with, or `null` where that pairing matches none of `devices`.

    OutputDevice:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: |
            Opaque: the output module's GUID and the device's GUID, printed the way foobar2000 prints a GUID and joined by `:`. A client MUST NOT parse, split or build one.
          examples: ["D41D2423-FBB0-4635-B233-7054F79814AB:44761B90-C842-41F7-86E5-645DE2EEA6DC"]
        name:
          type: string
          description: What to call this device in a picker, exactly as foobar2000 names it.
          examples: ["Speakers (Realtek High Definition Audio)"]

    ActiveOutputRequest:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId:
          type: string
          description: |
            One of the ids `GET /outputs` last listed, opaque the same way: a client MUST NOT parse, split or build one, only echo one it was handed. No output type rides alongside it; the id names the module and the device together.

    ActiveOutputRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable output device]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    StreamTimeline:
      type: object
      additionalProperties: false
      required: [streamTime, marks]
      properties:
        streamTime:
          type: number
          description: |
            Seconds of audio encoded since the component started. Not wall-clock time and not the player's position. It is the clock `marks[].at` is expressed in.
        marks:
          type: array
          description: |
            Where the stream last changed what a given stream time means, oldest first: a track starting, or a seek within one. The list is bounded, so a player left running for a day does not grow it; a client needs only the marks around what it is currently hearing.

            A seek produces a mark because the track does not change but its position does. Without one a client goes on deriving positions from before the jump.
          items:
            type: object
            additionalProperties: false
            required: [at, path, subsong, position]
            properties:
              at:
                type: number
                description: Stream time at which this track's audio began.
              path:
                type: string
                description: |
                  A plain absolute local path, the form foobar2000 evaluates `%path%` to and `GET /state`'s `player.path` carries, so a client can join the two on equality. No route here is addressed by it.

                  Not the form the player stores: on a portable install foobar2000's canonical path for `C:\Music\x.mp3` is `file-relative://..\Music\x.mp3`. This route resolves it.
              subsong: { type: integer }
              position:
                type: number
                description: |
                  Where the player was within the track at `at`. Zero except when a listener connects mid-track or somebody seeks.

    DeviceIdentity:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          maxLength: 64
          description: |
            Opaque, and stable for as long as the device keeps its storage. It is what groups a device's connections into one listener, so a reconnect and Safari's `Range` probe do not read as three people.

            Untrusted: it labels a row in somebody else's picker and nothing branches on it, and anything admitted onto this origin could send another device's. A client SHOULD generate one at random and keep it, and MUST NOT derive it from anything about the person using it.
          examples: ["3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8"]
        name:
          type: string
          maxLength: 64
          description: |
            What to call this device in a picker. Empty, absent, unprintable or overlong all become no name at all — the label is refused, never the request, because a bad name must not cost somebody their audio.
          examples: ["Android phone"]

    StreamListeners:
      type: object
      additionalProperties: false
      required: [devices, connections, maxConnections, playerMuted]
      properties:
        devices:
          type: array
          description: Connected devices, longest-listening first. A device inside its linger has gone and is not here.
          items:
            type: object
            additionalProperties: false
            required: [deviceId, name, format, connections, listeningFor]
            properties:
              deviceId:
                type: string
                description: |
                  As the device sent it, or `#<n>` for a connection that named nothing. Each anonymous connection is its own device: merging them would report two strangers as one person.
              name:
                type: [string, "null"]
                description: Null when the device did not name itself, so a client can tell that from a name it chose.
              format:
                type: string
                examples: [opus]
              connections:
                type: integer
                description: |
                  Sockets this device holds. Routinely two — Safari probes a source with `Range: bytes=0-1` before fetching it for real.
                examples: [2]
              listeningFor:
                type: integer
                description: Seconds since this device's oldest live connection opened.
        connections:
          type: integer
          description: |
            Every socket, across every device. This is what `maxConnections` bounds, and it is not the number a person should be shown.
        maxConnections:
          type: integer
          description: "`maxConcurrentStreams` from `config.json`."
        playerMuted:
          type: boolean
          description: |
            Whether the player is silent *because somebody is listening*, as opposed to muted by hand. foobar2000 has no mute flag, only a volume at -100 dB, so a client reading the volume alone sees a fader at the bottom either way, and this is what tells it which sentence to put next to it.

            False the moment anybody unmutes the player from either end: the hold never argues, and stays released until nobody is listening.

    StreamTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresIn]
      properties:
        ticket:
          type: string
          description: |
            Opaque. Send it as the `ticket` query parameter and discard it once the connection is open.
        expiresIn:
          type: integer
          description: Seconds from now.
          examples: [120]

    TagWriteRequest:
      description: |
        Where to write, and what. The address is exactly one of three: `track` with `subsong`, `ordinal` with `structure`, or `playlist` with `index` and `structure`. None of them and two of them are both a `400`, and so is a member of any carried with the wrong type. Nothing here is a filesystem path.
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        track:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            The library form: the track's path relative to the media library root, forward-slashed on every platform, the address `GET /artwork?track=` takes. The snapshot's `directory` and `filename` for that row, concatenated, or a playlist row's `libraryPath`.

            At most 4096 printable characters. It is a lookup key rather than a path, so `..` in it is neither refused nor meaningful: it matches nothing, which is a `404`.
          examples: ["Fictional Artist/Imaginary Album/01 Track.flac"]
        subsong:
          type: integer
          minimum: 0
          description: |
            Which track inside the file, for cue sheets and disc images: the number the player assigned it, never a position among the tracks at one path. Every subsong of one file shares a `track` address, so this is the half of the library form that tells them apart.

            Omit it for an ordinary file, where a missing value is read as `0`. A cue sheet's subsongs number from 1, so omitting it for a file the player splits is a `404` rather than a write to that file's first track. Send the `subsong` the row carries.

            No `default:` is declared here. openapi-typescript treats a property that has one as always present and emits it non-optional, which would force every caller to pass a subsong it does not have.
        ordinal:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            The precise library form: the track's position in the media library snapshot `structure` names, from `GET /library/export` or a delta. It names one track and one subsong, where a `track` address names every root holding that relative path.

            This is what a client sends after a `409` saying the address holds more than one track. Requires `structure`, which is the media library's own generation and a number.
          examples: [1904]
        playlist:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The playlist form: the playlist holding the row, by the `id` a `PlaylistAnnotation` carries. The address for a track the media library does not hold, and for nothing else.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        index:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            The row's position in that playlist, `0` being the first, at the `structure` it was read at. Required with `playlist`.
          examples: [3]
        structure:
          description: |
            The generation the address was read at, required with `ordinal` and with `playlist`, and its type says which of the two was sent. A well-formed generation the player has moved past is a `409` and anything else about it is a `400`. Nothing is written either way.

            With `playlist` it is that playlist's own structure generation, from `GET /playlists`, from a page or from a delta: a string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, sent exactly as it arrived.

            With `ordinal` it is the media library's own generation, from `library.structure` in `GET /state`, and a number, the same value a fill sends.
          oneOf:
            - type: string
              pattern: "^[0-9]+$"
            - type: integer
              minimum: 0
          examples: ["9204739866101318923", 41]
        fields:
          type: object
          minProperties: 1
          description: |
            Tag name to value. Every name MUST be on the allowlist. Two names differing only in case are refused rather than guessed at, since foobar2000 tag names are case-insensitive and that is two instructions for one tag.
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
            description: |
              A whole number is accepted and rendered as text, so `4` and `"4"` are the same request. An empty string removes the tag. Fractional numbers, booleans and nulls are refused.
          examples: [{ rating: "4" }]

    TagWritten:
      description: |
        What was written, and the address it was written to, echoed in the form the request sent: `track` and `subsong` for the library form, `subsong` carrying the value the write used and so `0` where the request omitted it; `ordinal` alone for the ordinal form, which names a subsong already; `playlist` and `index` for the playlist form. `structure` is not echoed, being a precondition on the write rather than part of the address.
      type: object
      additionalProperties: false
      required: [written, fields]
      properties:
        written: { type: boolean, const: true }
        track: { type: string }
        subsong: { type: integer, minimum: 0 }
        ordinal: { type: integer, minimum: 0 }
        playlist: { type: string }
        index: { type: integer, minimum: 0 }
        fields:
          type: object
          description: What was written, normalised to strings.
          additionalProperties: { type: string }

    TagRefused:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [written, error, detail]
      properties:
        written: { type: boolean, const: false }
        error:
          type: string
          description: The category of refusal.
          enum:
            - malformed request
            - unacceptable address
            - no fields to write
            - field not allowed
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.
        field:
          type: string
          description: |
            Present only when `error` is `field not allowed`, naming the field. A client SHOULD use it to stop offering that control.

    TagFailed:
      description: The request was acceptable and the attempt failed.
      type: object
      additionalProperties: false
      required: [written, error]
      properties:
        written: { type: boolean, const: false }
        error:
          type: string
          enum:
            - foobar2000 does not know that track
            - the media library holds more than one track at that address
            - "the playlist's rows were added, removed or reordered; read them again"
            - the media library was rebuilt; export it again
            - the player could not write the tags
            - the player did not answer in time
            - tag writing is not available

    PlaylistAnnotation:
      description: |
        One playlist, with everything a client draws its entry in a list from.
      type: object
      additionalProperties: false
      required: [id, index, title, itemCount, isAutoPlaylist, role, structure, revision, managed]
      properties:
        id:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed. Stable across renames, reordering and restarts, and never reused. It is what the routes here address, and what a client SHOULD store to find a playlist again later.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        index:
          type: integer
          minimum: 0
          description: |
            Position in the player's own playlist list, counting from zero. Not identity: creating, deleting or reordering a playlist changes it.
        title:
          type: string
          description: |
            The playlist's title, as the player holds it. foobar2000 permits two playlists to share one, so it is for display rather than for identity.
        itemCount:
          type: integer
          minimum: 0
          description: |
            How many rows the playlist holds.
        isAutoPlaylist:
          type: boolean
          description: |
            Whether the playlist is an autoplaylist, filled and kept filled by the player from a query. True for any autoplaylist, including ones made in foobar2000 before this component was installed.
        role:
          type: [string, "null"]
          enum:
            - scratch
            - null
          description: |
            What this component keeps the playlist for, and `null` for every playlist it keeps for nothing of its own, which is all of them a user made. `scratch` is the playlist a fill puts a set of tracks in for the player to play, and a client SHOULD hide it from the playlist list it draws.

            Read from a marker this component writes on the playlist rather than from the title, so a playlist renamed at the player keeps its role and a playlist somebody titles to look like this one never gains one.
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Moves when the playlist's rows are added, removed, reordered or replaced. Rows a client read at an earlier value are at positions that have moved, and it MUST read them again.

            **A string of decimal digits, and never a JSON number.** This is a 64-bit counter, seeded so that no value it has ever published comes back after a restart, which puts it far above 2^53. A JSON number is an IEEE 754 double and exact only to 2^53, so a parser that reads this as a number rounds four consecutive generations to a single value and a client comparing two of them cannot see the edit between them. Compare these for equality and send them back as they arrived. Nothing here is ordered, counted or added to, so a string costs a client nothing.

            The other counters on this API are inside 2^53 and stay numbers: `GET /state`'s `playlistsRevision`, `queueRevision` and `timelineRevision`, the media library's own `structure` and `revision`, and the library `structure` a fill or a create resolves its ordinals against. Only a playlist's own two are spelled this way.
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Moves when a row already in the playlist would answer differently, a tag, a rating or a play count. The rows stay where they are.

            A string of decimal digits for the reason `structure` gives, and compared the same way.
        managed:
          description: |
            What this component stored when it created the playlist, or `null` for every playlist it did not create, including autoplaylists made in the player. This is how a client tells a folder it manages from an autoplaylist that was already there.

            It is kept as a foobar2000 playlist property, so it travels with the playlist through renames and restarts and is removed with the playlist.
          oneOf:
            - { $ref: "#/components/schemas/ManagedAutoPlaylist" }
            - type: "null"

    ManagedAutoPlaylist:
      type: object
      additionalProperties: false
      required: [key, query, sort, forceSort]
      properties:
        key:
          type: string
          description: |
            Whatever the client sent, handed back verbatim. Empty when none was given.
        query:
          type: string
          description: |
            The query the playlist was created with. Editing the query in foobar2000's own dialog makes this stale, and the component cannot detect that: the SDK offers no way to read an autoplaylist's current query back.
        sort:
          type: string
        forceSort:
          type: boolean

    AutoPlaylistRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What the playlist is called in foobar2000's own tabs. Required when creating, optional when updating; omitting it on an update leaves the name alone rather than renaming the playlist to whatever the client last knew.

            What somebody looking at the player will read on the tab. Nothing in this API parses it, and the user may rename it freely -- so a client that needs to recognise its own playlists later MUST use `key`, never the title.

            No control characters, which would be line breaks in a playlist tab.
        key:
          type: string
          maxLength: 256
          description: |
            Opaque to this component: stored, handed back and compared for equality, never interpreted. A client puts here whatever lets it recognise its own playlists later, such as `folder:genre:Rock`, rather than encoding a convention in the title, which the user can edit.

            MUST be unique across the playlists this component created. A second playlist with the same key is a `409` rather than a duplicate, so the same create request is safe to send twice.
          examples: ["folder:genre:Rock"]
        query:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            foobar2000's own query syntax, passed through untouched. This component never composes or interprets it; the player owns that language and is the only thing that can say whether a query parses.

            Quoting is therefore the client's responsibility. A value taken from library data and pasted in unquoted can produce a valid query that is not the one intended, and no validation here can catch that. Use `POST /autoplaylists/preview` to see what a query matches.
          examples: ["%genre% IS Rock"]
        sort:
          type: string
          maxLength: 4096
          description: A title-formatting pattern to sort by. Optional.
          examples: ["%album artist%|%date%|%album%"]
        forceSort:
          type: boolean
          description: |
            Keep the playlist sorted, and stop the user reordering it by hand. Optional, and false when absent.

    FillOwnPlaylistRequest:
      type: object
      additionalProperties: false
      required: [title, structure]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What to title the playlist. Applied on every call, whether this one is what creates the playlist for `role` or finds one already there, so retitling it from one fill to the next is the same call that fills it, never a second one.

            A title beginning `#Jean` reaches foobar2000's own tab exactly as sent; one that does not is prefixed with `#Jean` before it gets there. These are the component's own playlists, and a title is all the player's own list of playlists shows about whose a playlist is. No title is refused for lacking the prefix.

            `maxLength` bounds this request, not the tab it ends up in: the prefix is added afterwards, so a title at the bound that does not already begin `#Jean` reaches foobar2000 six characters past it.

            No control characters, which would be line breaks in a playlist tab.
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: export the library again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    FillPlaylistRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: export the library again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    CopyPlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [source, runs]
      properties:
        source:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The playlist to take rows from, by the `id` a `PlaylistAnnotation` carries. Rows are copied, so the source is left as it was. No generation is sent with it: the positions are read against the playlist as it stands when the player takes the job.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        runs: { $ref: "#/components/schemas/Runs" }

    RemovePlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's own `structure` generation, the one its positions were read at. Read it from `GET /playlists`, from a page, from a delta or from the answer a copy gave. A value other than the playlist's current one is a `409` and nothing is removed.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, sent exactly as it arrived. **This is not the `structure` a fill sends.** A fill resolves media library ordinals against the library's own generation, which is inside 2^53 and is a number; this names one playlist's own counter, which is not.
          examples: ["9204739866101318923"]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    RenamePlaylistRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What to title the playlist, exactly as it will read in foobar2000's own tabs. No control characters, which would be line breaks in a playlist tab.

    MovePlaylistRequest:
      type: object
      additionalProperties: false
      required: [index]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            Where the playlist ends up in the player's list, counting from zero. A value at or past the number of playlists is a `400`.
          examples: [0]

    CreatePlaylistRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What to title the playlist, exactly as it will read in foobar2000's own tabs. No control characters, which would be line breaks in a playlist tab.
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. Required with `runs`, `bitset` or `ordinals`, and refused with `source`, which names rows rather than library tracks. A value other than the one currently held is a `409`: export the library again and resolve the set against the `structure` it reports.
          examples: [41]
        source:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The playlist to take rows from, by the `id` a `PlaylistAnnotation` carries. Sent with `runs`, which then names row positions in that playlist rather than library ordinals, and never with `structure`, `bitset` or `ordinals`. Rows are copied, so the source is left as it was.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    Runs:
      type: array
      description: |
        The set as ranges: each entry is `[start, count]`, a run of `count` consecutive positions beginning at `start`. A position is a library ordinal where a library `structure` is sent alongside the set, and a row position where the request names a playlist to read rows from instead, either through `source` or as the playlist in the path. Collapses a whole album, a whole folder or a whole playlist to a handful of pairs.

        Read in ascending order, never in the order the pairs are listed: a run cannot carry any other. A client holding a click-ordered set MUST send `ordinals` instead.
      items:
        type: array
        items: { type: integer, minimum: 0, maximum: 4294967295 }
        minItems: 2
        maxItems: 2
      examples: [[[0, 2], [9, 1]]]

    Bitset:
      type: string
      description: |
        The set as a bitmap, one bit per position of the kind `Runs` describes, least-significant bit first within each byte: bit 0 of byte 0 is position 0, bit 7 of byte 0 is position 7, bit 0 of byte 1 is position 8. Base64, and against the library exactly `ceil(trackCount / 8)` bytes for the `structure` sent alongside it. Costs about one byte per eight positions whatever the set holds, which is what makes it the form to reach for once a scattered set would cost more as `runs` than the range it names is wide.

        Read in ascending order: a bitmap carries no other order to preserve.
      examples: ["AwI="]

    Ordinals:
      type: array
      items: { type: integer, minimum: 0, maximum: 4294967295 }
      description: |
        The set as a plain list of the positions `Runs` describes. The only one of the three forms read in the order it is given rather than ascending, which makes it the form a client holding a click-ordered set, such as a multi-select or a queue, MUST send. Sending the same set as `runs` or `bitset` reads it in ascending order instead, silently.
      examples: [[9, 0, 1]]

    FillResult:
      type: object
      additionalProperties: false
      required: [playlistId, structure, positions]
      properties:
        playlistId:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed. From `POST /playlists/own/{role}/items` this is the id `role` resolved to; from `POST /playlists/{id}/items` it is the `id` the request named.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The target playlist's `structure` generation once the rows have landed. An undo naming this one removes exactly the rows below and nothing else, and a rating changed in between moves the playlist's `revision` rather than this, so it does not block one.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, and it goes back into `POST /playlists/{id}/items/remove` exactly as it arrived. A client that holds it as a number undoes against a neighbour of it and is refused `409` every time.

            Not the same field as the `structure` this request sent: that one is the media library's own generation, an ordinal is resolved against it, and it stays a plain number.
          examples: ["9204739866101318924"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One position per row inserted, in the order the rows were inserted: request order for `ordinals`, ascending ordinal order for `runs` and `bitset`. `positions[i]` is where the *i*-th inserted row landed, 0-based.
          examples: [[0, 1, 2]]

    CopiedRows:
      type: object
      additionalProperties: false
      required: [structure, positions]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The target playlist's `structure` generation once the rows have landed. An undo naming this one removes exactly the rows below and nothing else, and a rating changed in between moves the playlist's `revision` rather than this, so it does not block one.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, and it goes back into `POST /playlists/{id}/items/remove` exactly as it arrived. A client that holds it as a number undoes against a neighbour of it and is refused `409` every time.
          examples: ["9204739866101318924"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One position per row appended, in ascending source order, 0-based in the target. Empty where `runs` named no rows.
          examples: [[4, 5, 6]]

    RemovedRows:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's `structure` generation once the rows are gone. A client holding the rest of the rows re-keys them to this rather than reading the playlist again.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives.
          examples: ["9204739866101318924"]

    QueryPreview:
      type: object
      additionalProperties: false
      required: [valid, error, matches, libraryEnabled]
      properties:
        valid:
          type: boolean
          description: Whether foobar2000 could read the query. Check this before `matches`.
        error:
          type: string
          description: |
            The player's own message when `valid` is false, and empty otherwise. Safe to show a person: it describes the query they typed, not anything on the disk.
        matches:
          type: integer
          minimum: 0
          description: How many tracks in the Media Library the query matches. `0` when invalid.
        libraryEnabled:
          type: boolean
          description: |
            Whether this install has a Media Library configured. Autoplaylists filter the Media Library and nothing else, so `false` means every autoplaylist is empty whatever the query. A client SHOULD say so before somebody creates one, which is why this is reported here rather than on `/capabilities`.

    PlaylistRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - malformed request
            - unacceptable title
            - unacceptable key
            - unacceptable query
            - unacceptable sort
            - unacceptable playlist id
            - unacceptable ordinal set
            - too many requests
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    PlaylistFailed:
      description: The request was acceptable and the attempt failed.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - foobar2000 could not read that query
            - no such playlist
            - that position is past the end
            - the media library holds more than one track at that address
            - that playlist was not created by foo_jean
            - another playlist already has that key
            - this install's autoplaylist limit is reached
            - tracks were added or removed; export the library again
            - the queue changed since that revision; read it again
            - the playlist's rows were added, removed or reordered; read them again
            - that revision is not one this playlist can catch up from; read its rows again
            - the player could not do that
            - the player did not answer in time
            - autoplaylists are not available
            - this install has playlist writes turned off; turn on writePlaylists in config.json to allow them
            - another component has locked that playlist against that edit
            - that playlist is foo_jean's own; address it by its role rather than by its id
            - this install has playback control turned off; turn on controlPlayback in config.json to allow it
            - this install has output device changes turned off; turn on changeOutput in config.json to allow them
            - the player does not list that output device; read the outputs again
        detail:
          type: string
          description: |
            Empty except for a query foobar2000 could not read, where it carries the player's own parse error. That message describes text the client sent rather than anything on the player's disk, so it is safe to show.

    State:
      description: |
        What `GET /state` answers. The library's two generations ride under `library`, and
        what the player is doing rides under `player`.
      type: object
      additionalProperties: false
      required: [library, player, configGeneration]
      properties:
        library: { $ref: "#/components/schemas/Library" }
        player: { $ref: "#/components/schemas/PlayerState" }
        configGeneration:
          type: integer
          minimum: 0
          description: |
            Moves when a reload changes a key `GET /capabilities` reflects, and stands still on every other reload, including one that changed nothing or changed only a key that needs foobar2000 restarted. A client polls this to learn a switch moved without asking for capabilities on every tick.
          examples: [3]

    Library:
      description: |
        What rides under `library` in `GET /state`'s `200`, and what `GET /library/export` and `POST /library/refresh` hand back on a `202`. Small on purpose: it is polled.
      type: object
      additionalProperties: false
      required: [ready, structure, revision, trackCount, columns]
      properties:
        ready:
          type: boolean
          description: |
            Whether a snapshot has been built. False only between the component starting and its first walk finishing. Every other library route answers `503` while it is false.
        structure:
          type: integer
          description: |
            Moves when tracks are added to or removed from the library. A different value from the one a client's snapshot header carries means every ordinal it holds is meaningless: export again. `0` before the first build.
          examples: [41]
        revision:
          type: integer
          description: |
            Moves when a row changes in place, which is what a play, a rating or a tag edit does. A higher value with an unchanged `structure` means fetch a delta. Contiguous, so it is exactly the `since` to ask with.
          examples: [903]
        trackCount:
          type: integer
          description: Rows in the snapshot, which is the length of every `ids` array in it.
          examples: [30441]
        columns:
          type: array
          items: { type: string }
          description: |
            The title-formatting expressions the ready snapshot was built with, in the order they appear in the header's `columns` array. Empty while `ready` is false. The spine is not among them: `directory`, `filename` and `subsong` are always built and are reported under `spine` instead.

            This is what a client compares against between a `202` from `GET /library/export` and its next attempt. The comparison is by membership: same members, in any order, is the same declaration.
          examples: [["%title%", "%album artist%", "%play_count%"]]

    PlayingLocation:
      description: |
        Where the playing track sits: the playlist's GUID and the item's position within it.
      type: object
      additionalProperties: false
      required: [playlistId, index]
      properties:
        playlistId:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed, matching `PlaylistAnnotation.id` for the same playlist.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        index:
          type: integer
          minimum: 0
          description: The playing item's position within that playlist, 0-based.

    PlayerState:
      description: |
        What rides under `player` in `GET /state`'s `200`. Always present and never null: a
        stopped player still answers this section, with `playback` `stopped` and `path` empty.
      type: object
      additionalProperties: false
      required:
        [playback, path, subsong, libraryPath, position, duration, volume, muted, playbackMode,
         outputDeviceId, title, artist, album, albumArtist, playingLocation, currentPlaylistId,
         queueRevision, playlistsRevision, timelineRevision]
      properties:
        playback:
          type: string
          enum: [stopped, paused, playing]
          description: What the player is doing right now.
        path:
          type: string
          description: |
            What is playing, or empty when nothing is. foobar2000's own absolute
            display path, in the player's own separator. Not the media library
            snapshot's key, which is `directory` plus `filename`, library-relative
            and forward-slashed everywhere.
        subsong:
          type: integer
          description: The player's own subsong number within `path`, for a cue sheet or a disc image. `0` for an ordinary file.
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds the playing track, or `null` where it does not. With `subsong` it is the library address `POST /tags` takes, and it is the only address a client can write a rating for the playing track to: `path` is foobar2000's own absolute one and no route here accepts it.
        position: { $ref: "#/components/schemas/Position" }
        duration:
          type: number
          description: The playing track's length in seconds, or `0` when nothing is playing.
        volume:
          type: number
          description: The player's own volume, in whatever range it reports.
        muted:
          type: boolean
        playbackMode:
          description: |
            Jean's name for the playback order the player is in right now, or `null` when this component has no name for the order the player reports. Always present and never omitted, so a client can tell "no name for this" from "too old to report".
          oneOf:
            - { $ref: "#/components/schemas/PlaybackMode" }
            - type: "null"
        outputDeviceId:
          type: [string, "null"]
          description: |
            The id of the device the player is set to, spelled exactly as `GET /outputs` spells it, or `null` where the component cannot ask. It rides every poll of this document because it is one field; the device list is its own route because building it costs more than a poll should.
        title:
          type: [string, "null"]
          description: |
            The playing track's title, computed by the player, or `null` when it has not computed one.
        artist:
          type: [string, "null"]
          description: |
            The playing track's artist, computed by the player, or `null` when it has not computed one.
        album:
          type: [string, "null"]
          description: |
            The record the playing track is from, computed by the player, or `null` when it has not computed one. A client keys a cover by this, alongside `albumArtist`, rather than by the track, so an album played through costs one request.
        albumArtist:
          type: [string, "null"]
          description: |
            The playing track's album artist, computed by the player, or `null` when it has not computed one. Not filled in from `artist`: a compilation credits a different artist on every row of the same record.
        playingLocation:
          description: |
            Where the playing track sits, or `null` when it is not playing from a playlist this component can name.
          oneOf:
            - { $ref: "#/components/schemas/PlayingLocation" }
            - type: "null"
        currentPlaylistId:
          type: [string, "null"]
          description: |
            The playlist the player has focused, by the `id` a `PlaylistAnnotation` carries. `null` where the player has no focused playlist at all, which is a state foobar2000 can be in and not an error.

            **This is not where the playing track is**, which is `playingLocation` and can name a different playlist: what is focused is a property of the player's own window. It is here rather than as a flag on `GET /playlists` because a client watching it wants it at the rate it polls playback, and because it moves when nothing about the playlist list has.

            It decides more than which tab is drawn. Under foobar2000's *Playback follows cursor* it is also the playlist an advance takes its next track from, so a client that started a set and sees this naming something else is about to lose playback to it.
          example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
        queueRevision:
          type: integer
          description: |
            Moves when the queue's contents or order change, or when a queued entry's playlist position shifts or is lost. Never moves for anything else this section reports.
        playlistsRevision:
          type: integer
          description: |
            Moves when a playlist is created, removed, moved in the list or retitled, and when any playlist's `structure` or `revision` moves. A client re-reads `GET /playlists` when the one it holds has moved, and not otherwise.
        timelineRevision:
          type: integer
          description: |
            Moves when the encoder lays a mark on the timeline `GET /stream/timeline` answers, for a track starting or a seek. Never moves for anything else this section reports. `0`, and never moving, where `maxConcurrentStreams` is `0` in `config.json`.

    Position:
      description: |
        Where playback was at the moment this component last looked, and how long ago that
        was. A `steady_clock` mark means nothing on another machine, so `ageSeconds` is the
        only part of it a client can use: it adds `ageSeconds` to `seconds` and keeps counting
        from there while `player.playback` is `playing`.
      type: object
      additionalProperties: false
      required: [seconds, ageSeconds]
      properties:
        seconds:
          type: number
          description: Playback position at the mark, in seconds.
        ageSeconds:
          type: number
          description: |
            How long before this response was built the mark was taken, in seconds. `0` when
            no mark has ever been taken.

    PlaylistPage:
      description: |
        `GET /playlists/{id}/items`'s whole answer: the rows asked for, how many the playlist holds, and the two numbers they were read at.
      type: object
      additionalProperties: false
      required: [structure, revision, totalCount, items]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's structure generation as of this read, the same value `GET /playlists` reports for it. Rows held against an older one sit at positions that have moved.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives: it is a 64-bit counter and a JSON number could not carry it. `totalCount` beside it is a plain number, and so is every position in `items`.
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's content revision as of this read. A different one with the same `structure` means a row already in the playlist would answer differently. Compared for equality and never for order: these are strings, and a higher counter does not sort higher.
        totalCount:
          type: integer
          minimum: 0
          description: How many rows the whole playlist holds, not how many this page carries.
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistRow" }

    PlaylistChanges:
      description: |
        `GET /playlists/{id}/items/changes`'s whole answer: the rows whose content moved, the values they now carry, and the revision they bring the client up to. No `structure`, because the request named the only one this answer can be against.

        Values are deduplicated, which `GET /playlists/{id}/items` does not do. A change reaching many rows at once, a bulk retag or a folder rescan, is mostly one value repeated, and a client that cannot tell a repeat from a fresh value grows its dictionary by a row rather than by a value. So the values sit in `columns` and the rows carry only where they are. Deduplication is **within this one response**: no dictionary here has a `base`, nothing is measured against what the client already holds, and the component keeps no dictionary between responses.
      type: object
      additionalProperties: false
      required: [revision, columns, items]
      properties:
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's content revision as of this read. A client that patches these rows in holds this revision and sends it back as `since` next time.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives. Store it as it arrived: a round trip through a number lands on a neighbour of it, and the next request is then refused or, worse, answers nothing and looks caught up.
        columns:
          type: array
          items: { $ref: "#/components/schemas/ChangedPlaylistColumn" }
          description: |
            One dictionary per column the request declared, in the order it declared them, whenever `items` carries a row. Empty when `items` is, which is the answer a client polling a quiet playlist gets every tick and the reason this is not padded out to the declared count. Any other length means the two sides disagree about the column set: read the page again rather than patch.
        items:
          type: array
          items: { $ref: "#/components/schemas/ChangedPlaylistRow" }
          description: |
            Only the rows whose content moved, in no promised order. A client patches each into the page it holds by `position`, and reads its values at the same index in every entry of `columns`.

    ChangedPlaylistColumn:
      description: |
        One column's values across this response: the distinct strings it takes, and one id per changed row. Row *i* in `items` takes `text[ids[i]]`, so `ids` is as long as `items` and `text` is as long as the column has distinct values here.

        The names come from `LibraryColumn`, and so does what they mean. Two things differ, both because this is JSON rather than a blob. There is no `ends`: JSON delimits its own strings, so `text` is the array of values instead of a run of bytes with offsets into it. And there is no `base`, because nothing here is appended to a dictionary the client already holds.
      type: object
      additionalProperties: false
      required: [text, ids]
      properties:
        text:
          type: array
          items: { type: string }
          description: |
            Every distinct value this column takes across this response, each carried once however many changed rows share it, in no promised order. A field the player cannot resolve is `?`, the single question mark, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Album", "?"]]
        ids:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One index into `text` per changed row, in the order `items` carries them. As long as `items`, and every entry below `text`'s length.
          examples: [[0, 0, 1]]

    ChangedPlaylistRow:
      description: |
        Where one row whose content moved sits, and where the media library holds its track. Its values are not here: they are in `PlaylistChanges.columns`, at this row's index in `items`.
      type: object
      additionalProperties: false
      required: [position, libraryPath, subsong]
      properties:
        position:
          type: integer
          minimum: 0
          description: |
            Where this row sits in the playlist, counting from zero, at the `structure` the request named.
          examples: [1]
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds this track, or `null` where it does not.
        subsong:
          type: integer
          minimum: 0
          description: |
            Which track inside the file this row holds, `0` for an ordinary file, read from the handle the row was drawn from rather than from the media library. It is the other half of the library address `POST /tags` takes: every track of one cue sheet shares a `libraryPath`, and a cue sheet's subsongs number from 1, so an address carrying the path alone reaches none of them.

            It is not one of the declared `columns`, and a client MUST NOT ask for `%subsong%` there: that declaration is shared with `GET /library/export`, so widening it rebuilds the snapshot and moves its `structure`.
          examples: [0]

    PlaylistRow:
      description: |
        One row of a playlist, evaluated against the handle that row holds rather than against a media library record, so a track the library does not hold answers its columns like every other row.
      type: object
      additionalProperties: false
      required: [columns, libraryPath, subsong]
      properties:
        columns:
          type: array
          items: { type: string }
          description: |
            One value per declared column, in the order declared. A field the player cannot resolve is `?`, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Track", "Fictional Artist"]]
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds this track, or `null` where it does not.
        subsong:
          type: integer
          minimum: 0
          description: |
            Which track inside the file this row holds, `0` for an ordinary file, read from the handle the row was drawn from rather than from the media library. It is the other half of the library address `POST /tags` takes: every track of one cue sheet shares a `libraryPath`, and a cue sheet's subsongs number from 1, so an address carrying the path alone reaches none of them.

            It is not one of the declared `columns`, and a client MUST NOT ask for `%subsong%` there: that declaration is shared with `GET /library/export`, so widening it rebuilds the snapshot and moves its `structure`.
          examples: [0]

    QueueRead:
      description: |
        `GET /queue`'s whole answer: every queued entry, in the player's own order, and the queue revision they were read at.
      type: object
      additionalProperties: false
      required: [revision, entries]
      properties:
        revision:
          type: integer
          description: |
            `GET /state`'s `queueRevision` as of this read. A client refetches when the one it holds has moved, and not otherwise.
        entries:
          type: array
          items: { $ref: "#/components/schemas/QueuedTrack" }

    QueuedTrack:
      description: |
        One entry in the play queue, as a client draws a row: the fixed fields a row shows, where the track sits in the media library, and where it sits in a playlist. A missing tag is an empty string, never `null` and never `"?"`.
      type: object
      additionalProperties: false
      required: [title, artist, duration, album, albumArtist, libraryPath, location]
      properties:
        title: { type: string }
        artist: { type: string }
        duration:
          type: number
          description: Seconds.
        album: { type: string }
        albumArtist: { type: string }
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds this track, or `null` where it does not.
        location:
          description: |
            Where this entry sits in a playlist, or `null` for a library track queued by handle and for a playlist row whose position the player has lost. The core keeps such an entry rather than dropping it; read it through the handle it carries, never through a stale position.
          oneOf:
            - { $ref: "#/components/schemas/PlayingLocation" }
            - type: "null"

    QueuePlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [playlistId, positions]
      properties:
        playlistId:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          minItems: 1
          description: |
            The rows to queue, by position in that playlist, in the order to queue them in -- the order a multi-select was clicked in, never sorted and never queued as a range.
          examples: [[7, 2, 5]]
        at:
          type: integer
          minimum: 0
          description: |
            Where in the queue to insert, `0` being the head. Omit it to queue at the end. Sent only together with `revision`; `at` without `revision` is a `400`.
          examples: [1]
        revision:
          type: integer
          description: |
            The queue revision `at` was chosen against, from `GET /state`'s `queueRevision`. Required whenever `at` is sent.
          examples: [9]

    QueueLibraryTracksRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: export the library again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }
        at:
          type: integer
          minimum: 0
          description: |
            Where in the queue to insert, `0` being the head. Omit it to queue at the end. Sent only together with `revision`; `at` without `revision` is a `400`.
          examples: [1]
        revision:
          type: integer
          description: |
            The queue revision `at` was chosen against, from `GET /state`'s `queueRevision`. Required whenever `at` is sent.
          examples: [9]

    MoveQueueRequest:
      type: object
      additionalProperties: false
      required: [from, to, revision]
      properties:
        from:
          type: integer
          minimum: 0
          description: The entry's position in the queue before the move.
          examples: [3]
        to:
          type: integer
          minimum: 0
          description: |
            The entry's position once it has moved: taken out at `from`, then put back at `to` in the queue without it. Both name a position in the same, unchanged-length queue.
          examples: [0]
        revision:
          type: integer
          description: |
            The queue revision this move was planned against, from `GET /state`'s `queueRevision` or `GET /queue`'s own `revision`. Required, unlike `QueuePlaylistRowsRequest.revision`: a move has no "the end" to fall back to that needs no plan.
          examples: [9]

    LibraryHeader:
      description: |
        The JSON header inside a snapshot or a delta, between the four-byte magic number and the blob. It is not served on its own by any route; it is documented here so a client can be generated for it. *The media library*, at the top of this document, has the framing and how to read a column.
      type: object
      additionalProperties: false
      required: [kind, structure, revision, trackCount, columns, spine]
      properties:
        kind:
          type: string
          enum: [snapshot, delta]
          description: Which of the two routes produced this. A client MUST check it rather than infer it from the URL it asked for.
        structure:
          type: integer
          description: The generation the ordinals in this body belong to.
        revision:
          type: integer
          description: The generation this body brings a client up to.
        since:
          type: integer
          description: |
            Deltas only, and absent from a snapshot. The revision this body patches from, echoing the request so a client can confirm what it is applying.
        trackCount:
          type: integer
          description: |
            Rows in the whole snapshot, in a delta as well as in a snapshot. In a snapshot it is the length of every `ids` array; in a delta it is what `ordinals` are bounded by, and it is what their width was chosen from.
        columns:
          type: array
          description: |
            The columns the client declared, each carrying its own `name`, in the order it named them. In a delta, only the ones that moved.
          items: { $ref: "#/components/schemas/LibraryColumn" }
        spine:
          type: object
          additionalProperties: false
          description: |
            The three columns the component always builds, keyed by name rather than carrying one. A snapshot has all three. A delta has only the ones that moved, which for the spine is rare: a track whose path changed is a removal and an addition, and that moves `structure`.
          properties:
            directory:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: |
                The track's directory relative to the library root, forward-slashed on every platform and keeping its trailing slash, so `directory + filename` is the whole relative path. Empty for a track at the root. The library root itself is never published.
            filename:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: The last segment of the path, extension included.
            subsong:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: |
                The player's own subsong number within the file, as decimal text, for cue sheets and disc images. `0` for an ordinary file, and never a position among the rows at one path. Text like every other column, because nothing here types a value.

    LibraryColumn:
      description: |
        One column: a dictionary of distinct strings, and one dictionary id per row. Every `offset` is a byte offset from the start of the blob and is a multiple of four.

        Both routes answer with this shape. A delta's columns carry `ordinals` and `dict.base` on top of it; a snapshot's carry neither, and a client reads `kind` on the header to know which it is holding rather than testing for a key.
      type: object
      additionalProperties: false
      required: [ids, dict, distinct, hasUnresolved, allUnresolved]
      properties:
        name:
          type: string
          description: |
            The title-formatting expression this column was built from, exactly as configured. Present on an entry in `columns`, absent under `spine`, where the key is the name.
          examples: ["%title%"]
        ids:
          allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
          description: |
            One dictionary id per row. In a snapshot `count` is `trackCount` and entry *i* belongs to ordinal *i*. In a delta `count` is `ordinals.count` and entry *i* belongs to ordinal `ordinals[i]`.
        ordinals:
          allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
          description: |
            Deltas only, and absent from a snapshot. The ordinals this column changed at, ascending and without repeats, one for each entry in `ids`. Its `width` is the narrowest of 1, 2 and 4 that holds every ordinal from `0` to `trackCount - 1`: these index rows rather than dictionary entries, so it is chosen from a different number than `ids.width` and is often a different width.
        dict:
          type: object
          additionalProperties: false
          required: [text, ends]
          properties:
            text:
              type: object
              additionalProperties: false
              required: [offset, length]
              description: |
                Every value in the dictionary, concatenated with nothing between them, `length` bytes of UTF-8 as the player produced it. One `TextDecoder` call reads the lot; slice it lazily rather than building every string up front.
              properties:
                offset: { type: integer }
                length: { type: integer }
            ends:
              allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
              description: |
                Where each value ends within `text`, exclusive. Value *i* spans `[ends[i - 1], ends[i])`, reading `ends[-1]` as `0`. In a snapshot `count` is `distinct`; in a delta it is `distinct - base`, because a delta carries only what was appended.
            base:
              type: integer
              description: |
                Deltas only, and absent from a snapshot. How many entries the client's dictionary already holds. Dictionaries are append-only within a `structure` generation, so the values in `text` are appended at this index and nothing already held is restated.
        distinct:
          type: integer
          description: |
            Values in the whole dictionary, in a delta as well as in a snapshot. This is what `ids.width` was chosen from.
        hasUnresolved:
          type: boolean
          description: |
            Whether `?`, the single question mark, is one of the values. That is what a field the player could not resolve formats to, so this is capability detection answered exactly rather than sampled: a field that resolves on one track in ten thousand is detected here and missed by sampling.

            It replaces the guess, not the switch. A user overriding detection in a client's own settings still wins.
        allUnresolved:
          type: boolean
          description: |
            Whether `?` is the only value the column ever takes, which means the player resolves this field for nothing in this library. A client SHOULD treat the column as absent.

    LibrarySection:
      description: A run of fixed-width unsigned little-endian integers in the blob.
      type: object
      additionalProperties: false
      required: [offset, count, width]
      properties:
        offset:
          type: integer
          description: Bytes from the start of the blob. Always a multiple of four, so a typed array can be taken over it in place.
        count:
          type: integer
          description: How many integers.
        width:
          type: integer
          enum: [1, 2, 4]
          description: |
            Bytes per integer, chosen from the measured cardinality. A client MUST read it rather than assume: the same column is one byte wide in a small library and four in a large one.

    LibraryTrack:
      description: |
        `GET /track/library`'s whole answer: one row, in the columns the request declared. No address comes back, because the request carried it.
      type: object
      additionalProperties: false
      required: [columns]
      properties:
        columns:
          type: array
          items: { type: string }
          description: |
            One value per declared column, in the order declared. A field the player cannot resolve is `?`, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Track", "Fictional Artist"]]

    PlayingTrackColumns:
      description: |
        `GET /track/playing`'s whole answer: the columns the request declared, evaluated against whatever the player is playing right now, beside the identity of the track that answered. The request named no track, so `path` and `subsong` come back spelled and valued exactly as `GET /state`'s `player.path` and `player.subsong`, and a client checks them against the track it asked about before drawing anything else this answer carries.
      type: object
      additionalProperties: false
      required: [path, subsong, columns]
      properties:
        path:
          type: string
          description: |
            foobar2000's own absolute display path of the track that answered, in the player's own separator. Spelled and valued exactly as `GET /state`'s `player.path`.
        subsong:
          type: integer
          description: |
            The player's own subsong number for the track that answered, for a cue sheet or a disc image, `0` for an ordinary file. Spelled and valued exactly as `GET /state`'s `player.subsong`.
        columns:
          type: array
          items: { type: string }
          description: |
            One value per declared column, in the order declared. A field the player cannot resolve is `?`, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Track", "Fictional Artist"]]

    LibraryRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the snapshot was touched.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - too many columns
            - unacceptable column
            - duplicate column
            - unacceptable revision
        detail:
          type: string
          description: |
            What specifically was wrong, naming the position of the offending column where there is one. Safe to show a person: it describes the request the client sent and nothing on the player's disk.

    LibraryFailed:
      description: The request was acceptable and the snapshot could not answer it.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - the library snapshot has not been built yet
            - "tracks were added or removed; export the library again"
            - "that revision is older than the retained window; export the library again"
            - no such revision
        detail:
          type: string
          description: Always empty. It is present so that every library failure reads as one shape.

    Error:
      description: |
        The minimum shape every failing response carries. It says nothing about what broke inside the component, because error text leaks filesystem paths.
      type: object
      required: [error]
      properties:
        error: { type: string }
