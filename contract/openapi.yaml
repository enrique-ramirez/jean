  /playlists/{id}/items/copy:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The playlist the rows are appended to, by the `id` a `PlaylistAnnotation` carries: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: copyPlaylistItems
      summary: Append rows of one playlist to the end of another.
      description: |
        The rows are copied, so `source` keeps every row it lent, and they land at the end in ascending position order, which is the only order `runs` can carry. Sending the same playlist as `source` and as `id` appends a copy of those rows to itself.

        **The request names no generation and answers one.** An append addresses no position in the target, so there is nothing for a generation to protect on the way in; what comes back is the `structure` the target stands at once the rows have landed, alongside where each one landed. Those two are what an undo removes exactly these rows against, through `POST /playlists/{id}/items/remove`, and they are why this answers a document rather than nothing.

        One operation of the player's: nothing here reads an item count before or after the write.

        `runs` naming no rows at all is accepted and appends nothing. A body naming no `source` is a `400` rather than a copy of the target onto itself.

        `duplicates: skip` leaves out every row whose track the target already holds and names its source position in `skipped`. Where that is every row nothing is appended, `positions` is empty and `structure` is the one the target already stood at.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where `id` is one of this component's own playlists, and with `409` where another component has locked the target against having rows added. The `source` is only read from, so neither a lock on it nor a `role` it carries bears on anything here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyPlaylistRowsRequest" }
            examples:
              rows:
                summary: Rows 1, 2 and 4 of another playlist.
                value:
                  source: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                  runs: [[1, 2], [4, 1]]
      responses:
        "200":
          description: Appended. `positions` names where each row landed, and `structure` the generation the target now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopiedRows" }
              examples:
                default:
                  summary: Three rows appended to a playlist that held four.
                  value: { structure: "9204739866101318924", positions: [4, 5, 6], skipped: [] }
                skipped:
                  summary: Rows 1, 2 and 4 asked for with `duplicates` `skip`, of which the target already held the track at row 2.
                  value: { structure: "9204739866101318924", positions: [4, 5], skipped: [2] }
        "400":
          description: |
            The request was understood and declined before the player was asked: a body that is not JSON, a missing `source` or one this component did not issue, a missing or malformed `runs`, a field the schema does not declare, a `runs` entry naming a row past the end of the source playlist, or a selection resolving to more than 1,500,000 rows, an engineered ceiling on what one request may resolve to, set far above any selection made in a playlist view; the real playlist length is checked again once the player has answered. A create from the same source is refused in the same words.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404":
          description: |
            Neither the target nor the source is a playlist the player holds. Which of the two is not said: either way the rows asked for are not there to copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "409": { $ref: "#/components/responses/PlaylistLocked" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/remove:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The playlist the rows are removed from, by the `id` a `PlaylistAnnotation` carries: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: removePlaylistItems
      summary: Remove rows of a playlist, named by position.
      description: |
        The set is the fill's own, read here as row positions rather than library ordinals, and `structure` is the playlist's own generation rather than the library's: the one `GET /playlists` reports for it, or the one a page, a delta or a copy answered.

        **A `structure` that is no longer the playlist's current one is a `409` and nothing is removed.** The check runs before a row is touched, so a client that asked for three rows never has three others go instead. Read the playlist's rows again from the generation `GET /playlists` now reports, and send the positions that names.

        What comes back is the generation the rows left behind, so a client that holds the rows it just removed re-keys what it has rather than reading the playlist again.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where the `id` is one of this component's own playlists, and with the same `409` where another component has locked the playlist against having rows removed. The two share a status and carry different `error` strings, because one is answered by reading the playlist again and the other by releasing the lock at the player.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemovePlaylistRowsRequest" }
            examples:
              runs:
                summary: Rows 1 and 2 of a playlist read at the generation named.
                value: { structure: "9204739866101318923", runs: [[1, 2]] }
              ordinals:
                summary: The same two rows as a plain list.
                value: { structure: "9204739866101318923", ordinals: [1, 2] }
      responses:
        "200":
          description: Removed. `structure` is the generation the playlist now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemovedRows" }
              examples:
                default:
                  value: { structure: "9204739866101318924" }
        "400":
          description: |
            The request was understood and declined before the player was asked: a body that is not JSON, a `structure` missing or not a string of decimal digits inside 64 bits, a set that is not exactly one of `runs`, `bitset` and `ordinals`, a field the schema does not declare, a position past the end of the playlist, or a selection resolving to more than 1,500,000 rows, an engineered ceiling on what one request may resolve to, set far above any selection made in a playlist view; the real playlist length is checked again once the player has answered. A fill sent the same set is refused in the same words.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409":
          description: |
            Either the `structure` the request named is no longer the playlist's current one, or another component has locked the playlist against having rows removed. The `error` string tells them apart; nothing is removed in either case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
              examples:
                restructured:
                  value:
                    error: "the playlist's rows were added, removed or reordered; read them again"
                    detail: ""
                locked:
                  value:
                    error: "another component has locked that playlist against that edit"
                    detail: ""
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/move:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The playlist whose rows are moved, by the `id` a `PlaylistAnnotation` carries: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: movePlaylistItems
      summary: Move rows of a playlist to a new place, named by position.
      description: |
        The set is a removal's, read as row positions: `runs` or `ordinals`, exactly one, and never a `bitset`. `structure` is the playlist's own generation: the one `GET /playlists` reports for it, or the one a page, a delta, a copy or an earlier edit answered.

        The named rows are taken out and put back together, in the order they had in the playlist, so the first of them lands at `to`. `to` counts positions in the playlist with those rows taken out, as `POST /queue/move` does for one entry. It is at most the playlist's length less the number of rows moved, and that value is the end. A set that is not contiguous lands contiguous. A move that leaves every row where it was is answered like any other.

        **A `structure` that is no longer the playlist's current one is a `409` and nothing is moved.** The check runs before a row is touched. Read the playlist's rows again from the generation `GET /playlists` now reports and plan the move again.

        What comes back is the generation the playlist now stands at, so a client that holds the rows re-keys them rather than reading the playlist again.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where the `id` is one of this component's own playlists, and with the same `409` where another component has locked the playlist against a reorder. The two share a status and carry different `error` strings, because one is answered by reading the playlist again and the other by releasing the lock at the player.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovePlaylistRowsRequest" }
            examples:
              runs:
                summary: Rows 4 and 5 of a playlist read at the generation named, moved to the head.
                value: { structure: "9204739866101318923", runs: [[4, 2]], to: 0 }
              ordinals:
                summary: Rows 5 and 2, moved so they land at position 7 of the playlist without them.
                value: { structure: "9204739866101318923", ordinals: [5, 2], to: 7 }
      responses:
        "200":
          description: Moved. `structure` is the generation the playlist now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovedRows" }
              examples:
                default:
                  value: { structure: "9204739866101318924" }
        "400":
          description: |
            The request was understood and declined. Before the player is asked: a body that is not JSON, a `structure` missing or not a string of decimal digits inside 64 bits, a set that is not exactly one of `runs` and `ordinals`, a `to` missing or not a non-negative integer, or a field the schema does not declare. Once the player has answered, the playlist's real length decides two more: a set naming a position past its end, and a `to` greater than its length less the rows moved.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistRowsMovedOrLocked" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/sort:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The playlist whose rows are sorted, by the `id` a `PlaylistAnnotation` carries: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: sortPlaylistItems
      summary: Sort a playlist by a title-formatting pattern.
      description: |
        Sorts the whole playlist, whatever is selected in it, ascending by the value `pattern` formats for each row. `pattern` is foobar2000 title formatting, so a sort by several fields is one pattern joining them, as in `%album artist%|%date%|%album%`. Rows whose values compare equal keep the order they had.

        `structure` is the playlist's own generation, as for `POST /playlists/{id}/items/move`, and a value that is no longer current is a `409` with nothing sorted.

        What comes back is the generation the playlist now stands at and `order`, one entry per row: `order[n]` is the position the row now at position `n` held before the sort. A client holding the rows re-keys them with it rather than reading the playlist again.

        Refused as a move is: `403` under the read-only-playlists setting and for this component's own playlists, and `409` for a moved `structure` or a playlist another component has locked against a reorder.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SortPlaylistRowsRequest" }
            examples:
              default:
                summary: By album artist, then date, album, disc and track.
                value:
                  structure: "9204739866101318923"
                  pattern: "%album artist%|%date%|%album%|%discnumber%|%tracknumber%"
      responses:
        "200":
          description: Sorted. `structure` is the generation the playlist now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SortedRows" }
              examples:
                default:
                  summary: A playlist of four rows whose last row sorted first.
                  value: { structure: "9204739866101318924", order: [3, 0, 1, 2] }
        "400":
          description: |
            The request was understood and declined before the player was asked: a body that is not JSON, a `structure` missing or not a string of decimal digits inside 64 bits, a `pattern` missing, empty or longer than 4096 characters, or a field the schema does not declare.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistRowsMovedOrLocked" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/{index}/play:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
      - name: index
        in: path
        required: true
        description: The row's position in the playlist, `0` being the first, at the `structure` the client read it at.
        schema: { type: integer, minimum: 0, maximum: 4294967295 }
        example: 3
    post:
      tags: [playlists]
      operationId: playPlaylistRow
      summary: Start playback at one row of a playlist.
      description: |
        The one playback command here: every other one is addressed by the player rather than by a playlist. The row is named by position, so a client sending one it read at a `structure` the playlist has moved past plays whatever sits there now.

        Nothing comes back. Where playback landed reaches a client through `GET /state`'s `playingLocation`, on the player's own report rather than on this answer, so a track started at the player and a track started here arrive the same way.

        This writes nothing and the read-only-playlists setting does not refuse it. `controlPlayback` does, for the player's own session: this is playback, not a playlist write.

        Naming a detached session, the playlist's rows as they stand become that session's own to play, starting at `index`, and the player's own playback stays where it was. A later edit to the playlist, or deleting it, changes nothing the session plays.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Playing.
        "400":
          description: |
            An id this component did not issue, an `index` that is not a whole number or is larger than 4294967295, or the player found `index` past the end of that playlist.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404":
          description: |
            No playlist has that id, or `session` names no session this device may see. The `error` string tells them apart, and the second answers in the same bytes as `NoSuchSession`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PlaylistFailed"
                  - $ref: "#/components/schemas/Error"
              examples:
                noSuchPlaylist:
                  value: { error: no such playlist, detail: "" }
                noSuchSession:
                  value: { error: no such session }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playback/play:
    post:
      tags: [player]
      operationId: playLibrarySet
      summary: Play a set of library tracks in a detached session.
      description: |
        The set becomes the named session's own to play, starting at `index`. Its tracks are taken from the library when the request is answered, so a later rebuild changes nothing the session plays. No playlist the player holds is written, the scratch included, and the player's own playback stays where it was.

        The set is read as `POST /playlists/{id}/items` reads a fill, by `structure` and exactly one of `runs`, `bitset` and `ordinals`, without `duplicates`. `index` counts into the set in the order it decodes: as given for `ordinals`, ascending for `runs` and `bitset`.

        The player's own session plays a set through `POST /playlists/own/{role}/items` and `POST /playlists/{id}/items/{index}/play`. Naming it, or naming no session, is a `403` while `controlPlayback` is off and a `409` otherwise, either before the body is read. A detached session is never refused for `controlPlayback`.

        A `structure` that has moved is answered `409` before `index` is looked at, so a client holding a stale snapshot is told to read the state again rather than that its `index` is wrong.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayLibrarySetRequest" }
            examples:
              fromTheSecond:
                summary: Three tracks, in the order clicked, starting at the second.
                value: { structure: 41, ordinals: [9, 0, 1], index: 1 }
      responses:
        "204":
          description: Playing.
        "400":
          description: |
            A body that is not JSON or names a field this route does not take, `title` and `duplicates` among them; an ordinal set that is not exactly one of `runs`, `bitset` and `ordinals`, or that names an ordinal outside the library while its `structure` is still the current one; an `index` that is missing or not a whole number; or an `index` past the end of the set, an empty set included. The `error` string tells the last two apart from the rest and from each other.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
                  - $ref: "#/components/schemas/Error"
              examples:
                noIndex:
                  value: { error: "'index' must be a whole number" }
                pastTheSet:
                  value: { error: that position is past the end, detail: "" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "409":
          description: |
            The player's own session was named, or no session was, or the `structure` the set was resolved against has moved, the same `409` a fill answers. The `error` string tells them apart.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/PlaylistFailed"
              examples:
                engine:
                  value: { error: "the engine session plays a playlist row; name a detached session" }
                restructured:
                  value: { error: "tracks were added or removed; read the state and ask again", detail: "" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "503":
          description: |
            The media library is not available or its first snapshot has not been built yet, or this install cannot take a library set into a session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                off:
                  value: { error: the media library is not available }
                nothingYet:
                  value: { error: the library snapshot has not been built yet, detail: "" }
                noTaking:
                  value: { error: playback commands are not available }

  /playback/play-pause:
    post:
      tags: [player]
      operationId: playPause
      summary: Toggle between playing and paused.
      description: |
        Whether that means resuming a paused track or starting one again from a stop is foobar2000's own call; this route asks for the toggle and does not choose. The answer comes once the player has been handed this command and run it, and nothing comes back beyond the status. Where playback landed reaches a client through `GET /state`'s `playback`, not this answer.

        Naming a detached session, the toggle acts on the `playback` its state reads. A session reading `playing` is paused. A session paused through this route is set to play, and reads `paused` until a connection listens. A session set to play that reads `paused` only because no connection listens stays set to play, and this changes nothing.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Toggled.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/pause:
    post:
      tags: [player]
      operationId: pause
      summary: Pause, whatever playback is doing.
      description: |
        Playing, playback pauses. Paused or stopped, nothing changes, and the answer is the same, so a client that means pause sends this however stale its last read of `GET /state` is, and a second one sent before the first is seen changes nothing. The answer comes once the player has been handed this command and run it, and nothing comes back beyond the status.

        Naming a detached session, a session set to play is paused, including one reading `paused` only because no connection listens, and it reads `paused` whether or not anybody listens.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Paused, or already paused or stopped.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/resume:
    post:
      tags: [player]
      operationId: resume
      summary: Play, whatever playback is doing.
      description: |
        Paused, playback resumes where it was. Stopped, it starts as `POST /playback/play-pause` starts it from a stop. Playing, nothing changes, and the answer is the same, so a client that means play sends this however stale its last read of `GET /state` is. The answer comes once the player has been handed this command and run it, and nothing comes back beyond the status.

        Naming a detached session, a paused session is set to play and reads `paused` until a connection listens, and a session already set to play stays set to play.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Playing, or set to play.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/next:
    post:
      tags: [player]
      operationId: nextTrack
      summary: Advance to the next track.
      description: |
        Which track that is, and in what order, is foobar2000's own current playback mode; this route does not read or choose one. The answer comes once the player has been handed this command and run it. Where playback landed reaches a client through `GET /state`'s `playingLocation`, not this answer.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Advanced.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/previous:
    post:
      tags: [player]
      operationId: previousTrack
      summary: Move to the previous track.
      description: |
        Naming the player's own session, this is foobar2000's own Previous. Naming a detached session that is on a track more than three seconds in, playing or paused, it starts that track again from its start and plays it; otherwise it goes back in the session's own order and plays that track. A stopped session goes back. A session holding no snapshot changes nothing, unless it is on a track more than three seconds in.

        The answer comes once the player has been handed this command and run it. Where playback landed reaches a client through `GET /state`'s `playingLocation`, not this answer.

        This route takes no body. One sent is ignored.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Moved.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/stop:
    post:
      tags: [player]
      operationId: stop
      summary: Stop playback.
      description: |
        The answer comes once the player has been handed this command and run it. `GET /state`'s `playback` reports `stopped` once the player has caught up.

        This route takes no body. One sent is ignored.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Stopped.
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/seek:
    post:
      tags: [player]
      operationId: seek
      summary: Move the playing track's position.
      description: |
        Exactly one of `seconds`, an absolute position, and `relativeSeconds`, an offset from wherever the player is now. Naming both or naming neither is a `400`, read off which field is present and never off what it holds: `{"seconds": 0}` is a seek to the start and is not the same as sending nothing.

        The answer comes once the player has been handed this command and run it. Where the seek landed reaches a client through `GET /state`'s `position`, not this answer.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackSeekRequest" }
            examples:
              absolute:
                summary: Jump to 90 seconds in.
                value: { seconds: 90 }
              relative:
                summary: Back up ten seconds.
                value: { relativeSeconds: -10 }
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Sought.
        "400":
          description: |
            The body is not JSON, names neither `seconds` nor `relativeSeconds`, names both, carries one of them with the wrong type, carries a negative `seconds`, or carries a `seconds` or `relativeSeconds` too large for the body to hold, such as `1e999`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSeekRefusal" }
              examples:
                twoForms:
                  value: { error: unacceptable seek, detail: "'seconds' and 'relativeSeconds' were both present; send exactly one" }
                neitherForm:
                  value: { error: unacceptable seek, detail: "send exactly one of 'seconds' and 'relativeSeconds'" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /playback/mode:
    post:
      tags: [player]
      operationId: setPlaybackMode
      summary: Put the player into a playback order, by name.
      description: |
        `mode` is one of the seven names `PlaybackMode` publishes. Neither foobar2000's own string nor its ordinal ever crosses this API in either direction: the name is resolved to the player's own order index inside the component, off the same list `GET /capabilities`'s `playbackModes` is built from.

        A name outside `PlaybackMode` is a `400`. A name inside it that this install does not offer, because it is missing from `GET /capabilities`'s `playbackModes`, is a `409`: the request is well formed and the player is the reason it cannot be met, the same reading `POST /tags` already gives an address it cannot place. Naming a detached session, a name inside `PlaybackMode` that the session's own `playbackModes` does not list, `shuffleAlbums` or `shuffleFolders`, is the same `409`, whatever this install offers.

        The answer comes once the player has been handed this command and run it. Where the mode landed reaches a client through `GET /state`'s `playbackMode`, not this answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackModeRequest" }
            examples:
              shuffle:
                value: { mode: shuffleTracks }
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Set.
        "400":
          description: |
            The body is not JSON, carries no `mode`, or names something that is not one of `PlaybackMode`'s own values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackModeRefusal" }
              examples:
                unknownName:
                  value: { error: unacceptable mode, detail: "'shuffleRecords' is not a playback mode this API knows" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "409": { $ref: "#/components/responses/PlaybackModeUnavailable" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaybackUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /outputs:
    get:
      tags: [player]
      operationId: getOutputs
      summary: The output devices foobar2000 offers, and which one is set.
      description: |
        Read straight from the player on every call rather than held between them: a device can appear or disappear at the operating system without foobar2000 telling this component first, so there is nothing here worth caching.

        `active` is the id of the device the player is currently paired with, or `null` where that pairing matches none of `devices`, which is what a device unplugged since the last switch looks like from here.
      responses:
        "200":
          description: The devices this install can send sound to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outputs" }
              examples:
                default:
                  value:
                    devices:
                      - { id: "D41D2423-FBB0-4635-B233-7054F79814AB:44761B90-C842-41F7-86E5-645DE2EEA6DC", name: "Speakers (Realtek High Definition Audio)" }
                      - { id: "D41D2423-FBB0-4635-B233-7054F79814AB:00000000-0000-0000-0000-000000000000", name: "Primary Sound Driver" }
                    active: "D41D2423-FBB0-4635-B233-7054F79814AB:44761B90-C842-41F7-86E5-645DE2EEA6DC"
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/OutputsUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /outputs/active:
    post:
      tags: [player]
      operationId: setActiveOutput
      summary: Switch the player's output device.
      description: |
        `deviceId` is one of the ids `GET /outputs` last listed. There is no output type alongside it: foobar2000 picks the module and the device together, off the pair the id itself carries, so a type field would only restate what the id already says.

        The answer comes once the player has been handed this command and run it. Where the switch landed reaches a client through `GET /state`'s `outputDeviceId`, not this answer.

        The output is the player's, whichever session a client is in. This route reads no `session`, so one sent with it is ignored, an id nobody issued included, and the answer is the one a request naming none gets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveOutputRequest" }
            examples:
              switch:
                value: { deviceId: "D41D2423-FBB0-4635-B233-7054F79814AB:00000000-0000-0000-0000-000000000000" }
      responses:
        "204":
          description: Switched.
        "400":
          description: |
            The body is not JSON, carries no `deviceId`, carries it with the wrong type, or carries a field the schema does not declare.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveOutputRefusal" }
              examples:
                noDeviceId:
                  value: { error: unacceptable output device, detail: "'deviceId' is required and must be a string" }
        "403": { $ref: "#/components/responses/OutputChangeDisabled" }
        "409": { $ref: "#/components/responses/OutputDeviceNotListed" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/OutputsUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /volume:
    post:
      tags: [player]
      operationId: setVolume
      summary: Set the player's level, step it, or mute it.
      description: |
        Exactly one of `value`, a level in `GET /capabilities`'s `volumeMin`..`volumeMax`; `step`, one player-defined nudge in the direction named; and `muted`, set rather than toggled. Naming two of them or naming none is a `400`, read off which field is present and never off what it holds: `{"value": 0}` is a legal level and `{"muted": false}` is a legal unmute, and a check written against truthiness refuses both.

        `step`'s size is whatever foobar2000 is configured to step by; this route does not invent one, through `playback_control::volume_up`/`volume_down`.

        The answer comes once the player has been handed this command and run it. Where the level and the mute flag landed reach a client through `GET /state`'s `volume` and `muted`, not this answer.

        Never subject to the rate limit `DELETE /queue` publishes: a held key sends a run of these and refusing one would be visible.

        The level is the player's, whichever session a client is in: a detached session has no output to turn down, and a listener sets its own level on its own device. This route reads no `session`, so one sent with it is ignored, an id nobody issued included, and the answer is the one a request naming none gets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeRequest" }
            examples:
              level:
                summary: Set the level directly, at the mute floor.
                value: { value: -100 }
              stepUp:
                value: { step: up }
              mute:
                value: { muted: true }
      responses:
        "204":
          description: Set.
        "400":
          description: |
            The body is not JSON, names none of `value`, `step` and `muted`, names more than one of them, `step` is anything but `"up"` or `"down"`, a named field carries the wrong type, `value` is outside `volumeMin`..`volumeMax`, or `value` is too large for the body to hold, such as `1e999`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeRefusal" }
              examples:
                twoForms:
                  value: { error: unacceptable volume, detail: "send exactly one of 'value', 'step' and 'muted'" }
                badStep:
                  value: { error: unacceptable volume, detail: "'step' must be 'up' or 'down'" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/VolumeUnavailable" }
        "504": { $ref: "#/components/responses/PlaybackTooSlow" }

  /state:
    get:
      tags: [player, library]
      operationId: getState
      summary: What the player is doing, and the library's two generations.
      description: |
        The document a client polls. It is small, it is `ETag`ged, and a poll that finds nothing new is a `304` with no body.

        Read `library.structure` and `library.revision` from here and compare them with the ones held. A different `structure` means every ordinal held names another track, so a client asks for its windows again. A higher `revision` with the same `structure` means rows changed in place, and `library.changeCounts` says in which columns. Both the same means there is nothing to do.

        `library.ready` is `false` between the component starting and its first snapshot being built, and also on an install with no media library at all: the two are indistinguishable from this document alone. This is also what a client polls after a `202` from `POST /library/rows`: wait until `library.ready` is true and `library.columns` has the same members as the set declared, then ask again.

        This route never answers `503`: a player with no library is still a player, so it answers `200` with `library.ready` false and a populated `player` section. The three routes under `/library` keep their own `503` when there is no library to serve.

        This route never waits on foobar2000's main thread either, so it answers while every command is waiting on that thread and headed for a `504`. `mainThread` is how a client tells the two apart: see `MainThread`.

        Its `ETag` names the content coding. See *Compression*.

        Naming a detached session, `player` answers that session: its `playback`, `path`, `subsong`, `libraryPath`, `libraryOrdinal`, `position`, `duration`, `playbackMode`, `title`, `artist`, `album`, `albumArtist`, `queueRevision`, `timelineRevision` and `sessionRevision`. `volume`, `muted`, `outputDeviceId`, `outputSilent`, `currentPlaylistId` and `playlistsRevision` answer the player whichever session is named, and so do `library`, `mainThread` and `configGeneration`. `playingLocation` is `null`: a detached session plays a snapshot of a playlist, which stops matching it at the playlist's first edit. Each session is polled under an `ETag` of its own, so a change in one leaves every other answering `304`.

        A poll naming a detached session with a `deviceId` keeps that device a member, and so keeps the session from ending, whether it is answered `200` or `304`. A poll naming no device holds nothing, and neither does a command.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: |
            The current state of the snapshot. `Cache-Control` is `private, no-cache`, as on every route here that sets a validator: this must stay current, so no cache but the client's own may hold it, and a client revalidates before drawing the copy it holds rather than reusing it blind.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`."
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The generations and the coding, quoted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
              examples:
                built:
                  value:
                    configGeneration: 3
                    library:
                      ready: true
                      structure: 41
                      revision: 903
                      trackCount: 30441
                      columns: ["%title%", "%album artist%", "%play_count%"]
                      changeCounts: [0, 12, 903]
                      build: null
                    player:
                      playback: playing
                      path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.flac'
                      subsong: 0
                      libraryPath: "Fictional Artist/Imaginary Album/01 Track.flac"
                      libraryOrdinal: 3025
                      position: { seconds: 83.4, ageSeconds: 0.2 }
                      duration: 214.0
                      volume: -8.5
                      muted: false
