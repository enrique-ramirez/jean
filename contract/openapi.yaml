openapi: 3.1.0

# The HTTP surface of foo_jean, in full.
#
# Hand-written, and the contract. The component does not serve it: code generation happens at build time, and an unauthenticated route describing this component's own surface adds nothing a reader of the repository does not already have. Fetch it from the repo.
#
# Generate a TypeScript client with:
#
#   pnpm types:api
#
# `plugins/fb2k/tests/api_contract_test.cpp` pins the exact key set of every document the component produces. `plugins/fb2k/scripts/test.sh` checks that the version below matches `plugins/fb2k/src/core/version.h`.

info:
  title: foo_jean
  version: 0.3.0
  summary: Tag writing, autoplaylists and the media library for foobar2000, over HTTP, for clients that beefweb cannot serve.
  description: |
    A foobar2000 component exposing what [beefweb](https://github.com/hyperblast/beefweb) does not: writing metadata tags, managing autoplaylists, reading the whole media library in one piece, and streaming the player's own output.

    ## Relationship to beefweb

    This component runs beside beefweb on its own port and replaces no beefweb endpoint. `GET /playlists` is an annotation, not a playlist listing: beefweb reports titles, item counts and order, and this reports only what beefweb cannot say — which playlists are autoplaylists — plus the ids needed to join the two answers.

    A client MUST ask beefweb for its playlists and this component for the annotations, in that order. See `PlaylistAnnotation`.

    ## Versioning

    `apiVersion` is the number to branch on. It moves independently of the component version: a patch release does not move it, a breaking change to any shape here does. Read it from `GET /status` and refuse a number the client does not understand.

    ## Authentication

    Three routes answer without a bearer token: `GET /status`, `POST /pair` and `GET /stream`. Every other route requires `Authorization: Bearer <token>`. The scheme is matched case-insensitively and the token is compared in constant time. There is no unauthenticated mode: a component with no token configured refuses to listen.

    The two unauthenticated routes that do something carry credentials of their own. `POST /pair` requires a window opened at the player and a private source address. `GET /stream` requires a ticket from `POST /stream/ticket`.

    The token is generated on first run into `<profile>/foo_jean/config.json`. Copy it out by hand or obtain it through `POST /pair`. It is absent from the discovery record.

    ## Finding the component

    See `DiscoveryRecord`. That record is writable by anyone who can reach beefweb, so it is a hint and never a destination for a credential.

    ## Reachability

    `bindAddress` defaults to `0.0.0.0`, every local interface, so a browser on another device on the same network reaches the component without configuration. It can be narrowed to `127.0.0.1`.

    A component that is advertised but does not answer the status probe is either narrowed that way or behind a firewall. That is a distinct state from an absent component, and a client SHOULD report it as such rather than as "not installed".

    ## CORS

    Any origin is reflected by default, so a client works wherever it is served from: beefweb on the next port, a dev server, a phone. `Vary: Origin` is set on every response, and the origin is echoed rather than answered with a literal `*`, which would forbid credentialed mode. `POST /pair` is the exception — with no `allowedOrigins` configured it admits only an origin on the host the request was addressed to, since it is the route that hands out the token.

    **A browser hands script only the CORS-safelisted response headers**, so every answer carries `Access-Control-Expose-Headers: ETag, Retry-After`. Those are the two a client is told to act on and neither is safelisted: without the first no cross-origin page can read a validator at all, and without the second a `429` cannot be backed off from as documented. `Cache-Control` and `Content-Type` are safelisted and are not named.

    `If-None-Match` is the other half of the same problem and is a *request* header, which no safelist covers either, so the preflight answers `Access-Control-Allow-Headers: Authorization, Content-Type, If-None-Match`. Without it a page could hold a validator and never send one, and the revision poll, the snapshot, the delta and a cover would each be a full download from a browser and a `304` from a command line.

    CORS decides which page may read a response. The bearer token decides who is served. The token travels in a header rather than a cookie, so every request carrying it is preflighted, and a page without it gets a `401` whatever the CORS headers say.

    Set `allowedOrigins` in `<profile>/foo_jean/config.json` to narrow to a list, matched on the whole origin string and case-insensitively.

    `OPTIONS` preflight is answered `204` without a credential, identically for every path, so it reveals nothing about which routes exist.

    ## The media library

    `GET /state` is a small JSON document a client polls, carrying the library's two generations under `library`. The library itself is a binary snapshot from `GET /library/export`, patched afterwards by `GET /library/changes`. There is no paged route and no per-entity route: a client holds the whole library and asks the questions locally.

    Two generations say what changed. `structure` moves when tracks are added or removed, which shifts every ordinal after the change, so a client throws its arrays away and exports again. `revision` moves when rows change in place, which leaves ordinals alone, so a client fetches a delta and patches. Modifications are constant, roughly one per track played; additions and removals are rare and the user just caused them.

    An **ordinal** is a track's position in the snapshot, counted from zero, and it is the only handle these routes use. Ordinals are in library-relative path order, compared the way the player compares paths itself rather than byte by byte: a run of digits counts as a number and case does not count at all, so `2 Mello` comes before `10cc`. Ties are broken by subsong and then by the player's own canonical path, so the order is total and does not shuffle between rebuilds. An ordinal means nothing across a `structure` change.

    ### Who declares the columns

    The client, and the export request is the declaration. `GET /library/export?columns=…` names the title-formatting expressions the client wants, and the component evaluates exactly those. Nothing here parses or interprets one: that keeps the component general and it keeps a client's own capability detection working.

    The loop is: ask, and get either the blob or a `202`; on a `202` poll `GET /state` until `library.columns` match what was asked for and `library.ready` is true; then ask again. **The first export after the component starts, and the first after a declaration changes, is the slow one.** It walks and formats every track in the library. Every export after that is served from what is already built.

    Order does not matter when comparing: `columns` from `GET /state`'s `library` and the set a client declared are the same declaration when they have the same members. Order decides only where a column lands in the header's `columns` array.

    Every later rebuild reuses the last declared set, whether the player raised a change notification or somebody called `POST /library/refresh`. Two clients wanting different sets will therefore take the snapshot from each other; at most two builds are kept, so a third evicts rather than accumulating.

    ### The snapshot format

    Both `GET /library/export` and `GET /library/changes` answer in one format, `application/octet-stream`:

    ```
    offset 0   4 bytes    the ASCII letters JLIB
    offset 4   4 bytes    headerLength, unsigned little-endian
    offset 8   headerLength bytes    the header, UTF-8 JSON, right-padded with ASCII spaces
    offset 8 + headerLength           the blob, to the end of the body
    ```

    Every integer in the body is unsigned and little-endian. The header's padding is what makes `8 + headerLength` a multiple of four, and `headerLength` counts it, so the blob begins on a four-byte boundary. Every `offset` in the header is measured from the first byte of the blob and is itself a multiple of four. That is what lets a client take `new Uint32Array(buffer, blobStart + offset, count)` over the bytes in place: a typed array over a byte offset that is not a multiple of its element size throws in every browser.

    The header parses with `JSON.parse` and is small. Its shape is `LibraryHeader`.

    ### Compression

    `GET /library/export` and `GET /library/changes` are gzipped when the request offers gzip, and sent as they stand when it does not. This is the largest thing the component produces and it is several times smaller compressed, so a client SHOULD offer gzip; every browser does by default.

    Negotiation is RFC 9110's: `Accept-Encoding: gzip` gets `Content-Encoding: gzip`, `Accept-Encoding: gzip;q=0` is a refusal and gets the bytes as they stand, and no `Accept-Encoding` at all is also a refusal. Only `gzip` is offered; `br`, `zstd` and `deflate` are not, and `*` is read as offering nothing rather than as offering everything.

    Every answer from these routes carries `Vary: Accept-Encoding`, and **the `ETag` names the coding**: `"s41-r903-gzip"` and `"s41-r903-identity"` are two representations of one snapshot and never share a validator. A client passes back whichever tag it holds and keeps asking with the same `Accept-Encoding` it asked with before. `GET /state` is `ETag`ged on the same terms, coding and all, because it is compressed on the same terms.

    The size ceiling is on the snapshot **as serialised**, before any compression: a library over it is a `413` however small it would have gzipped to, because the number that matters is what the client has to hold once it has decoded.

    ### Reading one column

    A column is a dictionary of distinct values plus one dictionary id per row. Nothing else: there is no type system here, no numbers and no nulls, because the component never parses, normalises or types what the player produced. A field the player could not resolve arrives as the single character `?`, an empty tag arrives as `""`, and a tag whose value is literally `N/A` arrives as `N/A`. Telling those three apart is the whole of a client's capability detection, so a client MUST NOT coerce them.

    - `ids` is one id per ordinal: `ids.count` entries of `ids.width` bytes each, where the width is 1, 2 or 4. In a snapshot `ids.count` equals `trackCount`.
    - `dict.text` is `dict.text.length` bytes of UTF-8, every distinct value concatenated with nothing between them. Decode it with one `TextDecoder` call and slice lazily: materialising a quarter of a million strings up front costs more than drawing them does.
    - `dict.ends` is `dict.ends.count` entries of `dict.ends.width` bytes, entry *i* being the offset within `dict.text` at which value *i* ends. Value *i* therefore spans `[ends[i - 1], ends[i])`, with `ends[-1]` read as `0`.

    Widths are chosen from the measured cardinality, so a client MUST read them rather than assume: `ids.width` is the narrowest of 1, 2 and 4 that holds every id from `0` to `distinct - 1`, and `dict.ends.width` the narrowest that holds `dict.text.length`.

    Each column also carries what a client would otherwise learn by sampling rows and guessing. `distinct` is the number of values in the whole dictionary, `hasUnresolved` says whether `?` is one of them, and `allUnresolved` says whether it is the only one. A field that resolves on one track in ten thousand is therefore detected exactly rather than missed, which sampling cannot promise.

    ### The spine

    Three columns the component always builds, under `spine` rather than in `columns`, and they read exactly like any other column.

    `directory` and `filename` are the track's path relative to the library root, forward-slashed on every platform, split in two because directories repeat heavily. `directory` keeps its trailing slash, so the whole relative path is the two concatenated. The library root itself never appears: an absolute path is the player's business and this API does not publish one here. `subsong` is the index within the file, as decimal text, and it is `0` for an ordinary file.

    ### Reading a delta

    A delta carries only the columns that moved, and each of them carries only the rows that moved. A client patches those typed arrays and leaves every other column's array identity alone, which is what stops a play count moving from invalidating everything derived from titles.

    - `ordinals` is `ordinals.count` ascending ordinals, and `ids` is one new id for each of them, in the same order. `ids.count` equals `ordinals.count`. `ordinals.width` is the narrowest that holds every ordinal from `0` to `trackCount - 1`, which is a different number from the one `ids.width` comes from.
    - Dictionaries are append-only within a `structure` generation, so a delta never restates one. `dict.base` is the number of entries the client already holds, and `dict.text` and `dict.ends` carry only what was appended after it: `dict.ends.count` is `distinct - dict.base`, not `distinct`. Append them and the client's dictionary is current again.

    A value that stops being used leaves an entry behind. The next `structure` rebuild compacts it, and nothing before then does.

    ## Artwork

    `GET /artwork` is one front cover, addressed by the library-relative path of a track that has it: the snapshot's `directory` and `filename` concatenated, exactly as it published them. There is no ordinal here. An ordinal means nothing across a `structure` change, so a URL built from one would have to name the generation as well and would then change every time a track was added anywhere in the library, emptying a browser's cache of every cover at once. A relative path survives a rebuild, a restart and a change of column set.

    **Point every row of an album at one URL.** A client picks one track to stand for a record and addresses that one from the sleeve, the row, the shelf and the now-playing pane alike. One URL in every view is what lets the browser store, deduplicate and revalidate a cover once instead of once per screen. That is also why this route takes a track rather than an album: the player resolves art per track, from the file's own tags or from an image beside it, and which of the two it is varies inside one library.

    The address is a lookup key and never a path. It is matched against what the player reported for the tracks in the snapshot and is joined to nothing, so there is no file outside the media library to name and nothing to traverse out of. An address the snapshot does not carry is a `404`, and never another record's sleeve.

    The body is `image/jpeg`, `image/png`, `image/gif`, `image/webp` or `image/bmp`, read from the bytes rather than from a filename. A picture in anything else is a `404`: a type nothing recognised is not one a client should be told to draw.

    ### The playing cover

    `GET /artwork/playing` is the front cover of whatever the player is playing right now, addressed by nothing: no path, no index, no handle. It answers what `GET /artwork` cannot, because there is no library-relative path to address a stream, a CD track or a file the library has never indexed by: the player's own now-playing loader resolves a picture embedded in the file's own tags exactly as readily as one sitting beside it on disk, and this route is a window onto that loader rather than onto the snapshot.

    The picture is held rather than loaded per request: this component folds it once with the same validator `GET /artwork` computes, the moment the player's loader hands it over, and a conditional request that already holds the current cover costs a comparison of two strings and touches no file. The address does not move when the track does, so the next track of the same album revalidates to a `304`.

    `GET /artwork` is unchanged by this. Everything that addresses a cover by library key keeps using it.

    ### Revalidating a cover

    `Cache-Control: no-cache, must-revalidate`, which is "ask every time, and use the copy you have when it has not changed" rather than "do not keep it". A client SHOULD keep the bytes and send the `ETag` back as `If-None-Match`.

    `must-revalidate` addresses a cache that is not the client's own, and a client does nothing differently for it. Of the three directives that let a shared cache reuse a response to a request carrying `Authorization`, it is the only one that still makes that cache ask this component before it answers.

    The validator is strong, quoted and opaque, and it is a fold of the picture itself, so it moves when and only when the cover does. That catches the change nothing else can see: an image file sitting beside the music, replaced in place, alters no tag and no track and is announced to nobody. The player loads the cover to answer at all, so a `304` saves the transfer and the redraw rather than the work at the player.

    A cover is never compressed. These are already compressed formats, so there is no `Vary: Accept-Encoding` here and no coding suffix on the validator.

    ## Errors

    Every response with a status of 400 or above is `application/json` carrying at least an `error` string, including the unrouted `404` and the oversized `413` that cpp-httplib generates itself.

    Responses from `POST /tags` also carry `written: false`, except the `413` and the `401`, which are refused before the route is reached. Branch on the status rather than on the presence of `written`.

  contact:
    name: foo_jean
    url: https://github.com/enrique-ramirez/foo_jean
  license:
    name: TBD

servers:
  - url: http://{host}:{port}/api
    description: The component, on its own port beside beefweb.
    variables:
      host:
        default: 127.0.0.1
        description: The machine running foobar2000.
      port:
        default: "8881"
        description: From the discovery record. beefweb's own default is 8880.

security:
  - bearerAuth: []

tags:
  - name: discovery
    description: Finding the component and asking what it can do.
  - name: player
    description: |
      What the player is doing, polled rather than pushed.
  - name: tags
    description: Writing metadata to files the player already manages.
  - name: playlists
    description: |
      Autoplaylists, and which playlists are autoplaylists.
  - name: library
    description: |
      The player's media library, as one columnar snapshot and a stream of patches to it.
  - name: queue
    description: |
      The play queue, read whole and refetched on its own revision.
  - name: artwork
    description: |
      Cover art: one route addressed by a track the media library holds, and one addressed by whatever is playing.
  - name: stream
    description: |
      Listening to the player's own output. foobar2000 decodes and sequences; this carries the result to a browser.
  - name: pairing
    description: |
      Handing the token to a device without transcribing it.

paths:
  /status:
    get:
      tags: [discovery]
      operationId: getStatus
      summary: Identify the component. Needs no credential.
      description: |
        Tells "foo_jean is here" from "nothing is listening" without spending a credential, so the port named in a discovery record can be checked before a token is sent to it.

        It reports nothing a port scan would not. The field allowlist is absent from it and requires authentication.
      security: []
      responses:
        "200":
          description: The component is listening.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
              examples:
                default:
                  value:
                    name: foo_jean
                    version: 0.3.0
                    apiVersion: 1
                    authRequired: true

  /pair:
    post:
      tags: [pairing]
      operationId: pair
      summary: Read the token, during a window opened at the player.
      description: |
        Returns the bearer token, so a device need not have 64 hex characters typed into it. The owner presses **Pair a device** in `File → Preferences → Tools → Jean`, then the user presses Pair in the client. The window is open for 120 seconds.

        Three bounds apply, and none is optional:

        - Single grant. The first success closes the window. Pairing a second device takes a second press.
        - Private source addresses only: RFC1918, loopback and link-local, and their IPv6 equivalents. A forwarded port or a tunnel cannot be paired through. The address is checked before the window is consulted, so a caller from outside learns nothing about whether a window is open and cannot spend a grant.
        - The pairing history is recorded and shown in the preferences pane, so a pairing the owner did not perform is discoverable afterwards.

        `Content-Type: application/json` is required. A simple `POST` needs no CORS preflight, so without this requirement a page on any origin could fire one blind and spend the grant. Requiring JSON forces every cross-origin caller to be preflighted, and with no `allowedOrigins` configured this route answers a preflight only for an origin on the host the request was addressed to.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 64
                  description: |
                    What to call this device in the pairing history. Optional, and it MUST stay optional: requiring a name reintroduces the typing this route removes. Display text only. A value containing control characters is stored as empty rather than refused, since it is written to a log where a newline would forge a line.
            examples:
              named: { value: { name: Living room TV } }
              anonymous: { value: {} }
      responses:
        "200":
          description: |
            The token. The only response in this API that carries it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Paired" }
              examples:
                default:
                  value:
                    token: 8f14e45fceea167a5a36dedd4bea2543f14e45fceea167a5a36dedd4bea2543a
                    apiVersion: 1
        "400":
          description: A body that is not a JSON object, or a name that is not short text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            No window is open, or the caller is not on the local network. The `error` string distinguishes them: the first is fixed by a press at the player, the second is a fact about the network. A caller from outside is answered before the window is consulted, so it cannot infer one from the other.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                shut: { value: { error: pairing is not open } }
                remote: { value: { error: pairing is available on the local network only } }
        "415":
          description: |
            The request was not `application/json`. This requirement is what forces a cross-origin caller to be preflighted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            Pairing attempts are rate-limited on a budget of their own, separate from every other route. A burst of ten is allowed, refilling at one every six seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /capabilities:
    get:
      tags: [discovery]
      operationId: getCapabilities
      summary: What this install permits, and what does not change while it runs.
      description: |
        The write allowlist, the streaming and autoplaylist limits, what this install permits, and the player's own name, version and volume range. A client reads this once and draws the player from it; none of it rides `GET /state`. A client SHOULD render controls for the fields named here and nothing else, rather than being configured with its own copy of the list.
      responses:
        "200":
          description: What may be written, and what a client needs to draw the player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
              examples:
                ratingOnly:
                  summary: The default install.
                  value:
                    apiVersion: 1
                    allowedFields: ["rating"]
                    canWrite: true
                    canWritePlaylists: true
                    canChangeOutput: true
                    maxAutoPlaylists: 100
                    canCreateAutoPlaylists: true
                    canStream: true
                    streamFormats: ["opus", "aac"]
                    canMuteWhileStreaming: true
                    canReadLibrary: true
                    playerName: foobar2000
                    playerVersion: 2.25.3
                    volumeMin: -100
                    volumeMax: 0
                    volumeUnit: db
                writesDisabled:
                  summary: allowedFields emptied, writePlaylists and changeOutput both turned off, and maxAutoPlaylists zeroed in config.json.
                  value:
                    apiVersion: 1
                    allowedFields: []
                    canWrite: false
                    canWritePlaylists: false
                    canChangeOutput: false
                    maxAutoPlaylists: 0
                    canCreateAutoPlaylists: false
                    canStream: true
                    streamFormats: ["opus", "aac"]
                    canMuteWhileStreaming: true
                    canReadLibrary: true
                    playerName: foobar2000
                    playerVersion: 2.25.3
                    volumeMin: -100
                    volumeMax: 0
                    volumeUnit: db
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tags:
    post:
      tags: [tags]
      operationId: writeTags
      summary: Write metadata to one track.
      description: |
        The player performs the write, through `metadb_io_v2`, so foobar2000's own database is current when this returns and a client re-reading the value through beefweb sees the new one.

        Three conditions must hold, and they fail with different statuses:

        1. Every field is on the allowlist (`403`). Names are compared case-insensitively.
        2. The path is a plain absolute local path (`400`). No relative path, no `..` segment, no UNC share, no URL scheme.
        3. foobar2000 already manages the track (`404`): it is in the Media Library or in an open playlist. The SDK will build a handle for any path at all, so a path being well-formed says nothing about the player knowing it.

        The first two are decided before the player is involved.

        Only the named fields are touched; everything else in the file is left alone. An empty string removes a field rather than setting it to empty, which is how a rating is cleared rather than set to `"0"`.

        Writes are not batched. One track per request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagWriteRequest" }
            examples:
              setRating:
                summary: Rate a track four stars.
                value:
                  path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.mp3'
                  fields: { rating: "4" }
              clearRating:
                summary: Remove the rating tag entirely.
                value:
                  path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.mp3'
                  fields: { rating: "" }
              subsong:
                summary: One track inside a cue sheet or disc image.
                value:
                  path: 'C:\Music\Fictional Artist\Imaginary Album\disc.flac'
                  subsong: 3
                  fields: { rating: "5" }
      responses:
        "200":
          description: |
            Written, and foobar2000's database is current. The body echoes what was written, so a client that updated its own view optimistically can reconcile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagWritten" }
              examples:
                default:
                  value:
                    written: true
                    path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.mp3'
                    subsong: 0
                    fields: { rating: "4" }
        "400":
          description: |
            The request is malformed, names no path, names an unacceptable path, or has nothing to write. Retrying it unchanged will not help.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagRefused" }
              examples:
                unsafePath:
                  value:
                    written: false
                    error: unacceptable path
                    detail: "'path' must be a plain absolute local path"
                caseCollision:
                  summary: Two spellings of one tag, refused rather than guessed at.
                  value:
                    written: false
                    error: malformed request
                    detail: "'rating' is named twice, differing only in case"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            The field is not on this install's allowlist. A `403` rather than a `400` because the request was understood and retrying it unchanged will never work. `field` names the offending field, and a client SHOULD stop offering that control.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagRefused" }
              examples:
                notAllowed:
                  value:
                    written: false
                    error: field not allowed
                    detail: artist
                    field: artist
        "404":
          description: |
            foobar2000 does not manage that track: the path names nothing, or it names a real file the player has not been told about. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
              examples:
                unknown:
                  value: { written: false, error: foobar2000 does not know that track }
        "413":
          description: |
            The body exceeds 256 KB and was refused before it was parsed. The component answers and closes while the rest of the body may still be in flight, so a client sending something very large may see a dropped connection instead of this response. Both mean refused.

            One of the two failures that does not carry `written`; the other is the `401`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The player could not write the tags. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
        "503":
          description: Tag writing is unavailable in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
        "504":
          description: |
            The player did not finish within 30 seconds. The write MAY still complete afterwards, so a client MUST re-read the value rather than assume it did not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }

  /playlists:
    get:
      tags: [playlists]
      operationId: getPlaylists
      summary: Which playlists are autoplaylists, and which this component created.
      description: |
        Not a playlist listing. beefweb answers that at `GET http://<player>:8880/api/playlists`, with titles, item counts, total time and which playlist is current. This route reports only what beefweb cannot, and repeats none of it.

        One entry per playlist, in playlist order. Join it to beefweb's answer on `beefwebId`, falling back to `index`. `title` is for checking a join, not for display.

        ### Ask beefweb first

        beefweb assigns its playlist ids lazily, when it next rebuilds its map. A playlist this component has just created therefore reports `beefwebId: null` until beefweb looks again, and creating it is enough to make beefweb do so. A client MUST request beefweb's playlists before this route for the join to be complete.
      responses:
        "200":
          description: One annotation per playlist.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [playlists]
                properties:
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists:
    post:
      tags: [playlists]
      operationId: createAutoPlaylist
      summary: Create an autoplaylist.
      description: |
        Creates a playlist and hands it to foobar2000's own autoplaylist client, so the core keeps it filled and keeps it after this component is uninstalled.

        An autoplaylist filters the Media Library and nothing else. On an install with no Media Library configured every autoplaylist is empty and nothing in the player says why. Call `POST /autoplaylists/preview` first and read its `libraryEnabled`.

        The playlist is real and visible in foobar2000's own playlist tabs, so `title` is what somebody looking at the player will read. Nothing in this API parses it, no prefix is required or implied, and the user may rename it freely. What a title means -- whether a playlist is a client's own plumbing or the user's music -- is the client's to decide and the client's to encode.

        Existing playlists are never converted. There is no route that turns an existing playlist into an autoplaylist, because the core replaces the contents of a playlist when it takes one over.

        Refused with `403` under the read-only-playlists setting: every playlist this creates would hold the user's music, and the setting refuses every write but the component's own two.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoPlaylistRequest" }
            examples:
              keyed:
                summary: Tagged with a key the client recognises later, so it can find its own again.
                value:
                  title: "Rock"
                  key: "folder:genre:Rock"
                  query: "%genre% IS Rock"
              sorted:
                summary: Kept in order by the core, which also stops the user reordering it by hand.
                value:
                  title: "Recently Added"
                  query: "%added% DURING LAST 4 WEEKS"
                  sort: "%added%"
                  forceSort: true
      responses:
        "200":
          description: Created. The body is the annotation, as `GET /playlists` would report it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WritesDisabled" }
        "409": { $ref: "#/components/responses/PlaylistConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists/preview:
    post:
      tags: [playlists]
      operationId: previewQuery
      summary: Try a query without creating anything.
      description: |
        Compiles the query with foobar2000's own parser and counts what it matches in the Media Library. Nothing is created and nothing changes.

        A query that does not parse is a `200` here, carrying `valid: false` and the player's own message. This is the route a client calls while somebody is typing, so an unreadable query is data rather than an error. Creating with the same query is a `400`.

        A client SHOULD debounce this: it runs on foobar2000's main thread, and one request per keystroke is one main-thread callback per keystroke. A client SHOULD also read `libraryEnabled` — `matches: 0` with `libraryEnabled: false` means the install has no Media Library, and any autoplaylist created from the query will be empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 4096
                  description: |
                    foobar2000 query syntax. MUST NOT be empty: the player reads an empty query as matching everything.
            examples:
              default:
                value: { query: "%genre% IS Rock" }
      responses:
        "200":
          description: The query was tried. Read `valid` before `matches`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryPreview" }
              examples:
                matched:
                  value: { valid: true, error: "", matches: 412, libraryEnabled: true }
                unreadable:
                  value:
                    valid: false
                    error: "Query syntax error"
                    matches: 0
                    libraryEnabled: true
                noLibrary:
                  summary: A valid query on an install with no Media Library.
                  value: { valid: true, error: "", matches: 0, libraryEnabled: false }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces. Not beefweb's id.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: updateAutoPlaylist
      summary: Point an autoplaylist at a different query.
      description: |
        Replaces the specification. `query`, `sort`, `key` and `forceSort` end up exactly as this request states them, so a client MUST send the whole record rather than only the parts being changed; omitting `key` clears it. The `managed` object from `GET /playlists` has that shape, so read-modify-write is the way to call this.

        `title` is the exception: omit it to leave the name alone. Resending a remembered title would undo a rename made in the player.

        The playlist itself is kept, and with it its id, its position and beefweb's id for it. Deleting and recreating changes all three.

        Only playlists this component created can be updated, and that is a `403` whatever `writePlaylists` says. The same status also answers when `writePlaylists` is `false`, checked first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoPlaylistRequest" }
            examples:
              requeried:
                summary: Change what it collects, leave what it is called.
                value: { query: "%genre% IS Jazz" }
      responses:
        "200":
          description: Updated. The body is the annotation as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOurs" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: |
            The player refused. If the new query compiles but the core then declines to attach it, the playlist is left as an ordinary playlist that this component still recognises as its own; sending the request again with a query the player accepts restores it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: removeAutoPlaylist
      summary: Delete an autoplaylist this component created.
      description: |
        Removes the playlist and the autoplaylist client with it.

        Only playlists this component created. Anything else is a `403`, including an autoplaylist made in foobar2000 itself, whatever `writePlaylists` says. The same status also answers when `writePlaylists` is `false`, checked first. A client that needs to delete an arbitrary playlist MUST ask beefweb, which will delete any playlist for any caller that can reach it.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed, id]
                properties:
                  removed: { type: boolean, const: true }
                  id: { type: string }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOurs" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/own/{role}/items:
    parameters:
      - name: role
        in: path
        required: true
        description: |
          Which of the component's own playlists to fill. `scratch` is emptied first, so the insert leaves it holding only this request's rows; `queue` is never emptied, and the insert appends after whatever it already holds. Neither is reached by the read-only-playlists setting: both are how this component works, not the user's music. A `role` outside these two is a `400`.
        schema:
          type: string
          enum: [scratch, queue]
        example: scratch
    post:
      tags: [playlists]
      operationId: fillOwnPlaylist
      summary: Insert library rows into one of the component's own playlists, making it first if it is not there.
      description: |
        Resolves `role` to a playlist through the component's own marker rather than through a title, so a playlist renamed at the player is still found and one somebody hand-titled to look like it is not adopted. Makes the playlist, carrying `title`, if the role has none yet.

        The set to insert is named by exactly one of `runs`, `bitset` and `ordinals`, resolved against the `structure` sent alongside it. Sending more than one, or none, is a `400`. `runs` and `bitset` are inserted in ascending ordinal order — neither can carry any other — and `ordinals` is inserted in exactly the order it is given, which is the form a client holding a click-ordered set, such as a multi-select or a queue, MUST use to keep that order.

        The read-only-playlists setting never refuses this operation: it protects a user's own playlists, and neither of the component's own holds any.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FillOwnPlaylistRequest" }
            examples:
              runs:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { title: "Scratch", structure: 41, runs: [[0, 2], [9, 1]] }
              bitset:
                summary: The same three ordinals as a bitmap.
                value: { title: "Scratch", structure: 41, bitset: "AwI=" }
              ordinals:
                summary: The same three ordinals in click order, which only this form can carry.
                value: { title: "Scratch", structure: 41, ordinals: [9, 0, 1] }
      responses:
        "200":
          description: Inserted. `positions` names where each row landed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FillResult" }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/StructureMoved" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/FillUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: emptyOwnPlaylist
      summary: Take every row out of one of the component's own playlists, keeping the playlist.
      description: |
        Removes every item rather than the playlist itself, the same guard a replacing fill of `scratch` already keeps: deleting a playlist the play queue points into kills foobar2000. The playlist keeps its id, its position and beefweb's id for it.

        Idempotent: a role with no playlist yet is not made one just to answer this, and reports success regardless, exactly as `DELETE /stream/hold` reports success whether or not there was a hold to release.

        The read-only-playlists setting never refuses this operation, for the reason it never refuses a fill of either role: neither holds any of the user's music.
      responses:
        "204":
          description: Emptied, or already empty because there was nothing to empty.
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/OwnPlaylistsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces. Not beefweb's id.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: fillPlaylist
      summary: Insert library rows into a user's own playlist.
      description: |
        Always appends: nothing here empties the playlist first. A fill that replaces what it holds is `POST /playlists/own/scratch/items`, which only ever addresses the component's own.

        The set to insert is named by exactly one of `runs`, `bitset` and `ordinals`, resolved against the `structure` sent alongside it. Sending more than one, or none, is a `400`. `runs` and `bitset` are inserted in ascending ordinal order — neither can carry any other — and `ordinals` is inserted in exactly the order it is given, which is the form a client holding a click-ordered set, such as a multi-select, MUST use to keep that order.

        Refused with `403` under the read-only-playlists setting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FillPlaylistRequest" }
            examples:
              runs:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { structure: 41, runs: [[0, 2], [9, 1]] }
              bitset:
                summary: The same three ordinals as a bitmap.
                value: { structure: 41, bitset: "AwI=" }
              ordinals:
                summary: The same three ordinals in click order, which only this form can carry.
                value: { structure: 41, ordinals: [9, 0, 1] }
      responses:
        "200":
          description: Inserted. `positions` names where each row landed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FillResult" }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WritesDisabled" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/StructureMoved" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/FillUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /state:
    get:
      tags: [player, library]
      operationId: getState
      summary: What the player is doing, and the library's two generations.
      description: |
        The document a client polls. It is small, it is `ETag`ged, and a poll that finds nothing new is a `304` with no body.

        Read `library.structure` and `library.revision` from here and compare them with the ones in the header of the snapshot already held. A different `structure` means export again. A higher `revision` with the same `structure` means fetch a delta. Both the same means there is nothing to do.

        `library.ready` is `false` between the component starting and its first snapshot being built, and also on an install with no media library at all: the two are indistinguishable from this document alone. This is also what a client polls after a `202` from `GET /library/export`: wait until `library.ready` is true and `library.columns` has the same members as the set declared, then ask for the export again.

        This route never answers `503`: a player with no library is still a player, so it answers `200` with `library.ready` false and a populated `player` section. The three routes under `/library` keep their own `503` when there is no library to serve.

        Its `ETag` names the content coding, exactly as the two binary routes do. See *Compression*.
      responses:
        "200":
          description: |
            The current state of the snapshot. `Cache-Control` is `no-cache, must-revalidate`, as on every route here that sets a validator.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`no-cache, must-revalidate`."
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The generations and the coding, quoted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
              examples:
                built:
                  value:
                    library:
                      ready: true
                      structure: 41
                      revision: 903
                      trackCount: 30441
                      columns: ["%title%", "%album artist%", "%play_count%"]
                    player:
                      playback: playing
                      path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.flac'
                      subsong: 0
                      position: { seconds: 83.4, ageSeconds: 0.2 }
                      duration: 214.0
                      volume: -8.5
                      muted: false
                      playbackMode: inOrder
                      title: Imaginary Track
                      artist: Fictional Artist
                      playingLocation:
                        { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, index: 3 }
                      queueRevision: 4
                building:
                  summary: The component is up and the first walk has not finished.
                  value:
                    library:
                      { ready: false, structure: 0, revision: 0, trackCount: 0, columns: [] }
                    player:
                      playback: stopped
                      path: ""
                      subsong: 0
                      position: { seconds: 0, ageSeconds: 0 }
                      duration: 0
                      volume: 0
                      muted: false
                      playbackMode: inOrder
                      title: null
                      artist: null
                      playingLocation: null
                      queueRevision: 0
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/StatePolledTooFast" }

  /queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: The play queue, in the player's own order.
      description: |
        Every queued entry, in the order the player will play them, with the fields a client draws a row from and the revision they were read at. `revision` is `GET /state`'s `queueRevision` as of this read: refetch when the one a client holds has moved, and not otherwise.

        A queued library track carries `libraryPath` and no `location`. A queued playlist row carries `location`, and `libraryPath` too where the media library also holds that track. Either may be missing on its own, and both are missing for a track queued from a playlist row or a whole playlist since removed: the core keeps such an entry rather than dropping it, so this reports it with `location: null` rather than a stale position.
      responses:
        "200":
          description: The queue, read whole.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueRead" }
              examples:
                default:
                  value:
                    revision: 4
                    entries:
                      - title: Imaginary Track
                        artist: Fictional Artist
                        duration: 214.5
                        album: Imaginary Album
                        albumArtist: Various Fictional Artists
                        libraryPath: "Fictional Artist/Imaginary Album/01 Track.flac"
                        location: null
                      - title: Another Track
                        artist: Another Artist
                        duration: 187.0
                        album: Another Album
                        albumArtist: Another Artist
                        libraryPath: null
                        location: { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, index: 7 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: The queue is not available in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
    post:
      tags: [queue]
      operationId: queueTracks
      summary: Queue playlist rows or library tracks.
      description: |
        Takes exactly one of two bodies, named below: `QueuePlaylistRowsRequest` queues rows from a user's playlist, by position; `QueueLibraryTracksRequest` queues tracks from the media library, by handle, resolved against `structure` the same way `POST /playlists/{id}/items` resolves a fill. Naming fields from both, or from neither, is a `400`.

        A position or an ordinal repeated in the request is queued twice, exactly as foobar2000's own *Add to playback queue* allows for a row. One job either way, so a multi-select is never left half-queued.

        Omit `at` to queue at the end. Send it with `revision`, the queue revision it was chosen against from `GET /state`'s `queueRevision`, to queue at that position instead; `at` without `revision` is a `400`, decided here rather than by the player.

        Whether `playlistId` names a playlist, and whether a row or `at` names a position past what it addresses -- a row past the playlist's end, `at` past the queue's end -- are answered by the player rather than judged here: only it knows which playlists exist and how many rows or queue entries each holds. A `structure` that has moved is a `409`, the same as a fill's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/QueuePlaylistRowsRequest"
                - $ref: "#/components/schemas/QueueLibraryTracksRequest"
            examples:
              atTheEnd:
                summary: Three rows, queued in the order clicked.
                value: { playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04, positions: [7, 2, 5] }
              atAPosition:
                summary: One row, queued second in the queue.
                value:
                  playlistId: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
                  positions: [4]
                  at: 1
                  revision: 9
              libraryTracks:
                summary: Three library tracks, queued in the order clicked, by handle.
                value: { structure: 41, ordinals: [9, 0, 1] }
      responses:
        "204":
          description: Queued.
        "400":
          description: |
            The component judged the request for itself before the player was involved -- a body that is not JSON, a body naming both a playlist and the library or naming neither, a missing or unusable `playlistId`, an empty or unusable `positions`, an ordinal set that is not exactly one of `runs`, `bitset` and `ordinals` or that is empty, an ordinal outside the library while its `structure` is still the current one, or an `at` sent without a `revision` -- or the player found a row or `at` past the end of what it addresses. The schemas below tell the two apart.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/StructureMoved" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The player refused. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503":
          description: |
            The queue is not available in this build, or, for a library-tracks request, the media library is not available or its first snapshot has not been built yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: The player did not finish within 30 seconds. A client MUST re-read `GET /queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }

  /library/export:
    get:
      tags: [library]
      operationId: exportLibrary
      summary: Declare a column set, and take the whole library in one binary snapshot.
      description: |
        Every track, every declared column, in one response. The format is in the description at the top of this document, under *The media library*; the header's shape is `LibraryHeader`.

        `columns` is the declaration, and it is required. A `200` means a snapshot of exactly that set is built and this is it. A `202` means one is not, that the component has started building it, and that the client should poll `GET /state` until `library.columns` match and `library.ready` is true, then ask again. **The first export after the component starts, and the first after the declared set changes, is the slow one**: it walks and formats every track. Nothing else on this API is affected while it runs.

        There is no paged variant and none is planned. Paging a library needs a stable sorted order, producing one needs a full pass, and the component is where the whole database already sits in memory. A client that holds everything answers its own searches, counts and shelves without another request.

        The response is `ETag`ged on the two generations, so a client that polls `GET /state` and finds nothing new never gets here, and one that arrives anyway is answered `304`.

        Large. Expect single-digit megabytes for a library of thirty thousand tracks, growing roughly linearly. A client MUST read it as an `ArrayBuffer` rather than as text.
      parameters:
        - name: columns
          in: query
          required: true
          description: |
            The columns to build, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. Required: an export with none is a `400` rather than a rebuild from nothing.

            Passed to foobar2000's title-formatting compiler untouched. The three spine columns are always built and MUST NOT be named here.

            At most 64, each 1 to 1024 printable characters, and no repeats. Two spellings of one column, such as `a` and `%61`, are a repeat and are refused. An identical pair sent twice is not: the server collapses it before the component sees it, so it is accepted.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: |
            The snapshot. `Cache-Control` is `no-cache, must-revalidate`, so a client revalidates with `If-None-Match` rather than reusing it blind, and `Content-Encoding` is `gzip` whenever the request offered it. See *Compression*.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`no-cache, must-revalidate`."
            Content-Encoding:
              schema: { type: string, enum: [gzip] }
              description: Present only when the request offered gzip. Absent means the bytes as they stand.
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The generations and the coding, quoted.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "202":
          description: |
            No snapshot of that set exists and one is being built. The body is the `Library` object `GET /state` carries under `library`, as it stands now, so a client can see what it is waiting to change.

            Asking again for a set already being built is another `202` and does not start a second build. A client SHOULD poll `GET /state` rather than re-asking here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/LibraryRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/LibraryTooLarge" }
        "429": { $ref: "#/components/responses/LibraryRefreshedTooFast" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /library/changes:
    get:
      tags: [library]
      operationId: getLibraryChanges
      summary: What has changed since a revision, per column.
      description: |
        The patch between the revision a client holds and the current one, in the same binary format as the snapshot. It carries only the columns that moved and, within each, only the rows that moved, so the common case of a play count and a last-played date advancing touches two columns and leaves the rest of a client's arrays untouched by identity as well as by value.

        Call this when `GET /state` reports the same `library.structure` and a higher `library.revision`. A different `structure` is a `409`: ordinals have shifted and the patch would be meaningless, so export again.

        There is no `columns` here, because `since` already names the generation. A rebuild with a different set moves `structure`, so a client whose declaration is stale reaches the `409` and exports, which is where it declares again.

        The component keeps a bounded window of past revisions, and falling behind it is a `410`, whose description is where that window's reach is written down. The answer is the same one: export again. A client that polls at any sane interval will not see it.

        There is no promise of freshness the player cannot keep. A component storing its data privately and publishing it through a title-formatting hook, which is how several play-count components work, changes a value with no notification to anybody; foobar2000's own playlist columns show the same stale value. The snapshot catches up when that track next plays or when somebody calls `POST /library/refresh`.
      parameters:
        - name: since
          in: query
          required: true
          description: |
            The `revision` the client currently holds. A whole number. `revision` values are contiguous, so this is exactly what the last snapshot or delta header reported.
          schema: { type: integer, minimum: 0 }
          example: 900
      responses:
        "200":
          description: |
            The delta. Its header carries `since`, so a client can confirm what it was patched from. A revision that moved with no id changing is not a revision at all, so an answer here always has something in it. `Cache-Control` is `no-cache, must-revalidate`, and the bytes are gzipped on the same terms as the snapshot; see *Compression*.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`no-cache, must-revalidate`."
            Content-Encoding:
              schema: { type: string, enum: [gzip] }
              description: Present only when the request offered gzip. Absent means the bytes as they stand.
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: The generations, the revision patched from, and the coding, quoted.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/LibraryRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/LibraryConflict" }
        "410": { $ref: "#/components/responses/LibraryRevisionGone" }
        "413": { $ref: "#/components/responses/LibraryTooLarge" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /library/refresh:
    post:
      tags: [library]
      operationId: refreshLibrary
      summary: Rebuild the snapshot from the player.
      description: |
        Asks foobar2000 to walk its media library again and replaces the snapshot with the result. This is the hand on the wheel behind the two automatic mechanisms, the player's own change notifications and the re-read of every track as it stops playing, and it is what recovers a value neither of those can see.

        It rebuilds the column set last declared by an export, so it takes no body. On a component nothing has declared to since it started, it rebuilds the set already built, which is why a refresh cannot cost a client the snapshot it is using.

        Expensive: it re-queries and re-formats every track. Rate limited to a burst of three, refilling one every thirty seconds, which is what a person pressing a button needs and a looping client does not get.

        The answer is `202` rather than `200`. The rebuild may still be running, and the body carries the generations as they stand at the moment of the request, so a client watches `GET /state`'s `library.structure` for it to move past them. It MUST NOT treat the answer as the finished rebuild.
      responses:
        "202":
          description: |
            The rebuild was asked for. The body is the `Library` object `GET /state` carries under `library`, as it stands now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/LibraryRefreshedTooFast" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /artwork:
    get:
      tags: [artwork]
      operationId: getArtwork
      summary: The front cover of a track the media library holds.
      description: |
        One picture, addressed by a track's library-relative path, revalidated rather than re-fetched. *Artwork* at the top of this document is the whole of it: how to address a cover, why every row of an album should point at one URL, and what the validator is computed from.

        The address is resolved against the snapshot already in memory, with no scan of the library and no walk of the filesystem. The cover itself is loaded on every request, a conditional one included, for the reason *Revalidating a cover* gives.
      parameters:
        - name: track
          in: query
          required: true
          description: |
            The track's path relative to the media library root, forward-slashed on every platform: the snapshot's `directory` and `filename` for that row, concatenated. Percent-encode it.

            At most 4096 printable characters. It is a lookup key rather than a path, so `..` in it is neither refused nor meaningful: it matches nothing.
          schema: { type: string, minLength: 1, maxLength: 4096 }
          example: Artist/Album/01 A Title.flac
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`no-cache, must-revalidate`: keep the bytes, and ask before drawing them again."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/ArtworkNotModified" }
        "400": { $ref: "#/components/responses/ArtworkRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }
        "503": { $ref: "#/components/responses/ArtworkUnavailable" }

  /artwork/playing:
    get:
      tags: [artwork]
      operationId: getPlayingArtwork
      summary: The front cover of whatever is playing.
      description: |
        One picture, addressed by nothing. *The playing cover* above is the whole of it: why it exists beside `GET /artwork`, what it resolves that the snapshot cannot, and why revalidating it costs no file access.
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`no-cache, must-revalidate`: keep the bytes, and ask before drawing them again."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/ArtworkNotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoPlayingArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }

  /stream/ticket:
    post:
      tags: [stream]
      operationId: issueStreamTicket
      summary: Get a short-lived credential for one stream connection.
      description: |
        An `<audio>` element cannot send an `Authorization` header, so the credential for `GET /stream` travels in the query string. That makes it a capability URL, and a short lifetime is what bounds it: a ticket expires in `expiresIn` seconds and grants nothing but the audio already being played.

        A ticket is not single-use. Safari's media element probes a source with a `Range: bytes=0-1` request before fetching it for real, so one playback start is two requests and a single-use ticket cannot serve Safari at all. A ticket is good until it expires; `maxConcurrentStreams` bounds how many streams may be open at once.

        A client SHOULD call this immediately before opening the stream rather than at page load, and MUST request a fresh ticket when reconnecting. Clients MUST NOT store a ticket, log it, or put it anywhere a bearer token would not go.

        This is also where a device says who it is, because it is the only part of opening a stream a client controls: an `<audio>` element sends no body and no header of its own. The identity rides the ticket to the connection it opens, so `GET /stream/listeners` can group sockets into devices. A request with no body is an anonymous listener rather than a refusal.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIdentity" }
      responses:
        "200":
          description: A ticket, good until it expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTicket" }
              examples:
                issued:
                  value:
                    ticket: 8f14e45fceea167a5a36dedd4bea2543f14e45fceea167a5a36dedd4bea2543a
                    expiresIn: 120
        "400":
          description: A body that is not a JSON object, or a `deviceId` or `name` that is not short text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415":
          description: A body was sent and was not `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

  /stream/listeners:
    get:
      tags: [stream]
      operationId: getStreamListeners
      summary: Who is listening, and whether the player was silenced for them.
      description: |
        The audience, counted two ways at once. **Connections** are what cost a thread and what `maxConcurrentStreams` bounds. **Devices** are what a person reads, and one device is routinely two connections — Safari probes a source with `Range: bytes=0-1` before fetching it for real — or three across a reconnect. A client MUST count devices anywhere it says how many people are listening.

        This is a roster and not a set of targets. Audio cannot be sent to a device that is not already asking for it: starting playback in a browser needs a gesture on that browser, so there is nothing here for a client to press.

        Nothing in it names a network address or a user agent. A device is called what it called itself.
      responses:
        "200":
          description: The audience as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamListeners" }
              examples:
                twoDevices:
                  value:
                    devices:
                      - deviceId: 3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8
                        name: Android phone
                        format: opus
                        connections: 1
                        listeningFor: 412
                      - deviceId: 9d21b7f4-8c60-4e15-a3b2-77c1e0f5a9d3
                        name: null
                        format: aac
                        connections: 2
                        listeningFor: 18
                    connections: 3
                    maxConnections: 8
                    playerMuted: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/hold:
    delete:
      tags: [stream]
      operationId: releaseOutputHold
      summary: Ask for the player to be audible alongside the listeners.
      description: |
        While anybody is listening this component silences the player, so that choosing a device moves the sound rather than doubling it. This asks for both at once instead.

        There is no route that *takes* the hold. A client says it wants both outputs; when they should be one is the component's to decide, and it decides again the moment everybody has stopped listening — the choice is scoped to the spell of listening it was made in, not to a connection, so a reconnect does not undo it and the next session does not inherit it.

        Clients SHOULD warn before offering this. The stream runs a second or two behind the player, which is fine a room apart and an echo in the same room; `GET /stream/timeline` is how a client can say by how much rather than hedging.

        Idempotent, and it says nothing about whether there was a hold to release: with nobody listening there is nothing to give back and nothing has gone wrong.
      responses:
        "204":
          description: Noted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: This install does not mute the player, so there is never a hold. `canMuteWhileStreaming` says so in advance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stream/leave:
    post:
      tags: [stream]
      operationId: leaveStream
      summary: Say that a device stopped listening on purpose.
      description: |
        A closed socket does not say why it closed. A handoff back to the player and a wireless dropout look identical from here, and they want opposite answers: the first should give the player its sound back at once, the second must not unmute into a gap the client is about to reconnect across. So a device that stopped deliberately says so, and everything else waits out the linger.

        Best effort, and never required. A client that crashes, a tab that closes and a request that fails all end the same way a moment later. Ignored while the device still holds a connection, and it can only ever end its own linger — a `deviceId` nobody sent is not a way to unmute the player.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIdentity" }
      responses:
        "204":
          description: Noted, whether or not there was anything to end.
        "400":
          description: No `deviceId`, or a body that is not a JSON object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415":
          description: The body was not `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stream/timeline:
    get:
      tags: [stream]
      operationId: getStreamTimeline
      summary: What is audible, in the stream's own clock.
      description: |
        The player's reported position is not what a listener is hearing: the stream runs a second or two behind it, so a progress bar or lyrics driven from beefweb's `GET /player` run ahead of the audio. This route is how a client corrects that.

        `audio.currentTime` counts rendered audio: it advances only as sound leaves the speaker. The only unknown is the stream time of the first sample the element played, and it is recoverable:

        ```js
        // once, when the element starts playing
        const connectedAt = performance.now();
        const { streamTime } = await (await fetch(base + "/stream/timeline", auth)).json();
        const anchor = streamTime - (performance.now() - connectedAt) / 1000;

        // any time after
        const audible = anchor + player.currentTime;
        const mark = marks.findLast(m => m.at <= audible);
        const position = mark ? mark.position + (audible - mark.at) : null;
        ```

        A client MUST re-anchor after every reconnect, because `currentTime` restarts. It MAY re-poll occasionally and re-derive `anchor` to shed clock drift, which is milliseconds over a few minutes.

        Browsers differ over whether `currentTime` starts at zero or at the stream's own granule position, which is a large number for a listener joining a long-running stream. Deriving `anchor` as above works either way, and a client can tell which it got from whether `anchor` came out near zero.
      responses:
        "200":
          description: The stream clock, and where the last few tracks began.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTimeline" }
              examples:
                midTrack:
                  value:
                    streamTime: 491.46
                    marks:
                      - at: 402.1
                        path: 'C:\Music\Émile Fictif\Canción Inventada\06 Café Imaginario.mp3'
                        subsong: 0
                        position: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

  /stream:
    get:
      tags: [stream]
      operationId: openStream
      summary: Listen to what foobar2000 is playing.
      description: |
        A single unbounded response carrying the player's own output: the same audio the speakers get, with its DSP chain and ReplayGain applied. There is no length, no `Range` and no seeking. Seeking means asking foobar2000 to seek, which moves every listener at once.

        The response is chunked and ends when the client disconnects, the component stops, or the listener falls too far behind to be sent contiguous audio. A client MUST reconnect rather than treat the end as a stop: a dropped connection is ordinary on a wireless network, and an `<audio>` element does not retry by itself.

        This route takes a ticket rather than a bearer token, because an `<audio>` element cannot send a header. Without a valid ticket it answers `401`, and a bearer token is not accepted in its place.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: From `POST /stream/ticket`. Valid until it expires, not consumed by this request.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: |
            One of the `streamFormats` from `GET /capabilities`. Omit it to get the first, which is the best this install offers. A format the install does not encode is a `400` rather than a silent substitution.
          schema: { type: string }
          examples:
            safari: { value: aac }
      responses:
        "200":
          description: |
            Audio, until something ends it. `Cache-Control` is `no-store`, there is no
            `Content-Length`, and `Accept-Ranges` is `none` — a live stream has no length
            to take a range of, and a `Range` request is answered with the stream from the
            live edge like any other.
          content:
            audio/ogg:
              schema: { type: string, format: binary }
            audio/aac:
              schema: { type: string, format: binary }
        "400":
          description: A format this install does not encode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            No ticket, an unknown ticket, or an expired one. All three answer identically, so a caller cannot sort guesses into wrong and too late.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>`, from `<profile>/foo_jean/config.json`. At least 32 characters; a shorter token in the config file is refused and the component does not listen.

  responses:
    PlaylistRefused:
      description: |
        The request was understood and declined before the player was involved: a body that is not JSON, a missing or unusable `title`, `query`, `sort` or `key`, an id this component did not issue, or an ordinal set that is not exactly one of `runs`, `bitset` and `ordinals`, or that names an ordinal outside the library while its `structure` is still the current one. A `structure` that has moved is a `409` instead, whether the library grew or shrank.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistRefusal" }
          examples:
            noQuery:
              value: { error: unacceptable query, detail: "'query' is required" }
            queryTooLong:
              value: { error: unacceptable query, detail: "'query' must be printable text of at most 4096 characters" }
            notJson:
              value: { error: malformed request, detail: "could not parse it as JSON: [json.exception.parse_error.101] parse error at line 1, column 1: syntax error while parsing value - invalid literal; last read: 'n'" }
            twoForms:
              value: { error: unacceptable ordinal set, detail: "'runs' and 'bitset' were both present; send exactly one" }

    NotOurs:
      description: |
        The target was not created by this component: `POST /autoplaylists` is the only route that makes a playlist these two can touch, so anything else, including an autoplaylist made in foobar2000 itself, is refused here whatever `writePlaylists` says. There is no remedy: a client asking either route to convert a hand-built playlist would have `beginUpdate` replace the user's own rows with a query's results.

        The same status also answers when `writePlaylists` is `false` in `config.json`, checked before the target is looked at. A client tells the two apart by `error`, which the examples below give both of.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            notOurs:
              value: { error: that playlist was not created by foo_jean, detail: "" }
            writesDisabled:
              value: { error: this install has playlist writes turned off; turn on writePlaylists in config.json to allow them, detail: "" }

    WritesDisabled:
      description: |
        This install has `writePlaylists` set to `false` in `config.json`. That is a player owner's own choice, made to keep every playlist but this component's own two read-only; setting it back to `true` is what grants the write.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: this install has playlist writes turned off; turn on writePlaylists in config.json to allow them, detail: "" }

    NoSuchPlaylist:
      description: No playlist has that id. It may have been deleted in the player.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistConflict:
      description: |
        Another playlist already has that `key`, or this install is at `maxAutoPlaylists`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            keyInUse:
              value: { error: another playlist already has that key, detail: "folder:genre:Rock" }
            tooMany:
              value: { error: this install's autoplaylist limit is reached, detail: "this install allows 100 and already has 100" }

    StructureMoved:
      description: |
        The `structure` the request named is no longer the current one: tracks were added to or removed from the library, so every ordinal it carries has shifted and inserting them would land the wrong rows. This is the same `409` `GET /api/library/changes` answers for the same reason, and the remedy is the same: export the library again and resolve the set against the `structure` that export reports.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; export the library again"
                detail: ""

    TooManyRequests:
      description: |
        Playlist changes are arriving faster than this component will make them. The limit bounds how fast a client bug can fill the player with playlists; it is not a security control.

        A burst of thirty is allowed, refilling at one a second, shared across creating, updating and deleting. Reading and previewing are not limited. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistRefusal" }

    BodyTooLarge:
      description: |
        The body is larger than 256 KiB and was refused before it was parsed, the same ceiling and the same refusal `POST /tags` answers: one `set_payload_max_length` covers every route this component accepts a body on. No set a library view can produce needs to reach it — `bitset` costs about one byte per eight ordinals in the library whatever the set, which is the form to reach for once a scattered set would cost more as `runs`.

        The component answers and closes while the rest of the body may still be in flight, so a client sending something very large may see a dropped connection instead of this response. Both mean refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: request too large }

    PlayerRefused:
      description: |
        The player refused. No reason is given, because error text leaks filesystem paths.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlayerTooSlow:
      description: |
        The player did not finish within 30 seconds. The work MAY still complete afterwards, so a client MUST re-read `GET /playlists` rather than assume it did not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistUnavailable:
      description: |
        Autoplaylists are not available in this install, either because the component could not reach that part of the player or because `maxAutoPlaylists` is `0` in `config.json`. `GET /capabilities` reports this in advance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    FillUnavailable:
      description: |
        Either this install does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or no snapshot has been built yet. Both mean there is nothing to resolve the set against.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the media library is not available }
            nothingYet:
              value: { error: the library snapshot has not been built yet, detail: "" }

    OwnPlaylistsUnavailable:
      description: |
        The component could not reach the playlist machinery its own scratch and queue playlists depend on. Unrelated to autoplaylists, whose own unavailability is `PlaylistUnavailable`, and unrelated to the read-only-playlists setting, which never reaches this route.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the component's own playlists are not available }

    StreamUnavailable:
      description: |
        Either this install does not stream, because no encoder started or `streamingEnabled` is false, or it is already serving as many connections as `maxConcurrentStreams` allows. The `error` string distinguishes them, and a client SHOULD present the second as busy and retry rather than as unsupported. `GET /capabilities` reports the first in advance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotModified:
      description: |
        The client already holds this representation. No body. `ETag` is repeated so a client can keep validating against it.

        cpp-httplib evaluates `If-None-Match` for static files alone, so these routes answer it themselves. The tag is strong, it is quoted, and `*` is accepted. It is not a hash of the bytes: it is the generations the representation was built from, plus the content coding it was sent in, and both of those move whenever the bytes do. A validator held from an identity answer therefore does not revalidate a gzipped one, which is deliberate.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`no-cache, must-revalidate`, as on the `200`."
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried, coding suffix and all.
        Vary:
          schema: { type: string }
          description: "`Accept-Encoding`."

    StatePolledTooFast:
      description: |
        Polls of `GET /state` are arriving faster than this component will answer them: a burst of 30, refilling one every 100 milliseconds, per source address. An ordinary poll on its own interval never meets this; a client stuck in a loop does.

        The refusal is decided before the document is built, so it carries no `ETag` and neither the `player` nor the `library` section. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    LibraryRefused:
      description: |
        The request was understood and declined before the snapshot was touched: no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, the same column twice, or a `since` that is missing or not a whole number.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryRefusal" }
          examples:
            noColumns:
              value: { error: unacceptable column, detail: "'columns' is required" }
            noSince:
              value: { error: unacceptable revision, detail: "'since' is required" }
            repeated:
              value: { error: duplicate column, detail: "column 3 repeats an earlier one" }

    LibraryConflict:
      description: |
        `structure` has moved since the revision named in `since`, so ordinals have shifted and a patch would be meaningless. Export again, which is also where a client declares its columns afresh.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; export the library again"
                detail: ""

    LibraryRevisionGone:
      description: |
        The revision asked to catch up from is outside the retained window of 1920, or it is ahead of the current one, which is what a client that kept a snapshot across a component restart sees. Both mean the same thing: export again.

        That window is spent by listening rather than by the clock. Every track that stops playing is re-read and moves `revision`, and nothing moves it while nobody is listening, so a client asleep overnight comes back inside it. One away across days of playback does not, and exports again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }

    LibraryTooLarge:
      description: |
        The snapshot serialises to more than 64 MiB and this component will not send it. The ceiling is on the serialised bytes rather than on what crosses the wire, so gzip does not buy room underneath it. That is a ceiling on the *response*; `413` on a request body is a different limit and a different number.

        Nothing a client can do about it. It means a library far larger than this format was measured against, and it is worth reporting.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    LibraryRefreshedTooFast:
      description: |
        Rebuilds are arriving faster than this component will make them: a burst of three, refilling one every thirty seconds, shared between `POST /library/refresh` and the builds an export declares. A rebuild re-queries and re-formats every track in the library, so this bounds what a looping client, or one varying the set it asks for, can do to the player.

        Asking again for a set already being built costs nothing here, so an ordinary client never meets this.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    LibraryUnavailable:
      description: |
        Either this install does not serve the media library at all, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or `GET /library/changes` was asked for a patch on a component with no snapshot yet.

        The `error` string tells them apart: `the media library is not available` is the first, `the library snapshot has not been built yet` the second. `GET /library/export` answers the second case with a `202` instead, because there the client has just said what to build.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the media library is not available }
            nothingYet:
              value: { error: the library snapshot has not been built yet, detail: "" }

    ArtworkNotModified:
      description: |
        The cover is byte for byte the one the client was last sent, so there is no body.

        `ETag` is repeated so a client can keep validating against it, and `Cache-Control` is repeated so a stored copy that has just been confirmed keeps its instruction.
      headers:
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried.
        Cache-Control:
          schema: { type: string }
          description: "`no-cache, must-revalidate`."

    ArtworkRefused:
      description: |
        The address was declined before the snapshot was consulted: no `track` at all, one longer than 4096 characters, or one carrying a control character.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noTrack:
              value: { error: "'track' is required" }

    NoArtwork:
      description: |
        There is no picture to send. Either the snapshot holds no track at that address, which is what a client sees after tracks moved on disk, or the player has no front cover for the one it holds, or the cover is in a format this component does not publish.

        The `error` string tells them apart. All three are ordinary: an album without a sleeve is not a fault, and a client SHOULD fall back to whatever it draws for a record with no art rather than report an error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no artwork for that track }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    NoPlayingArtwork:
      description: |
        There is no picture to send for whatever is playing: nothing is playing yet, the player has no front cover for what is, or the cover is in a format this component does not publish.

        The `error` string is the same one `GET /artwork` answers with for the second and third of those, because from a reader's side it is the same fact. A client SHOULD fall back to whatever it draws for a record with no art rather than report an error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no artwork for that track }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    ArtworkTooLarge:
      description: |
        The picture is larger than 16 MiB and this component will not send it. A ceiling on the *response*; `413` on a request body is a different limit and a different number.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ArtworkRequestedTooFast:
      description: |
        Covers are arriving faster than this component will read them: a burst of 300, refilling one every 50 milliseconds. A screenful of covers at once is the case this exists to allow, so a client drawing a grid never meets it; a client looping does.

        A client that meets this SHOULD back off rather than retry, and MUST NOT treat it as "no artwork". `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ArtworkUnavailable:
      description: |
        This install does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`. Artwork is addressed through the snapshot, so there is nothing to address without one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: artwork is not available }

    Unauthorized:
      description: |
        No token, the wrong token, or the wrong scheme.

        No `WWW-Authenticate` header is sent. It would raise a native browser credential dialog over the client's own UI, and no browser can satisfy this scheme.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: authentication required }

  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [name, version, apiVersion, authRequired]
      properties:
        name:
          type: string
          const: foo_jean
          description: |
            Always this value. A client following a discovery record MUST check it before sending a token: the record can be forged, and this is what confirms the port it named is running foo_jean.
        version:
          type: string
          description: The component's own version. Informational; branch on apiVersion instead.
          examples: ["0.3.0"]
        apiVersion:
          type: integer
          description: The shape of this API. A client MUST refuse a number it does not understand.
          examples: [1]
        authRequired:
          type: boolean
          const: true
          description: Always true. There is no unauthenticated mode.

    Capabilities:
      type: object
      additionalProperties: false
      required:
        [apiVersion, allowedFields, canWrite, canWritePlaylists, canChangeOutput,
         maxAutoPlaylists, canCreateAutoPlaylists, canStream, streamFormats,
         canMuteWhileStreaming, canReadLibrary, playerName, playerVersion, volumeMin,
         volumeMax, volumeUnit, playbackModes]
      properties:
        apiVersion:
          type: integer
          examples: [1]
        allowedFields:
          type: array
          description: |
            Tag names this install permits, lower case by convention and matched case-insensitively. Anything not named here is refused with a `403`.
          items: { type: string }
          examples: [["rating"]]
        canWrite:
          type: boolean
          description: |
            Exactly `allowedFields.length > 0`. A convenience, not a second source of truth.
        canWritePlaylists:
          type: boolean
          description: |
            Whether this install permits a write to a playlist or autoplaylist it did not create itself: create, add, edit, delete or reorder. `writePlaylists` in `config.json`, defaulting to `true`. A component predating this field reports nothing, and a client MUST read absence as writable.

            The component's own two playlists, its scratch space and the play queue's holding playlist, stay writable regardless: this governs the user's playlists, not the component's own plumbing.
        canChangeOutput:
          type: boolean
          description: |
            Whether this install permits switching the player's output device. `changeOutput` in `config.json`, defaulting to `true`. Reported only: no route in this bundle reads it back or acts on it.
        maxAutoPlaylists:
          type: integer
          minimum: 0
          description: |
            How many autoplaylists this component will keep at once, counting only the ones it created. `0` switches creation off.

            The cap bounds a client bug rather than an attacker; whoever holds the token can already write tags.
          examples: [100]
        canCreateAutoPlaylists:
          type: boolean
          description: |
            True only when `canWritePlaylists` is true and `maxAutoPlaylists` is above zero. False under either alone, so a client gates a single control on this field rather than checking both itself.
        canStream:
          type: boolean
          description: |
            Exactly `streamFormats.length > 0`. False on an install where the component loaded but no encoder started, where `streamingEnabled` is false, and on any component version that predates streaming. A client MUST hide the listen control when it is false rather than offer it and fail.
        streamFormats:
          type: array
          items: { type: string }
          description: |
            What `GET /stream?format=` accepts, best first. `opus` is Ogg Opus, which every current browser except older Safari plays. `aac` is AAC-LC in ADTS, for Safari before 18.4.

            A client SHOULD omit `format` and take the first entry unless it knows the browser needs otherwise. The list varies by install: one whose Windows has no AAC encoder reports `opus` alone.
          examples: [["opus", "aac"]]
        canMuteWhileStreaming:
          type: boolean
          description: |
            Whether this install silences the player while somebody is listening to the stream. `muteWhileStreaming` in `config.json`, and the player owner's decision rather than a client's: there is no route that changes it.

            The capture is taken before the player's volume, so muting leaves the stream at full level. False makes the player one more speaker alongside every listener, which is fine a room apart from them and an echo in the same one — the stream runs a second or two behind.
        canReadLibrary:
          type: boolean
          description: |
            Whether this install serves the media library. False on a component that loaded without the feature and on any version predating it, and every route under `/library` then answers `503`, as does `GET /artwork`, which addresses a cover through the snapshot. `GET /state` answers `200` regardless, with `library.ready` false. A client MUST hide the library rather than offer it and fail.

            True says the routes are there, not that a snapshot is built yet. `GET /state` reports `library.ready` for that.
        playerName:
          type: string
          description: |
            The player's own name, read once at startup and static for as long as it runs. foo_jean loads in foobar2000 alone, so this is the player identifying itself rather than a client needing to guess.
          examples: ["foobar2000"]
        playerVersion:
          type: string
          description: The player's own version string, read the same way.
          examples: ["2.25.3"]
        volumeMin:
          type: number
          description: |
            The floor of the range `PlayerState.volume` in `GET /state` moves within. A client draws the fader's whole length against `volumeMin`..`volumeMax` rather than assuming any particular scale.
          examples: [-100]
        volumeMax:
          type: number
          description: The ceiling of that range.
          examples: [0]
        volumeUnit:
          type: string
          description: What `volumeMin`, `volumeMax` and `PlayerState.volume` are all measured in.
          examples: ["db"]
        playbackModes:
          type: array
          items: { $ref: "#/components/schemas/PlaybackMode" }
          description: |
            The playback modes this install can be put into, in the order the player itself lists them. An order the player reports that this component has no Jean name for is missing from here rather than guessed at, and an install reporting none answers an empty array.
          examples: [["inOrder", "repeatAll", "repeatOne", "random", "shuffleTracks", "shuffleAlbums", "shuffleFolders"]]

    PlaybackMode:
      type: string
      description: |
        Jean's own name for a playback order. `foo_jean` maps it both ways against whatever the player calls its own orders; neither foobar2000's own string nor its ordinal ever crosses this API.
      enum: [inOrder, repeatAll, repeatOne, random, shuffleTracks, shuffleAlbums, shuffleFolders]

    StreamTimeline:
      type: object
      additionalProperties: false
      required: [streamTime, marks]
      properties:
        streamTime:
          type: number
          description: |
            Seconds of audio encoded since the component started. Not wall-clock time and not the player's position. It is the clock `marks[].at` is expressed in.
        marks:
          type: array
          description: |
            Where the stream last changed what a given stream time means, oldest first: a track starting, or a seek within one. The list is bounded, so a player left running for a day does not grow it; a client needs only the marks around what it is currently hearing.

            A seek produces a mark because the track does not change but its position does. Without one a client goes on deriving positions from before the jump.
          items:
            type: object
            additionalProperties: false
            required: [at, path, subsong, position]
            properties:
              at:
                type: number
                description: Stream time at which this track's audio began.
              path:
                type: string
                description: |
                  A plain absolute local path, the same form beefweb reports for `%path%` and the same form `POST /tags` accepts, so a client can join the two on equality.

                  Not the form the player stores: on a portable install foobar2000's canonical path is `file-relative://..\Music\x.mp3` for the file beefweb calls `C:\Music\x.mp3`. This route resolves it.
              subsong: { type: integer }
              position:
                type: number
                description: |
                  Where the player was within the track at `at`. Zero except when a listener connects mid-track or somebody seeks.

    Paired:
      type: object
      additionalProperties: false
      required: [token, apiVersion]
      properties:
        token:
          type: string
          description: |
            The bearer token, in full. A client MUST store it where it would store one pasted by hand, and MUST NOT log it or put it in a URL.
        apiVersion:
          type: integer
          description: The shape of this API, so a client can refuse a version it does not know.
          examples: [1]

    DeviceIdentity:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          maxLength: 64
          description: |
            Opaque, and stable for as long as the device keeps its storage. It is what groups a device's connections into one listener, so a reconnect and Safari's `Range` probe do not read as three people.

            Untrusted: it labels a row in somebody else's picker and nothing branches on it, and anyone already holding the token could send another device's. A client SHOULD generate one at random and keep it, and MUST NOT derive it from anything about the person using it.
          examples: ["3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8"]
        name:
          type: string
          maxLength: 64
          description: |
            What to call this device in a picker. Empty, absent, unprintable or overlong all become no name at all — the label is refused, never the request, because a bad name must not cost somebody their audio.
          examples: ["Android phone"]

    StreamListeners:
      type: object
      additionalProperties: false
      required: [devices, connections, maxConnections, playerMuted]
      properties:
        devices:
          type: array
          description: Connected devices, longest-listening first. A device inside its linger has gone and is not here.
          items:
            type: object
            additionalProperties: false
            required: [deviceId, name, format, connections, listeningFor]
            properties:
              deviceId:
                type: string
                description: |
                  As the device sent it, or `#<n>` for a connection that named nothing. Each anonymous connection is its own device: merging them would report two strangers as one person.
              name:
                type: [string, "null"]
                description: Null when the device did not name itself, so a client can tell that from a name it chose.
              format:
                type: string
                examples: [opus]
              connections:
                type: integer
                description: |
                  Sockets this device holds. Routinely two — Safari probes a source with `Range: bytes=0-1` before fetching it for real.
                examples: [2]
              listeningFor:
                type: integer
                description: Seconds since this device's oldest live connection opened.
        connections:
          type: integer
          description: |
            Every socket, across every device. This is what `maxConnections` bounds, and it is not the number a person should be shown.
        maxConnections:
          type: integer
          description: "`maxConcurrentStreams` from `config.json`."
        playerMuted:
          type: boolean
          description: |
            Whether the player is silent *because somebody is listening*, as opposed to muted by hand. foobar2000 has no mute flag — mute is the volume at -100 dB — so a client reading beefweb sees a fader at the bottom either way, and this is what tells it which sentence to put next to it.

            False the moment anybody unmutes the player from either end: the hold never argues, and stays released until nobody is listening.

    StreamTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresIn]
      properties:
        ticket:
          type: string
          description: |
            Opaque. Send it as the `ticket` query parameter and discard it once the connection is open.
        expiresIn:
          type: integer
          description: Seconds from now.
          examples: [120]

    TagWriteRequest:
      type: object
      additionalProperties: false
      required: [path, fields]
      properties:
        path:
          type: string
          maxLength: 4096
          description: |
            The track's path, exactly as beefweb reports `%path%`: a plain absolute local path. No URL scheme, not even `file://`, no UNC share, no `..` segment, no relative path.

            With `subsong`, this is the whole of a track's identity. Playlist items have no id and any mutation invalidates indices, so a path is the only stable handle a client has.
          examples: ['C:\Music\Fictional Artist\Imaginary Album\01 Track.mp3']
        subsong:
          type: integer
          minimum: 0
          description: |
            Which track inside the file, for cue sheets and disc images. Omit it for an ordinary file; a missing value is read as 0.

            No `default:` is declared here. openapi-typescript treats a property that has one as always present and emits it non-optional, which would force every caller to pass a subsong it does not have.
        fields:
          type: object
          minProperties: 1
          description: |
            Tag name to value. Every name MUST be on the allowlist. Two names differing only in case are refused rather than guessed at, since foobar2000 tag names are case-insensitive and that is two instructions for one tag.
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
            description: |
              A whole number is accepted and rendered as text, so `4` and `"4"` are the same request. An empty string removes the tag. Fractional numbers, booleans and nulls are refused.
          examples: [{ rating: "4" }]

    TagWritten:
      type: object
      additionalProperties: false
      required: [written, path, subsong, fields]
      properties:
        written: { type: boolean, const: true }
        path: { type: string }
        subsong: { type: integer, minimum: 0 }
        fields:
          type: object
          description: What was written, normalised to strings.
          additionalProperties: { type: string }

    TagRefused:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [written, error, detail]
      properties:
        written: { type: boolean, const: false }
        error:
          type: string
          description: The category of refusal.
          enum:
            - malformed request
            - missing path
            - unacceptable path
            - no fields to write
            - field not allowed
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.
        field:
          type: string
          description: |
            Present only when `error` is `field not allowed`, naming the field. A client SHOULD use it to stop offering that control.

    TagFailed:
      description: The request was acceptable and the attempt failed.
      type: object
      additionalProperties: false
      required: [written, error]
      properties:
        written: { type: boolean, const: false }
        error:
          type: string
          enum:
            - foobar2000 does not know that track
            - the player could not write the tags
            - the player did not answer in time
            - tag writing is not available

    PlaylistAnnotation:
      description: |
        What this component knows about one playlist that beefweb does not report, and nothing else. Title, item count, total time and which playlist is current all come from beefweb.
      type: object
      additionalProperties: false
      required: [id, beefwebId, index, title, isAutoPlaylist, managed]
      properties:
        id:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed. Stable across renames, reordering and restarts, and never reused. It is what the routes here address, and what a client SHOULD store to find a playlist again later.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        beefwebId:
          type: [string, "null"]
          description: |
            beefweb's id for the same playlist, read from the property beefweb keeps it in. This is the join key between the two APIs, and it is exact, unlike matching on a title foobar2000 permits duplicates of or on an index that changes under both.

            `null` when beefweb has not assigned one yet, which is the case for a playlist just created here until beefweb next rebuilds its map. Request beefweb's playlists first and this is filled in.

            Read, never written: it is another component's bookkeeping.
          examples: ["p3"]
        index:
          type: integer
          minimum: 0
          description: |
            Position in the player, and the fallback join key when `beefwebId` is null. Not identity: creating, deleting or reordering a playlist changes it.
        title:
          type: string
          description: |
            For checking a join rather than for display. beefweb's answer is the one to show; this is a snapshot from a different request.
        isAutoPlaylist:
          type: boolean
          description: |
            Whether the playlist is an autoplaylist. This is the question beefweb cannot answer. True for any autoplaylist, including ones made in foobar2000 before this component was installed.
        managed:
          description: |
            What this component stored when it created the playlist, or `null` for every playlist it did not create, including autoplaylists made in the player. This is how a client tells a folder it manages from an autoplaylist that was already there.

            It is kept as a foobar2000 playlist property, the same mechanism beefweb uses for its ids, so it travels with the playlist through renames and restarts and is removed with the playlist.
          oneOf:
            - { $ref: "#/components/schemas/ManagedAutoPlaylist" }
            - type: "null"

    ManagedAutoPlaylist:
      type: object
      additionalProperties: false
      required: [key, query, sort, forceSort]
      properties:
        key:
          type: string
          description: |
            Whatever the client sent, handed back verbatim. Empty when none was given.
        query:
          type: string
          description: |
            The query the playlist was created with. Editing the query in foobar2000's own dialog makes this stale, and the component cannot detect that: the SDK offers no way to read an autoplaylist's current query back.
        sort:
          type: string
        forceSort:
          type: boolean

    AutoPlaylistRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What the playlist is called in foobar2000's own tabs. Required when creating, optional when updating; omitting it on an update leaves the name alone rather than renaming the playlist to whatever the client last knew.

            What somebody looking at the player will read on the tab. Nothing in this API parses it, and the user may rename it freely -- so a client that needs to recognise its own playlists later MUST use `key`, never the title.

            No control characters, which would be line breaks in a playlist tab.
        key:
          type: string
          maxLength: 256
          description: |
            Opaque to this component: stored, handed back and compared for equality, never interpreted. A client puts here whatever lets it recognise its own playlists later, such as `folder:genre:Rock`, rather than encoding a convention in the title, which the user can edit.

            MUST be unique across the playlists this component created. A second playlist with the same key is a `409` rather than a duplicate, so the same create request is safe to send twice.
          examples: ["folder:genre:Rock"]
        query:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            foobar2000's own query syntax, passed through untouched. This component never composes or interprets it; the player owns that language and is the only thing that can say whether a query parses.

            Quoting is therefore the client's responsibility. A value taken from library data and pasted in unquoted can produce a valid query that is not the one intended, and no validation here can catch that. Use `POST /autoplaylists/preview` to see what a query matches.
          examples: ["%genre% IS Rock"]
        sort:
          type: string
          maxLength: 4096
          description: A title-formatting pattern to sort by. Optional.
          examples: ["%album artist%|%date%|%album%"]
        forceSort:
          type: boolean
          description: |
            Keep the playlist sorted, and stop the user reordering it by hand. Optional, and false when absent.

    FillOwnPlaylistRequest:
      type: object
      additionalProperties: false
      required: [title, structure]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What to title the playlist, exactly as it will read in foobar2000's own tabs. Applied on every call, whether this one is what creates the playlist for `role` or finds one already there, so retitling it from one fill to the next is the same call that fills it, never a second one.

            No control characters, which would be line breaks in a playlist tab.
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: export the library again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    FillPlaylistRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: export the library again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    Runs:
      type: array
      description: |
        The set as ranges: each entry is `[start, count]`, a run of `count` consecutive ordinals beginning at `start`. Collapses a whole album, a whole folder or the whole library to a handful of pairs.

        Inserted in ascending ordinal order, never in the order the pairs are listed — a run cannot carry any other order. A client holding a click-ordered set MUST send `ordinals` instead.
      items:
        type: array
        items: { type: integer, minimum: 0 }
        minItems: 2
        maxItems: 2
      examples: [[[0, 2], [9, 1]]]

    Bitset:
      type: string
      description: |
        The set as a bitmap, one bit per ordinal of the `structure` sent alongside it, least-significant bit first within each byte: bit 0 of byte 0 is ordinal 0, bit 7 of byte 0 is ordinal 7, bit 0 of byte 1 is ordinal 8. Base64 of exactly `ceil(trackCount / 8)` bytes for that `structure`. Costs about one byte per eight ordinals in the library whatever the set, which is what makes it the form to reach for once a scattered set would cost more as `runs` than the library is wide.

        Inserted in ascending ordinal order — a bitmap carries no other order to preserve.
      examples: ["AwI="]

    Ordinals:
      type: array
      items: { type: integer, minimum: 0 }
      description: |
        The set as a plain list. The only one of the three forms inserted in the order it is given rather than ascending — the form a client holding a click-ordered set, such as a multi-select or a queue, MUST send. Sending the same set as `runs` or `bitset` inserts it in ascending order instead, silently.
      examples: [[9, 0, 1]]

    FillResult:
      type: object
      additionalProperties: false
      required: [playlistId, beefwebId, positions]
      properties:
        playlistId:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed. From `POST /playlists/own/{role}/items` this is the id `role` resolved to; from `POST /playlists/{id}/items` it is the `id` the request named.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        beefwebId:
          type: [string, "null"]
          description: |
            beefweb's id for the same playlist, exactly as `PlaylistAnnotation.beefwebId` reports it. `null` until beefweb next rebuilds its map; a client that needs it MUST request beefweb's playlists again first.
          examples: ["p3"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One position per row inserted, in the order the rows were inserted: request order for `ordinals`, ascending ordinal order for `runs` and `bitset`. `positions[i]` is where the *i*-th inserted row landed, 0-based.
          examples: [[0, 1, 2]]

    QueryPreview:
      type: object
      additionalProperties: false
      required: [valid, error, matches, libraryEnabled]
      properties:
        valid:
          type: boolean
          description: Whether foobar2000 could read the query. Check this before `matches`.
        error:
          type: string
          description: |
            The player's own message when `valid` is false, and empty otherwise. Safe to show a person: it describes the query they typed, not anything on the disk.
        matches:
          type: integer
          minimum: 0
          description: How many tracks in the Media Library the query matches. `0` when invalid.
        libraryEnabled:
          type: boolean
          description: |
            Whether this install has a Media Library configured. Autoplaylists filter the Media Library and nothing else, so `false` means every autoplaylist is empty whatever the query. A client SHOULD say so before somebody creates one, which is why this is reported here rather than on `/capabilities`.

    PlaylistRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - malformed request
            - unacceptable title
            - unacceptable key
            - unacceptable query
            - unacceptable sort
            - unacceptable playlist id
            - unacceptable ordinal set
            - too many requests
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    PlaylistFailed:
      description: The request was acceptable and the attempt failed.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - foobar2000 could not read that query
            - no such playlist
            - that position is past the end
            - that playlist was not created by foo_jean
            - another playlist already has that key
            - this install's autoplaylist limit is reached
            - tracks were added or removed; export the library again
            - the player could not do that
            - the player did not answer in time
            - autoplaylists are not available
            - this install has playlist writes turned off; turn on writePlaylists in config.json to allow them
        detail:
          type: string
          description: |
            Empty except for a query foobar2000 could not read, where it carries the player's own parse error. That message describes text the client sent rather than anything on the player's disk, so it is safe to show.

    State:
      description: |
        What `GET /state` answers. The library's two generations ride under `library`, and
        what the player is doing rides under `player`.
      type: object
      additionalProperties: false
      required: [library, player]
      properties:
        library: { $ref: "#/components/schemas/Library" }
        player: { $ref: "#/components/schemas/PlayerState" }

    Library:
      description: |
        What rides under `library` in `GET /state`'s `200`, and what `GET /library/export` and `POST /library/refresh` hand back on a `202`. Small on purpose: it is polled.
      type: object
      additionalProperties: false
      required: [ready, structure, revision, trackCount, columns]
      properties:
        ready:
          type: boolean
          description: |
            Whether a snapshot has been built. False only between the component starting and its first walk finishing. Every other library route answers `503` while it is false.
        structure:
          type: integer
          description: |
            Moves when tracks are added to or removed from the library. A different value from the one a client's snapshot header carries means every ordinal it holds is meaningless: export again. `0` before the first build.
          examples: [41]
        revision:
          type: integer
          description: |
            Moves when a row changes in place, which is what a play, a rating or a tag edit does. A higher value with an unchanged `structure` means fetch a delta. Contiguous, so it is exactly the `since` to ask with.
          examples: [903]
        trackCount:
          type: integer
          description: Rows in the snapshot, which is the length of every `ids` array in it.
          examples: [30441]
        columns:
          type: array
          items: { type: string }
          description: |
            The title-formatting expressions the ready snapshot was built with, in the order they appear in the header's `columns` array. Empty while `ready` is false. The spine is not among them: `directory`, `filename` and `subsong` are always built and are reported under `spine` instead.

            This is what a client compares against between a `202` from `GET /library/export` and its next attempt. The comparison is by membership: same members, in any order, is the same declaration.
          examples: [["%title%", "%album artist%", "%play_count%"]]

    PlayingLocation:
      description: |
        Where the playing track sits: the playlist's GUID and the item's position within it.
      type: object
      additionalProperties: false
      required: [playlistId, index]
      properties:
        playlistId:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed, matching `PlaylistAnnotation.id` for the same playlist.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        index:
          type: integer
          minimum: 0
          description: The playing item's position within that playlist, 0-based.

    PlayerState:
      description: |
        What rides under `player` in `GET /state`'s `200`. Always present and never null: a
        stopped player still answers this section, with `playback` `stopped` and `path` empty.
      type: object
      additionalProperties: false
      required:
        [playback, path, subsong, position, duration, volume, muted, playbackMode, title, artist,
         playingLocation, queueRevision]
      properties:
        playback:
          type: string
          enum: [stopped, paused, playing]
          description: What the player is doing right now.
        path:
          type: string
          description: |
            What is playing, or empty when nothing is. foobar2000's own absolute
            display path, in the player's own separator. Not the media library
            snapshot's key, which is `directory` plus `filename`, library-relative
            and forward-slashed everywhere.
        subsong:
          type: integer
          description: The index within `path`, for a cue sheet or a disc image. `0` for an ordinary file.
        position: { $ref: "#/components/schemas/Position" }
        duration:
          type: number
          description: The playing track's length in seconds, or `0` when nothing is playing.
        volume:
          type: number
          description: The player's own volume, in whatever range it reports.
        muted:
          type: boolean
        playbackMode:
          description: |
            Jean's name for the playback order the player is in right now, or `null` when this component has no name for the order the player reports. Always present and never omitted, so a client can tell "no name for this" from "too old to report".
          oneOf:
            - { $ref: "#/components/schemas/PlaybackMode" }
            - type: "null"
        title:
          type: [string, "null"]
          description: |
            The playing track's title, computed by the player, or `null` when it has not computed one.
        artist:
          type: [string, "null"]
          description: |
            The playing track's artist, computed by the player, or `null` when it has not computed one.
        playingLocation:
          description: |
            Where the playing track sits, or `null` when it is not playing from a playlist this component can name.
          oneOf:
            - { $ref: "#/components/schemas/PlayingLocation" }
            - type: "null"
        queueRevision:
          type: integer
          description: |
            Moves when the queue's contents or order change, or when a queued entry's playlist position shifts or is lost. Never moves for anything else this section reports.

    Position:
      description: |
        Where playback was at the moment this component last looked, and how long ago that
        was. A `steady_clock` mark means nothing on another machine, so `ageSeconds` is the
        only part of it a client can use: it adds `ageSeconds` to `seconds` and keeps counting
        from there while `player.playback` is `playing`.
      type: object
      additionalProperties: false
      required: [seconds, ageSeconds]
      properties:
        seconds:
          type: number
          description: Playback position at the mark, in seconds.
        ageSeconds:
          type: number
          description: |
            How long before this response was built the mark was taken, in seconds. `0` when
            no mark has ever been taken.

    QueueRead:
      description: |
        `GET /queue`'s whole answer: every queued entry, in the player's own order, and the queue revision they were read at.
      type: object
      additionalProperties: false
      required: [revision, entries]
      properties:
        revision:
          type: integer
          description: |
            `GET /state`'s `queueRevision` as of this read. A client refetches when the one it holds has moved, and not otherwise.
        entries:
          type: array
          items: { $ref: "#/components/schemas/QueuedTrack" }

    QueuedTrack:
      description: |
        One entry in the play queue, as a client draws a row: the fixed fields a row shows, where the track sits in the media library, and where it sits in a playlist. A missing tag is an empty string, never `null` and never `"?"`.
      type: object
      additionalProperties: false
      required: [title, artist, duration, album, albumArtist, libraryPath, location]
      properties:
        title: { type: string }
        artist: { type: string }
        duration:
          type: number
          description: Seconds.
        album: { type: string }
        albumArtist: { type: string }
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds this track, or `null` where it does not.
        location:
          description: |
            Where this entry sits in a playlist, or `null` for a library track queued by handle and for a playlist row whose position the player has lost. The core keeps such an entry rather than dropping it; read it through the handle it carries, never through a stale position.
          oneOf:
            - { $ref: "#/components/schemas/PlayingLocation" }
            - type: "null"

    QueuePlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [playlistId, positions]
      properties:
        playlistId:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces. Not beefweb's id.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          minItems: 1
          description: |
            The rows to queue, by position in that playlist, in the order to queue them in -- the order a multi-select was clicked in, never sorted and never queued as a range.
          examples: [[7, 2, 5]]
        at:
          type: integer
          minimum: 0
          description: |
            Where in the queue to insert, `0` being the head. Omit it to queue at the end. Sent only together with `revision`; `at` without `revision` is a `400`.
          examples: [1]
        revision:
          type: integer
          description: |
            The queue revision `at` was chosen against, from `GET /state`'s `queueRevision`. Required whenever `at` is sent.
          examples: [9]

    QueueLibraryTracksRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: export the library again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }
        at:
          type: integer
          minimum: 0
          description: |
            Where in the queue to insert, `0` being the head. Omit it to queue at the end. Sent only together with `revision`; `at` without `revision` is a `400`.
          examples: [1]
        revision:
          type: integer
          description: |
            The queue revision `at` was chosen against, from `GET /state`'s `queueRevision`. Required whenever `at` is sent.
          examples: [9]

    LibraryHeader:
      description: |
        The JSON header inside a snapshot or a delta, between the four-byte magic number and the blob. It is not served on its own by any route; it is documented here so a client can be generated for it. *The media library*, at the top of this document, has the framing and how to read a column.
      type: object
      additionalProperties: false
      required: [kind, structure, revision, trackCount, columns, spine]
      properties:
        kind:
          type: string
          enum: [snapshot, delta]
          description: Which of the two routes produced this. A client MUST check it rather than infer it from the URL it asked for.
        structure:
          type: integer
          description: The generation the ordinals in this body belong to.
        revision:
          type: integer
          description: The generation this body brings a client up to.
        since:
          type: integer
          description: |
            Deltas only, and absent from a snapshot. The revision this body patches from, echoing the request so a client can confirm what it is applying.
        trackCount:
          type: integer
          description: |
            Rows in the whole snapshot, in a delta as well as in a snapshot. In a snapshot it is the length of every `ids` array; in a delta it is what `ordinals` are bounded by, and it is what their width was chosen from.
        columns:
          type: array
          description: |
            The columns the client declared, each carrying its own `name`, in the order it named them. In a delta, only the ones that moved.
          items: { $ref: "#/components/schemas/LibraryColumn" }
        spine:
          type: object
          additionalProperties: false
          description: |
            The three columns the component always builds, keyed by name rather than carrying one. A snapshot has all three. A delta has only the ones that moved, which for the spine is rare: a track whose path changed is a removal and an addition, and that moves `structure`.
          properties:
            directory:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: |
                The track's directory relative to the library root, forward-slashed on every platform and keeping its trailing slash, so `directory + filename` is the whole relative path. Empty for a track at the root. The library root itself is never published.
            filename:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: The last segment of the path, extension included.
            subsong:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: |
                The index within the file, as decimal text, for cue sheets and disc images. `0` for an ordinary file. Text like every other column, because nothing here types a value.

    LibraryColumn:
      description: |
        One column: a dictionary of distinct strings, and one dictionary id per row. Every `offset` is a byte offset from the start of the blob and is a multiple of four.

        Both routes answer with this shape. A delta's columns carry `ordinals` and `dict.base` on top of it; a snapshot's carry neither, and a client reads `kind` on the header to know which it is holding rather than testing for a key.
      type: object
      additionalProperties: false
      required: [ids, dict, distinct, hasUnresolved, allUnresolved]
      properties:
        name:
          type: string
          description: |
            The title-formatting expression this column was built from, exactly as configured. Present on an entry in `columns`, absent under `spine`, where the key is the name.
          examples: ["%title%"]
        ids:
          allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
          description: |
            One dictionary id per row. In a snapshot `count` is `trackCount` and entry *i* belongs to ordinal *i*. In a delta `count` is `ordinals.count` and entry *i* belongs to ordinal `ordinals[i]`.
        ordinals:
          allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
          description: |
            Deltas only, and absent from a snapshot. The ordinals this column changed at, ascending and without repeats, one for each entry in `ids`. Its `width` is the narrowest of 1, 2 and 4 that holds every ordinal from `0` to `trackCount - 1`: these index rows rather than dictionary entries, so it is chosen from a different number than `ids.width` and is often a different width.
        dict:
          type: object
          additionalProperties: false
          required: [text, ends]
          properties:
            text:
              type: object
              additionalProperties: false
              required: [offset, length]
              description: |
                Every value in the dictionary, concatenated with nothing between them, `length` bytes of UTF-8 as the player produced it. One `TextDecoder` call reads the lot; slice it lazily rather than building every string up front.
              properties:
                offset: { type: integer }
                length: { type: integer }
            ends:
              allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
              description: |
                Where each value ends within `text`, exclusive. Value *i* spans `[ends[i - 1], ends[i])`, reading `ends[-1]` as `0`. In a snapshot `count` is `distinct`; in a delta it is `distinct - base`, because a delta carries only what was appended.
            base:
              type: integer
              description: |
                Deltas only, and absent from a snapshot. How many entries the client's dictionary already holds. Dictionaries are append-only within a `structure` generation, so the values in `text` are appended at this index and nothing already held is restated.
        distinct:
          type: integer
          description: |
            Values in the whole dictionary, in a delta as well as in a snapshot. This is what `ids.width` was chosen from.
        hasUnresolved:
          type: boolean
          description: |
            Whether `?`, the single question mark, is one of the values. That is what a field the player could not resolve formats to, so this is capability detection answered exactly rather than sampled: a field that resolves on one track in ten thousand is detected here and missed by sampling.

            It replaces the guess, not the switch. A user overriding detection in a client's own settings still wins.
        allUnresolved:
          type: boolean
          description: |
            Whether `?` is the only value the column ever takes, which means the player resolves this field for nothing in this library. A client SHOULD treat the column as absent.

    LibrarySection:
      description: A run of fixed-width unsigned little-endian integers in the blob.
      type: object
      additionalProperties: false
      required: [offset, count, width]
      properties:
        offset:
          type: integer
          description: Bytes from the start of the blob. Always a multiple of four, so a typed array can be taken over it in place.
        count:
          type: integer
          description: How many integers.
        width:
          type: integer
          enum: [1, 2, 4]
          description: |
            Bytes per integer, chosen from the measured cardinality. A client MUST read it rather than assume: the same column is one byte wide in a small library and four in a large one.

    LibraryRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the snapshot was touched.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - too many columns
            - unacceptable column
            - duplicate column
            - unacceptable revision
        detail:
          type: string
          description: |
            What specifically was wrong, naming the position of the offending column where there is one. Safe to show a person: it describes the request the client sent and nothing on the player's disk.

    LibraryFailed:
      description: The request was acceptable and the snapshot could not answer it.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - the library snapshot has not been built yet
            - "tracks were added or removed; export the library again"
            - "that revision is older than the retained window; export the library again"
            - no such revision
        detail:
          type: string
          description: Always empty. It is present so that every library failure reads as one shape.

    Error:
      description: |
        The minimum shape every failing response carries. It says nothing about what broke inside the component, because error text leaks filesystem paths.
      type: object
      required: [error]
      properties:
        error: { type: string }

    DiscoveryRecord:
      description: |
        Served by beefweb, not by this component, at `GET http://<player>:8880/api/clientconfig/foo_jean`. It is same-origin for anything beefweb serves, so finding the component is one request rather than a port scan. The component writes it on every start and removes it on a clean shutdown.

        `null` means the component is not installed.

        ### This record is not evidence

        `POST /api/clientconfig/{id}` is a documented beefweb route, `changeClientConfig` defaults to on, and beefweb ships with no authentication. Anyone who can reach beefweb can therefore overwrite this record and name any port, and the forgery lasts until the component next starts. A client that read a port from here and posted its bearer token to it would hand the token to whoever wrote the file.

        A client MUST treat this record as a hint. Call unauthenticated `GET /status` on the advertised port first, require `name` to be `foo_jean` and an `apiVersion` the client understands, and only then send the token.
      type: object
      required: [name, version, apiVersion, port, authRequired, listening]
      properties:
        name: { type: string, const: foo_jean }
        version: { type: string, examples: ["0.3.0"] }
        apiVersion: { type: integer, examples: [1] }
        port:
          type: integer
          description: Where the component says it is listening. Verify before trusting.
          examples: [8881]
        authRequired: { type: boolean, const: true }
        listening:
          type: boolean
          description: |
            False when the component loaded but could not bind. Not the same as an absent record, and a client SHOULD report it: "installed but could not start on port 8881" is something a person can act on, where a silently disabled feature is not.
        error:
          type: string
          description: Present only when `listening` is false. Safe to show a person.
          examples: ["could not bind 0.0.0.0:8881; the port is in use"]
        portInUse:
          type: boolean
          description: |
            Present only when `listening` is false, and separated from other failures because it has a specific remedy: change `port` in `<profile>/foo_jean/config.json`. The usual cause is another server on that port.
