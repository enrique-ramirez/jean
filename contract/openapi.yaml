openapi: 3.1.0

# The HTTP surface of foo_jean, in full.
#
# Hand-written, and the contract. The component does not serve it: code generation happens at build time, and an unauthenticated route describing this component's own surface adds nothing a reader of the repository does not already have. Fetch it from the repo.
#
# Generate a TypeScript client with:
#
#   pnpm types:api
#
# `plugins/fb2k/tests/api_contract_test.cpp` pins the exact key set of every document the component produces. `plugins/fb2k/scripts/test.sh` checks that the version below matches `plugins/fb2k/src/core/version.h`.

info:
  title: foo_jean
  version: 0.5.0
  summary: The media library, playlists, the queue, tag writing and a live stream of the player's output, for foobar2000, over HTTP.
  description: |
    A foobar2000 component exposing over HTTP what a client cannot otherwise reach: writing metadata tags, the media library read in windows, every playlist and autoplaylist addressed by foobar2000's own GUID, the play queue, cover art, what the player is doing, and a live encode of its output.

    ## Playlists and playback

    Playlists are read and edited here and nowhere else. `GET /playlists` is the listing: every playlist the player holds, with its title, its item count, its position in the player's list, whether it is an autoplaylist, and the two generations that say what a client has to read again. There is no second answer to join it against. See `PlaylistAnnotation`.

    The playback commands are here: `/playback/*` for pause, next, previous, stop, seek and the playback mode, `/volume` for the level, a step and mute, and `POST /playlists/{id}/items/{index}/play` for starting a row, because a row is addressed by playlist.

    ## Versioning

    `apiVersion` is the number to branch on. It moves independently of the component version: a patch release does not move it, a breaking change to any shape here does. Read it from `GET /status` and refuse a number the client does not understand.

    ## Admission

    Every route, `OPTIONS` and `GET /status` included, requires a private source address (RFC1918, loopback and link-local, and their IPv6 equivalents) and a `Host` the component recognises: an IPv4 or IPv6 literal, `localhost`, a name with no dot, a name ending `.lan`, `.local` or `.home.arpa`, or a name listed in `allowedHosts` in `<profile>/foo_jean/config.json`. Either check failing is `403`, before anything else about the request is read.

    A request under `/api/` that a browser marks `Sec-Fetch-Site: cross-site` or `same-site` is `403` as well, unless its `Origin` is one `allowedOrigins` lists. A browser sends that header only to a secure origin, so a request carrying none is admitted, as is one marked `same-origin` or `none`. Every answer under `/api/` carries `Cross-Origin-Resource-Policy: same-origin`, so a page on another origin cannot read one through an `<img>` or an `<audio>`, which CORS never governs.

    Every `POST` requires `Content-Type: application/json`, with or without a body; without it the answer is `415`, which every `POST` below lists as `JsonRequired`. `DELETE` carries no such rule, since a browser preflights every cross-origin `DELETE` on its own.

    `GET /stream` requires one credential of its own beside admission: a ticket from `POST /stream/ticket`.

    ## Reachability

    `bindAddress` defaults to `0.0.0.0`, every local interface, so a browser on another device on the same network reaches the component without configuration. It can be narrowed to `127.0.0.1`.

    No answer at all to `GET /status`, rather than a refusal, means `bindAddress` has narrowed the component off this network or a firewall is in the way, not necessarily that foo_jean is not installed.

    ## CORS

    No origin is reflected with `allowedOrigins` empty: another port on the same host is another origin, and any service listening there could reach every route this component answers. A listed origin is reflected on every route: `Vary: Origin` is set on every response, and the origin is echoed rather than answered with a literal `*`, which would forbid credentialed mode.

    **A browser hands script only the CORS-safelisted response headers**, so an answer to a listed origin carries `Access-Control-Expose-Headers: ETag, Retry-After`. Those are the two a client is told to act on and neither is safelisted: without the first no cross-origin page can read a validator at all, and without the second a `429` cannot be backed off from as documented. `Cache-Control` and `Content-Type` are safelisted and are not named.

    `If-None-Match` is the other half of the same problem and is a *request* header, which no safelist covers either, so the preflight answers `Access-Control-Allow-Headers: Content-Type, If-None-Match`. Without it a page could hold a validator and never send one, and the state poll and a cover would each be a full download from a browser and a `304` from a command line.

    CORS decides which page may read a response. Admission decides who is served at all: the source and `Host` checks run before CORS is even consulted, and neither one is a CORS header a non-browser client would have to honour.

    Set `allowedOrigins` in `<profile>/foo_jean/config.json` to the origins a page may be served from, matched on the whole origin string and case-insensitively.

    `OPTIONS` preflight is answered `204` without a credential, identically for every path, so it reveals nothing about which routes exist.

    ## The media library

    `GET /state` is a small JSON document a client polls, carrying the library's two generations under `library`. The component holds the library and a client holds windows of it: `POST /library/rows` answers the rows a client names, in the binary format below, and is where it declares its columns, and `GET /library/runs` answers how the whole library falls into albums, so a client can lay out a list it has not read. A client asks the component what it would otherwise sweep the library to find out. `GET /library/summary` answers a handful of numbers and shelves about the whole library, and four questions answer which tracks a search matches, and which an album, an artist or a genre holds (see *The four questions*). `GET /library/values` completes a field's values from a prefix and `GET /library/credits` names the artists one track's credit holds. All of them read the snapshot the component holds. `GET /track/library` is the one per-entity route, and it reads a single track back after a write rather than standing in for a browse.

    Two generations say what changed. `structure` moves when tracks are added or removed, which shifts every ordinal after the change. It also moves when the column set changes, or when a rebuild puts the same tracks in another order, since every ordinal then names a different track. A client that sees it move forgets the ordinals it holds, reads `GET /state` and asks for its windows again. A rebuild that finds the same tracks and columns in the same order keeps `structure` and moves `revision` only for the rows whose values changed. `revision` moves when rows change in place, which leaves ordinals alone, and `library.changeCounts` says in which columns, so a client re-reads only what depends on them. Modifications are constant, roughly one per track played; additions and removals are rare and the user just caused them.

    An **ordinal** is a track's position in the snapshot, counted from zero, and it is the only handle these routes use. Ordinals follow the player's own ordering of library-relative paths, which need not be byte order: a player may put `2 Mello` ahead of `10cc`, where byte order would put it after. Ties are broken by subsong and then by the player's own canonical path, so the order is total and does not change between rebuilds of an unchanged library. A client MUST NOT reproduce the comparison or read meaning into where a path lands: an ordinal is a position the component handed it, never one it could have worked out. An ordinal means nothing across a `structure` change.

    ### Who declares the columns

    The client, and the rows request is the declaration. `POST /library/rows` names the title-formatting expressions the client wants in `columns`, and the component evaluates exactly those. Nothing here parses or interprets one: that keeps the component general and it keeps a client's own capability detection working.

    The loop is: ask, and get either rows or a `202`; on a `202` poll `GET /state` until `library.columns` match what was asked for and `library.ready` is true; then ask again. **The first request after the component starts, and the first after a declaration changes, is the slow one.** It walks and formats every track in the library. Every request after that is served from what is already built.

    Order does not matter when comparing: `columns` from `GET /state`'s `library` and the set a client declared are the same declaration when they have the same members. Order decides only where a column lands in the header's `columns` array.

    Every later rebuild reuses the last declared set, whether the player raised a change notification or somebody called `POST /library/refresh`. Two clients wanting different sets will therefore take the snapshot from each other, each change of set costing a full rebuild.

    ### The rows format

    `POST /library/rows` answers in one format, `application/octet-stream`:

    ```
    offset 0   4 bytes    the ASCII letters JLIB
    offset 4   4 bytes    headerLength, unsigned little-endian
    offset 8   headerLength bytes    the header, UTF-8 JSON, right-padded with ASCII spaces
    offset 8 + headerLength           the blob, to the end of the body
    ```

    Every integer in the body is unsigned and little-endian. The header's padding is what makes `8 + headerLength` a multiple of four, and `headerLength` counts it, so the blob begins on a four-byte boundary. Every `offset` in the header is measured from the first byte of the blob and is itself a multiple of four. That is what lets a client take `new Uint32Array(buffer, blobStart + offset, count)` over the bytes in place: a typed array over a byte offset that is not a multiple of its element size throws in every browser.

    The header parses with `JSON.parse` and is small. Its shape is `LibraryRowsHeader`.

    ### Compression

    `POST /library/rows` is gzipped when the request offers gzip, and sent as it stands when it does not. It is several times smaller compressed, so a client SHOULD offer gzip; every browser does by default.

    Negotiation is RFC 9110's: `Accept-Encoding: gzip` gets `Content-Encoding: gzip`, `Accept-Encoding: gzip;q=0` is a refusal and gets the bytes as they stand, and no `Accept-Encoding` at all is also a refusal. Only `gzip` is offered; `br`, `zstd` and `deflate` are not, and `*` is read as offering nothing rather than as offering everything.

    Every answer from this route carries `Vary: Accept-Encoding`. This route carries no `ETag`. `GET /state` is `ETag`ged, with a tag of its own built from the state (the library's `structure` and `revision` among other segments), and **the `ETag` names the coding**: `"s41-r903-i9231704662185031702-p12-c3-gzip"` and `"s41-r903-i9231704662185031702-p12-c3-identity"` are two representations of one state and never share a validator. A client passes back whichever tag it holds and keeps asking with the same `Accept-Encoding` it asked with before. The middle segment is fixed when the component starts and differs between runs of it, so a tag a browser cached before a restart never matches what the new run answers.

    ### Reading one column

    A column is a dictionary of distinct values plus one dictionary id per row. Nothing else: there is no type system here, no numbers and no nulls, because the component never parses, normalises or types what the player produced. A field the player could not resolve arrives as the single character `?`, an empty tag arrives as `""`, and a tag whose value is literally `N/A` arrives as `N/A`. Telling those three apart is the whole of a client's capability detection, so a client MUST NOT coerce them.

    - `ids` is one id per ordinal: `ids.count` entries of `ids.width` bytes each, where the width is 1, 2 or 4. In a rows body `ids.count` equals `rows`.
    - `dict.text` is `dict.text.length` bytes of UTF-8, every distinct value concatenated with nothing between them. Decode it with one `TextDecoder` call and slice lazily: materialising a quarter of a million strings up front costs more than drawing them does.
    - `dict.ends` is `dict.ends.count` entries of `dict.ends.width` bytes, entry *i* being the offset within `dict.text` at which value *i* ends. Value *i* therefore spans `[ends[i - 1], ends[i])`, with `ends[-1]` read as `0`.

    Widths are chosen from the measured cardinality, so a client MUST read them rather than assume: `ids.width` is the narrowest of 1, 2 and 4 that holds every id of the dictionary the body carries for that column, and `dict.ends.width` the narrowest that holds `dict.text.length`.

    Each column also carries what a client would otherwise learn by sampling rows and guessing. `distinct` is the number of values in the whole dictionary, `hasUnresolved` says whether `?` is one of them, and `allUnresolved` says whether it is the only one. A field that resolves on one track in ten thousand is therefore detected exactly rather than missed, which sampling cannot promise.

    ### The spine

    Three columns the component always builds, under `spine` rather than in `columns`, and they read exactly like any other column.

    `directory` and `filename` are the track's path relative to the library root, forward-slashed on every platform, split in two because directories repeat heavily. `directory` keeps its trailing slash, so the whole relative path is the two concatenated. The library root itself never appears: an absolute path is the player's business and this API does not publish one here. `subsong` is the player's own subsong number for that row, as decimal text, and it is `0` for an ordinary file. It is a value the player assigned rather than a position among the rows at one path, and a cue sheet's subsongs number from 1, so a client MUST NOT work one out by counting. plugins/fb2k/ARCHITECTURE.md, *Facts about the player*, has which files the player splits.

    ### The four questions

    `GET /library/search`, `GET /library/album`, `GET /library/artist` and `GET /library/genre` answer what a client would otherwise have to read every row of the library to find: the tracks a search matches and the artists, albums and genres it names, and the tracks an album, an artist or a genre holds. Each reads the snapshot the component holds, answers on the connection that asked, and names tracks by ordinal at the `structure` it carries.

    **`plugins/fb2k/tests/fixtures/library_questions_cases.json` defines their answers.** For every case in that file an implementation MUST answer what the case expects, byte for byte in what the answer says, and where this text and a case differ the case is right. What follows is what a reader needs to ask the questions and read the answers, and it is not a second definition of folding, ranking or credit splitting.

    **Roles.** Each question takes the roles `GET /library/summary` takes, and five more: `artists`, `artistIds`, `albumArtists`, `albumArtistIds` and `artistSort`, each an expression the client declared through `POST /library/rows`, as the summary reads them. A question reads `title`, `artist`, `album`, `albumArtist`, `genre`, `artists`, `artistIds`, `albumArtists`, `albumArtistIds`, `artistSort`, `trackNumber` and `discNumber`, and accepts the others without reading them. A role left out reads as unresolved on every track. The summary takes its own seventeen alone.

    **Folding.** A text is folded by lower-casing it as ECMAScript's `String.prototype.toLowerCase` does, decomposing it to NFD, spelling each character CLDR's Latin-ASCII transform has a rule for as that rule does (`ø` is `o`, `œ` is `oe`, `ß` is `ss`) and each dot-like mark as a full stop, and removing every code point with the Unicode property `Diacritic`. A query is folded whole and then split on ECMAScript whitespace into words, so a sigma before a space is final. A query that leaves no word is a query that folds to nothing, which matches no track and names no entity. A library that holds no tracks answers every query so, whatever the words. A query with no letter or digit in it, such as a name written in Morse code, is matched on its folded text with the whitespace taken out of both sides, and a cell that is unresolved carries no search text.

    **Sets.** A set of tracks is an ascending list of ordinals at the answer's `structure`, sent as `runs` or as `bitset`, whichever serialises shorter, and `runs` on a tie. `runs` is the maximal runs of consecutive ordinals, `[start, count]` each, and is measured as the compact JSON text of that array, with no whitespace. `bitset` is `ceil(trackCount / 8)` bytes at the answer's `structure`, as `Bitset` describes, in padded base64. The answer carries no `trackCount`, so a client decodes a `bitset` against the library it holds at that `structure` and reads nothing from an answer at another. `runs` is the shorter when its text is no longer than `4 * ceil(ceil(trackCount / 8) / 3)` characters. An empty set is `{ "runs": [] }`. A client reads a set in whichever form arrives, and exactly one of the two is present.

    **Entities.** An album is grouped by the summary's key: two tracks belong to one when their album tags match and their credited artists match, a tag matching by that key. One rule is the questions' own: a credited name that is blank is an artist of its own, as the page has always treated it, where the summary reads it as no artist, so an album asked with `by` absent does not include a track whose credit is blank. An artist is a name credited on a track, a genre a value of the genre expression; the cases say how credits split into names, which name is the lead, which a guest and which tags are read. An entity's `cover` is the library-relative path `GET /artwork?track=` takes, `null` where none exists: an album's is the path of its canonical track, the one with the lowest disc number, then the lowest track number, then the lowest ordinal, and an artist's is the canonical track of the album holding the first track, in ordinal order, that credits it and has an album tag, a guest credit included.

    **Ties.** Where two tracks or two entities tie on every rank key, they keep the order the cases leave them in.

    **Refusals come in this order, as the summary's do.** A request the route cannot read is a `400`, which `LibraryRefused` lists. A component that does not serve the media library is a `503`. The budget of the four questions is a `429`, which `LibraryQuestionsTooFast` describes, and a request refused for what it asks spends nothing. A component with no snapshot ready, or one that was not built with a role's expression, answers `202` with the `library` object `GET /state` carries and starts no build. An expression the declaration does not hold is a `409` naming it. An answer carries the pair it read, whatever pair the request was admitted at.

    **Held answers.** `Cache-Control` is `private, no-cache` and there is no `ETag`: a client keeps what it asked in memory. `Content-Encoding` is `gzip` whenever the request offered it. See *Compression*.

    ## Artwork

    `GET /artwork` is one front cover, addressed by the library-relative path of a track that has it: the snapshot's `directory` and `filename` concatenated, exactly as it published them. There is no ordinal here. An ordinal means nothing across a `structure` change, so a URL built from one would have to name the generation as well and would then change every time a track was added anywhere in the library, emptying a browser's cache of every cover at once. A relative path survives a rebuild, a restart and a change of column set.

    **Point every row of an album at one URL.** A client picks one track to stand for a record and addresses that one from the sleeve, the row, the shelf and the now-playing pane alike. One URL in every view is what lets the browser store, deduplicate and revalidate a cover once instead of once per screen. That is also why this route takes a track rather than an album: the player resolves art per track, from the file's own tags or from an image beside it, and which of the two it is varies inside one library.

    The address is a lookup key and never a path. It is matched against what the player reported for the tracks in the snapshot and is joined to nothing, so there is no file outside the media library to name and nothing to traverse out of. An address the snapshot does not carry is a `404`, and never another record's sleeve.

    The body is `image/jpeg`, `image/png`, `image/gif`, `image/webp` or `image/bmp`, read from the bytes rather than from a filename. Where the player's front cover is in anything else, the picture in the track's own tags is sent instead if it is one of those. With neither, the answer is a `404`: a type nothing recognised is not one a client should be told to draw.

    ### The playing cover

    `GET /artwork/playing` is the front cover of whatever the player is playing right now, addressed by nothing: no path, no index, no handle. It answers what `GET /artwork` cannot, because there is no library-relative path to address a stream, a CD track or a file the library has never indexed by: the player's own now-playing loader resolves a picture embedded in the file's own tags exactly as readily as one sitting beside it on disk, and this route is a window onto that loader rather than onto the snapshot.

    The picture is held rather than loaded per request: this component folds it once with the same validator `GET /artwork` computes, the moment the player's loader hands it over, and a conditional request that already holds the current cover costs a comparison of two strings and touches no file. The address does not move when the track does, so the next track of the same album revalidates to a `304`.

    ### The positional fallback

    `GET /artwork/playlists/{id}/{row}` is the front cover of a playlist row `GET /artwork` cannot address: one with no library-relative path. A client names a playlist and a position; the player resolves the two to a handle, so nothing here becomes a filesystem path and nothing addresses a track the player did not itself find at that row. A row the media library does hold a path for is refused rather than answered: one album is one address, and a position is not that address.

    ### Revalidating a cover

    `GET /artwork` answers a present cover with `Cache-Control: private, max-age=604800, stale-while-revalidate=15552000`, fresh for seven days and drawn stale for 180 more while the client revalidates it, and a `404` with `private, max-age=600`, ten minutes. The long lifetime is what the one-URL-per-album design is for: a client holding a sleeve spends no request on it for a week, and after that draws the copy it holds at once while it asks, with the `ETag`, whether the cover changed. A cover replaced at the player reaches a client within a week; one that did not costs a `304`. The short one is what tells a client to look again: a cover dropped into an album's folder after the last ask is drawn within ten minutes, with no reload. `private` keeps both out of a cache that is not the client's own, since nothing here should be redistributed to another client through a shared cache.

    `GET /artwork/playing` and `GET /artwork/playlists/{id}/{row}` answer `Cache-Control: private, no-cache` on every outcome, present cover or refusal alike: the address names nothing durable, a track playing now or a position in a playlist, so the picture behind it changes without the URL changing and a lifetime would hand a client the wrong sleeve. `no-cache` asks a client to revalidate before it draws the copy it holds rather than forbidding the copy outright, so a client SHOULD still keep the bytes and send the `ETag` back as `If-None-Match`.

    The validator is strong, quoted and opaque, and it is a fold of the picture itself, so it moves when and only when the cover does. That catches the change nothing else can see: an image file sitting beside the music, replaced in place, alters no tag and no track and is announced to nobody. The player loads the cover to answer at all, so a `304` saves the transfer and the redraw rather than the work at the player.

    A cover is never compressed. These are already compressed formats, so there is no `Vary: Accept-Encoding` here and no coding suffix on the validator.

    ## Errors

    Every response with a status of 400 or above is `application/json` carrying at least an `error` string, including the unrouted `404` and the oversized `413` that cpp-httplib generates itself.

    Responses from `POST /tags` also carry `written: false`, except the `413`, which is refused before the route is reached. Branch on the status rather than on the presence of `written`.

  contact:
    name: foo_jean
    url: https://github.com/enrique-ramirez/foo_jean
  license:
    name: TBD

servers:
  - url: http://{host}:{port}/api
    description: The component. It also serves Jean itself, from the same origin.
    variables:
      host:
        default: 127.0.0.1
        description: The machine running foobar2000.
      port:
        default: "8881"
        description: Set by `port` in `<profile>/foo_jean/config.json`.

tags:
  - name: connection
    description: Finding the component and asking what it can do.
  - name: player
    description: |
      What the player is doing, polled rather than pushed.
  - name: tags
    description: Writing metadata to files the player already manages.
  - name: playlists
    description: |
      Autoplaylists, and which playlists are autoplaylists.
  - name: library
    description: |
      The player's media library, read in windows of rows by position, with the runs, values, credits and set questions that locate them.
  - name: queue
    description: |
      The play queue: read whole, refetched on its own revision, added to, reordered, trimmed one entry at a time, or emptied outright.
  - name: artwork
    description: |
      Cover art: one route addressed by a track the media library holds, one addressed by whatever is playing, and one addressed by a playlist and a position for a track that reaches neither.
  - name: stream
    description: |
      Listening to the player's own output. foobar2000 decodes and sequences; this carries the result to a browser.
  - name: sessions
    description: |
      Playback sessions: the player's own, and detached sessions that each play for themselves out of the same library.

paths:
  /status:
    get:
      tags: [connection]
      operationId: getStatus
      summary: Identify the component.
      description: |
        Tells "foo_jean is here" from "nothing is listening", for a script or a person checking this origin exists before asking it anything else.

        It reports nothing a port scan would not. The field allowlist is absent from it; ask `GET /capabilities` for it.
      responses:
        "200":
          description: The component is listening.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
              examples:
                default:
                  value:
                    name: foo_jean
                    version: 0.5.0
                    apiVersion: 1

  /capabilities:
    get:
      tags: [connection]
      operationId: getCapabilities
      summary: What this install permits, and what does not change while it runs.
      description: |
        The write allowlist, the streaming and autoplaylist limits, what this install permits, and the player's own name, version and volume range. A client reads this once and draws the player from it; none of it rides `GET /state`. A client SHOULD render controls for the fields named here and nothing else, rather than being configured with its own copy of the list.
      responses:
        "200":
          description: What may be written, and what a client needs to draw the player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
              examples:
                defaultInstall:
                  summary: The default install.
                  value:
                    apiVersion: 1
                    allowedFields: ["rating", "unsynced lyrics"]
                    canWrite: true
                    canWritePlaylists: true
                    canControlPlayback: true
                    canChangeOutput: true
                    maxAutoPlaylists: 100
                    canCreateAutoPlaylists: true
                    canStream: true
                    streamFormats: ["opus", "aac"]
                    canMuteWhileStreaming: true
                    canReadLibrary: true
                    playerName: foobar2000
                    playerVersion: 2.25.3
                    volumeMin: -100
                    volumeMax: 0
                    volumeUnit: db
                writesDisabled:
                  summary: allowedFields emptied, writePlaylists and changeOutput both turned off, and maxAutoPlaylists zeroed in config.json.
                  value:
                    apiVersion: 1
                    allowedFields: []
                    canWrite: false
                    canWritePlaylists: false
                    canControlPlayback: true
                    canChangeOutput: false
                    maxAutoPlaylists: 0
                    canCreateAutoPlaylists: false
                    canStream: true
                    streamFormats: ["opus", "aac"]
                    canMuteWhileStreaming: true
                    canReadLibrary: true
                    playerName: foobar2000
                    playerVersion: 2.25.3
                    volumeMin: -100
                    volumeMax: 0
                    volumeUnit: db

  /tags:
    post:
      tags: [tags]
      operationId: writeTags
      summary: Write metadata to one track.
      description: |
        The player performs the write, through `metadb_io_v2`, so foobar2000's own database is current when this returns and the next read of the value, through this API or any other, sees the new one.

        The track is named by exactly one of three addresses, and never by a filesystem path. The library form is `track` with `subsong`, the library-relative key `GET /artwork?track=` takes, resolved against the media library snapshot. The ordinal form is `ordinal` with `structure`, a position in that snapshot, which names one track where a relative path can name two. The playlist form is `playlist`, `index` and `structure`, one row of a playlist by position. Sending none of them, sending two, or sending a field of any with the wrong type is a `400`, the rule `POST /playlists/{id}/items` applies to `runs`, `bitset` and `ordinals`.

        **A client holding a row's `libraryPath` SHOULD send the library form, playlist row or not.** A relative path survives a reorder, a rebuild and a restart, and a position survives none of them, so the playlist form is what a row the media library does not hold falls back to.

        Three conditions must hold, and they fail with different statuses:

        1. Every field is on the allowlist (`403`). Names are compared case-insensitively.
        2. The request carries exactly one address (`400`).
        3. Something holds a track at it (`404`): the snapshot, at that relative path and subsong, or that playlist, at that position. An `ordinal` the snapshot does not hold answers `409` instead, for the reason below.

        The first two are decided before the player is involved.

        **Three conditions answer a `409`, and nothing is written for any of them.** A `structure` that is no longer that playlist's current one, checked before the handle is read so that a write aimed at one row never lands on another. An ordinal form that resolves to nothing, which is a `structure` a rebuild has moved, an ordinal past the end of the snapshot at the generation named, or a component that has built no snapshot at all. And a `track` address the snapshot holds more than one track at, which two media library roots holding one relative path produce: the component refuses rather than pick one, and a client SHOULD retry once with the `ordinal` it read that row at. The error string tells the three apart.

        Only the named fields are touched; everything else in the file is left alone. An empty string removes a field rather than setting it to empty, which is how a rating is cleared rather than set to `"0"`.

        Writes are not batched. One track per request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagWriteRequest" }
            examples:
              setRating:
                summary: Rate a track the media library holds four stars.
                value:
                  track: "Fictional Artist/Imaginary Album/01 Track.flac"
                  fields: { rating: "4" }
              clearRating:
                summary: Remove the rating tag entirely.
                value:
                  track: "Fictional Artist/Imaginary Album/01 Track.flac"
                  fields: { rating: "" }
              subsong:
                summary: One track inside a cue sheet or disc image.
                value:
                  track: "Fictional Artist/Imaginary Album/disc.flac"
                  subsong: 3
                  fields: { rating: "5" }
              ordinal:
                summary: The same track by its position in the media library snapshot, which is what a client retries an ambiguous address with.
                value:
                  ordinal: 1904
                  structure: 41
                  fields: { rating: "4" }
              playlistRow:
                summary: A row the media library does not hold, by position and the generation it was read at.
                value:
                  playlist: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                  index: 3
                  structure: "9204739866101318923"
                  fields: { rating: "4" }
      responses:
        "200":
          description: |
            Written, and foobar2000's database is current. The body echoes what was written, so a client that updated its own view optimistically can reconcile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagWritten" }
              examples:
                library:
                  summary: The address as it was sent, and the values as they were written.
                  value:
                    written: true
                    track: "Fictional Artist/Imaginary Album/01 Track.flac"
                    subsong: 0
                    fields: { rating: "4" }
                ordinal:
                  summary: An ordinal comes back alone, naming a subsong already.
                  value:
                    written: true
                    ordinal: 1904
                    fields: { rating: "4" }
                playlist:
                  value:
                    written: true
                    playlist: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                    index: 3
                    fields: { rating: "4" }
        "400":
          description: |
            The request is malformed, carries no address or carries two, carries a field of one of them with the wrong type, or has nothing to write. Retrying it unchanged will not help.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagRefused" }
              examples:
                bothAddresses:
                  summary: Two addresses, refused rather than one of them preferred.
                  value:
                    written: false
                    error: unacceptable address
                    detail: "a request names one of 'track', 'ordinal' and 'playlist', never two"
                caseCollision:
                  summary: Two spellings of one tag, refused rather than guessed at.
                  value:
                    written: false
                    error: malformed request
                    detail: "'rating' is named twice, differing only in case"
        "403":
          description: |
            The field is not on this install's allowlist. A `403` rather than a `400` because the request was understood and retrying it unchanged will never work. `field` names the offending field, and a client SHOULD stop offering that control.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagRefused" }
              examples:
                notAllowed:
                  value:
                    written: false
                    error: field not allowed
                    detail: artist
                    field: artist
        "404":
          description: |
            Nothing holds a track at that address: the snapshot carries no track at that relative path and subsong, or the playlist does not exist, or `index` is at or past its end. Nothing was written. An `ordinal` the snapshot does not hold is the `409` rather than this.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
              examples:
                unknown:
                  value: { written: false, error: foobar2000 does not know that track }
        "409":
          description: |
            The address no longer names what the client read it at, and nothing was written. The error string says which of three, and each has its own remedy.

            The `structure` the playlist form named is no longer that playlist's current one, so the row at `index` may be another track: read the playlist's rows again from the generation `GET /playlists` now reports, and send the position that names.

            The ordinal form resolved to nothing, for one of three reasons the component cannot tell apart. The `structure` it named is no longer the media library's, so every ordinal held against it names another track. Or the snapshot at that generation holds no ordinal that high. Or no snapshot is built, which is where a component sits between starting and its first one. One resolver serves the ordinal here and the ones `POST /playlists/{id}/items` and the queue routes take, and it reports all three as a miss, so the error string names the rebuild alone. Read the library's state again and send an ordinal resolved against the `structure` it reports; where the `structure` sent is already the one `GET /state` reports, the ordinal itself was wrong and reading again will not help.

            The `track` address names a track under more than one media library root, so nothing about it says which was meant: send the `ordinal` the row was read at instead. A client SHOULD retry once, and on this refusal only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
              examples:
                restructured:
                  value:
                    written: false
                    error: "the playlist's rows were added, removed or reordered; read them again"
                rebuilt:
                  value:
                    written: false
                    error: the media library was rebuilt; read the state and ask again
                ambiguous:
                  value:
                    written: false
                    error: the media library holds more than one track at that address
        "413":
          description: |
            The body exceeds 256 KB and was refused before it was parsed. The component answers and closes while the rest of the body may still be in flight, so a client sending something very large may see a dropped connection instead of this response. Both mean refused.

            The one response from `POST /tags` that does not carry `written`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429":
          description: |
            Tag writes are arriving faster than this component will make them: a burst of 200, refilling one every 50 milliseconds, one budget however many clients are writing. Rating a whole album or a box set one track after another never meets it; a client stuck in a loop does. A request refused for what it asks is refused for that first and spends nothing. Nothing was written. `Retry-After` is sent in seconds.
          headers:
            Retry-After:
              schema: { type: string }
              description: Seconds to wait.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
              examples:
                tooFast:
                  value: { written: false, error: too many tag writes }
        "500":
          description: The player could not write the tags. No reason is given, because error text leaks filesystem paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
        "503":
          description: Tag writing is unavailable in this build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }
        "504":
          description: |
            The player did not finish within 30 seconds. The write MAY still complete afterwards, so a client MUST re-read the value rather than assume it did not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFailed" }

  /playlists:
    get:
      tags: [playlists]
      operationId: getPlaylists
      summary: Every playlist the player holds.
      description: |
        One entry per playlist, in playlist order: the GUID every route here addresses a playlist by, its title, how many rows it holds, whether it is an autoplaylist, the role where this component keeps the playlist for a purpose of its own, and the two numbers that say whether rows a client already holds are still current.

        ### The two numbers

        `structure` moves when a playlist's rows are added, removed, reordered or replaced, so rows held against an older one sit at positions that have moved. `revision` moves when a row already in the playlist would answer differently, a tag, a rating or a play count, and the rows stay where they are.

        Both are counters kept for as long as this component runs rather than anything the player stores, and both are seeded so that no value either has published comes back after a restart, so a client holding a pair from an earlier run reads the playlist again.

        **Both travel as strings of decimal digits, and a client MUST NOT read either as a number.** That seeding puts them far above 2^53, and a JSON number is an IEEE 754 double, exact only that far: parsed as a number, four consecutive generations round to one value and a structural edit becomes invisible to the client that was watching for it. Compare a pair for equality, hand it back as it arrived, and never order, count or do arithmetic on one. Every other counter this API publishes is inside 2^53 and is a number.
      responses:
        "200":
          description: One entry per playlist.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [playlists]
                properties:
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist at the end of the player's list, holding a set or nothing.
      description: |
        An ordinary playlist, not an autoplaylist: nothing keeps it filled and `POST /autoplaylists` is what makes one that does. It lands last in the player's own list and carries `title` exactly as somebody looking at foobar2000 will read it.

        The set is optional and is the fill's own: `runs`, `bitset` or `ordinals` resolved against a `structure` for media library tracks, exactly as `POST /playlists/{id}/items` reads them, or `source` and `runs` for the rows of a playlist that already exists. A body naming neither creates the playlist holding nothing, and needs no media library to do it.

        **The playlist is created and filled in one operation of the player's.** A client saving a set as a playlist sends this one request: there is no window in which the playlist exists empty, and nothing here has to be followed by a fill.

        Refused with `403` under the read-only-playlists setting: the playlist it makes would hold the user's music.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlaylistRequest" }
            examples:
              empty:
                summary: A playlist holding nothing, which is what the sidebar's own *New playlist* sends.
                value: { title: "Road trip" }
              libraryRows:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { title: "Road trip", structure: 41, runs: [[0, 2], [9, 1]] }
              playlistRows:
                summary: Rows 1, 2 and 4 of a playlist that already exists.
                value:
                  title: "Road trip"
                  source: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                  runs: [[1, 2], [4, 1]]
      responses:
        "200":
          description: Created. The body is the annotation, as `GET /playlists` would report it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400":
          description: |
            The request was understood and declined: a body that is not JSON, a missing, empty, unprintable or over-long `title`, a `source` this component did not issue, a set that is not exactly one of `runs`, `bitset` and `ordinals`, one naming an ordinal outside the library while its `structure` is still the current one, a `source` row past the end of that playlist, or a `source` selection resolving to more than 1,500,000 rows, an engineered ceiling on what one request may resolve to, set far above any selection made in a playlist view; the real playlist length is checked again once the player has answered. The schemas below tell the last of those from the rest.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/WritesDisabled" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/StructureMoved" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503":
          description: |
            A set of media library tracks arrived and this install either does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or has built no snapshot yet to resolve it against. A create carrying no such set is answered `503` only where the component cannot reach the player's playlists at all, which `PlaylistWritesUnavailable` describes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                off:
                  value: { error: the media library is not available }
                nothingYet:
                  value: { error: the library snapshot has not been built yet, detail: "" }
                noPlayer:
                  value: { error: playlist changes are not available }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists:
    post:
      tags: [playlists]
      operationId: createAutoPlaylist
      summary: Create an autoplaylist.
      description: |
        Creates a playlist and hands it to foobar2000's own autoplaylist client, so the core keeps it filled and keeps it after this component is uninstalled.

        An autoplaylist filters the Media Library and nothing else. On an install with no Media Library configured every autoplaylist is empty and nothing in the player says why. Call `POST /autoplaylists/preview` first and read its `libraryEnabled`.

        The playlist is real and visible in foobar2000's own playlist tabs, so `title` is what somebody looking at the player will read. Nothing in this API parses it, no prefix is required or implied, and the user may rename it freely. What a title means -- whether a playlist is a client's own plumbing or the user's music -- is the client's to decide and the client's to encode.

        Existing playlists are never converted. There is no route that turns an existing playlist into an autoplaylist, because the core replaces the contents of a playlist when it takes one over.

        Refused with `403` under the read-only-playlists setting: every playlist this creates would hold the user's music, and the setting refuses every write but the component's own scratch playlist.

        `maxAutoPlaylists` caps this route and no other: at the cap it is a `409`, and at `0` a `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoPlaylistRequest" }
            examples:
              keyed:
                summary: Tagged with a key the client recognises later, so it can find its own again.
                value:
                  title: "Rock"
                  key: "folder:genre:Rock"
                  query: "%genre% IS Rock"
              sorted:
                summary: Kept in order by the core, which also stops the user reordering it by hand.
                value:
                  title: "Recently Added"
                  query: "%added% DURING LAST 4 WEEKS"
                  sort: "%added%"
                  forceSort: true
      responses:
        "200":
          description: Created. The body is the annotation, as `GET /playlists` would report it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/WritesDisabled" }
        "409": { $ref: "#/components/responses/PlaylistConflict" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists/preview:
    post:
      tags: [playlists]
      operationId: previewQuery
      summary: Try a query without creating anything.
      description: |
        Compiles the query with foobar2000's own parser and counts what it matches in the Media Library. Nothing is created and nothing changes.

        A query that does not parse is a `200` here, carrying `valid: false` and the player's own message. This is the route a client calls while somebody is typing, so an unreadable query is data rather than an error. Creating with the same query is a `400`.

        With `rows: true` the answer also names the matching tracks, as media library ordinals, counted in the generation `structure` names: the value `GET /state`'s `library.structure` reports. A client whose library snapshot is at another `structure` cannot read the ordinals against it, and asks again once it has caught up. A match the component's snapshot does not hold is left out, so `ordinals` can be shorter than `matches`. Without `rows` the answer carries neither field.

        A client SHOULD debounce this: it runs on foobar2000's main thread, and one request per keystroke is one main-thread callback per keystroke. A client SHOULD also read `libraryEnabled` — `matches: 0` with `libraryEnabled: false` means the install has no Media Library, and any autoplaylist created from the query will be empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 4096
                  description: |
                    foobar2000 query syntax. MUST NOT be empty: the player reads an empty query as matching everything.
                rows:
                  type: boolean
                  default: false
                  description: |
                    Also answer which tracks match: `structure` and `ordinals` on the answer. Without it the answer carries neither. The body grows with the library for a broad query, at up to a few bytes per matching track, so ask for it only when the rows are to be drawn.
            examples:
              default:
                value: { query: "%genre% IS Rock" }
              rows:
                summary: The same query, asking for the matching tracks.
                value: { query: "%genre% IS Rock", rows: true }
      responses:
        "200":
          description: The query was tried. Read `valid` before `matches`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryPreview" }
              examples:
                matched:
                  value: { valid: true, error: "", matches: 412, libraryEnabled: true }
                unreadable:
                  value:
                    valid: false
                    error: "Query syntax error"
                    matches: 0
                    libraryEnabled: true
                noLibrary:
                  summary: A valid query on an install with no Media Library.
                  value: { valid: true, error: "", matches: 0, libraryEnabled: false }
                withRows:
                  summary: A valid query asked for its matching tracks.
                  value:
                    valid: true
                    error: ""
                    matches: 3
                    libraryEnabled: true
                    structure: 41
                    ordinals: [12, 13, 407]
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/QueryPreviewedTooFast" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /autoplaylists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: updateAutoPlaylist
      summary: Point an autoplaylist at a different query.
      description: |
        Replaces the specification. `query`, `sort`, `key` and `forceSort` end up exactly as this request states them, so a client MUST send the whole record rather than only the parts being changed; omitting `key` clears it. The `managed` object from `GET /playlists` has that shape, so read-modify-write is the way to call this.

        `title` is the exception: omit it to leave the name alone. Resending a remembered title would undo a rename made in the player.

        The playlist itself is kept, and with it its id and its position in the player's list. Deleting and recreating changes both.

        Any autoplaylist can be updated, whoever made it. A playlist that is not an autoplaylist is a `409`, since taking it over would replace its rows with a query's results. A `403` answers when `writePlaylists` is `false`, checked first, and for this component's own scratch playlist.

        Only an autoplaylist this component made is recorded: its `managed` carries the new specification, and it counts towards `maxAutoPlaylists`. Any other keeps `managed: null` after the update and spends nothing of the limit. A `key` on one of those is a `400`, since a key is how a client recognises a playlist this component made; an empty `key` is no key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoPlaylistRequest" }
            examples:
              requeried:
                summary: Change what it collects, leave what it is called.
                value: { query: "%genre% IS Jazz" }
      responses:
        "200":
          description: Updated. The body is the annotation as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAnnotation" }
        "400":
          description: |
            Declined before the player was involved, as any autoplaylist route does, or a `key` sent for an autoplaylist this component did not make, which only the player can tell.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/PlaylistRefusal" }
                  - { $ref: "#/components/schemas/PlaylistFailed" }
              examples:
                noQuery:
                  value: { error: unacceptable query, detail: "'query' is required" }
                keyRefused:
                  value: { error: unacceptable key, detail: a key names a playlist this component made }
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/AutoPlaylistConflict" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: |
            The player refused. If the new query compiles but the core then declines to attach it, the playlist is left as an ordinary playlist that this component still recognises as its own; sending the request again with a query the player accepts restores it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: removeAutoPlaylist
      summary: Delete an autoplaylist.
      description: |
        Removes the playlist and the autoplaylist client with it. Any autoplaylist can be deleted, whoever made it.

        A playlist that is not an autoplaylist is a `409`; it is deleted through `DELETE /playlists/{id}`. Another component's lock against removing the playlist is a `409` too, the one `DELETE /playlists/{id}` answers. A `403` answers when `writePlaylists` is `false`, checked first, and for this component's own scratch playlist.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed, id]
                properties:
                  removed: { type: boolean, const: true }
                  id: { type: string }
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/AutoPlaylistConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/own/{role}/items:
    parameters:
      - name: role
        in: path
        required: true
        description: |
          Which of the component's own playlists to fill. `scratch` is the only one: it is emptied first, so the insert leaves it holding only this request's rows. Not reached by the read-only-playlists setting: this is how this component works, not the user's music. A `role` other than `scratch` is a `400`.
        schema:
          type: string
          enum: [scratch]
        example: scratch
    post:
      tags: [playlists]
      operationId: fillOwnPlaylist
      summary: Insert library rows into one of the component's own playlists, making it first if it is not there.
      description: |
        Resolves `role` to a playlist through the component's own marker rather than through a title, so a playlist renamed at the player is still found and one somebody hand-titled to look like it is not adopted. Makes the playlist, carrying `title`, if the role has none yet.

        The set to insert is named by exactly one of `runs`, `bitset` and `ordinals`, resolved against the `structure` sent alongside it. Sending more than one, or none, is a `400`. `runs` and `bitset` are inserted in ascending ordinal order — neither can carry any other — and `ordinals` is inserted in exactly the order it is given, which is the form a client holding a click-ordered set, such as a multi-select or a queue, MUST use to keep that order.

        The read-only-playlists setting never refuses this operation: it protects a user's own playlists, and neither of the component's own holds any. `controlPlayback` does: playing a set through the scratch is the player's own session's playback, and this is refused with a `403` while it is off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FillOwnPlaylistRequest" }
            examples:
              runs:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { title: "Scratch", structure: 41, runs: [[0, 2], [9, 1]] }
              bitset:
                summary: The same three ordinals as a bitmap.
                value: { title: "Scratch", structure: 41, bitset: "AwI=" }
              ordinals:
                summary: The same three ordinals in click order, which only this form can carry.
                value: { title: "Scratch", structure: 41, ordinals: [9, 0, 1] }
      responses:
        "200":
          description: Inserted. `positions` names where each row landed, and `structure` the generation the target now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FillResult" }
              examples:
                default:
                  summary: Two rows inserted into the scratch playlist.
                  value:
                    playlistId: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                    structure: "9204739866101318924"
                    positions: [0, 1]
                    skipped: []
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "409": { $ref: "#/components/responses/FillConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/FillUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: emptyOwnPlaylist
      summary: Take every row out of one of the component's own playlists, keeping the playlist.
      description: |
        Removes every item rather than the playlist itself, the same choice a replacing fill of `scratch` makes: the playlist keeps its id, its position in the player's list and the marker that `role` resolves through, and deleting it would cost all three. The play queue plays no part in that and is not touched here; `DELETE /playlists/{id}` has what the player does with a queued entry whose playlist goes.

        Idempotent: a role with no playlist yet is not made one just to answer this, and reports success regardless, exactly as `DELETE /stream/hold` reports success whether or not there was a hold to release.

        The read-only-playlists setting never refuses this operation, for the reason it never refuses a fill of `scratch`: it holds none of the user's music. `controlPlayback` does, for the same reason it refuses the fill.
      responses:
        "204":
          description: Emptied, or already empty because there was nothing to empty.
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/PlaybackDisabled" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/OwnPlaylistsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: renamePlaylist
      summary: Retitle a playlist.
      description: |
        Any playlist, not only one this component made: `title` ends up exactly as somebody looking at foobar2000's own tabs will read it. The playlist keeps its `id`, its position, its rows and both its version numbers, none of which a title bears on.

        `title` is held to the same rule `POST /playlists` holds a new one to, because a title a client cannot create is one it cannot rename to either.

        Nothing comes back. The list a client draws comes from `GET /playlists`, which `GET /state`'s `playlistsRevision` tells it to read again.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where the `id` is one of this component's own playlists, and with `409` where another component has locked the playlist against a rename.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenamePlaylistRequest" }
            examples:
              renamed:
                summary: What the sidebar sends when somebody finishes typing over a playlist's name.
                value: { title: "Road trip" }
      responses:
        "204":
          description: Renamed.
        "400":
          description: |
            An id this component did not issue, a body that is not JSON, a field the schema does not declare, or a missing, empty, unprintable or over-long `title`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistRefusal" }
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistLocked" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistWritesUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    delete:
      tags: [playlists]
      operationId: removePlaylist
      summary: Delete a playlist.
      description: |
        Any playlist, an autoplaylist included. `DELETE /autoplaylists/{id}` refuses a plain playlist. The rows go with it; the files do not.

        **The play queue is not touched, and a client MUST NOT empty it first.** foobar2000 keeps a queued entry whose whole playlist is deleted rather than dropping it, and such an entry still plays when it reaches the head: plugins/fb2k/ARCHITECTURE.md, *Facts about the player*, has what the player does and what reading one carelessly costs. `GET /queue` answers those entries from their handles, so the queue a client draws afterwards is the queue the player will play.

        Nothing comes back.

        Refused with `403` under the read-only-playlists setting, with `403` whatever that setting says where the `id` is one of this component's own playlists, and with `409` where another component has locked the playlist against being deleted.
      responses:
        "204":
          description: Deleted.
        "400":
          description: An id this component did not issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistRefusal" }
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistLocked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistWritesUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/move:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    post:
      tags: [playlists]
      operationId: movePlaylist
      summary: Move a playlist to a position in the player's list.
      description: |
        `index` is where the playlist ends up, counting from zero, and every playlist it passes shifts by one to make room. It is a position in the list as it stands, so moving the first of three playlists to `2` puts it last; `3` is one past the end and a `400`.

        Nothing comes back, and the `index` each playlist now carries is read from `GET /playlists`. Every playlist between the two positions has one it did not have before, so a client holding the list MUST read it again rather than patching the one entry it moved.

        Refused with `403` under the read-only-playlists setting, and with `403` whatever that setting says where the `id` is one of this component's own playlists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovePlaylistRequest" }
            examples:
              toTheTop:
                summary: Make it the first playlist in the player's list.
                value: { index: 0 }
      responses:
        "204":
          description: Moved.
        "400":
          description: |
            An id this component did not issue, a body that is not JSON, an `index` missing or not a whole number in range, or one the player found past the end of its list. The schemas below tell the last of those from the rest.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistWritesUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    get:
      tags: [playlists]
      operationId: getPlaylistItems
      summary: A page of a playlist's rows, in the columns the client declares.
      description: |
        Every column is evaluated against the row's own handle, so a file dragged into a playlist from outside the media library draws like every other row. `libraryPath` is the library-relative path `GET /artwork?track=` takes, and it is `null` for exactly those rows the media library does not hold.

        The answer carries the playlist's whole `totalCount` alongside the page, and the `structure` and `revision` it was read at. Rows held against an older `structure` sit at positions that have moved and MUST be read again; a moved `revision` alone means the rows are where they were and their content is what changed.

        A `count` reaching past the end answers the rows that remain, and an `offset` at or past the end answers no rows at all. Both still carry `totalCount`, `structure` and `revision`, so a client wanting only those asks for a `count` of zero.

        **`cover`.** A request that names roles as query parameters beside the route's own, as `GET /library/summary` takes them, gets a `cover` on every row: the library-relative path `GET /artwork?track=` takes, of the cover track of the row's album, or `null` where the media library does not hold the row, where the declaration does not hold a role's expression, or where no snapshot is ready. A request naming no role gets no `cover` at all. The roles are the ones `GET /library/search` takes; a role that is unknown, empty or named twice is a `400` as it is there.

        Reads are budgeted per client, a burst of 30 refilling one every 100 milliseconds, with `GET /playlists/{id}/items/changes` in the same bucket.
      parameters:
        - name: offset
          in: query
          required: true
          description: The position of the first row to answer, counting from zero.
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
          example: 0
        - name: count
          in: query
          required: true
          description: How many rows to answer at most. Zero answers the counts and no rows.
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
          example: 100
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. Each row answers one value per column, in the order declared.

            Passed to foobar2000's title-formatting compiler untouched, under the same gate `POST /library/rows` puts on a declaration: at most 64, each 1 to 1024 printable characters, and no repeats.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
        - $ref: "#/components/parameters/RoleTrackNumber"
        - $ref: "#/components/parameters/RoleDiscNumber"
        - $ref: "#/components/parameters/RoleTitle"
        - $ref: "#/components/parameters/RoleArtist"
        - $ref: "#/components/parameters/RoleAlbum"
        - $ref: "#/components/parameters/RoleAlbumArtist"
        - $ref: "#/components/parameters/RoleDuration"
        - $ref: "#/components/parameters/RolePlayCount"
        - $ref: "#/components/parameters/RoleLastPlayed"
        - $ref: "#/components/parameters/RoleRating"
        - $ref: "#/components/parameters/RoleYear"
        - $ref: "#/components/parameters/RoleGenre"
        - $ref: "#/components/parameters/RoleCodec"
        - $ref: "#/components/parameters/RoleBitrate"
        - $ref: "#/components/parameters/RolePlayCountLocal"
        - $ref: "#/components/parameters/RoleLastPlayedLocal"
        - $ref: "#/components/parameters/RoleAdded"
        - $ref: "#/components/parameters/RoleArtists"
        - $ref: "#/components/parameters/RoleArtistIds"
        - $ref: "#/components/parameters/RoleAlbumArtists"
        - $ref: "#/components/parameters/RoleAlbumArtistIds"
        - $ref: "#/components/parameters/RoleArtistSort"
      responses:
        "200":
          description: The page, and the counts the whole playlist stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistPage" }
              examples:
                default:
                  summary: Two rows of a five-row playlist, the second of them outside the media library.
                  value:
                    structure: "9204739866101318923"
                    revision: "9204739866101318977"
                    totalCount: 5
                    items:
                      - columns: ["Imaginary Track", "Fictional Artist"]
                        libraryPath: "Fictional Artist/Imaginary Album/01 Track.flac"
                        subsong: 0
                      - columns: ["Dragged in", "Somebody Else"]
                        libraryPath: null
                        subsong: 0
        "400":
          description: |
            The request was understood and declined before the player was asked: an id this component did not issue, no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, the same column twice, or an `offset` or `count` that is missing, not a whole number or larger than 4294967295. The schemas below tell the column refusals from the other two.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LibraryRefusal"
                  - $ref: "#/components/schemas/PlaylistRefusal"
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "429": { $ref: "#/components/responses/PlaylistRowsReadTooFast" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }
    post:
      tags: [playlists]
      operationId: fillPlaylist
      summary: Insert library rows into a user's own playlist.
      description: |
        Always appends: nothing here empties the playlist first. A fill that replaces what it holds is `POST /playlists/own/scratch/items`, which only ever addresses the component's own.

        The set to insert is named by exactly one of `runs`, `bitset` and `ordinals`, resolved against the `structure` sent alongside it. Sending more than one, or none, is a `400`. `runs` and `bitset` are inserted in ascending ordinal order — neither can carry any other — and `ordinals` is inserted in exactly the order it is given, which is the form a client holding a click-ordered set, such as a multi-select, MUST use to keep that order.

        `duplicates: skip` leaves out every track the playlist already holds and names it in `skipped`. Where that is the whole set nothing is inserted, `positions` is empty and `structure` is the one the playlist already stood at.

        Refused with `403` under the read-only-playlists setting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FillPlaylistRequest" }
            examples:
              runs:
                summary: Ordinals 0, 1 and 9 of a 16-track library, as two runs.
                value: { structure: 41, runs: [[0, 2], [9, 1]] }
              bitset:
                summary: The same three ordinals as a bitmap.
                value: { structure: 41, bitset: "AwI=" }
              ordinals:
                summary: The same three ordinals in click order, which only this form can carry.
                value: { structure: 41, ordinals: [9, 0, 1] }
              skippingDuplicates:
                summary: The same three ordinals, leaving out any the playlist already holds.
                value: { structure: 41, ordinals: [9, 0, 1], duplicates: skip }
      responses:
        "200":
          description: Inserted. `positions` names where each row landed, and `structure` the generation the target now stands at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FillResult" }
              examples:
                default:
                  summary: Three rows appended to a playlist that held four.
                  value:
                    playlistId: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                    structure: "9204739866101318924"
                    positions: [4, 5, 6]
                    skipped: []
                skipped:
                  summary: Ordinals 9, 0 and 1 asked for with `duplicates` `skip`, of which the playlist already held ordinal 0.
                  value:
                    playlistId: "45837d74-fa4f-415c-bba9-bf2db8f0dc04"
                    structure: "9204739866101318924"
                    positions: [4, 5]
                    skipped: [0]
        "400": { $ref: "#/components/responses/PlaylistRefused" }
        "403": { $ref: "#/components/responses/OwnPlaylistAddressed" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/FillConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/FillUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/items/changes:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    get:
      tags: [playlists]
      operationId: getPlaylistItemChanges
      summary: The rows of a playlist whose content moved since a revision.
      description: |
        The patch between the `revision` a client holds for one playlist and the current one. It carries only the rows whose content would answer differently, each at the position it sits at, so a client patches what it holds rather than reading the page again.

        A row here does **not** come in the shape `GET /playlists/{id}/items` answers a row in. The values are lifted out into one dictionary per column, distinct within this response, and each row carries one id into each dictionary. `PlaylistChanges` has why and how to read it.

        Call this when `GET /state`'s `playlistsRevision` has moved and `GET /playlists` reports the same `structure` and a different `revision` for this playlist. A different `structure` is a `409`: rows were added, removed or reordered, so every position the client holds names something else.

        `structure` and `revision` are strings of decimal digits here as everywhere, and a client compares them for equality rather than for order. `PlaylistAnnotation.structure` has why. This component is the one side that reads them as numbers, and it is where the window is judged.

        A revision nothing has changed since is a `200` carrying no rows, never an error.

        **`cover`.** A request that names roles as query parameters beside the route's own, as `GET /library/summary` takes them, gets a `cover` on every changed row: the library-relative path `GET /artwork?track=` takes, of the cover track of the row's album, or `null` where the media library does not hold the row, where the declaration does not hold a role's expression, or where no snapshot is ready. A request naming no role gets no `cover` at all. The roles are the ones `GET /library/search` takes; a role that is unknown, empty or named twice is a `400` as it is there.

        Reads are budgeted with `GET /playlists/{id}/items`, in one bucket per client.

        The component keeps a bounded window of which positions changed at each revision and drops a playlist's window when its `structure` moves. Falling behind that window is a `410`. Both refusals have the same remedy, and it is this playlist's page.
      parameters:
        - name: structure
          in: query
          required: true
          description: |
            The `structure` generation the client's positions were read at, from the page or the delta it holds. Required rather than defaulted to the current one: a client patching by position always knows which generation its positions belong to, and a request that does not name one cannot be told from a stale one.

            A run of decimal digits, sent exactly as it arrived. It is a 64-bit counter for the reason `PlaylistAnnotation.structure` gives, so a client that holds it as a number sends a neighbour of the value it meant and is refused. Anything but digits is a `400`. This is not the `structure` a fill sends, which names the media library's generation and is a number.
          schema: { type: string, pattern: "^[0-9]+$" }
          example: "9204739866101318923"
        - name: since
          in: query
          required: true
          description: |
            The `revision` the client currently holds for this playlist, as a run of decimal digits, on the same terms as `structure` above. Unlike the media library's `revision`, which is a number, this one is a playlist's own.
          schema: { type: string, pattern: "^[0-9]+$" }
          example: "9204739866101318976"
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, on the same terms as `GET /playlists/{id}/items`: repeated once per column, never comma-separated, at most 64, each 1 to 1024 printable characters, and no repeats. Send the set the held page was read with, or the patched rows will carry different values from the rows around them.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
        - $ref: "#/components/parameters/RoleTrackNumber"
        - $ref: "#/components/parameters/RoleDiscNumber"
        - $ref: "#/components/parameters/RoleTitle"
        - $ref: "#/components/parameters/RoleArtist"
        - $ref: "#/components/parameters/RoleAlbum"
        - $ref: "#/components/parameters/RoleAlbumArtist"
        - $ref: "#/components/parameters/RoleDuration"
        - $ref: "#/components/parameters/RolePlayCount"
        - $ref: "#/components/parameters/RoleLastPlayed"
        - $ref: "#/components/parameters/RoleRating"
        - $ref: "#/components/parameters/RoleYear"
        - $ref: "#/components/parameters/RoleGenre"
        - $ref: "#/components/parameters/RoleCodec"
        - $ref: "#/components/parameters/RoleBitrate"
        - $ref: "#/components/parameters/RolePlayCountLocal"
        - $ref: "#/components/parameters/RoleLastPlayedLocal"
        - $ref: "#/components/parameters/RoleAdded"
        - $ref: "#/components/parameters/RoleArtists"
        - $ref: "#/components/parameters/RoleArtistIds"
        - $ref: "#/components/parameters/RoleAlbumArtists"
        - $ref: "#/components/parameters/RoleAlbumArtistIds"
        - $ref: "#/components/parameters/RoleArtistSort"
      responses:
        "200":
          description: The rows that moved, and the revision they bring the client up to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistChanges" }
              examples:
                default:
                  summary: |
                    Three rows retagged since the revision the request named, one of them outside the media library. They were asked for as `%title%` and `%album artist%`, and two of the three share an artist, so that artist is carried once.
                  value:
                    revision: "9204739866101318977"
                    columns:
                      - text: ["Imaginary Track", "Another Track", "Dragged in"]
                        ids: [0, 1, 2]
                      - text: ["Fictional Artist", "Somebody Else"]
                        ids: [0, 0, 1]
                    items:
                      - position: 1
                        libraryPath: "Fictional Artist/Imaginary Album/02 Track.flac"
                        subsong: 0
                      - position: 4
                        libraryPath: "Fictional Artist/Imaginary Album/05 Track.flac"
                        subsong: 0
                      - position: 7
                        libraryPath: null
                        subsong: 0
                caughtUp:
                  summary: Nothing has changed since the revision asked from.
                  value: { revision: "9204739866101318976", columns: [], items: [] }
        "400":
          description: |
            The request was understood and declined before the player was asked: an id this component did not issue, no `columns` at all or a set the column gate refuses, a missing `since`, or a `structure` or `since` that is not a run of decimal digits inside 64 bits. The schemas below tell the column and revision refusals from the other two.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LibraryRefusal"
                  - $ref: "#/components/schemas/PlaylistRefusal"
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistRowsMoved" }
        "410": { $ref: "#/components/responses/PlaylistRevisionGone" }
        "429": { $ref: "#/components/responses/PlaylistRowsReadTooFast" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistRowsUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/runs:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    get:
      tags: [playlists]
      operationId: getPlaylistRuns
      summary: How a playlist falls into album runs, and its header figures.
      description: |
        In one pass over every row of the playlist: its runs, by the rule `GET /library/runs` gives, each as its length; its highest play count; and the figures `GET /library/summary` draws a header from, over the playlist's rows. A row the media library holds is read from the snapshot, and any other row from its own handle, as `GET /playlists/{id}/items` evaluates it. The roles are the ones the four questions take.

        `structure` and `revision` are the playlist's own, strings of decimal digits for the reason `PlaylistAnnotation.structure` gives. The `ETag` is strong and names the content, so a `revision` that moved without changing a figure is answered `304`.

        **Refusals** are the library runs', in their order, with a budget of its own at the summary's depth and refill. `409` is a `structure` that is not the playlist's, or a role naming an expression the declaration does not hold.
      parameters:
        - name: structure
          in: query
          required: true
          description: |
            The playlist's `structure` the client holds, as a run of decimal digits sent exactly as it arrived, on the terms `GET /playlists/{id}/items/changes` gives.
          schema: { type: string, pattern: "^[0-9]+$" }
          example: "9204739866101318923"
        - $ref: "#/components/parameters/RoleTrackNumber"
        - $ref: "#/components/parameters/RoleDiscNumber"
        - $ref: "#/components/parameters/RoleTitle"
        - $ref: "#/components/parameters/RoleArtist"
        - $ref: "#/components/parameters/RoleAlbum"
        - $ref: "#/components/parameters/RoleAlbumArtist"
        - $ref: "#/components/parameters/RoleDuration"
        - $ref: "#/components/parameters/RolePlayCount"
        - $ref: "#/components/parameters/RoleLastPlayed"
        - $ref: "#/components/parameters/RoleRating"
        - $ref: "#/components/parameters/RoleYear"
        - $ref: "#/components/parameters/RoleGenre"
        - $ref: "#/components/parameters/RoleCodec"
        - $ref: "#/components/parameters/RoleBitrate"
        - $ref: "#/components/parameters/RolePlayCountLocal"
        - $ref: "#/components/parameters/RoleLastPlayedLocal"
        - $ref: "#/components/parameters/RoleAdded"
        - $ref: "#/components/parameters/RoleArtists"
        - $ref: "#/components/parameters/RoleArtistIds"
        - $ref: "#/components/parameters/RoleAlbumArtists"
        - $ref: "#/components/parameters/RoleAlbumArtistIds"
        - $ref: "#/components/parameters/RoleArtistSort"
      responses:
        "200":
          description: |
            The runs and figures. `Cache-Control` is `private, no-cache`, and `Content-Encoding` is `gzip` whenever the request offered it. See *Compression*.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`."
            Content-Encoding:
              schema: { type: string, enum: [gzip] }
              description: Present only when the request offered gzip. Absent means the bytes as they stand.
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistRuns" }
        "202": { $ref: "#/components/responses/LibraryNotReady" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/PlaylistReadRefused" }
        "404": { $ref: "#/components/responses/NoSuchPlaylist" }
        "409": { $ref: "#/components/responses/PlaylistReadConflict" }
        "429": { $ref: "#/components/responses/PlaylistRunsTooFast" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/PlaylistReadUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /playlists/{id}/find:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
    get:
      tags: [playlists]
      operationId: findInPlaylist
      summary: The positions of a playlist whose rows match what was typed.
      description: |
        The positions whose row matches `query` as `GET /library/search` matches a track: every folded word of the query is found in the row's title, artist, album artist, album or artist sort. A row the media library holds is matched on the folded text the component holds for the snapshot, and any other row on text folded from its own handle.

        `matched` is a set of positions in the playlist, ascending, at the playlist's `structure`. A query with no words matches every row of the playlist, and a client has no reason to send one. `structure` and `revision` are the playlist's own, as `GET /playlists/{id}/runs` has them.

        **Refusals** are the questions', with a budget of its own at their depth and refill. `query` is up to 1024 bytes of UTF-8. `409` is a `structure` that is not the playlist's, or a role naming an expression the declaration does not hold.
      parameters:
        - { name: query, in: query, required: true, description: "What was typed. Up to 1024 bytes as UTF-8, and it may be empty.", schema: { type: string } }
        - name: structure
          in: query
          required: true
          description: |
