            Content-Encoding:
              schema: { type: string, enum: [gzip] }
              description: Present only when the request offered gzip. Absent means the bytes as they stand.
            Vary:
              schema: { type: string }
              description: "`Accept-Encoding`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCredits" }
        "202": { $ref: "#/components/responses/LibraryNotReady" }
        "400": { $ref: "#/components/responses/LibraryRefused" }
        "409": { $ref: "#/components/responses/LibraryUndeclaredOrMoved" }
        "429": { $ref: "#/components/responses/LibraryQuestionsTooFast" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /library/refresh:
    post:
      tags: [library]
      operationId: refreshLibrary
      summary: Rebuild the snapshot from the player.
      description: |
        Asks foobar2000 to walk its media library again and patches the snapshot with the result: where the tracks and the columns are the same, `structure` holds and only the rows whose values changed move `revision`. This is the hand on the wheel behind the two automatic mechanisms, the player's own change notifications and the re-read of every track as it stops playing, and it is what recovers a value neither of those can see.

        It rebuilds the column set last declared through `POST /library/rows`, so it takes no body. On a component nothing has declared to since it started, it rebuilds the set already built, which is why a refresh cannot cost a client the snapshot it is using.

        Expensive: it re-queries and re-formats every track. Rate limited to a burst of three, refilling one every thirty seconds, which is what a person pressing a button needs and a looping client does not get.

        The answer is `202` rather than `200`. The rebuild may still be running, and the body carries the generations as they stand at the moment of the request, so a client watches `GET /state`'s `library.build` to clear and its generations for what moved, if anything did. It MUST NOT treat the answer as the finished rebuild.
      responses:
        "202":
          description: |
            The rebuild was asked for. The body is the `Library` object `GET /state` carries under `library`, as it stands now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "429": { $ref: "#/components/responses/LibraryRefreshedTooFast" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }

  /track/library:
    get:
      tags: [library]
      operationId: getLibraryTrack
      summary: One track's columns, addressed the way a cover is, or by its position.
      description: |
        The columns a client declares, evaluated against the one track the address names. The address is exactly one of two: `track` with `subsong`, `GET /artwork?track=`'s address word for word, or `ordinal` with `structure`, a position in the media library snapshot, resolved the way `POST /tags` resolves the same pair because it names one track where a relative path can name two. Sending both forms, or neither, is a `400`, and so is sending half of the ordinal form. The answer is the positional `columns` array `GET /playlists/{id}/items` gives a row.

        This is what reads one value back. The library arrives in windows read from a snapshot the player refreshes when it notices a change, which is not when the client is asking, so a client that has just written a tag and wants to know what landed has nothing else to ask. The ordinal form is what that read-back sends after a write the library form answered `409` for, or after a write retried by ordinal and then timed out.

        `libraryPath` is not echoed. The caller supplied the address, so the answer carries only what it did not already have.

        The player compiles and evaluates these columns itself, so a set the snapshot was never built with is answered here without rebuilding anything and without disturbing what the snapshot holds. It answers one track, and reading many this way costs a request and a job at the player each, where the snapshot costs neither.
      parameters:
        - name: track
          in: query
          required: false
          description: |
            The library form's address: the track's path relative to the media library root, forward-slashed on every platform: the snapshot's `directory` and `filename` for that row, concatenated, or a playlist row's `libraryPath`. Percent-encode it.

            At most 4096 printable characters. It is a lookup key rather than a path, so `..` in it is neither refused nor meaningful: it matches nothing. Required unless `ordinal` is sent, and sending both is a `400`.
          schema: { type: string, minLength: 1, maxLength: 4096 }
          example: Artist/Album/01 A Title.flac
        - name: subsong
          in: query
          required: false
          description: |
            Which track inside the file, for cue sheets and disc images: the number the player assigned it, never a position among the tracks at one path. Every subsong of one file shares a `track` address, so this is what tells them apart. Meaningful only with `track`; an ordinal already names a subsong.

            Omitted is read as `0`, which is an ordinary file. A cue sheet's subsongs number from 1, so omitting it for a file the player splits is a `404` rather than that file's first track. Send the `subsong` the row carries.
          schema: { type: integer, minimum: 0 }
          example: 0
        - name: ordinal
          in: query
          required: false
          description: |
            The precise form's address: the track's position in the media library snapshot `structure` names, as any route answering ordinals gives it. It names one track and one subsong, where a `track` address can name one under each of two media library roots.

            Requires `structure`; sending `track` as well is a `400`. A `structure` the player has moved past is a `409`; an ordinal past the end of the snapshot at that generation is the `404` an unknown address gets.
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
          example: 1904
        - name: structure
          in: query
          required: false
          description: |
            The media library's own generation the `ordinal` was read at: `library.structure` in `GET /state`, or the `structure` a rows body or an answer carried. Required with `ordinal`, and meaningless without it.
          schema: { type: integer, minimum: 0 }
          example: 41
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. The answer carries one value per column, in the order declared.

            Passed to foobar2000's title-formatting compiler untouched, under the same gate `POST /library/rows` puts on a declaration: at most 64, each 1 to 1024 printable characters, and no repeats.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: The track, in the columns the request declared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryTrack" }
              examples:
                default:
                  summary: A track asked for as `%title%` and `%artist%`.
                  value:
                    columns: ["Imaginary Track", "Fictional Artist"]
        "400":
          description: |
            The request was understood and declined before the player was asked: neither `track` nor `ordinal` (a `structure` sent alone answers as neither), both of them, a `track` longer than 4096 characters or carrying a control character, a `subsong` that is not a whole number, `ordinal` sent without `structure`, an `ordinal` that is not a whole number or is past what 32 bits hold, no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, or the same column twice. A `track` sent alongside a `structure` with no `ordinal` is the library form and `structure` is ignored, the way `POST /tags` also ignores it there: that is a `200`, not this. The schemas below tell the column refusals from the address ones. They are `anyOf` rather than the `oneOf` this document pairs schemas with elsewhere, because `Error` is open and a `LibraryRefusal` body satisfies both.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/LibraryRefusal"
                  - $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NoSuchLibraryTrack" }
        "409":
          description: |
            The address no longer names one definite track, and nothing was answered. The `error` string says which of two.

            An address given without an ordinal names a track under more than one media library root, so answering one of them would confirm a value that may belong to the other. The client asked this route to find out what a write did, so the wrong track's columns are worse than none. `POST /tags` refuses the same address in the same words, and a client that read the row from a rows body holds the `ordinal` that names one track instead.

            Or the `ordinal` form's `structure` is no longer the media library's current one, which is also the answer while no snapshot has been built at all: tracks were added or removed since the generation it names, so every ordinal read against it has shifted. Read `GET /state` again and send an ordinal resolved against the `structure` it reports. An ordinal past the end of that generation is the `404` an unknown address gets, not this.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistFailed" }
              examples:
                ambiguous:
                  value:
                    error: the media library holds more than one track at that address
                    detail: ""
                structureMoved:
                  value:
                    error: "tracks were added or removed; read the state and ask again"
                    detail: ""
        "429": { $ref: "#/components/responses/LibraryTrackReadTooFast" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /track/playing:
    get:
      tags: [player]
      operationId: getPlayingTrack
      summary: The playing track's columns, addressed by nothing.
      description: |
        The columns a client declares, evaluated against whatever the player is playing right now: no path, no index, no handle. `GET /artwork/playing` is why this exists beside `GET /track/library`, in the same words: there is no library-relative path to address a stream, a CD track or a file the library has never indexed by, so a client that wants a value from one of those has nothing else to ask.

        The request named no track, so the answer carries `path` and `subsong` beside `columns`, spelled and valued exactly as `GET /state`'s `player.path` and `player.subsong`. A client checks the two against the track it asked about before drawing anything the answer carries: an answer that lands after the next track started still names the track that was playing when this component read it, and never the one the client now cares about.

        The columns are evaluated through the player's own now-playing formatting rather than against the playing file's stored tags, so a station announcing a song answers the song.

        This route reads nothing from the media library snapshot. It answers while `library.ready` is false, and for a track the library holds no path for, and it never answers `503`, unlike every route under `/library/`, which does answer that status in the same window.

        A paused player is answered like a playing one; only a stopped player is a `404`.

        Unlike `GET /artwork/playing`, this route sets no `ETag` and never answers `304`: there is nothing held here to fold a validator from, so a conditional request would cost the same job at the player as a fresh one.

        Every response carries `Cache-Control: private, no-cache`, refusals included: the address names nothing durable, so what sits behind it changes without the URL changing.

        Naming a detached session answers the track that session is on, its columns evaluated against that track's stored tags, since the player is not the one playing it. The session is asked before the columns are judged, so a session this device may not see answers `404` whatever the columns say. A detached session's read spends the same budget the player's own does.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
        - name: columns
          in: query
          required: true
          description: |
            The columns to evaluate, repeated once per column: `?columns=%25title%25&columns=%25artist%25`. Never comma-separated, because a title-formatting expression may contain commas. The answer carries one value per column, in the order declared.

            Passed to foobar2000's title-formatting compiler untouched, under the same gate `GET /track/library` puts on a declaration: at most 64, each 1 to 1024 printable characters, and no repeats.
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 1024 }
            minItems: 1
            maxItems: 64
          style: form
          explode: true
      responses:
        "200":
          description: The playing track, in the columns the request declared, beside the identity of the track that answered.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`: revalidate on every request, since this URL names a different track once the player does."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayingTrackColumns" }
              examples:
                default:
                  summary: A track asked for as `%title%` and `%artist%`.
                  value:
                    path: 'C:\Music\Fictional Artist\Imaginary Album\01 Track.flac'
                    subsong: 0
                    columns: ["Imaginary Track", "Fictional Artist"]
        "400":
          description: |
            The request was understood and declined before the player was asked: no `columns` at all, more than 64 of them, one that is empty, longer than 1024 characters or carrying a control character, or the same column twice.
          headers:
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`, as on the `200`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryRefusal" }
              examples:
                noColumns:
                  value: { error: unacceptable column, detail: "'columns' is required" }
        "404": { $ref: "#/components/responses/NoTrackPlaying" }
        "429": { $ref: "#/components/responses/PlayingTrackReadTooFast" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /artwork:
    get:
      tags: [artwork]
      operationId: getArtwork
      summary: The front cover of a track the media library holds.
      description: |
        One picture, addressed by a track's library-relative path, revalidated rather than re-fetched. *Artwork* at the top of this document is the whole of it: how to address a cover, why every row of an album should point at one URL, and what the validator is computed from.

        The address is resolved against the snapshot already in memory, with no scan of the library and no walk of the filesystem. The cover itself is loaded on every request, a conditional one included, for the reason *Revalidating a cover* gives.
      parameters:
        - name: track
          in: query
          required: true
          description: |
            The track's path relative to the media library root, forward-slashed on every platform: the snapshot's `directory` and `filename` for that row, concatenated. Percent-encode it.

            At most 4096 printable characters. It is a lookup key rather than a path, so `..` in it is neither refused nor meaningful: it matches nothing.
          schema: { type: string, minLength: 1, maxLength: 4096 }
          example: Artist/Album/01 A Title.flac
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`private, max-age=604800, stale-while-revalidate=15552000`: this album's cover is fresh for seven days, drawn stale for 180 more while it is revalidated, and never in a cache but that client's."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/ArtworkNotModified" }
        "400": { $ref: "#/components/responses/ArtworkRefused" }
        "404": { $ref: "#/components/responses/NoArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }
        "503": { $ref: "#/components/responses/ArtworkUnavailable" }

  /artwork/playing:
    get:
      tags: [artwork]
      operationId: getPlayingArtwork
      summary: The front cover of whatever is playing.
      description: |
        One picture, addressed by nothing. *The playing cover* above is the whole of it: why it exists beside `GET /artwork`, what it resolves that the snapshot cannot, and why revalidating it costs no file access.

        Naming a detached session answers the cover of the track that session is on, read the way `GET /artwork` reads one, so a front cover in a format this component does not publish gives way to the picture in the track's own tags. It is read once for each track the session plays, on the first request after the track changes, and held until the track changes again, so a revalidation costs no file access here either; a track with no cover is held as having none. A detached session's request spends the same budget the player's own does.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the track does."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/RevalidatedArtworkNotModified" }
        "404": { $ref: "#/components/responses/NoPlayingArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }

  /artwork/playlists/{id}/{row}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
      - name: row
        in: path
        required: true
        description: The row's position in the playlist, `0` being the first.
        schema: { type: integer, minimum: 0, maximum: 4294967295 }
        example: 0
    get:
      tags: [artwork]
      operationId: getPlaylistRowArtwork
      summary: The front cover of a playlist row with no library-relative path.
      description: |
        The fallback for a row `GET /artwork` cannot address. *The positional fallback* above is the whole of it: why a playlist and a position stand in for a path, and why a row the media library does hold a path for is refused rather than answered.

        A query string carrying `track` is ignored: the client's whole say in this request is the playlist and the position, and the player resolves the handle behind them.
      responses:
        "200":
          description: |
            The cover, in the format the player stored it in.
          headers:
            ETag:
              schema: { type: string }
              description: Strong, quoted and opaque. Send it back as `If-None-Match`.
            Cache-Control:
              schema: { type: string }
              description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the row does."
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/RevalidatedArtworkNotModified" }
        "400":
          description: An `id` this component did not issue, or a `row` that is not a whole number or is larger than 4294967295.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistRefusal"
                  - $ref: "#/components/schemas/PlaylistFailed"
        "404": { $ref: "#/components/responses/NoPositionalArtwork" }
        "413": { $ref: "#/components/responses/ArtworkTooLarge" }
        "429": { $ref: "#/components/responses/ArtworkRequestedTooFast" }
        "500": { $ref: "#/components/responses/PlayerRefused" }
        "503": { $ref: "#/components/responses/ArtworkUnavailable" }
        "504": { $ref: "#/components/responses/PlayerTooSlow" }

  /stream/ticket:
    post:
      tags: [stream]
      operationId: issueStreamTicket
      summary: Get a short-lived credential for one stream connection.
      description: |
        An `<audio>` element cannot send a header at all, so the credential for `GET /stream` travels in the query string. That makes it a capability URL, and a short lifetime is what bounds it: a ticket expires in `expiresIn` seconds and grants nothing but the audio already being played.

        A ticket is not single-use. Safari's media element probes a source with a `Range: bytes=0-1` request before fetching it for real, so one playback start is two requests and a single-use ticket cannot serve Safari at all. A ticket is good until it expires or newer tickets push it out; `maxConcurrentStreams` bounds how many streams may be open at once.

        The component keeps a small bounded number of tickets outstanding, and minting one more than that pushes one out before its time. A device that mints more than it uses loses its own oldest first, and another device's only when it holds none of its own. The device is the body's `deviceId`; a request naming none counts with the other anonymous ones. A ticket pushed out answers `401` like one that expired, and a client that mints immediately before opening, as the next paragraph asks, is unlikely to meet it.

        A client SHOULD call this immediately before opening the stream rather than at page load, and MUST request a fresh ticket when reconnecting. Clients MUST NOT store a ticket or log it.

        This is also where a device says who it is, because it is the only part of opening a stream a client controls: an `<audio>` element sends no body and no header of its own. The identity rides the ticket to the connection it opens, so `GET /stream/listeners` can group sockets into devices. A request with no body is an anonymous listener rather than a refusal.

        Naming a detached session, the ticket opens that session's stream, and `GET /stream` reads no `session` of its own. The device is still read from the body and never from the query, so the body's device is the one a session answers. A ticket makes that device a member of a shared session, which it keeps once the session stops being shared, until both its grace as a controller and its listening linger have run out. An anonymous request may take a ticket for a shared session and listen to it, and is never a member. A private session this device is not a member of answers `404` and issues nothing, as does a request with no body naming one.

        Refused in this order: streaming switched off or not offered, whatever session is named; the body; then the session.
      parameters:
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIdentity" }
      responses:
        "200":
          description: A ticket, good until it expires or is pushed out by newer ones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTicket" }
              examples:
                issued:
                  value:
                    ticket: 8f14e45fceea167a5a36dedd4bea2543f14e45fceea167a5a36dedd4bea2543a
                    expiresIn: 120
        "400":
          description: A body that is not a JSON object, or a `deviceId` or `name` that is not short text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

  /stream/listeners:
    get:
      tags: [stream]
      operationId: getStreamListeners
      summary: Who is listening, and whether the player was silenced for them.
      description: |
        The audience, counted two ways at once. **Connections** are what cost a thread and what `maxConcurrentStreams` bounds. **Devices** are what a person reads, and one device is routinely two connections — Safari probes a source with `Range: bytes=0-1` before fetching it for real — or three across a reconnect. A client MUST count devices anywhere it says how many people are listening.

        This is a roster and not a set of targets. Audio cannot be sent to a device that is not already asking for it: starting playback in a browser needs a gesture on that browser, so there is nothing here for a client to press.

        Nothing in it names a network address or a user agent. A device is called what it called itself.

        Naming a detached session, `devices` are that session's own listeners. Whichever session is named, `connections` counts every session together, the player's own included, since one `maxConcurrentStreams` bounds them all, and `playerMuted` answers the player. So the player's own roster can hold fewer sockets than `connections` says while somebody listens to a detached session. A private session's roster answers its members alone, and `404` to any other device or to none.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The audience as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamListeners" }
              examples:
                twoDevices:
                  value:
                    devices:
                      - deviceId: 3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8
                        name: Android phone
                        format: opus
                        connections: 1
                        listeningFor: 412
                      - deviceId: 9d21b7f4-8c60-4e15-a3b2-77c1e0f5a9d3
                        name: null
                        format: aac
                        connections: 2
                        listeningFor: 18
                    connections: 3
                    maxConnections: 8
                    playerMuted: true
        "404": { $ref: "#/components/responses/NoSuchSession" }

  /stream/hold:
    delete:
      tags: [stream]
      operationId: releaseOutputHold
      summary: Ask for the player to be audible alongside the listeners.
      description: |
        While anybody is listening to the player's own session this component silences the player, so that choosing a device moves the sound rather than doubling it. This asks for both at once instead. A device listening to a detached session never silences the player, since it is not hearing what the player plays.

        The hold is the player's, whichever session a client is in. This route reads no `session`, so one sent with it is ignored, an id nobody issued included, and the answer is the one a request naming none gets.

        There is no route that *takes* the hold. A client says it wants both outputs; when they should be one is the component's to decide, and it decides again the moment everybody has stopped listening — the choice is scoped to the spell of listening it was made in, not to a connection, so a reconnect does not undo it and the next session does not inherit it.

        Clients SHOULD warn before offering this. The stream runs a second or two behind the player, which is fine a room apart and an echo in the same room; `GET /stream/timeline` is how a client can say by how much rather than hedging.

        Idempotent, and it says nothing about whether there was a hold to release: with nobody listening there is nothing to give back and nothing has gone wrong.
      responses:
        "204":
          description: Noted.
        "503":
          description: This install does not mute the player, so there is never a hold. `canMuteWhileStreaming` says so in advance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stream/leave:
    post:
      tags: [stream]
      operationId: leaveStream
      summary: Say that a device stopped listening on purpose.
      description: |
        A closed socket does not say why it closed. A handoff back to the player and a wireless dropout look identical from here, and they want opposite answers: the first should give the player its sound back at once, the second must not unmute into a gap the client is about to reconnect across. So a device that stopped deliberately says so, and everything else waits out the linger.

        Best effort, and never required. A client that crashes, a tab that closes and a request that fails all end the same way a moment later. Sent while the device still holds a connection, it is remembered, and that connection's close then leaves no linger; a reconnect first cancels it. It can only ever end its own linger — a `deviceId` nobody sent is not a way to unmute the player.

        It ends what it ends in the session named and in no other. Naming none or `engine`, that is the device's linger on the player's own session, and the player's session never ends. Naming a detached session, it is this device's linger there and its grace as a controller as well, so the device stops being a member, or, while it still holds a connection, stays listening and on the roster until that closes. A detached session whose last member leaves this way ends at once, its stream stopped before this answers. This is the one way a session ends before its grace runs out, and no request ends one for a device still in it. A shared session this device was never in answers `204` and ends nothing, and a session this device may not see answers `404` and ends nothing anywhere, the player's own session included. The device is read from the body, as `POST /stream/ticket` reads it, and never from the query.
      parameters:
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIdentity" }
      responses:
        "204":
          description: Noted, whether or not there was anything to end.
        "400":
          description: No `deviceId`, or a body that is not a JSON object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "415": { $ref: "#/components/responses/JsonRequired" }

  /stream/timeline:
    get:
      tags: [stream]
      operationId: getStreamTimeline
      summary: What is audible, in the stream's own clock.
      description: |
        The player's reported position is not what a listener is hearing: the stream runs a second or two behind it, so a progress bar or lyrics driven from `GET /state`'s `player.position` run ahead of the audio. This route is how a client corrects that.

        `audio.currentTime` counts rendered audio: it advances only as sound leaves the speaker. The only unknown is the stream time of the first sample the element played, and it is recoverable:

        ```js
        // once, when the element starts playing
        const connectedAt = performance.now();
        const { streamTime } = await (await fetch(base + "/stream/timeline", auth)).json();
        const anchor = streamTime - (performance.now() - connectedAt) / 1000;

        // any time after
        const audible = anchor + player.currentTime;
        const mark = marks.findLast(m => m.at <= audible);
        const position = mark ? mark.position + (audible - mark.at) : null;
        ```

        A client MUST re-anchor after every reconnect, because `currentTime` restarts. It MAY re-poll occasionally and re-derive `anchor` to shed clock drift, which is milliseconds over a few minutes.

        Browsers differ over whether `currentTime` starts at zero or at the stream's own granule position, which is a large number for a listener joining a long-running stream. Deriving `anchor` as above works either way, and a client can tell which it got from whether `anchor` came out near zero.

        Naming a detached session, this is that session's stream clock and its marks, which share nothing with the player's own.
      parameters:
        - $ref: "#/components/parameters/Session"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The stream clock, and where the last few tracks began.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTimeline" }
              examples:
                midTrack:
                  value:
                    streamTime: 491.46
                    marks:
                      - at: 402.1
                        path: 'C:\Music\Émile Fictif\Canción Inventada\06 Café Imaginario.mp3'
                        subsong: 0
                        position: 0
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

  /stream:
    get:
      tags: [stream]
      operationId: openStream
      summary: Listen to what foobar2000 is playing.
      description: |
        A single unbounded response carrying the player's own output: the same audio the speakers get, with its DSP chain and ReplayGain applied. There is no length, no `Range` and no seeking. Seeking means asking foobar2000 to seek, which moves every listener at once.

        The response is chunked and ends when the client disconnects, the component stops, or the listener falls too far behind to be sent contiguous audio. A client MUST reconnect rather than treat the end as a stop: a dropped connection is ordinary on a wireless network, and an `<audio>` element does not retry by itself.

        This route takes a ticket because an `<audio>` element cannot send a header at all: without one, anything that can address this origin, a cross-origin `<audio src>` included, could open a stream. Without a valid ticket it answers `401`.

        It plays the session its ticket was issued for and no other, and reads no `session` of its own: one beside the ticket is ignored. A detached session's stream is that session's audio, decoded for it alone, and its listeners never silence the player. Where the ticket's session has ended since the ticket was issued, this answers `404` and opens nothing. Every connection counts against one `maxConcurrentStreams`, whichever session it hears.

        Refused in this order: the ticket, streaming switched off, the format, the ticket's session, then the cap.
      parameters:
        - name: ticket
          in: query
          required: true
          description: From `POST /stream/ticket`. Valid until it expires or is pushed out by newer ones, not consumed by this request.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: |
            One of the `streamFormats` from `GET /capabilities`. Omit it to get the first, which is the best this install offers. A format the install does not encode is a `400` rather than a silent substitution.
          schema: { type: string }
          examples:
            safari: { value: aac }
      responses:
        "200":
          description: |
            Audio, until something ends it. `Cache-Control` is `no-store`, there is no
            `Content-Length`, and `Accept-Ranges` is `none` — a live stream has no length
            to take a range of, and a `Range` request is answered with the stream from the
            live edge like any other.
          content:
            audio/ogg:
              schema: { type: string, format: binary }
            audio/aac:
              schema: { type: string, format: binary }
        "400":
          description: A format this install does not encode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            No ticket, an unknown ticket, an expired one, or one pushed out by newer ones. All four answer identically, so a caller cannot sort guesses into wrong and too late.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "503": { $ref: "#/components/responses/StreamUnavailable" }

  /sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a detached session of this device's own.
      description: |
        A detached session plays out of the same library as the player and is heard through a stream of its own, without touching what the player is doing. It starts stopped, with nothing to play and nothing queued, in `inOrder`, and private: listed and answered only to its members, the creator first among them.

        **Private is a courtesy, not a security boundary.** Anything on the network can send another device's `deviceId`, so a private session is one other clients are not shown, and nothing more.

        The device is read from the body, as `POST /stream/ticket` reads it, and never from the query. Its `deviceId` and `name` are what the session's `createdBy` answers.

        `controlPlayback` does not govern this route: it governs the player's own session alone.

        A session is kept by its members: a device listening to it, one polling `GET /state` naming it with that device's `deviceId`, or one that took a ticket for it. A command naming it keeps nothing. A session nobody keeps is ended once its grace runs out, so a client that creates one and goes away leaves nothing behind for long.

        While `GET /capabilities` answers `canCreateSessions: false` this route answers `503 sessions are not available`, after the body is judged. With `maxSessions` detached sessions already kept it answers `503 too many sessions`, and a session ending frees its place. Turning streaming off refuses creating one, and ends none already kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIdentity" }
            examples:
              named:
                value: { deviceId: 3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8, name: Android phone }
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              examples:
                created:
                  value:
                    id: Wb3kqRf8TmZ2
                    kind: detached
                    shared: false
                    playback: stopped
                    title: null
                    artist: null
                    album: null
                    albumArtist: null
                    libraryPath: null
                    listeners: 0
                    playbackModes: [inOrder, repeatAll, repeatOne, random, shuffleTracks]
                    chainDropped: false
                    reports: []
                    createdBy: { deviceId: 3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8, name: Android phone }
        "400":
          description: |
            A body that is not a JSON object, a `deviceId` or `name` that is not text, either of them longer than 64 bytes as sent, or no `deviceId`. A `deviceId` that is absent, empty, only spaces and tabs, or holds an unprintable character counts as none, and so does a `deviceId` in the query. A `name` like that is not refused: the session's `createdBy.name` answers `null`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noDevice:
                  value: { error: "'deviceId' is required" }
        "415": { $ref: "#/components/responses/JsonRequired" }
        "503": { $ref: "#/components/responses/SessionsUnavailable" }
    get:
      tags: [sessions]
      operationId: listSessions
      summary: The sessions this device may see.
      description: |
        The player's own session first, always, then every detached session this device may see, in the order they were created: each one that is shared, and each private one it is a member of.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The sessions, the player's own first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sessions" }
              examples:
                engineOnly:
                  value:
                    sessions:
                      - id: engine
                        kind: engine
                        shared: true
                        playback: playing
                        title: Imaginary Track
                        artist: Fictional Artist
                        album: Imaginary Album
                        albumArtist: Fictional Artist
                        libraryPath: Fictional Artist/Imaginary Album/01 Imaginary Track.flac
                        listeners: 1
                        playbackModes: [inOrder, repeatAll, repeatOne, random, shuffleTracks, shuffleAlbums, shuffleFolders]
                        chainDropped: false
                        reports: []
                        createdBy: null

  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A session's `id`, `engine` for the player's own.
        schema: { type: string }
        example: engine
    get:
      tags: [sessions]
      operationId: getSession
      summary: One session.
      description: |
        The player's own session answers any device, or none. A detached session answers a device that may see it, and `404` to anybody else, in the same words and the same bytes as an id nobody issued, so a stranger cannot tell a private session from one that does not exist.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
    post:
      tags: [sessions]
      operationId: shareSession
      summary: Share a detached session, or stop sharing it.
      description: |
        A shared session is listed for every device, and any of them may control it, listen to it, or both. Stopping sharing unlists it for everybody but its members and disconnects nobody already listening.

        Any device that may see the session may change this, so a device that sees a shared session may share it or stop sharing it, and the request makes it a member. Sharing is not protection in either direction: a private session is a courtesy, not a security boundary.

        Refused in this order: the player's own session, whatever the device and the body; no `deviceId`; a session this device may not see, before its body is read; then a body without a boolean `shared`. `controlPlayback` does not govern this route.
      parameters:
        - name: deviceId
          in: query
          required: true
          description: The device asking. Required here, since only a device that may see the session may change it.
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareSessionRequest" }
            examples:
              share:
                value: { shared: true }
      responses:
        "200":
          description: The session as the change left it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: No `deviceId` in the query, or a body without a boolean `shared`. Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noDevice:
                  value: { error: "'deviceId' is required" }
                notBoolean:
                  value: { error: "'shared' must be true or false" }
        "404": { $ref: "#/components/responses/NoSuchSession" }
        "409":
          description: The player's own session is always shared, and nothing about it changes here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                engine:
                  value: { error: the engine session cannot be changed }
        "415": { $ref: "#/components/responses/JsonRequired" }

components:
  parameters:
    Session:
      name: session
      in: query
      required: false
      description: |
        The session the request is for: an `id` `GET /sessions` answers. No `session`, an empty one and `engine` are the same request, to the player's own session, and nothing else about it changes. A detached session this device may not see answers `404`, in the same bytes as an id nobody issued.

        `controlPlayback` governs the player's own session alone, and refuses nothing addressed to a detached one.
      schema: { type: string }
      example: engine

    DeviceId:
      name: deviceId
      in: query
      required: false
      description: |
        The device asking, as it names itself in `DeviceIdentity`. A private session answers only its members, and a request naming no device is from none of them. A `deviceId` longer than 64 bytes, or holding an unprintable character, reads as no device.
      schema: { type: string, maxLength: 64 }

    RoleTrackNumber:
      name: trackNumber
      in: query
      required: false
      description: "The declared expression that reads the track's number on its disc."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleDiscNumber:
      name: discNumber
      in: query
      required: false
      description: "The declared expression that reads the disc the track is on."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleTitle:
      name: title
      in: query
      required: false
      description: "The declared expression that reads the track's title."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleArtist:
      name: artist
      in: query
      required: false
      description: "The declared expression that reads the track's artist."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleAlbum:
      name: album
      in: query
      required: false
      description: "The declared expression that reads the album the track belongs to."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleAlbumArtist:
      name: albumArtist
      in: query
      required: false
      description: "The declared expression that reads the artist the album is credited to."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleDuration:
      name: duration
      in: query
      required: false
      description: "The declared expression that reads the track's length in seconds."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RolePlayCount:
      name: playCount
      in: query
      required: false
      description: "The declared expression that reads the track's play count from the scrobbling source."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleLastPlayed:
      name: lastPlayed
      in: query
      required: false
      description: "The declared expression that reads when the scrobbling source last saw the track played, as a timestamp."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleRating:
      name: rating
      in: query
      required: false
      description: "The declared expression that reads the track's rating."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleYear:
      name: year
      in: query
      required: false
      description: "The declared expression that reads the track's year."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleGenre:
      name: genre
      in: query
      required: false
      description: "The declared expression that reads the track's genres, separated by the unit separator (U+001F) where there are several."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleCodec:
      name: codec
      in: query
      required: false
      description: "The declared expression that reads the track's codec."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleBitrate:
      name: bitrate
      in: query
      required: false
      description: "The declared expression that reads the track's bitrate in kilobits per second."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RolePlayCountLocal:
      name: playCountLocal
      in: query
      required: false
      description: "The declared expression that reads the track's play count from the player's own counter."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleLastPlayedLocal:
      name: lastPlayedLocal
      in: query
      required: false
      description: "The declared expression that reads when the player's own counter last saw the track played, as a timestamp."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleAdded:
      name: added
      in: query
      required: false
      description: "The declared expression that reads when the track entered the library, as a timestamp."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleArtists:
      name: artists
      in: query
      required: false
      description: "The declared expression that reads every value of the track's `artists` tag, separated by the unit separator (U+001F) where there are several."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleArtistIds:
      name: artistIds
      in: query
      required: false
      description: "The declared expression that reads every value of the track's MusicBrainz artist id tag, separated by the unit separator (U+001F) where there are several."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleAlbumArtists:
      name: albumArtists
      in: query
      required: false
      description: "The declared expression that reads every value of the track's `albumartists` tag, separated by the unit separator (U+001F) where there are several."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleAlbumArtistIds:
      name: albumArtistIds
      in: query
      required: false
      description: "The declared expression that reads every value of the track's MusicBrainz album artist id tag, separated by the unit separator (U+001F) where there are several."
      schema: { $ref: "#/components/schemas/LibraryRole" }

    RoleArtistSort:
      name: artistSort
      in: query
      required: false
      description: "The declared expression that reads the artist's sort name, the plain spelling a tagger writes beside a stylised one."
      schema: { $ref: "#/components/schemas/LibraryRole" }

  responses:
    PlaylistRefused:
      description: |
        The request was understood and declined before the player was involved: a body that is not JSON, a missing or unusable `title`, `query`, `sort` or `key`, an id this component did not issue, or an ordinal set that is not exactly one of `runs`, `bitset` and `ordinals`, or that names an ordinal outside the library while its `structure` is still the current one. A `structure` that has moved is a `409` instead, whether the library grew or shrank.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistRefusal" }
          examples:
            noQuery:
              value: { error: unacceptable query, detail: "'query' is required" }
            queryTooLong:
              value: { error: unacceptable query, detail: "'query' must be printable text of at most 4096 characters" }
            notJson:
              value: { error: malformed request, detail: "could not parse it as JSON: [json.exception.parse_error.101] parse error at line 1, column 1: syntax error while parsing value - invalid literal; last read: 'n'" }
            twoForms:
              value: { error: unacceptable ordinal set, detail: "'runs' and 'bitset' were both present; send exactly one" }

    WritesDisabled:
      description: |
        This install has `writePlaylists` set to `false` in `config.json`. That is a player owner's own choice, made to keep every playlist but this component's own scratch playlist read-only; setting it back to `true` is what grants the write.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: this install has playlist writes turned off; turn on writePlaylists in config.json to allow them, detail: "" }

    OwnPlaylistAddressed:
      description: |
        The edit addresses one of this component's own playlists, found by the `role` a `PlaylistAnnotation` carries and never by its title. Jean plays a set through the scratch, so retitling, deleting, moving or changing the rows of one by `id` would take apart the playlist somebody is listening from. `POST /playlists/own/{role}/items` fills one and `DELETE /playlists/own/{role}/items` empties it; those two are the whole of what may change it, and `writePlaylists` being `true` buys nothing here.

        Reading is not addressing. Such a playlist stays a legal `source` for `POST /playlists/{id}/items/copy` and for `POST /playlists`, and its rows are readable as any other playlist's, which is what lets *Add to playlist* and *Save as playlist* work over results Jean played through the scratch.

        The same status also answers when `writePlaylists` is `false` in `config.json`, checked before the playlist is looked at. A client tells the two apart by `error`, which the examples below give both of.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            ownPlaylist:
              value: { error: that playlist is foo_jean's own; address it by its role rather than by its id, detail: "" }
            writesDisabled:
              value: { error: this install has playlist writes turned off; turn on writePlaylists in config.json to allow them, detail: "" }

    PlaybackDisabled:
      description: |
        This install has `controlPlayback` set to `false` in `config.json`, and the request is for the player's own session. That is a player owner's own choice, made to keep the player's transport, its queue and the component's own scratch playlist untouched from here; setting it back to `true` is what grants the write. Reading the state and the queue is unaffected, and nothing addressed to a detached session is refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: this install has playback control turned off; turn on controlPlayback in config.json to allow it, detail: "" }

    OutputChangeDisabled:
      description: |
        This install has `changeOutput` set to `false` in `config.json`. That is a player owner's own choice; setting it back to `true` is what grants the write. `GET /outputs` is unaffected either way, and so are the volume, the mute flag and every playback command, which follow `controlPlayback` instead for the player's own session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: this install has output device changes turned off; turn on changeOutput in config.json to allow them, detail: "" }

    OutputDeviceNotListed:
      description: |
        The `deviceId` sent is not one `GET /outputs` currently lists. The request is well formed and the player is the reason it cannot be met, the same reading `POST /playback/mode` already gives a mode this install does not offer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            default:
              value: { error: the player does not list that output device; read the outputs again, detail: "" }

    OutputsUnavailable:
      description: |
        The component could not reach the part of the player the output device list and the active device are read from.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: output devices are not available }

    NoSuchPlaylist:
      description: No playlist has that id. It may have been deleted in the player.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistConflict:
      description: |
        Another playlist already has that `key`, or this install is at `maxAutoPlaylists`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            keyInUse:
              value: { error: another playlist already has that key, detail: "folder:genre:Rock" }
            tooMany:
              value: { error: this install's autoplaylist limit is reached, detail: "this install allows 100 and already has 100" }

    AutoPlaylistConflict:
      description: |
        Nothing was changed, for one of three reasons the `error` string tells apart. The target is not an autoplaylist: taking a plain playlist over would replace its rows with a query's results, and `DELETE /playlists/{id}` is how a plain playlist goes. A playlist that carries this component's record is not refused, even where its client was lost. On `POST`, another playlist may already have the `key`. On `DELETE`, another component may have locked the playlist against removal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            notAnAutoPlaylist:
              value: { error: that playlist is not an autoplaylist, detail: "" }
            keyInUse:
              value: { error: another playlist already has that key, detail: "folder:genre:Rock" }
            locked:
              value: { error: another component has locked that playlist against that edit, detail: "" }

    StructureMoved:
      description: |
        The `structure` the request named is no longer the current one: tracks were added to or removed from the library, so every ordinal it carries has shifted and inserting them would land the wrong rows. The remedy is to read `library.structure` from `GET /state` and resolve the set against it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; read the state and ask again"
                detail: ""

    FillConflict:
      description: |
        The `structure` the request named is no longer the current one, or another component has locked the target playlist against having rows added. The `error` string distinguishes them. The remedy for the first is to read `library.structure` from `GET /state` and resolve the set against it. The second is released at the player, by whatever put it there, and nothing a client sends changes that.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; read the state and ask again"
                detail: ""
            locked:
              value:
                error: "another component has locked that playlist against that edit"
                detail: ""

    TooManyRequests:
      description: |
        Playlist changes or queue changes are arriving faster than this component will make them. The limit bounds how fast a client bug can flood the player with playlists or queue entries; it is not a security control.

        A burst of thirty is allowed, refilling at one a second, one budget shared across creating, renaming, moving and deleting a playlist, copying rows into one and removing them, and across queueing, moving, removing and clearing the queue. Reading is not limited, and a query preview spends a budget of its own. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistRefusal" }

    BodyTooLarge:
      description: |
        The body is larger than 256 KiB and was refused before it was parsed, the same ceiling and the same refusal `POST /tags` answers: one `set_payload_max_length` covers every route this component accepts a body on. No set a library view can produce needs to reach it — `bitset` costs about one byte per eight ordinals in the library whatever the set, which is the form to reach for once a scattered set would cost more as `runs`.

        The component answers and closes while the rest of the body may still be in flight, so a client sending something very large may see a dropped connection instead of this response. Both mean refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: request too large }

    JsonRequired:
      description: |
        The request did not carry `Content-Type: application/json`. Every `POST` needs it, one with no body included: a transport command, `POST /stream/ticket` for an anonymous listener and `POST /library/refresh` all send the header and nothing else. It is checked once admission has passed and before the route reads anything, so nothing about the request reached the player.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: send application/json }

    PlayerRefused:
      description: |
        The player refused. No reason is given, because error text leaks filesystem paths.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlayerTooSlow:
      description: |
        The player did not finish within 30 seconds. The work MAY still complete afterwards, so a client MUST re-read `GET /playlists` rather than assume it did not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistUnavailable:
      description: |
        Autoplaylists are not available in this install, either because the component could not reach that part of the player or, on `POST /autoplaylists` alone, because `maxAutoPlaylists` is `0` in `config.json`. `GET /capabilities` reports this in advance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaylistWritesUnavailable:
      description: |
        The component could not reach the part of the player a playlist is created, renamed, moved or deleted through. Unrelated to autoplaylists, whose own unavailability is `PlaylistUnavailable`: a request naming none should not send a player owner to `maxAutoPlaylists`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: playlist changes are not available }

    FillUnavailable:
      description: |
        Either this install does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or no snapshot has been built yet. Both mean there is nothing to resolve the set against. The third is a component that cannot reach the playlist it would fill, which names the component's own playlists on `POST /playlists/own/{role}/items` and playlist changes on `POST /playlists/{id}/items`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the media library is not available }
            nothingYet:
              value: { error: the library snapshot has not been built yet, detail: "" }
            noOwnPlaylists:
              value: { error: "the component's own playlists are not available" }
            noPlaylistWrites:
              value: { error: playlist changes are not available }

    PlaylistRowsMoved:
      description: |
        The `structure` the request named is no longer the playlist's current one: its rows were added, removed or reordered, so every position the client holds names a different track and patching one would draw the wrong row. Read the playlist's rows again, from the `structure` `GET /playlists` now reports.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            restructured:
              value:
                error: "the playlist's rows were added, removed or reordered; read them again"
                detail: ""

    PlaylistLocked:
      description: |
        Some other component has locked the playlist against this edit, and foobar2000 refuses it on that component's behalf. Nothing a client sends changes that: the lock is released at the player, by whatever put it there. A playlist reports its locks per edit, so one that refuses a rename may still take rows.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            locked:
              value:
                error: "another component has locked that playlist against that edit"
                detail: ""

    PlaylistRowsMovedOrLocked:
      description: |
        Either the `structure` the request named is no longer the playlist's current one, or another component has locked the playlist against having its rows reordered. The `error` string tells them apart, and nothing is changed in either case.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            restructured:
              value:
                error: "the playlist's rows were added, removed or reordered; read them again"
                detail: ""
            locked:
              value:
                error: "another component has locked that playlist against that edit"
                detail: ""

    PlaylistRevisionGone:
      description: |
        The revision asked to catch up from is outside the window this playlist retains, or it is ahead of the current one, which is what a client holding rows across a component restart sees. The remedy is the same as the `409`'s: read the playlist's rows again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }
          examples:
            gone:
              value:
                error: "that revision is not one this playlist can catch up from; read its rows again"
                detail: ""

    PlaylistRowsUnavailable:
      description: |
        The component could not reach the part of the player a playlist's rows are read from. Unrelated to autoplaylists, whose own unavailability is `PlaylistUnavailable`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the playlist's rows are not available }

    OwnPlaylistsUnavailable:
      description: |
        The component could not reach the playlist machinery its own scratch playlist depends on. Unrelated to autoplaylists, whose own unavailability is `PlaylistUnavailable`, and unrelated to the read-only-playlists setting, which never reaches this route.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the component's own playlists are not available }

    StreamUnavailable:
      description: |
        Either this install does not stream, because no encoder started or `streamingEnabled` is false, or it is already serving as many connections as `maxConcurrentStreams` allows, across every session together. The `error` string distinguishes them, and a client SHOULD present the second as busy and retry rather than as unsupported. `GET /capabilities` reports the first in advance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotModified:
      description: |
        The client already holds this representation. No body. `ETag` is repeated so a client can keep validating against it.

        cpp-httplib evaluates `If-None-Match` for static files alone, so these routes answer it themselves. The tag is strong, it is quoted, and `*` is accepted. It is not a hash of the bytes: it is the generations the representation was built from, plus the content coding it was sent in, and both of those move whenever the bytes do. A validator held from an identity answer therefore does not revalidate a gzipped one, which is deliberate.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`, as on the `200`."
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried, coding suffix and all.
        Vary:
          schema: { type: string }
          description: "`Accept-Encoding`."

    QueryPreviewedTooFast:
      description: |
        Query previews are arriving faster than this component will run them: a burst of 30, refilling one every 200 milliseconds, a budget apart from the one playlist changes spend. Each preview runs the query over the whole Media Library on foobar2000's main thread. Somebody typing into an editor that sends one per keystroke never meets it; a client stuck in a loop does. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistRefusal" }

    StatePolledTooFast:
      description: |
        Polls of `GET /state` are arriving faster than this component will answer them: a burst of 30, refilling one every 100 milliseconds, per source address. An ordinary poll on its own interval never meets this; a client stuck in a loop does.

        The refusal is decided before the document is built, so it carries no `ETag` and neither the `player` nor the `library` section. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    PlaybackUnavailable:
      description: |
        The component could not reach the part of the player these transport commands run through.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: playback commands are not available }

    PlaybackTooSlow:
      description: |
        The player did not finish within 30 seconds. The command MAY still land afterwards, so a client MUST read `GET /state` rather than assume it did not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistFailed" }

    PlaybackModeUnavailable:
      description: |
        `mode` is a `PlaybackMode` this API knows, but the order list of the session it is for does not carry it: this install's own, `GET /capabilities`'s `playbackModes`, for the player's own session, and the session's `playbackModes` for a detached one. The request is well formed and the player is the reason it cannot be met; nothing was changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notOffered:
              value: { error: this install does not offer that playback mode }

    VolumeUnavailable:
      description: |
        The component could not reach the part of the player the level and the mute flag are read from and written to.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: volume is not available }

    LibraryRefused:
      description: |
        The request was understood and declined before the snapshot was touched. On the routes that take roles as query parameters it is a role that is not one of the published names, one with an empty expression, one longer than 1024 characters or one carrying a control character, or one named twice in two spellings (`unacceptable role`, `duplicate role`). The four questions refuse the same roles in the same words, with the credit roles beside the summary's, and refuse a question parameter that is missing, empty where it may not be, not a whole number of 0 or more where it names a count, not `true` or `false` where it is a flag, named twice, or a `query` over 1024 bytes (`unacceptable question`, `duplicate question`). A parameter that is neither a role nor one the route owns is `unacceptable role`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryRefusal" }
          examples:
            notARole:
              value: { error: unacceptable role, detail: "'mood' is not a role" }
            repeatedRole:
              value: { error: duplicate role, detail: "role 'artist' is named twice" }
            noQuery:
              value: { error: unacceptable question, detail: "'query' is required" }
            longQuery:
              value: { error: unacceptable question, detail: "'query' must be at most 1024 bytes" }
            notACount:
              value: { error: unacceptable question, detail: "'limit' must be a whole number of 0 or more" }
            notAFlag:
              value: { error: unacceptable question, detail: "'splitsCredits' must be true or false" }
            repeatedName:
              value: { error: duplicate question, detail: "'name' is named twice" }

    LibraryNotReady:
      description: |
        No snapshot is ready, or the ready one was not built with a declared role's expression. The body is the `Library` object `GET /state` carries under `library`, as it stands now. No build was started: a client polls `GET /state` until the library is ready and asks again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Library" }

    LibraryUndeclared:
      description: |
        A role names an expression the declaration does not hold. The error names the expression, so a client declares again through `POST /library/rows`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            undeclared:
              value: { error: "'%album%' is not a declared column" }

    LibraryRefreshedTooFast:
      description: |
        Rebuilds are arriving faster than this component will make them: a burst of three, refilling one every thirty seconds, shared between `POST /library/refresh` and the builds a rows request declares. A rebuild re-queries and re-formats every track in the library, so this bounds what a looping client, or one varying the set it asks for, can do to the player.

        Asking again for a set already being built costs nothing here, so an ordinary client never meets this.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    LibraryUnavailable:
      description: |
        Either this install does not serve the media library at all, which `GET /capabilities` reports in advance as `canReadLibrary: false`, or a route that needs the snapshot was asked on a component with none yet.

        The `error` string tells them apart: `the media library is not available` is the first, `the library snapshot has not been built yet` the second. `POST /library/rows` and the questions answer the second case with a `202` instead, because there the client has just said what to build.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: the media library is not available }
            nothingYet:
              value: { error: the library snapshot has not been built yet, detail: "" }

    PlaylistReadRefused:
      description: |
        The request was understood and declined before the player was asked: the library's refusals of a declaration, a role or a question parameter (`LibraryRefused` lists them), or an `id` that is not a playlist GUID, which is a `PlaylistRefusal`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LibraryRefusal"
              - $ref: "#/components/schemas/PlaylistRefusal"
          examples:
            noStructure:
              value: { error: unacceptable question, detail: "'structure' is required" }
            badId:
              value: { error: unacceptable playlist id, detail: "" }

    PlaylistReadUnavailable:
      description: |
        Either this install does not serve the media library at all, or it cannot read a playlist's rows. The `error` string tells them apart: `the media library is not available` is the first, `the playlist's rows are not available` the second.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noLibrary:
              value: { error: the media library is not available }
            noRows:
              value: { error: the playlist's rows are not available }

    LibraryRowsRefused:
      description: |
        The request was understood and declined before the snapshot was touched. A declaration the column gate refuses is a `LibraryRefusal`; a `structure` that is missing, empty, a JSON number or not a string of decimal digits, a set naming both of `runs` and `ordinals` or neither, a malformed set, or a body that is not JSON, is a `PlaylistRefusal` on the terms `POST /playlists/{id}/items` has; and a set naming more than 4096 rows is a `LibraryRefusal` whose error is `too many rows asked for`. An ordinal past `trackCount` is judged last, against the generation held, and is a `PlaylistRefusal` too.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LibraryRefusal"
              - $ref: "#/components/schemas/PlaylistRefusal"
          examples:
            tooMany:
              value: { error: too many rows asked for, detail: "a request names at most 4096 rows" }
            bothForms:
              value: { error: unacceptable ordinal set, detail: "exactly one of 'runs' and 'ordinals' is required" }
            malformedStructure:
              value: { error: malformed request, detail: "'structure' must be a string of decimal digits" }

    LibraryStructureMoved:
      description: |
        The `structure` the request named is not the current one, so every ordinal it holds names a different track. The `error` is `tracks were added or removed; read the state and ask again`: read `GET /state` for the current one and ask again with ordinals resolved against it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryFailed" }
          examples:
            restructured:
              value:
                error: "tracks were added or removed; read the state and ask again"
                detail: ""

    LibraryUndeclaredOrMoved:
      description: |
        Either the `structure` the request named is not the current one (`LibraryStructureMoved`), or a role names an expression the declaration does not hold (`LibraryUndeclared`). The `error` string tells them apart.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LibraryFailed"
              - $ref: "#/components/schemas/Error"
          examples:
            restructured:
              value:
                error: "tracks were added or removed; read the state and ask again"
                detail: ""
            undeclared:
              value: { error: "'%album%' is not a declared column" }

    PlaylistReadConflict:
      description: |
        Either the `structure` the request named is not the playlist's current one (`PlaylistRowsMoved`), or a role names an expression the declaration does not hold (`LibraryUndeclared`). The `error` string tells them apart.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/PlaylistFailed"
              - $ref: "#/components/schemas/Error"
          examples:
            restructured:
              value:
                error: "the playlist's rows were added, removed or reordered; read them again"
                detail: ""
            undeclared:
              value: { error: "'%album%' is not a declared column" }

    LibraryRowsTooFast:
      description: |
        Rows are being asked for faster than this component will answer them: a burst of 30, refilling one every 100 milliseconds, per client, in a bucket of its own. A client scrolling a list asks for a window at a time and never meets it. A request refused for what it asks spends nothing. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many library row reads }

    LibraryRunsTooFast:
      description: |
        Library runs are being asked for faster than this component will answer them: a burst of 200, refilling one every 50 milliseconds, a budget of its own. A client asks once per `structure` it sees move and never meets it. A request refused for what it asks spends nothing. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many library run reads }

    PlaylistRunsTooFast:
      description: |
        Playlist runs are being asked for faster than this component will answer them: a burst of 200, refilling one every 50 milliseconds, a budget of its own. A request refused for what it asks spends nothing. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many playlist run reads }

    PlaylistSearchedTooFast:
      description: |
        Playlist searches are arriving faster than this component will answer them: a burst of 200, refilling one every 50 milliseconds, a budget of its own. A request refused for what it asks spends nothing. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many playlist searches }

    PlaylistRowsReadTooFast:
      description: |
        Rows of playlists are being read faster than this component will answer them: a burst of 30, refilling one every 100 milliseconds, per client, one bucket shared by `GET /playlists/{id}/items` and `GET /playlists/{id}/items/changes`. A client scrolling a list asks for a window at a time and never meets it. The refusal comes after what the request says and after `503`, and before anything is asked of the player, and a request refused for what it asks spends nothing. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many playlist row reads }

    NoSuchLibraryTrack:
      description: |
        The snapshot holds no track at that address, which is what a client sees after tracks moved on disk or after a rebuild it has not read yet, and never another track's values. An `ordinal` past the end of the snapshot at the `structure` it named answers the same way.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no such track }

    NoTrackPlaying:
      description: |
        The player is stopped, or the session named is. `GET /artwork/playing` answers `404` the same way for the same reason, and a paused player or session is answered like a playing one, here as there. Or `session` names no session this device may see, in the same bytes as `NoSuchSession`; the `error` string tells the two apart.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`: revalidate on every request, since this URL names a different track once the player does."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: nothing is playing }
            noSuchSession:
              value: { error: no such session }

    ArtworkNotModified:
      description: |
        The cover is byte for byte the one the client was last sent, so there is no body.

        `ETag` is repeated so a client can keep validating against it, and `Cache-Control` is repeated so a stored copy that has just been confirmed keeps its instruction.
      headers:
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried.
        Cache-Control:
          schema: { type: string }
          description: "`private, max-age=604800, stale-while-revalidate=15552000`, as on the `200`."

    RevalidatedArtworkNotModified:
      description: |
        The cover is byte for byte the one the client was last sent, so there is no body.

        `ETag` is repeated so a client can keep validating against it, and `Cache-Control` is repeated so a stored copy that has just been confirmed still revalidates next time.
      headers:
        ETag:
          schema: { type: string }
          description: The same tag the `200` carried.
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`, as on the `200`."

    ArtworkRefused:
      description: |
        The address was declined before the snapshot was consulted: no `track` at all, one longer than 4096 characters, or one carrying a control character.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noTrack:
              value: { error: "'track' is required" }

    NoArtwork:
      description: |
        There is no picture to send. Either the snapshot holds no track at that address, which is what a client sees after tracks moved on disk, or the player has no front cover for the one it holds, or the cover is in a format this component does not publish.

        The `error` string tells them apart. All three are ordinary: an album without a sleeve is not a fault, and a client SHOULD fall back to whatever it draws for a record with no art rather than report an error.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, max-age=600`, ten minutes: a cover added at the player is drawn within that window with no reload."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no artwork for that track }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    NoPlayingArtwork:
      description: |
        There is no picture to send for whatever is playing, in the player or in the session named: nothing is playing yet, there is no front cover for what is, or the cover is in a format this component does not publish.

        The `error` string is the same one `GET /artwork` answers with for the second and third of those, because from a reader's side it is the same fact. A client SHOULD fall back to whatever it draws for a record with no art rather than report an error.

        Or `session` names no session this device may see, in the same bytes as `NoSuchSession`; the `error` string tells that apart.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the track does."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nothing:
              value: { error: no artwork for that track }
            noSuchSession:
              value: { error: no such session }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    NoPositionalArtwork:
      description: |
        There is no picture to send from a playlist and a position: the playlist does not exist, the position is past its end, the media library already holds a path for that row, the player has no front cover for what it found there, or the cover is in a format this component does not publish.

        The `error` string tells them apart. All five are ordinary and a client SHOULD fall back to whatever it draws for a record with no art rather than report an error.
      headers:
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`: revalidate on every request, since this URL names a different picture once the row does."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noSuchPlaylist:
              value: { error: no such playlist }
            positionPastEnd:
              value: { error: that position is past the end }
            nothing:
              value: { error: no artwork for that track }
            unreadable:
              value: { error: that artwork is not in a format this component sends }

    ArtworkTooLarge:
      description: |
        The picture is larger than 16 MiB and this component will not send it. A ceiling on the *response*; `413` on a request body is a different limit and a different number.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    LibraryTrackReadTooFast:
      description: |
        Reads of one library track are arriving faster than this component will answer them: a burst of 200, refilling one every 50 milliseconds, the same budget tag writes have, because the read this route exists for follows a write. Each read evaluates columns the client wrote, so what this bounds is a client stuck in a loop. A request refused for what it asks is refused for that first and spends nothing. The player was not asked. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many track reads }

    LibrarySummaryTooFast:
      description: |
        Summaries are being asked for faster than this component will answer them: a burst of 200, refilling one every 50 milliseconds, a budget of its own. A client asks once per pair it sees move and never meets it. A request refused for what it asks is refused for that first and spends nothing. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many library summary reads }

    LibraryQuestionsTooFast:
      description: |
        Questions are being asked faster than this component will answer them: a burst of 200, refilling one every 50 milliseconds, one budget shared by search and the album, artist and genre reads and by every client, and apart from the summary's. A client asks once per settled draft or opened page and never meets it. A request refused for what it asks is refused for that first and spends nothing. `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many library questions }

    PlayingTrackReadTooFast:
      description: |
        Reads of the playing track are arriving faster than this component will answer them: a burst of 60, refilling one every 250 milliseconds, a budget of its own. A client reading once per track change, and again while it waits for lyrics, never meets it, however many tabs it has open; a client stuck in a loop does. A request refused for what it asks is refused for that first and spends nothing. The player was not asked. `Retry-After` is sent in seconds, and `Cache-Control` is `private, no-cache` here as on every answer from this route.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
        Cache-Control:
          schema: { type: string }
          description: "`private, no-cache`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value: { error: too many track reads }

    ArtworkRequestedTooFast:
      description: |
        Covers are arriving faster than this component will read them: a burst of 300, refilling one every 50 milliseconds. A screenful of covers at once is the case this exists to allow, so a client drawing a grid never meets it; a client looping does.

        A client that meets this SHOULD back off rather than retry, and MUST NOT treat it as "no artwork". `Retry-After` is sent in seconds.
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ArtworkUnavailable:
      description: |
        This install does not serve the media library, which `GET /capabilities` reports in advance as `canReadLibrary: false`. Artwork is addressed through the snapshot, so there is nothing to address without one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            off:
              value: { error: artwork is not available }

    NoSuchSession:
      description: |
        No session this device may see has that id: nobody issued it, it has ended, or it is private and this device is not a member. All three answer in the same bytes, so a stranger cannot tell a private session from one that does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unknown:
              value: { error: no such session }

    SessionsUnavailable:
      description: |
        This install cannot start a session's stream, or it already holds as many detached sessions as it allows. The `error` string tells them apart, and a client SHOULD present the second as busy rather than as unsupported. The player's own session does not count against the limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unavailable:
              value: { error: sessions are not available }
            full:
              value: { error: too many sessions }

  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [name, version, apiVersion]
      properties:
        name:
          type: string
          const: foo_jean
          description: Always this value, which is what confirms the answering origin is foo_jean rather than something else on it.
        version:
          type: string
          description: The component's own version. Informational; branch on apiVersion instead.
          examples: ["0.4.0"]
        apiVersion:
          type: integer
          description: The shape of this API. A client MUST refuse a number it does not understand.
          examples: [1]

    Capabilities:
      type: object
      additionalProperties: false
      required:
        [apiVersion, allowedFields, canWrite, canWritePlaylists, canControlPlayback,
         canChangeOutput, maxAutoPlaylists, canCreateAutoPlaylists, canStream, streamFormats,
         canMuteWhileStreaming, canReadLibrary, playerName, playerVersion, volumeMin,
         volumeMax, volumeUnit, playbackModes, maxSessions, canCreateSessions]
      properties:
        apiVersion:
          type: integer
          examples: [1]
        allowedFields:
          type: array
          description: |
            Tag names this install permits, lower case by convention and matched case-insensitively. Anything not named here is refused with a `403`.
          items: { type: string }
          examples: [["rating", "unsynced lyrics"]]
        canWrite:
          type: boolean
          description: |
            Exactly `allowedFields.length > 0`. A convenience, not a second source of truth.
        canWritePlaylists:
          type: boolean
          description: |
            Whether this install permits a write to a playlist or autoplaylist it did not create itself: create, add, edit, delete or reorder. `writePlaylists` in `config.json`, defaulting to `true`. A component predating this field reports nothing, and a client MUST read absence as writable.

            The component's own scratch playlist stays writable regardless: this governs the user's playlists, not the component's own plumbing. The play queue is unaffected either way, since it is addressed through `/queue` rather than through a playlist.
        canControlPlayback:
          type: boolean
          description: |
            Whether this install permits driving the player's own session from here: the transport, seeking, the playback mode, the volume, playing a row and every queue write. `controlPlayback` in `config.json`, defaulting to `true`. Reading the state and the queue is unaffected either way, and so is the component's own scratch playlist, which follows this rather than `canWritePlaylists`. A detached session is driven whatever this says.
        canChangeOutput:
          type: boolean
          description: |
            Whether this install permits switching the player's output device. `changeOutput` in `config.json`, defaulting to `true`. It refuses `POST /outputs/active` alone: `GET /outputs` stays open regardless, and the volume, the mute flag and every playback command to the player's own session answer to `controlPlayback` instead.
        maxAutoPlaylists:
          type: integer
          minimum: 0
          description: |
            How many autoplaylists this component will keep at once, counting only the ones it created. The cap applies to creating only: `0` switches creation off, and updating or deleting one it made is never refused for the cap.

            The cap bounds a client bug rather than an attacker; anything admitted onto this origin can already write tags.
          examples: [100]
        canCreateAutoPlaylists:
          type: boolean
          description: |
            True only when `canWritePlaylists` is true and `maxAutoPlaylists` is above zero. False under either alone, so a client gates a single control on this field rather than checking both itself.
        canStream:
          type: boolean
          description: |
            Exactly `streamFormats.length > 0`. False on an install where the component loaded but no encoder started, where `streamingEnabled` is false, and on any component version that predates streaming. A client MUST hide the listen control when it is false rather than offer it and fail.
        streamFormats:
          type: array
          items: { type: string }
          description: |
            What `GET /stream?format=` accepts, best first. `opus` is Ogg Opus, which every current browser except older Safari plays. `aac` is AAC-LC in ADTS, for Safari before 18.4.

            A client SHOULD omit `format` and take the first entry unless it knows the browser needs otherwise. The list varies by install: one with no AAC encoder reports `opus` alone.
          examples: [["opus", "aac"]]
        canMuteWhileStreaming:
          type: boolean
          description: |
            Whether this install silences the player while somebody is listening to the player's own session. `muteWhileStreaming` in `config.json`, and the player owner's decision rather than a client's: there is no route that changes it. A device listening to a detached session never silences the player.

            The capture is taken before the player's volume, so muting leaves the stream at full level. False makes the player one more speaker alongside every listener, which is fine a room apart from them and an echo in the same one — the stream runs a second or two behind.
        canReadLibrary:
          type: boolean
          description: |
            Whether this install serves the media library. False on a component that loaded without the feature and on any version predating it, and every route under `/library` then answers `503`, as does `GET /artwork`, which addresses a cover through the snapshot. `GET /state` answers `200` regardless, with `library.ready` false. A client MUST say why the library is unavailable, and MUST NOT hide it or present it as empty.

            True says the routes are there, not that a snapshot is built yet. `GET /state` reports `library.ready` for that.
        playerName:
          type: string
          description: |
            The player's own name, read once at startup and static for as long as it runs. foo_jean loads in foobar2000 alone, so this is the player identifying itself rather than a client needing to guess.
          examples: ["foobar2000"]
        playerVersion:
          type: string
          description: The player's own version string, read the same way.
          examples: ["2.25.3"]
        volumeMin:
          type: number
          description: |
            The floor of the range `PlayerState.volume` in `GET /state` moves within. A client draws the fader's whole length against `volumeMin`..`volumeMax` rather than assuming any particular scale.
          examples: [-100]
        volumeMax:
          type: number
          description: The ceiling of that range.
          examples: [0]
        volumeUnit:
          type: string
          description: What `volumeMin`, `volumeMax` and `PlayerState.volume` are all measured in.
          examples: ["db"]
        playbackModes:
          type: array
          items: { $ref: "#/components/schemas/PlaybackMode" }
          description: |
            The playback modes this install can be put into, in the order the player itself lists them. An order the player reports that this component has no Jean name for is missing from here rather than guessed at, and an install reporting none answers an empty array.
          examples: [["inOrder", "repeatAll", "repeatOne", "random", "shuffleTracks", "shuffleAlbums", "shuffleFolders"]]
        maxSessions:
          type: integer
          minimum: 0
          maximum: 8
          description: |
            How many detached sessions this install keeps at once. `maxSessions` in `config.json`, from 0 to 8 and 4 by default, and the value foobar2000 was started with: a change to it waits for a restart. The player's own session is never counted. `0` switches creating them off.
          examples: [4]
        canCreateSessions:
          type: boolean
          description: |
            Whether `POST /sessions` can create a detached session here: true only where `canStream` is true, this install can start a session's stream, and `maxSessions` is above zero. A detached session is heard through the stream and nowhere else, so it is false while streaming is off, and moves with `streamingEnabled` with no restart. It says nothing about a free place: with every place taken it stays true and `POST /sessions` answers `503 too many sessions`. `controlPlayback` does not govern it.

    PlaybackMode:
      type: string
      description: |
        Jean's own name for a playback order. `foo_jean` maps it both ways against whatever the player calls its own orders; neither foobar2000's own string nor its ordinal ever crosses this API.
      enum: [inOrder, repeatAll, repeatOne, random, shuffleTracks, shuffleAlbums, shuffleFolders]

    PlaybackSeekRequest:
      description: |
        Exactly one of `seconds` and `relativeSeconds`. Naming both or naming neither is a `400`.
      type: object
      additionalProperties: false
      properties:
        seconds:
          type: number
          minimum: 0
          description: An absolute position in the playing track, in seconds from its start.
          examples: [90]
        relativeSeconds:
          type: number
          description: An offset from wherever the player is now, in seconds. Negative moves backward.
          examples: [-10]

    PlaybackModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/PlaybackMode" }

    VolumeRequest:
      description: |
        Exactly one of `value`, `step` and `muted`. Naming two of them or naming none is a `400`, read off which field is present and never off what it holds.
      type: object
      additionalProperties: false
      properties:
        value:
          type: number
          description: |
            A level in `GET /capabilities`'s `volumeMin`..`volumeMax`, in `volumeUnit`. `0` is a legal level like any other in that range, read off its presence rather than its truth, and never the absence of one. A level outside that range is refused, never clamped onto it.
          examples: [-8.5]
        step:
          type: string
          enum: [up, down]
          description: |
            One player-defined nudge, sized however foobar2000 is configured to step: never a number, so the size stays the player's.
          examples: [up]
        muted:
          type: boolean
          description: |
            Set rather than toggled: `true` mutes and `false` unmutes, whatever the player's mute state was before this arrived.
          examples: [true]

    PlaybackSeekRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable seek]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    PlaybackModeRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable mode]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    VolumeRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable volume]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    Outputs:
      type: object
      additionalProperties: false
      required: [devices, active]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/OutputDevice" }
        active:
          type: [string, "null"]
          description: |
            The id of the device foobar2000 is currently paired with, or `null` where that pairing matches none of `devices`.

    OutputDevice:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: |
            Opaque: the output module's GUID and the device's GUID, printed the way foobar2000 prints a GUID and joined by `:`. A client MUST NOT parse, split or build one.
          examples: ["D41D2423-FBB0-4635-B233-7054F79814AB:44761B90-C842-41F7-86E5-645DE2EEA6DC"]
        name:
          type: string
          description: What to call this device in a picker, exactly as foobar2000 names it.
          examples: ["Speakers (Realtek High Definition Audio)"]

    ActiveOutputRequest:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId:
          type: string
          description: |
            One of the ids `GET /outputs` last listed, opaque the same way: a client MUST NOT parse, split or build one, only echo one it was handed. No output type rides alongside it; the id names the module and the device together.

    ActiveOutputRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [unacceptable output device]
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    StreamTimeline:
      type: object
      additionalProperties: false
      required: [streamTime, marks]
      properties:
        streamTime:
          type: number
          description: |
            Seconds of audio encoded since the component started. Not wall-clock time and not the player's position. It is the clock `marks[].at` is expressed in.
        marks:
          type: array
          description: |
            Where the stream last changed what a given stream time means, oldest first: a track starting, or a seek within one. The list is bounded, so a player left running for a day does not grow it; a client needs only the marks around what it is currently hearing.

            A seek produces a mark because the track does not change but its position does. Without one a client goes on deriving positions from before the jump.
          items:
            type: object
            additionalProperties: false
            required: [at, path, subsong, position]
            properties:
              at:
                type: number
                description: Stream time at which this track's audio began.
              path:
                type: string
                description: |
                  A plain absolute local path, the form foobar2000 evaluates `%path%` to and `GET /state`'s `player.path` carries, so a client can join the two on equality. No route here is addressed by it.

                  Not the form the player stores: on a portable install foobar2000's canonical path for `C:\Music\x.mp3` is `file-relative://..\Music\x.mp3`. This route resolves it.
              subsong: { type: integer }
              position:
                type: number
                description: |
                  Where the player was within the track at `at`. Zero except when a listener connects mid-track or somebody seeks.

    DeviceIdentity:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          maxLength: 64
          description: |
            Opaque, and stable for as long as the device keeps its storage. It is what groups a device's connections into one listener, so a reconnect and Safari's `Range` probe do not read as three people.

            Untrusted: it labels a row in somebody else's picker and decides whose ticket a full store pushes out first, and anything admitted onto this origin could send another device's. A client SHOULD generate one at random and keep it, and MUST NOT derive it from anything about the person using it.

            Absent, empty, unprintable or overlong all become no id at all, and the request is served: a device with no id counts with the other anonymous ones.
          examples: ["3f8a1c0e-2b7d-4a91-9c33-51e0a2f6d4b8"]
        name:
          type: string
          maxLength: 64
          description: |
            What to call this device in a picker. Empty, absent, unprintable or overlong all become no name at all — the label is refused, never the request, because a bad name must not cost somebody their audio.
          examples: ["Android phone"]

    StreamListeners:
      type: object
      additionalProperties: false
      required: [devices, connections, maxConnections, playerMuted]
      properties:
        devices:
          type: array
          description: Connected devices of the session named, the player's own where none is, longest-listening first. A device inside its linger has gone and is not here.
          items:
            type: object
            additionalProperties: false
            required: [deviceId, name, format, connections, listeningFor]
            properties:
              deviceId:
                type: string
                description: |
                  As the device sent it, or `#<n>` for a connection that named nothing. Each anonymous connection is its own device: merging them would report two strangers as one person.
              name:
                type: [string, "null"]
                description: Null when the device did not name itself, so a client can tell that from a name it chose.
              format:
                type: string
                examples: [opus]
              connections:
                type: integer
                description: |
                  Sockets this device holds. Routinely two — Safari probes a source with `Range: bytes=0-1` before fetching it for real.
                examples: [2]
              listeningFor:
                type: integer
                description: Seconds since this device's oldest live connection opened.
        connections:
          type: integer
          description: |
            Every socket, across every device and every session together, whichever session is named. This is what `maxConnections` bounds, and it is not the number a person should be shown.
        maxConnections:
          type: integer
          description: "`maxConcurrentStreams` from `config.json`, which bounds the connections of every session together."
        playerMuted:
          type: boolean
          description: |
            Whether the player is silent *because somebody is listening to the player's own session*, as opposed to muted by hand. It answers the player's state whichever session is named: a device listening to a detached session never silences it. foobar2000 has no mute flag, only a volume at -100 dB, so a client reading the volume alone sees a fader at the bottom either way, and this is what tells it which sentence to put next to it.

            False the moment anybody unmutes the player from either end: the hold never argues, and stays released until nobody is listening.

    StreamTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresIn]
      properties:
        ticket:
          type: string
          description: |
            Opaque. Send it as the `ticket` query parameter and discard it once the connection is open.
        expiresIn:
          type: integer
          description: Seconds from now.
          examples: [120]

    Session:
      description: |
        One playback session. The player's own is `engine`: it always exists, is always shared, and answers what `GET /state` answers about the player. Every other is `detached`, playing for itself out of the same library.
      type: object
      additionalProperties: false
      required:
        [id, kind, shared, playback, title, artist, album, albumArtist, libraryPath, listeners,
         playbackModes, chainDropped, reports, createdBy]
      properties:
        id:
          type: string
          description: |
            `engine` for the player's own session. Otherwise opaque, drawn the way a stream ticket is, so an unlisted session is not found by counting.
          examples: [engine]
        kind:
          type: string
          enum: [engine, detached]
        shared:
          type: boolean
          description: |
            Whether every device sees the session, or only its members. Always `true` for `engine`. A private session is a courtesy, not a security boundary: anything on the network can send another device's `deviceId`.
        playback:
          type: string
          enum: [stopped, paused, playing]
          description: As `PlayerState` spells it.
        title:
          type: [string, "null"]
          description: As `PlayerState` spells it, and `null` where none has been computed.
        artist:
          type: [string, "null"]
          description: As `PlayerState` spells it, and `null` where none has been computed.
        album:
          type: [string, "null"]
          description: As `PlayerState` spells it, and `null` where none has been computed.
        albumArtist:
          type: [string, "null"]
          description: As `PlayerState` spells it, and `null` where none has been computed.
        libraryPath:
          type: [string, "null"]
          description: As `PlayerState` spells it, and `null` where the media library holds no such track or nothing is playing.
        listeners:
          type: integer
          description: |
            Devices connected to the session's stream now, counted as `GET /stream/listeners` counts `devices`. A device inside its linger has gone and is not counted.
        playbackModes:
          type: array
          description: |
            The orders the session offers. For `engine`, exactly `GET /capabilities`' `playbackModes`, in its order. For a detached session, `inOrder`, `repeatAll`, `repeatOne`, `random` and `shuffleTracks`.
          items: { $ref: "#/components/schemas/PlaybackMode" }
        chainDropped:
          type: boolean
          description: |
            Whether the session stopped running foobar2000's DSP chain after a DSP in it failed, which it does for the rest of its life. Always `false` for `engine`.
        reports:
          type: array
          maxItems: 8
          description: |
            What went wrong while the session played: its last eight reports, oldest first, a ninth dropping the first. Always empty for `engine`. A track that would not decode is skipped and reported; a session that has skipped every track it holds without decoding one stops rather than going round again. `sessionRevision` in `GET /state` moves for each report.
          items: { $ref: "#/components/schemas/SessionReport" }
        createdBy:
          description: |
            The device that created the session, as it named itself in `POST /sessions`, and `null` for `engine`. Two devices can carry one `name`, so `deviceId` is what tells two creators apart.

            The `deviceId` here is the one the creator's private sessions are entered with, and anybody this session is answered to reads it. That is why private is a courtesy and not a boundary.
          oneOf:
            - type: object
              additionalProperties: false
              required: [deviceId, name]
              properties:
                deviceId:
                  type: string
                name:
                  type: [string, "null"]
                  description: Null where the device named nothing, as a row of `StreamListeners.devices` spells it.
            - type: "null"

    SessionReport:
      description: |
        One thing that went wrong while a detached session played, and the track it happened on.
      type: object
      additionalProperties: false
      required: [sequence, kind, path, subsong, libraryPath]
      properties:
        sequence:
          type: integer
          minimum: 1
          description: |
            `1` for the session's first report, and one higher for each after it, for the session's whole life, so a client that has read up to one knows which are new.
        kind:
          type: string
          enum: [undecodable, chainDropped]
          description: |
            `undecodable`: the track would not decode, and the session skipped to the next. `chainDropped`: a DSP in foobar2000's chain failed, and the session plays on without the chain for the rest of its life, as `chainDropped` on the session says after this report has left the eight.
        path:
          type: string
          description: The track's path, as `PlayerState.path` spells it.
        subsong:
          type: integer
          minimum: 0
          description: As `PlayerState.subsong` spells it.
        libraryPath:
          type: [string, "null"]
          description: As `PlayerState.libraryPath` spells it, and `null` where the media library holds no such track.

    Sessions:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          description: The player's own session first, then the detached sessions in the order they were created.
          items: { $ref: "#/components/schemas/Session" }

    ShareSessionRequest:
      type: object
      required: [shared]
      properties:
        shared:
          type: boolean
          description: "`true` lists the session for every device, `false` for its members alone."

    TagWriteRequest:
      description: |
        Where to write, and what. The address is exactly one of three: `track` with `subsong`, `ordinal` with `structure`, or `playlist` with `index` and `structure`. None of them and two of them are both a `400`, and so is a member of any carried with the wrong type. Nothing here is a filesystem path.
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        track:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            The library form: the track's path relative to the media library root, forward-slashed on every platform, the address `GET /artwork?track=` takes. The snapshot's `directory` and `filename` for that row, concatenated, or a playlist row's `libraryPath`.

            At most 4096 printable characters. It is a lookup key rather than a path, so `..` in it is neither refused nor meaningful: it matches nothing, which is a `404`.
          examples: ["Fictional Artist/Imaginary Album/01 Track.flac"]
        subsong:
          type: integer
          minimum: 0
          description: |
            Which track inside the file, for cue sheets and disc images: the number the player assigned it, never a position among the tracks at one path. Every subsong of one file shares a `track` address, so this is the half of the library form that tells them apart.

            Omit it for an ordinary file, where a missing value is read as `0`. A cue sheet's subsongs number from 1, so omitting it for a file the player splits is a `404` rather than a write to that file's first track. Send the `subsong` the row carries.

            No `default:` is declared here. openapi-typescript treats a property that has one as always present and emits it non-optional, which would force every caller to pass a subsong it does not have.
        ordinal:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            The precise library form: the track's position in the media library snapshot `structure` names, as any route answering ordinals gives it. It names one track and one subsong, where a `track` address names every root holding that relative path.

            This is what a client sends after a `409` saying the address holds more than one track. Requires `structure`, which is the media library's own generation and a number.
          examples: [1904]
        playlist:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The playlist form: the playlist holding the row, by the `id` a `PlaylistAnnotation` carries. The address for a track the media library does not hold, and for nothing else.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        index:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            The row's position in that playlist, `0` being the first, at the `structure` it was read at. Required with `playlist`.
          examples: [3]
        structure:
          description: |
            The generation the address was read at, required with `ordinal` and with `playlist`, and its type says which of the two was sent. A well-formed generation the player has moved past is a `409` and anything else about it is a `400`. Nothing is written either way.

            With `playlist` it is that playlist's own structure generation, from `GET /playlists`, from a page or from a delta: a string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, sent exactly as it arrived.

            With `ordinal` it is the media library's own generation, from `library.structure` in `GET /state`, and a number, the same value a fill sends.
          oneOf:
            - type: string
              pattern: "^[0-9]+$"
            - type: integer
              minimum: 0
          examples: ["9204739866101318923", 41]
        fields:
          type: object
          minProperties: 1
          description: |
            Tag name to value. Every name MUST be on the allowlist. Two names differing only in case are refused rather than guessed at, since foobar2000 tag names are case-insensitive and that is two instructions for one tag.
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
            description: |
              A whole number is accepted and rendered as text, so `4` and `"4"` are the same request. An empty string removes the tag. Fractional numbers, booleans and nulls are refused.
          examples: [{ rating: "4" }]

    TagWritten:
      description: |
        What was written, and the address it was written to, echoed in the form the request sent: `track` and `subsong` for the library form, `subsong` carrying the value the write used and so `0` where the request omitted it; `ordinal` alone for the ordinal form, which names a subsong already; `playlist` and `index` for the playlist form. `structure` is not echoed, being a precondition on the write rather than part of the address.
      type: object
      additionalProperties: false
      required: [written, fields]
      properties:
        written: { type: boolean, const: true }
        track: { type: string }
        subsong: { type: integer, minimum: 0 }
        ordinal: { type: integer, minimum: 0 }
        playlist: { type: string }
        index: { type: integer, minimum: 0 }
        fields:
          type: object
          description: What was written, normalised to strings.
          additionalProperties: { type: string }

    TagRefused:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [written, error, detail]
      properties:
        written: { type: boolean, const: false }
        error:
          type: string
          description: The category of refusal.
          enum:
            - malformed request
            - unacceptable address
            - no fields to write
            - field not allowed
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.
        field:
          type: string
          description: |
            Present only when `error` is `field not allowed`, naming the field. A client SHOULD use it to stop offering that control.

    TagFailed:
      description: The request was acceptable and the attempt failed.
      type: object
      additionalProperties: false
      required: [written, error]
      properties:
        written: { type: boolean, const: false }
        error:
          type: string
          enum:
            - foobar2000 does not know that track
            - the media library holds more than one track at that address
            - "the playlist's rows were added, removed or reordered; read them again"
            - the media library was rebuilt; read the state and ask again
            - the player could not write the tags
            - the player did not answer in time
            - tag writing is not available
            - too many tag writes

    PlaylistAnnotation:
      description: |
        One playlist, with everything a client draws its entry in a list from.
      type: object
      additionalProperties: false
      required: [id, index, title, itemCount, isAutoPlaylist, role, structure, revision, managed]
      properties:
        id:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed. Stable across renames, reordering and restarts, and never reused. It is what the routes here address, and what a client SHOULD store to find a playlist again later.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        index:
          type: integer
          minimum: 0
          description: |
            Position in the player's own playlist list, counting from zero. Not identity: creating, deleting or reordering a playlist changes it.
        title:
          type: string
          description: |
            The playlist's title, as the player holds it. foobar2000 permits two playlists to share one, so it is for display rather than for identity.
        itemCount:
          type: integer
          minimum: 0
          description: |
            How many rows the playlist holds.
        isAutoPlaylist:
          type: boolean
          description: |
            Whether the playlist is an autoplaylist, filled and kept filled by the player from a query. True for any autoplaylist, including ones made in foobar2000 before this component was installed.
        role:
          type: [string, "null"]
          enum:
            - scratch
            - null
          description: |
            What this component keeps the playlist for, and `null` for every playlist it keeps for nothing of its own, which is all of them a user made. `scratch` is the playlist a fill puts a set of tracks in for the player to play, and a client SHOULD hide it from the playlist list it draws.

            Read from a marker this component writes on the playlist rather than from the title, so a playlist renamed at the player keeps its role and a playlist somebody titles to look like this one never gains one.
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Moves when the playlist's rows are added, removed, reordered or replaced. Rows a client read at an earlier value are at positions that have moved, and it MUST read them again.

            **A string of decimal digits, and never a JSON number.** This is a 64-bit counter, seeded so that no value it has ever published comes back after a restart, which puts it far above 2^53. A JSON number is an IEEE 754 double and exact only to 2^53, so a parser that reads this as a number rounds four consecutive generations to a single value and a client comparing two of them cannot see the edit between them. Compare these for equality and send them back as they arrived. Nothing here is ordered, counted or added to, so a string costs a client nothing.

            The other counters on this API are inside 2^53 and stay numbers: `GET /state`'s `playlistsRevision`, `queueRevision` and `timelineRevision`, the media library's own `structure` and `revision`, and the library `structure` a fill or a create resolves its ordinals against. Only a playlist's own two are spelled this way, and the library `structure` that `POST /library/rows` and `GET /library/credits` take, which they take as text.
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Moves when a row already in the playlist would answer differently, a tag, a rating or a play count. The rows stay where they are.

            A string of decimal digits for the reason `structure` gives, and compared the same way.
        managed:
          description: |
            What this component stored when it created the playlist, or `null` for every playlist it did not create, including autoplaylists made in the player. This is how a client tells a folder it manages from an autoplaylist that was already there.

            It is kept as a foobar2000 playlist property, so it travels with the playlist through renames and restarts and is removed with the playlist.
          oneOf:
            - { $ref: "#/components/schemas/ManagedAutoPlaylist" }
            - type: "null"

    ManagedAutoPlaylist:
      type: object
      additionalProperties: false
      required: [key, query, sort, forceSort]
      properties:
        key:
          type: string
          description: |
            Whatever the client sent, handed back verbatim. Empty when none was given.
        query:
          type: string
          description: |
            The query last sent to create or update the playlist. Editing the query in foobar2000's own dialog makes this stale, and the component cannot detect that: the SDK offers no way to read an autoplaylist's current query back.
        sort:
          type: string
        forceSort:
          type: boolean

    AutoPlaylistRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What the playlist is called in foobar2000's own tabs. Required when creating, optional when updating; omitting it on an update leaves the name alone rather than renaming the playlist to whatever the client last knew.

            What somebody looking at the player will read on the tab. Nothing in this API parses it, and the user may rename it freely -- so a client that needs to recognise its own playlists later MUST use `key`, never the title.

            No control characters, which would be line breaks in a playlist tab.
        key:
          type: string
          maxLength: 256
          description: |
            Opaque to this component: stored, handed back and compared for equality, never interpreted. A client puts here whatever lets it recognise its own playlists later, such as `folder:genre:Rock`, rather than encoding a convention in the title, which the user can edit.

            MUST be unique across the playlists this component created. A second playlist with the same key is a `409` rather than a duplicate, so the same create request is safe to send twice.
          examples: ["folder:genre:Rock"]
        query:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            foobar2000's own query syntax, passed through untouched. This component never composes or interprets it; the player owns that language and is the only thing that can say whether a query parses.

            Quoting is therefore the client's responsibility. A value taken from library data and pasted in unquoted can produce a valid query that is not the one intended, and no validation here can catch that. Use `POST /autoplaylists/preview` to see what a query matches.
          examples: ["%genre% IS Rock"]
        sort:
          type: string
          maxLength: 4096
          description: A title-formatting pattern to sort by. Optional.
          examples: ["%album artist%|%date%|%album%"]
        forceSort:
          type: boolean
          description: |
            Keep the playlist sorted, and stop the user reordering it by hand. Optional, and false when absent.

    FillOwnPlaylistRequest:
      type: object
      additionalProperties: false
      required: [title, structure]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What to title the playlist. Applied on every call, whether this one is what creates the playlist for `role` or finds one already there, so retitling it from one fill to the next is the same call that fills it, never a second one.

            A title beginning `#Jean` reaches foobar2000's own tab exactly as sent; one that does not is prefixed with `#Jean` before it gets there. These are the component's own playlists, and a title is all the player's own list of playlists shows about whose a playlist is. No title is refused for lacking the prefix.

            `maxLength` bounds this request, not the tab it ends up in: the prefix is added afterwards, so a title at the bound that does not already begin `#Jean` reaches foobar2000 six characters past it.

            No control characters, which would be line breaks in a playlist tab.
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: read `GET /state` again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    FillPlaylistRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: read `GET /state` again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }
        duplicates: { $ref: "#/components/schemas/Duplicates" }

    PlayLibrarySetRequest:
      type: object
      additionalProperties: false
      required: [structure, index]
      properties:
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: read `GET /state` again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }
        index:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            The track in the set to start at, `0` being the first, counted in the order the set decodes.
          examples: [1]

    Duplicates:
      type: string
      enum: [add, skip]
      default: add
      description: |
        What becomes of a track the target playlist already holds. `add` inserts it again, and is what leaving the field out means. `skip` leaves it out and names it in the answer's `skipped`, so a client can ask a person about those and send them again without this field.

        Two rows hold the same track where they name the same file and the same subsong, which is how foobar2000 itself tells one track from another. Tags play no part, so the same recording in two files is two tracks. Only what the target held before the request counts: a track the request itself names twice is inserted twice under either value.

        The target's lock is asked before its rows are, so a locked playlist is a `409` even where every track named would have been skipped.
      examples: [skip]

    CopyPlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [source, runs]
      properties:
        source:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The playlist to take rows from, by the `id` a `PlaylistAnnotation` carries. Rows are copied, so the source is left as it was. No generation is sent with it: the positions are read against the playlist as it stands when the player takes the job.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        runs: { $ref: "#/components/schemas/Runs" }
        duplicates: { $ref: "#/components/schemas/Duplicates" }

    RemovePlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's own `structure` generation, the one its positions were read at. Read it from `GET /playlists`, from a page, from a delta or from the answer a copy gave. A value other than the playlist's current one is a `409` and nothing is removed.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, sent exactly as it arrived. **This is not the `structure` a fill sends.** A fill resolves media library ordinals against the library's own generation, which is inside 2^53 and is a number; this names one playlist's own counter, which is not.
          examples: ["9204739866101318923"]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    MovePlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [structure, to]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's own `structure` generation, the one its positions were read at, as `RemovePlaylistRowsRequest.structure` describes it. A value other than the playlist's current one is a `409` and nothing is moved.
          examples: ["9204739866101318923"]
        runs:
          allOf:
            - $ref: "#/components/schemas/Runs"
          description: Row positions as ranges. Exactly one of `runs` and `ordinals` is sent.
        ordinals:
          allOf:
            - $ref: "#/components/schemas/Ordinals"
          description: Row positions as a plain list. Exactly one of `runs` and `ordinals` is sent. The rows keep the order they have in the playlist, not the order listed.
        to:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            Where the first moved row lands: its position once the moved rows are taken out and put back together, counted in the playlist without them. At most the playlist's length less the rows moved; a larger value is a `400`.
          examples: [0]

    SortPlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [structure, pattern]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's own `structure` generation, as `RemovePlaylistRowsRequest.structure` describes it. A value other than the playlist's current one is a `409` and nothing is sorted.
          examples: ["9204739866101318923"]
        pattern:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            A foobar2000 title-formatting pattern. Every row is formatted with it and the playlist is put in ascending order of the results.
          examples: ["%album artist%|%date%|%album%|%discnumber%|%tracknumber%"]

    RenamePlaylistRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What to title the playlist, exactly as it will read in foobar2000's own tabs. No control characters, which would be line breaks in a playlist tab.

    MovePlaylistRequest:
      type: object
      additionalProperties: false
      required: [index]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            Where the playlist ends up in the player's list, counting from zero. A value at or past the number of playlists is a `400`.
          examples: [0]

    CreatePlaylistRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            What to title the playlist, exactly as it will read in foobar2000's own tabs. No control characters, which would be line breaks in a playlist tab.
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. Required with `runs`, `bitset` or `ordinals`, and refused with `source`, which names rows rather than library tracks. A value other than the one currently held is a `409`: read `GET /state` again and resolve the set against the `structure` it reports.
          examples: [41]
        source:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The playlist to take rows from, by the `id` a `PlaylistAnnotation` carries. Sent with `runs`, which then names row positions in that playlist rather than library ordinals, and never with `structure`, `bitset` or `ordinals`. Rows are copied, so the source is left as it was.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    Runs:
      type: array
      description: |
        The set as ranges: each entry is `[start, count]`, a run of `count` consecutive positions beginning at `start`. A position is a library ordinal where a library `structure` is sent alongside the set, and a row position where the request names a playlist to read rows from instead, either through `source` or as the playlist in the path. Collapses a whole album, a whole folder or a whole playlist to a handful of pairs.

        Read in ascending order, never in the order the pairs are listed: a run cannot carry any other. A client holding a click-ordered set MUST send `ordinals` instead.
      items:
        type: array
        items: { type: integer, minimum: 0, maximum: 4294967295 }
        minItems: 2
        maxItems: 2
      examples: [[[0, 2], [9, 1]]]

    Bitset:
      type: string
      description: |
        The set as a bitmap, one bit per position of the kind `Runs` describes, least-significant bit first within each byte: bit 0 of byte 0 is position 0, bit 7 of byte 0 is position 7, bit 0 of byte 1 is position 8. Base64, and against the library exactly `ceil(trackCount / 8)` bytes for the `structure` sent alongside it. Costs about one byte per eight positions whatever the set holds, which is what makes it the form to reach for once a scattered set would cost more as `runs` than the range it names is wide.

        Read in ascending order: a bitmap carries no other order to preserve.
      examples: ["AwI="]

    Ordinals:
      type: array
      items: { type: integer, minimum: 0, maximum: 4294967295 }
      description: |
        The set as a plain list of the positions `Runs` describes. The only one of the three forms read in the order it is given rather than ascending, which makes it the form a client holding a click-ordered set, such as a multi-select or a queue, MUST send. Sending the same set as `runs` or `bitset` reads it in ascending order instead, silently.
      examples: [[9, 0, 1]]

    FillResult:
      type: object
      additionalProperties: false
      required: [playlistId, structure, positions, skipped]
      properties:
        playlistId:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed. From `POST /playlists/own/{role}/items` this is the id `role` resolved to; from `POST /playlists/{id}/items` it is the `id` the request named.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The target playlist's `structure` generation once the rows have landed. An undo naming this one removes exactly the rows below and nothing else, and a rating changed in between moves the playlist's `revision` rather than this, so it does not block one.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, and it goes back into `POST /playlists/{id}/items/remove` exactly as it arrived. A client that holds it as a number undoes against a neighbour of it and is refused `409` every time.

            Not the same field as the `structure` this request sent: that one is the media library's own generation, an ordinal is resolved against it, and it stays a plain number.
          examples: ["9204739866101318924"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One position per row inserted, in the order the rows were inserted: request order for `ordinals`, ascending ordinal order for `runs` and `bitset`. `positions[i]` is where the *i*-th inserted row landed, 0-based.
          examples: [[0, 1, 2]]
        skipped:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            The media library ordinal of each track left out because the playlist already held it, in the order the request would have inserted them. Empty unless the request said `duplicates: skip`, and always empty from `POST /playlists/own/{role}/items`, which takes no such field.
          examples: [[]]

    CopiedRows:
      type: object
      additionalProperties: false
      required: [structure, positions, skipped]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The target playlist's `structure` generation once the rows have landed. An undo naming this one removes exactly the rows below and nothing else, and a rating changed in between moves the playlist's `revision` rather than this, so it does not block one.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives, and it goes back into `POST /playlists/{id}/items/remove` exactly as it arrived. A client that holds it as a number undoes against a neighbour of it and is refused `409` every time.
          examples: ["9204739866101318924"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One position per row appended, in ascending source order, 0-based in the target. Empty where `runs` named no rows, and where `duplicates: skip` left every one out.
          examples: [[4, 5, 6]]
        skipped:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            The position in `source` of each row left out because the target already held its track, ascending. Empty unless the request said `duplicates: skip`.
          examples: [[]]

    RemovedRows:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's `structure` generation once the rows are gone. A client holding the rest of the rows re-keys them to this rather than reading the playlist again.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives.
          examples: ["9204739866101318924"]

    MovedRows:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's `structure` generation once the rows have moved. A client holding the rows re-keys them to this rather than reading the playlist again.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives.
          examples: ["9204739866101318924"]

    SortedRows:
      type: object
      additionalProperties: false
      required: [structure, order]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's `structure` generation once it is sorted.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives.
          examples: ["9204739866101318924"]
        order:
          type: array
          items: { type: integer, minimum: 0, maximum: 4294967295 }
          description: |
            One entry per row, in the playlist's new order: `order[n]` is the position the row now at position `n` held before the sort. A client re-keys the rows it holds with it.
          examples: [[3, 0, 1, 2]]

    QueryPreview:
      type: object
      additionalProperties: false
      required: [valid, error, matches, libraryEnabled]
      properties:
        valid:
          type: boolean
          description: Whether foobar2000 could read the query. Check this before `matches`.
        error:
          type: string
          description: |
            The player's own message when `valid` is false, and empty otherwise. Safe to show a person: it describes the query they typed, not anything on the disk.
        matches:
          type: integer
          minimum: 0
          description: How many tracks in the Media Library the query matches. `0` when invalid.
        libraryEnabled:
          type: boolean
          description: |
            Whether this install has a Media Library configured. Autoplaylists filter the Media Library and nothing else, so `false` means every autoplaylist is empty whatever the query. A client SHOULD say so before somebody creates one, which is why this is reported here rather than on `/capabilities`.
        structure:
          type: integer
          description: |
            The media library generation `ordinals` is counted in, the value `GET /state`'s `library.structure` reports, and a number for the reason `library.structure` is. Present only where the request sent `rows: true` and `valid` is true, together with `ordinals`, and absent otherwise.
          examples: [41]
        ordinals:
          type: array
          items: { type: integer, minimum: 0, maximum: 4294967295 }
          description: |
            The matching tracks as media library ordinals in generation `structure`, ascending. Present only where the request sent `rows: true` and `valid` is true, and absent otherwise. A match the component's snapshot does not hold is left out, so this can be shorter than `matches`.
          examples: [[12, 13, 407]]

    PlaylistRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the player was involved.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - malformed request
            - unacceptable title
            - unacceptable key
            - unacceptable query
            - unacceptable sort
            - unacceptable playlist id
            - unacceptable ordinal set
            - too many requests
        detail:
          type: string
          description: |
            What specifically was wrong. Safe to show a person: every value describes the request the client sent, never anything on the player's disk. For a body that is not JSON it carries the parser's message, which quotes the client's own text.

    PlaylistFailed:
      description: The request was acceptable and the attempt failed.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - foobar2000 could not read that query
            - no such playlist
            - that position is past the end
            - the media library holds more than one track at that address
            - that playlist is not an autoplaylist
            - unacceptable key
            - another playlist already has that key
            - this install's autoplaylist limit is reached
            - tracks were added or removed; read the state and ask again
            - the queue changed since that revision; read it again
            - the playlist's rows were added, removed or reordered; read them again
            - that revision is not one this playlist can catch up from; read its rows again
            - the player could not do that
            - the player did not answer in time
            - autoplaylists are not available
            - this install has playlist writes turned off; turn on writePlaylists in config.json to allow them
            - another component has locked that playlist against that edit
            - that playlist is foo_jean's own; address it by its role rather than by its id
            - this install has playback control turned off; turn on controlPlayback in config.json to allow it
            - this install has output device changes turned off; turn on changeOutput in config.json to allow them
            - the player does not list that output device; read the outputs again
        detail:
          type: string
          description: |
            Empty except for a query foobar2000 could not read, where it carries the player's own parse error, and for a key refused on an autoplaylist this component did not make, where it says what a key names. Both describe text the client sent rather than anything on the player's disk, so they are safe to show.

    State:
      description: |
        What `GET /state` answers. The library's two generations ride under `library`, and
        what the player is doing rides under `player`.
      type: object
      additionalProperties: false
      required: [library, player, configGeneration, mainThread]
      properties:
        library: { $ref: "#/components/schemas/Library" }
        player: { $ref: "#/components/schemas/PlayerState" }
        mainThread: { $ref: "#/components/schemas/MainThread" }
        configGeneration:
          type: integer
          minimum: 0
          description: |
            Moves when a reload changes a key `GET /capabilities` reflects, and stands still on every other reload, including one that changed nothing or changed only a key that needs foobar2000 restarted. A client polls this to learn a switch moved without asking for capabilities on every tick.
          examples: [3]

    MainThread:
      description: |
        Whether foobar2000's main thread is running what the component hands it. Every command, every playlist read and write, the queue, tag writes and the outputs run on that thread, so while it is not answering each of them waits and then answers `504`, and `player` goes on describing the last thing the player said. A modal dialog on the player's own screen, a long scan, a hung DSP or an expensive title-formatting script can each hold it.

        The component checks by handing the thread a trivial job, at most one every two seconds and only while something polls this route, and calls it not answering once a check has waited five seconds. `answering` turns back to `true` on the first poll after the thread runs the check, whether or not a command ever went through. The `ETag` moves as a stall starts and again as it ends, and stands still while one goes on.
      type: object
      additionalProperties: false
      required: [answering, unansweredSeconds]
      properties:
        answering:
          type: boolean
          description: |
            `false` while a check has waited five seconds or more without the main thread running it.
        unansweredSeconds:
          description: |
            How long the check the thread has not run had waited when this document was built, and `null` exactly while `answering` is `true`. A `304` answers a document built earlier, so a client holding one adds the time since it arrived, as it does for `position.ageSeconds`.
          oneOf:
            - { type: number, minimum: 0 }
            - type: "null"
          examples: [7.1]

    Library:
      description: |
        What rides under `library` in `GET /state`'s `200`, and what `POST /library/rows`, the questions and `POST /library/refresh` hand back on a `202`. Small on purpose: it is polled.
      type: object
      additionalProperties: false
      required: [ready, structure, revision, trackCount, columns, changeCounts, build, halted]
      properties:
        ready:
          type: boolean
          description: |
            Whether a snapshot has been built. False only between the component starting and its first walk finishing. Every other library route answers `503` while it is false.
        structure:
          type: integer
          description: |
            Moves when tracks are added to or removed from the library. A different value from the one a client's windows were read at means every ordinal it holds is meaningless: it asks for its windows again. `0` before the first build. The first value of a run is seeded at start and never repeats across runs of the component, within the range of an integer JSON can carry exactly, so a `structure` names one generation of one run.
          examples: [41]
        revision:
          type: integer
          description: |
            Moves when a row changes in place, which is what a play, a rating or a tag edit does. A higher value with an unchanged `structure` means rows changed in place, and `changeCounts` says in which columns.
          examples: [903]
        trackCount:
          type: integer
          description: Rows in the snapshot.
          examples: [30441]
        columns:
          type: array
          items: { type: string }
          description: |
            The title-formatting expressions the ready snapshot was built with, in the order of a rows header's `columns` array. Empty while `ready` is false. The spine is not among them: `directory`, `filename` and `subsong` are always built and are reported under `spine` instead.

            This is what a client compares against between a `202` from `POST /library/rows` and its next attempt. The comparison is by membership: same members, in any order, is the same declaration.
          examples: [["%title%", "%album artist%", "%play_count%"]]
        changeCounts:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One count per entry of `columns`, in the same order: a counter that moves whenever a value in that column changes in place. A client compares it for equality, which is how it learns a held window or an answer computed from that column is stale when `revision` moved for another column's sake. Empty while `columns` is.
          examples: [[0, 12, 903]]
        build:
          description: |
            Progress on a snapshot the component is building right now, or `null` while none is. This covers every build: the first walk, one started by a newly declared column set, and a rebuild asked for through `POST /library/refresh`.
          oneOf:
            - { $ref: "#/components/schemas/LibraryBuild" }
            - type: "null"
        halted:
          type: boolean
          description: |
            Whether the implementation has stopped reading the library for good, after failing too often to recover on its own. Once true it stays true until the implementation restarts: `build` is `null`, no further build starts, and the snapshot held when it stopped, if any, goes on being served at the generations above. A client waiting on a build stops waiting and tells its user the player needs restarting.

    LibraryRole:
      description: A declared title-formatting expression, 1 to 1024 printable characters. Every role of every library read takes one.
      type: string
      minLength: 1
      maxLength: 1024

    LibrarySummary:
      description: |
        What `GET /library/summary` answers, computed at the `structure` and `revision` it carries. An ordinal anywhere in it is at that `structure`, and means nothing at another.
      type: object
      additionalProperties: false
      required: [structure, revision, trackCount, seconds, earliestYear, latestYear, albumCount, artistCount, genreCount, topGenres, topAlbum, topArtist, topTracks, shelves]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        trackCount: { type: integer, description: "Tracks in the library." }
        seconds: { type: number, description: "Total length of the library in seconds." }
        earliestYear:
          type: [integer, "null"]
          description: The earliest year any track carries, or `null` where none carries one.
        latestYear:
          type: [integer, "null"]
          description: The latest year any track carries, or `null` where none carries one.
        albumCount: { type: integer, description: "Albums, as the grouping rule in `GET /library/summary` forms them." }
        artistCount: { type: integer, description: "Distinct credited artists." }
        genreCount: { type: integer, description: "Distinct genres." }
        topGenres:
          type: array
          maxItems: 14
          description: The most common genres, most common first.
          items:
            type: object
            additionalProperties: false
            required: [name, count, share]
            properties:
              name: { type: string }
              count: { type: integer }
              share: { type: integer, description: "`count` as a percentage of `trackCount`, rounded to a whole number." }
        topAlbum:
          description: The most played album, or `null` where no album has a play.
          oneOf:
            - { $ref: "#/components/schemas/SummaryAlbum" }
            - type: "null"
        topArtist:
          description: The most played artist, or `null` where none has a play.
          oneOf:
            - { $ref: "#/components/schemas/SummaryArtist" }
            - type: "null"
        topTracks:
          type: array
          maxItems: 10
          description: The most played tracks, most played first.
          items: { $ref: "#/components/schemas/SummaryTrack" }
        shelves:
          type: array
          description: The shelves that reach their minimum, in the order `GET /library/summary` lists them.
          items: { $ref: "#/components/schemas/SummaryShelf" }
        genres:
          type: array
          description: Present only when the request sent `genres=true`, and absent otherwise. Every genre of the library, most tracks first and then by the genre's key compared by UTF-16 code unit, which is not bytewise order.
          items: { $ref: "#/components/schemas/SummaryGenre" }

    SummaryArtist:
      type: object
      additionalProperties: false
      required: [name, plays, albumCount, trackCount, cover]
      properties:
        name:
          type: [string, "null"]
          description: The credited artist, or `null` for tracks that credit none.
        plays: { type: number }
        albumCount: { type: integer }
        trackCount: { type: integer }
        cover:
          description: The artist's most played album.
          $ref: "#/components/schemas/SummaryAlbum"

    SummaryAlbum:
      type: object
      additionalProperties: false
      required: [album, artist, cover, ordinals, trackCount, plays, lastPlayed, added, rating, ratedCount, bitrate]
      properties:
        album: { type: string }
        artist: { type: [string, "null"] }
        cover:
          type: [string, "null"]
          description: The library-relative path `GET /artwork?track=` takes, or `null` where the album has none.
        ordinals:
          type: array
          items: { type: integer }
          description: Every track of the album, ascending, at the document's `structure`.
        trackCount: { type: integer }
        plays: { type: number }
        lastPlayed: { type: number, description: "Milliseconds since the epoch of the latest play, `0` where unknown." }
        added: { type: number, description: "Milliseconds since the epoch of the latest arrival, `0` where unknown." }
        rating: { type: [number, "null"], description: "The mean rating of the rated tracks, or `null` where none is rated." }
        ratedCount: { type: integer, description: "Tracks with a rating." }
        bitrate: { type: [number, "null"], description: "The mean bitrate, or `null` where none is known." }

    SummaryTrack:
      type: object
      additionalProperties: false
      required: [ordinal, title, artist, plays, cover]
      properties:
        ordinal: { type: integer }
        title: { type: [string, "null"] }
        artist: { type: [string, "null"] }
        plays: { type: number }
        cover: { type: [string, "null"], description: "The library-relative path `GET /artwork?track=` takes, or `null`." }

    SummaryShelf:
      description: |
        One shelf. `figures` is computed over the tracks of the shelf's albums together.
      type: object
      additionalProperties: false
      required: [id, albums, figures]
      properties:
        id:
          type: string
          enum: [added, recent, top, rated, loved, upgrade, unopened, starter]
        albums:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/SummaryAlbum" }
        figures:
          $ref: "#/components/schemas/SetFigures"

    OrdinalSet:
      description: |
        A set of tracks as ascending ordinals at the `structure` of the answer carrying it, in exactly one of two forms: `runs`, or `bitset`. Whichever serialises shorter is sent, and `runs` on a tie. An empty set is `{ "runs": [] }`. See *The four questions*.
      oneOf:
        - type: object
          additionalProperties: false
          required: [runs]
          properties:
            runs: { $ref: "#/components/schemas/Runs" }
        - type: object
          additionalProperties: false
          required: [bitset]
          properties:
            bitset: { $ref: "#/components/schemas/Bitset" }

    SetFigures:
      description: |
        The header figures of a set of tracks, computed over exactly that set by the rules `GET /library/summary` uses for the whole library.
      type: object
      additionalProperties: false
      required: [albumCount, trackCount, seconds, earliestYear, latestYear]
      properties:
        albumCount: { type: integer, description: "Albums, as the grouping rule in `GET /library/summary` forms them, over the set." }
        trackCount: { type: integer, description: "Tracks in the set." }
        seconds: { type: number, description: "Total length of the set in seconds." }
        earliestYear:
          type: [integer, "null"]
          description: The earliest year any track of the set carries, or `null` where none carries one.
        latestYear:
          type: [integer, "null"]
          description: The latest year any track of the set carries, or `null` where none carries one.

    ArtistCards:
      description: |
        The figures an artist page draws its cards from, computed over the artist's `all` set, which is `own`, `shared` and `guest` together.
      type: object
      additionalProperties: false
      required: [playedShare, plays, neverPlayed, lastPlayed, mostPlayed, topGenres]
      properties:
        playedShare: { type: number, minimum: 0, maximum: 1, description: "The share of the set's tracks with at least one play." }
        plays: { type: integer, description: "Plays summed over the set." }
        neverPlayed: { type: integer, description: "Tracks of the set with no play." }
        lastPlayed:
          type: [number, "null"]
          description: Milliseconds since the epoch of the latest play of any track in the set, or `null` where none has one.
        mostPlayed:
          description: The most played track of the set, or `null` where none has a play.
          oneOf:
            - type: object
              additionalProperties: false
              required: [ordinal, title, plays]
              properties:
                ordinal: { type: integer, minimum: 0, description: "The track's ordinal at the document's `structure`." }
                title: { type: string, description: "The track's title, carried so a client that does not hold the row can draw the card." }
                plays: { type: integer, description: "Its play count." }
            - type: "null"
        topGenres:
          type: array
          maxItems: 4
          description: The most common genres of the set, most common first.
          items:
            type: object
            additionalProperties: false
            required: [name, count, share]
            properties:
              name: { type: string }
              count: { type: integer }
              share: { type: integer, description: "`count` as a percentage of the set's tracks, rounded to a whole number." }

    AlbumRecord:
      description: |
        One album of an artist's `own` or `shared` set, as a record on the artist's page.
      type: object
      additionalProperties: false
      required: [album, artist, year, cover, trackCount]
      properties:
        album: { type: string }
        artist: { type: [string, "null"] }
        year: { type: [integer, "null"], description: "The album's year, or `null` where its tracks carry none." }
        cover: { type: string, description: "The library-relative path `GET /artwork?track=` takes, of the album's first row within the set the records are computed over, the artist's `own` or `shared`. For a shared album that need not be the album's canonical cover track." }
        trackCount: { type: integer, description: "Tracks of the album within the set." }

    SummaryGenre:
      description: One genre of the whole library, as the genres page draws its tiles.
      type: object
      additionalProperties: false
      required: [name, count, albumCount, artistCount, covers]
      properties:
        name: { type: string }
        count: { type: integer, description: "Tracks holding the genre." }
        albumCount: { type: integer, description: "Albums, as the grouping rule in `GET /library/summary` forms them, with at least one track in the genre." }
        artistCount: { type: integer, description: "Distinct credited artists over the genre's tracks, as the credited artist is read for an album." }
        covers:
          type: array
          maxItems: 2
          items: { type: string }
          description: The library-relative paths `GET /artwork?track=` takes, of the first track in this genre of each of the tile's two largest albums, largest by tracks in the genre. They are not the albums' cover tracks.

    SearchAnswer:
      description: |
        What `GET /library/search` answers, computed at the `structure` and `revision` it carries. `figures` is over `matched`, and all zero and null where `matched` is `null`. An ordinal anywhere in it is at that `structure`, and means nothing at another.
      type: object
      additionalProperties: false
      required: [structure, revision, matched, matchCount, figures, best, artists, albums, genres, namesATrack]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        matched:
          description: Every matching track, or `null` where the query folds to nothing or the library holds no tracks.
          oneOf:
            - { $ref: "#/components/schemas/OrdinalSet" }
            - type: "null"
        matchCount: { type: integer, description: "The size of `matched`, and `0` where it is `null`." }
        figures: { $ref: "#/components/schemas/SetFigures" }
        best:
          type: array
          items: { type: integer }
          description: The best `limit` matching tracks as ordinals, in rank order.
        artists: { $ref: "#/components/schemas/ArtistSection" }
        albums: { $ref: "#/components/schemas/AlbumSection" }
        genres: { $ref: "#/components/schemas/GenreSection" }
        namesATrack: { type: boolean, description: "Whether a matching track's title folds to the same text as the query." }

    ArtistSection:
      type: object
      additionalProperties: false
      required: [total, top]
      properties:
        total: { type: integer, description: "How many artists the query admits." }
        top:
          type: array
          items: { $ref: "#/components/schemas/NamedArtist" }
          description: "The first `entityLimit` of them in rank order."

    AlbumSection:
      type: object
      additionalProperties: false
      required: [total, top]
      properties:
        total: { type: integer, description: "How many albums the query admits." }
        top:
          type: array
          items: { $ref: "#/components/schemas/NamedAlbum" }
          description: "The first `entityLimit` of them in rank order."

    GenreSection:
      type: object
      additionalProperties: false
      required: [total, top]
      properties:
        total: { type: integer, description: "How many genres the query admits." }
        top:
          type: array
          items: { $ref: "#/components/schemas/NamedGenre" }
          description: "The first `entityLimit` of them in rank order."

    NamedArtist:
      type: object
      additionalProperties: false
      required: [name, trackCount, guestCount, albumCount, cover]
      properties:
        name: { type: string }
        trackCount: { type: integer, description: "Tracks credited to the artist that are not guest credits." }
        guestCount: { type: integer, description: "Guest credits." }
        albumCount: { type: integer }
        cover:
          type: [string, "null"]
          description: The library-relative path `GET /artwork?track=` takes, of the canonical track of the album holding the artist's first credited track that has an album tag, or `null` where none does.

    NamedAlbum:
      type: object
      additionalProperties: false
      required: [album, artist, trackCount, cover]
      properties:
        album: { type: string }
        artist: { type: [string, "null"] }
        trackCount: { type: integer }
        cover:
          type: [string, "null"]
          description: The library-relative path `GET /artwork?track=` takes, of the album's canonical track, or `null` where it has none.

    NamedGenre:
      type: object
      additionalProperties: false
      required: [name, trackCount]
      properties:
        name: { type: string }
        trackCount: { type: integer }

    AlbumAnswer:
      description: |
        What `GET /library/album` answers, computed at the `structure` and `revision` it carries. `figures` is over `refs`.
      type: object
      additionalProperties: false
      required: [structure, revision, refs, figures, album, artist]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        refs: { $ref: "#/components/schemas/OrdinalSet" }
        figures: { $ref: "#/components/schemas/SetFigures" }
        album: { type: string, description: "The album as its tracks spell it, or as asked where no track matched." }
        artist: { type: [string, "null"], description: "The credited artist as the tracks spell it, `null` where none." }

    ArtistAnswer:
      description: |
        What `GET /library/artist` answers, computed at the `structure` and `revision` it carries. The three sets share no ordinal. `figures` and `cards` are computed over `own`, `shared` and `guest` together.
      type: object
      additionalProperties: false
      required: [structure, revision, own, shared, guest, figures, cards, records]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        own: { $ref: "#/components/schemas/OrdinalSet" }
        shared: { $ref: "#/components/schemas/OrdinalSet" }
        guest: { $ref: "#/components/schemas/OrdinalSet" }
        figures: { $ref: "#/components/schemas/SetFigures" }
        cards: { $ref: "#/components/schemas/ArtistCards" }
        records:
          type: object
          additionalProperties: false
          required: [own, shared]
          description: The albums of the `own` set and of the `shared` set, each as records.
          properties:
            own:
              type: array
              items: { $ref: "#/components/schemas/AlbumRecord" }
            shared:
              type: array
              items: { $ref: "#/components/schemas/AlbumRecord" }

    GenreAnswer:
      description: |
        What `GET /library/genre` answers, computed at the `structure` and `revision` it carries. `figures` is over `refs`.
      type: object
      additionalProperties: false
      required: [structure, revision, refs, figures]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        refs: { $ref: "#/components/schemas/OrdinalSet" }
        figures: { $ref: "#/components/schemas/SetFigures" }

    LibraryRowsRequest:
      description: |
        The body of `POST /library/rows`: the declaration, the generation, and exactly one form of the set.
      type: object
      additionalProperties: false
      required: [columns, structure]
      properties:
        columns:
          type: array
          items: { type: string, minLength: 1, maxLength: 1024 }
          minItems: 1
          maxItems: 64
          description: |
            The declaration: at most 64, each 1 to 1024 printable characters, no repeats. The three spine columns are always built and MUST NOT be named.
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The `structure` generation the ordinals were resolved against: `library.structure` from `GET /state`, spelled as a string of decimal digits. `GET /state` carries the pair as JSON numbers, and this body carries it as text, as a playlist's own `structure` travels, so the same rule applies: send the digits exactly as they were read, and anything else is a `400`. A value other than the one currently held is a `409`.
          examples: ["41"]
        runs: { $ref: "#/components/schemas/Runs" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }

    LibraryRowsHeader:
      description: |
        The JSON header inside a `POST /library/rows` body, between the four-byte magic number and the blob. It is not served on its own. The framing and how to read a column are in *The media library*, at the top of this document.
      type: object
      additionalProperties: false
      required: [kind, structure, revision, trackCount, rows, columns, spine]
      properties:
        kind:
          type: string
          enum: [rows]
          description: What this body is. A client MUST check it rather than infer it from the URL.
        structure:
          type: integer
          description: The generation the rows were read at.
        revision:
          type: integer
          description: The revision the rows were read at.
        trackCount:
          type: integer
          description: Rows in the whole snapshot, not the rows in this body.
        rows:
          type: integer
          minimum: 0
          description: Rows in this body, the length of every `ids` array in it.
        columns:
          type: array
          description: Every declared column, in the order declared, each with its `name`, its `ids` and `dict`, and the whole library's `distinct`, `hasUnresolved` and `allUnresolved`.
          items: { $ref: "#/components/schemas/LibraryColumn" }
        spine:
          type: object
          additionalProperties: false
          required: [directory, filename, subsong]
          description: The three columns the component always builds, keyed by name rather than carrying one, always carried in full.
          properties:
            directory:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: |
                The track's directory relative to the library root, forward-slashed on every platform and keeping its trailing slash, so `directory + filename` is the whole relative path. Empty for a track at the root. The library root itself is never published.
            filename:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: The last segment of the path, extension included.
            subsong:
              allOf: [{ $ref: "#/components/schemas/LibraryColumn" }]
              description: |
                The player's own subsong number within the file, as decimal text, for cue sheets and disc images. `0` for an ordinary file, and never a position among the rows at one path. Text like every other column, because nothing here types a value.

    LibraryRuns:
      description: |
        What `GET /library/runs` answers, computed at the `structure` and `revision` it carries. Run *i* covers the next `lengths[i]` ordinals after the runs before it.
      type: object
      additionalProperties: false
      required: [structure, revision, lengths, covers, untagged]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        lengths:
          type: array
          items: { type: integer, minimum: 1 }
          description: Each run's length, in ordinal order.
        covers:
          type: array
          items: { type: integer, minimum: 0 }
          description: The ordinal of each run's cover track, parallel to `lengths`. It may lie outside the run.
        untagged:
          type: array
          items: { type: integer, minimum: 0 }
          description: The ascending indices into `lengths` of the runs whose rows carry no album tag, each a group of untagged rows by one credit, and empty where there are none. A client needs it because a tagged run contributes its first position once per album record to the header's covers, where an untagged run contributes every position, and `covers` alone cannot tell the two apart.

    LibraryValues:
      description: |
        What `GET /library/values` answers, computed at the `structure` and `revision` it carries.
      type: object
      additionalProperties: false
      required: [structure, revision, values]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        values:
          type: array
          items: { type: string }
          description: The field's distinct values beginning with the prefix, at most `limit`, in the order the component holds them.

    CreditMember:
      description: One artist a credit names.
      type: object
      additionalProperties: false
      required: [name, key, isGuest]
      properties:
        name: { type: string, description: The artist as the credit spells it. }
        key: { type: string, description: The name folded as the four questions match an artist. }
        isGuest: { type: boolean, description: Whether the credit names the artist as a guest. }

    LibraryCredits:
      description: |
        What `GET /library/credits` answers, computed at the `structure` and `revision` it carries.
      type: object
      additionalProperties: false
      required: [structure, revision, artist, albumArtist]
      properties:
        structure: { type: integer, description: "The snapshot's `structure` the document was computed at." }
        revision: { type: integer, description: "The snapshot's `revision` the document was computed at." }
        artist:
          type: array
          items: { $ref: "#/components/schemas/CreditMember" }
          description: The members the track's artist credit names.
        albumArtist:
          type: array
          items: { $ref: "#/components/schemas/CreditMember" }
          description: The members the track's album artist credit names.

    PlaylistRuns:
      description: |
        What `GET /playlists/{id}/runs` answers, at the playlist's `structure` and `revision`.
      type: object
      additionalProperties: false
      required: [structure, revision, lengths, mostPlays, albumCount, trackCount, seconds, earliestYear, latestYear]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: The playlist's structure generation, as `PlaylistPage` has it.
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: The playlist's content revision, as `PlaylistPage` has it.
        lengths:
          type: array
          items: { type: integer, minimum: 1 }
          description: Each run's length, in row order. They sum to `trackCount`.
        mostPlays: { type: integer, minimum: 0, description: "The highest play count of any row." }
        albumCount: { type: integer, description: "Albums, as `LibrarySummary.albumCount` counts them, over the playlist's rows." }
        trackCount: { type: integer, description: "Rows in the playlist." }
        seconds: { type: number, description: "Total length of the playlist in seconds." }
        earliestYear:
          type: [integer, "null"]
          description: The earliest year any row carries, or `null` where none carries one.
        latestYear:
          type: [integer, "null"]
          description: The latest year any row carries, or `null` where none carries one.

    PlaylistFind:
      description: |
        What `GET /playlists/{id}/find` answers, at the playlist's `structure` and `revision`. `matched` holds positions in the playlist, counted from zero, and never library ordinals.
      type: object
      additionalProperties: false
      required: [structure, revision, matched]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: The playlist's structure generation, as `PlaylistPage` has it.
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: The playlist's content revision, as `PlaylistPage` has it.
        matched: { $ref: "#/components/schemas/OrdinalSet" }

    LibraryBuild:
      description: |
        How far the running build has gotten.
      type: object
      additionalProperties: false
      required: [phase, formatted, total]
      properties:
        phase:
          type: string
          enum: [listing, ordering, formatting]
          description: |
            `listing` walks the player for its tracks. `ordering` sorts them into the snapshot's own order, in memory, with no count of its own. `formatting` runs the declared columns through title-formatting, in slices of 8,192 tracks.
        formatted:
          type: integer
          description: |
            Tracks formatted so far. Moves once a slice of 8,192 tracks finishes, rather than continuously, so a library of one slice or fewer goes from nothing formatted to done.
          examples: [16384]
        total:
          type: integer
          description: |
            Tracks in the build. `0` during `listing`, since the count is not yet known; set once `ordering` starts.
          examples: [30441]

    PlayingLocation:
      description: |
        Where the playing track sits: the playlist's GUID and the item's position within it.
      type: object
      additionalProperties: false
      required: [playlistId, index]
      properties:
        playlistId:
          type: string
          description: |
            foobar2000's own playlist GUID, lower case and dashed, matching `PlaylistAnnotation.id` for the same playlist.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        index:
          type: integer
          minimum: 0
          description: The playing item's position within that playlist, 0-based.

    PlayerState:
      description: |
        What rides under `player` in `GET /state`'s `200`. Always present and never null: a
        stopped player still answers this section, with `playback` `stopped` and `path` empty.
      type: object
      additionalProperties: false
      required:
        [playback, path, subsong, libraryPath, libraryOrdinal, position, duration, volume, muted, playbackMode,
         outputDeviceId, outputSilent, title, artist, album, albumArtist, playingLocation,
         currentPlaylistId, queueRevision, playlistsRevision, timelineRevision, sessionRevision]
      properties:
        playback:
          type: string
          enum: [stopped, paused, playing]
          description: |
            What the player is doing right now. A detached session set to play reads `paused` while no connection listens to its stream, a device inside its linger included, and its position stands still; it reads `playing` from the moment a connection listens. A detached session paused through `POST /playback/play-pause` or `POST /playback/pause` reads `paused` whether or not anybody listens.
        path:
          type: string
          description: |
            What is playing, or empty when nothing is. foobar2000's own absolute
            display path, in the player's own separator. Not the media library
            snapshot's key, which is `directory` plus `filename`, library-relative
            and forward-slashed everywhere.
        subsong:
          type: integer
          description: The player's own subsong number within `path`, for a cue sheet or a disc image. `0` for an ordinary file.
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds the playing track, or `null` where it does not. With `subsong` it is the library address `POST /tags` takes, and it is the only address a client can write a rating for the playing track to: `path` is foobar2000's own absolute one and no route here accepts it.
        libraryOrdinal:
          type: [integer, "null"]
          minimum: 0
          description: |
            The playing track's ordinal in the snapshot, at the `structure` the same document reports under `library`, or `null` where the media library does not hold the playing track. It is resolved when the document is written, so a move of `structure` under a playing track moves it, and it means nothing at another `structure`. A detached session's `player` carries its own.
        position: { $ref: "#/components/schemas/Position" }
        duration:
          type: number
          description: The playing track's length in seconds, or `0` when nothing is playing.
        volume:
          type: number
          description: The player's own volume, in whatever range it reports.
        muted:
          type: boolean
        playbackMode:
          description: |
            Jean's name for the playback order the player is in right now, or `null` when this component has no name for the order the player reports. Always present and never omitted, so a client can tell "no name for this" from "too old to report".
          oneOf:
            - { $ref: "#/components/schemas/PlaybackMode" }
            - type: "null"
        outputDeviceId:
          type: [string, "null"]
          description: |
            The id of the device the player is set to, spelled exactly as `GET /outputs` spells it, or `null` where the component cannot ask. It rides every poll of this document because it is one field; the device list is its own route because building it costs more than a poll should.
        outputSilent:
          type: [boolean, "null"]
          description: |
            `true` exactly where the active output is foobar2000's Null Output, whichever of its devices is chosen, and `false` for every other output. `null` exactly where `outputDeviceId` is `null`. It is a guess about one output and says nothing else: it is `false` for speakers that are unplugged, for a muted player and for a third-party output that plays nowhere, and neither the volume, `muted` nor the stream's hold (`playerMuted`) moves it. It answers the player whichever session is named.
        title:
          type: [string, "null"]
          description: |
            The playing track's title, computed by the player, or `null` when it has not computed one.
        artist:
          type: [string, "null"]
          description: |
            The playing track's artist, computed by the player, or `null` when it has not computed one.
        album:
          type: [string, "null"]
          description: |
            The record the playing track is from, computed by the player, or `null` when it has not computed one. A client keys a cover by this, alongside `albumArtist`, rather than by the track, so an album played through costs one request.
        albumArtist:
          type: [string, "null"]
          description: |
            The playing track's album artist, computed by the player, or `null` when it has not computed one. Not filled in from `artist`: a compilation credits a different artist on every row of the same record.
        playingLocation:
          description: |
            Where the playing track sits, or `null` when it is not playing from a playlist this component can name.
          oneOf:
            - { $ref: "#/components/schemas/PlayingLocation" }
            - type: "null"
        currentPlaylistId:
          type: [string, "null"]
          description: |
            The playlist the player has focused, by the `id` a `PlaylistAnnotation` carries. `null` where the player has no focused playlist at all, which is a state foobar2000 can be in and not an error.

            **This is not where the playing track is**, which is `playingLocation` and can name a different playlist: what is focused is a property of the player's own window. It is here rather than as a flag on `GET /playlists` because a client watching it wants it at the rate it polls playback, and because it moves when nothing about the playlist list has.

            It decides more than which tab is drawn. Under foobar2000's *Playback follows cursor* it is also the playlist an advance takes its next track from, so a client that started a set and sees this naming something else is about to lose playback to it.
          example: 45837d74-fa4f-415c-bba9-bf2db8f0dc04
        queueRevision:
          type: integer
          description: |
            Moves when the queue's contents or order change, or when a queued entry's playlist position shifts or is lost. Never moves for anything else this section reports.
        playlistsRevision:
          type: integer
          description: |
            Moves when a playlist is created, removed, moved in the list or retitled, and when any playlist's `structure` or `revision` moves. A client re-reads `GET /playlists` when the one it holds has moved, and not otherwise.
        timelineRevision:
          type: integer
          description: |
            Moves when the encoder lays a mark on the timeline `GET /stream/timeline` answers, for a track starting or a seek. Never moves for anything else this section reports. `0`, and never moving, where `maxConcurrentStreams` is `0` in `config.json`.
        sessionRevision:
          type: integer
          minimum: 0
          description: |
            Moves when the named detached session's `shared`, `chainDropped` or `reports` move, and for nothing else: a client reads `GET /sessions/{id}` again when the one it holds has moved, as it reads the queue on `queueRevision`. A track change does not move it. `0`, and never moving, for the player's own session.

    Position:
      description: |
        Where playback was at the moment this component last looked, and how long ago that
        was. A `steady_clock` mark means nothing on another machine, so `ageSeconds` is the
        only part of it a client can use: it adds `ageSeconds` to `seconds` and keeps counting
        from there while `player.playback` is `playing`.
      type: object
      additionalProperties: false
      required: [seconds, ageSeconds]
      properties:
        seconds:
          type: number
          description: Playback position at the mark, in seconds.
        ageSeconds:
          type: number
          description: |
            How long before this response was built the mark was taken, in seconds. `0` when
            no mark has ever been taken.

    PlaylistPage:
      description: |
        `GET /playlists/{id}/items`'s whole answer: the rows asked for, how many the playlist holds, and the two numbers they were read at.
      type: object
      additionalProperties: false
      required: [structure, revision, totalCount, items]
      properties:
        structure:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's structure generation as of this read, the same value `GET /playlists` reports for it. Rows held against an older one sit at positions that have moved.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives: it is a 64-bit counter and a JSON number could not carry it. `totalCount` beside it is a plain number, and so is every position in `items`.
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's content revision as of this read. A different one with the same `structure` means a row already in the playlist would answer differently. Compared for equality and never for order: these are strings, and a higher counter does not sort higher.
        totalCount:
          type: integer
          minimum: 0
          description: How many rows the whole playlist holds, not how many this page carries.
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistRow" }

    PlaylistChanges:
      description: |
        `GET /playlists/{id}/items/changes`'s whole answer: the rows whose content moved, the values they now carry, and the revision they bring the client up to. No `structure`, because the request named the only one this answer can be against.

        Values are deduplicated, which `GET /playlists/{id}/items` does not do. A change reaching many rows at once, a bulk retag or a folder rescan, is mostly one value repeated, and a client that cannot tell a repeat from a fresh value grows its dictionary by a row rather than by a value. So the values sit in `columns` and the rows carry only where they are. Deduplication is **within this one response**: no dictionary here has a `base`, nothing is measured against what the client already holds, and the component keeps no dictionary between responses.
      type: object
      additionalProperties: false
      required: [revision, columns, items]
      properties:
        revision:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The playlist's content revision as of this read. A client that patches these rows in holds this revision and sends it back as `since` next time.

            A string of decimal digits, for the reason `PlaylistAnnotation.structure` gives. Store it as it arrived: a round trip through a number lands on a neighbour of it, and the next request is then refused or, worse, answers nothing and looks caught up.
        columns:
          type: array
          items: { $ref: "#/components/schemas/ChangedPlaylistColumn" }
          description: |
            One dictionary per column the request declared, in the order it declared them, whenever `items` carries a row. Empty when `items` is, which is the answer a client polling a quiet playlist gets every tick and the reason this is not padded out to the declared count. Any other length means the two sides disagree about the column set: read the page again rather than patch.
        items:
          type: array
          items: { $ref: "#/components/schemas/ChangedPlaylistRow" }
          description: |
            Only the rows whose content moved, in no promised order. A client patches each into the page it holds by `position`, and reads its values at the same index in every entry of `columns`.

    ChangedPlaylistColumn:
      description: |
        One column's values across this response: the distinct strings it takes, and one id per changed row. Row *i* in `items` takes `text[ids[i]]`, so `ids` is as long as `items` and `text` is as long as the column has distinct values here.

        The names come from `LibraryColumn`, and so does what they mean. Two things differ, both because this is JSON rather than a blob. There is no `ends`: JSON delimits its own strings, so `text` is the array of values instead of a run of bytes with offsets into it.
      type: object
      additionalProperties: false
      required: [text, ids]
      properties:
        text:
          type: array
          items: { type: string }
          description: |
            Every distinct value this column takes across this response, each carried once however many changed rows share it, in no promised order. A field the player cannot resolve is `?`, the single question mark, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Album", "?"]]
        ids:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            One index into `text` per changed row, in the order `items` carries them. As long as `items`, and every entry below `text`'s length.
          examples: [[0, 0, 1]]

    ChangedPlaylistRow:
      description: |
        Where one row whose content moved sits, and where the media library holds its track. Its values are not here: they are in `PlaylistChanges.columns`, at this row's index in `items`.
      type: object
      additionalProperties: false
      required: [position, libraryPath, subsong]
      properties:
        position:
          type: integer
          minimum: 0
          description: |
            Where this row sits in the playlist, counting from zero, at the `structure` the request named.
          examples: [1]
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds this track, or `null` where it does not.
        cover:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, of the cover track of this row's album, or `null` where the media library does not hold the row. Present only when the request named roles, and absent otherwise.
        subsong:
          type: integer
          minimum: 0
          description: |
            Which track inside the file this row holds, `0` for an ordinary file, read from the handle the row was drawn from rather than from the media library. It is the other half of the library address `POST /tags` takes: every track of one cue sheet shares a `libraryPath`, and a cue sheet's subsongs number from 1, so an address carrying the path alone reaches none of them.

            It is not one of the declared `columns`, and a client MUST NOT ask for `%subsong%` there: that declaration is shared with `POST /library/rows`, so widening it rebuilds the snapshot and moves its `structure`.
          examples: [0]

    PlaylistRow:
      description: |
        One row of a playlist, evaluated against the handle that row holds rather than against a media library record, so a track the library does not hold answers its columns like every other row.
      type: object
      additionalProperties: false
      required: [columns, libraryPath, subsong]
      properties:
        columns:
          type: array
          items: { type: string }
          description: |
            One value per declared column, in the order declared. A field the player cannot resolve is `?`, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Track", "Fictional Artist"]]
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds this track, or `null` where it does not.
        cover:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, of the cover track of this row's album, or `null` where the media library does not hold the row. Present only when the request named roles, and absent otherwise.
        subsong:
          type: integer
          minimum: 0
          description: |
            Which track inside the file this row holds, `0` for an ordinary file, read from the handle the row was drawn from rather than from the media library. It is the other half of the library address `POST /tags` takes: every track of one cue sheet shares a `libraryPath`, and a cue sheet's subsongs number from 1, so an address carrying the path alone reaches none of them.

            It is not one of the declared `columns`, and a client MUST NOT ask for `%subsong%` there: that declaration is shared with `POST /library/rows`, so widening it rebuilds the snapshot and moves its `structure`.
          examples: [0]

    QueueRead:
      description: |
        `GET /queue`'s whole answer: every queued entry, in the player's own order, and the queue revision they were read at.
      type: object
      additionalProperties: false
      required: [revision, entries]
      properties:
        revision:
          type: integer
          description: |
            `GET /state`'s `queueRevision` as of this read. A client refetches when the one it holds has moved, and not otherwise.
        entries:
          type: array
          items: { $ref: "#/components/schemas/QueuedTrack" }

    QueuedTrack:
      description: |
        One entry in the play queue, as a client draws a row: the fixed fields a row shows, where the track sits in the media library, and where it sits in a playlist. A missing tag is an empty string, never `null` and never `"?"`.
      type: object
      additionalProperties: false
      required: [title, artist, duration, album, albumArtist, libraryPath, location]
      properties:
        title: { type: string }
        artist: { type: string }
        duration:
          type: number
          description: Seconds.
        album: { type: string }
        albumArtist: { type: string }
        libraryPath:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, where the media library holds this track, or `null` where it does not.
        cover:
          type: [string, "null"]
          description: |
            The library-relative, forward-slashed key `GET /artwork?track=` takes, of the cover track of this row's album, or `null` where the media library does not hold the row. Present only when the request named roles, and absent otherwise.
        location:
          description: |
            Where this entry sits in a playlist, or `null` for a library track queued by handle and for a playlist row whose position the player has lost. The core keeps such an entry rather than dropping it; read it through the handle it carries, never through a stale position.
          oneOf:
            - { $ref: "#/components/schemas/PlayingLocation" }
            - type: "null"

    QueuePlaylistRowsRequest:
      type: object
      additionalProperties: false
      required: [playlistId, positions]
      properties:
        playlistId:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: |
            The `id` from a `PlaylistAnnotation`: foobar2000's own playlist GUID, lower case, dashed, no braces.
          examples: ["45837d74-fa4f-415c-bba9-bf2db8f0dc04"]
        positions:
          type: array
          items: { type: integer, minimum: 0 }
          minItems: 1
          description: |
            The rows to queue, by position in that playlist, in the order to queue them in -- the order a multi-select was clicked in, never sorted and never queued as a range.
          examples: [[7, 2, 5]]
        at:
          type: integer
          minimum: 0
          description: |
            Where in the queue to insert, `0` being the head. Omit it to queue at the end. Sent only together with `revision`; `at` without `revision` is a `400`.
          examples: [1]
        revision:
          type: integer
          description: |
            The queue revision `at` was chosen against, from `GET /state`'s `queueRevision`. Required whenever `at` is sent.
          examples: [9]

    QueueLibraryTracksRequest:
      type: object
      additionalProperties: false
      required: [structure]
      properties:
        structure:
          type: integer
          description: |
            The `structure` generation the set was resolved against, read from `library.structure` in `GET /state`. A value other than the one currently held is a `409`: read `GET /state` again and resolve the set against the `structure` it reports.
          examples: [41]
        runs: { $ref: "#/components/schemas/Runs" }
        bitset: { $ref: "#/components/schemas/Bitset" }
        ordinals: { $ref: "#/components/schemas/Ordinals" }
        at:
          type: integer
          minimum: 0
          description: |
            Where in the queue to insert, `0` being the head. Omit it to queue at the end. Sent only together with `revision`; `at` without `revision` is a `400`.
          examples: [1]
        revision:
          type: integer
          description: |
            The queue revision `at` was chosen against, from `GET /state`'s `queueRevision`. Required whenever `at` is sent.
          examples: [9]

    MoveQueueRequest:
      type: object
      additionalProperties: false
      required: [from, to, revision]
      properties:
        from:
          type: integer
          minimum: 0
          description: The entry's position in the queue before the move.
          examples: [3]
        to:
          type: integer
          minimum: 0
          description: |
            The entry's position once it has moved: taken out at `from`, then put back at `to` in the queue without it. Both name a position in the same, unchanged-length queue.
          examples: [0]
        revision:
          type: integer
          description: |
            The queue revision this move was planned against, from `GET /state`'s `queueRevision` or `GET /queue`'s own `revision`. Required, unlike `QueuePlaylistRowsRequest.revision`: a move has no "the end" to fall back to that needs no plan.
          examples: [9]

    LibraryColumn:
      description: |
        One column: a dictionary of distinct strings, and one dictionary id per row. Every `offset` is a byte offset from the start of the blob and is a multiple of four.

        Every route that answers in this format uses this shape.
      type: object
      additionalProperties: false
      required: [distinct, hasUnresolved, allUnresolved]
      properties:
        name:
          type: string
          description: |
            The title-formatting expression this column was built from, exactly as configured. Present on an entry in `columns`, absent under `spine`, where the key is the name.
          examples: ["%title%"]
        ids:
          allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
          description: |
            One dictionary id per row. `count` is `rows` and entry *i* belongs to the *i*th row named.
        dict:
          type: object
          additionalProperties: false
          required: [text, ends]
          properties:
            text:
              type: object
              additionalProperties: false
              required: [offset, length]
              description: |
                Every value in the dictionary, concatenated with nothing between them, `length` bytes of UTF-8 as the player produced it. One `TextDecoder` call reads the lot; slice it lazily rather than building every string up front.
              properties:
                offset: { type: integer }
                length: { type: integer }
            ends:
              allOf: [{ $ref: "#/components/schemas/LibrarySection" }]
              description: |
                Where each value ends within `text`, exclusive. Value *i* spans `[ends[i - 1], ends[i])`, reading `ends[-1]` as `0`. `count` is the number of values the rows use, which is not `distinct`.
        distinct:
          type: integer
          description: |
            Values in the whole library's dictionary for this column, which is not the number the body carries: `ids.width` is chosen from the dictionary the body carries.
        hasUnresolved:
          type: boolean
          description: |
            Whether `?`, the single question mark, is one of the values. That is what a field the player could not resolve formats to, so this is capability detection answered exactly rather than sampled: a field that resolves on one track in ten thousand is detected here and missed by sampling.

            It replaces the guess, not the switch. A user overriding detection in a client's own settings still wins.
        allUnresolved:
          type: boolean
          description: |
            Whether `?` is the only value the column ever takes, which means the player resolves this field for nothing in this library. A client SHOULD treat the column as absent.

    LibrarySection:
      description: A run of fixed-width unsigned little-endian integers in the blob.
      type: object
      additionalProperties: false
      required: [offset, count, width]
      properties:
        offset:
          type: integer
          description: Bytes from the start of the blob. Always a multiple of four, so a typed array can be taken over it in place.
        count:
          type: integer
          description: How many integers.
        width:
          type: integer
          enum: [1, 2, 4]
          description: |
            Bytes per integer, chosen from the measured cardinality. A client MUST read it rather than assume: the same column is one byte wide in a small library and four in a large one.

    LibraryTrack:
      description: |
        `GET /track/library`'s whole answer: one row, in the columns the request declared. No address comes back, because the request carried it.
      type: object
      additionalProperties: false
      required: [columns]
      properties:
        columns:
          type: array
          items: { type: string }
          description: |
            One value per declared column, in the order declared. A field the player cannot resolve is `?`, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Track", "Fictional Artist"]]

    PlayingTrackColumns:
      description: |
        `GET /track/playing`'s whole answer: the columns the request declared, evaluated against whatever the player is playing right now, beside the identity of the track that answered. The request named no track, so `path` and `subsong` come back spelled and valued exactly as `GET /state`'s `player.path` and `player.subsong`, and a client checks them against the track it asked about before drawing anything else this answer carries.
      type: object
      additionalProperties: false
      required: [path, subsong, columns]
      properties:
        path:
          type: string
          description: |
            foobar2000's own absolute display path of the track that answered, in the player's own separator. Spelled and valued exactly as `GET /state`'s `player.path`.
        subsong:
          type: integer
          description: |
            The player's own subsong number for the track that answered, for a cue sheet or a disc image, `0` for an ordinary file. Spelled and valued exactly as `GET /state`'s `player.subsong`.
        columns:
          type: array
          items: { type: string }
          description: |
            One value per declared column, in the order declared. A field the player cannot resolve is `?`, which is how a client tells an unresolved field from an empty one.
          examples: [["Imaginary Track", "Fictional Artist"]]

    LibraryRefusal:
      description: |
        A refusal the client can act on. The request was understood and declined before the snapshot was touched.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - too many columns
            - unacceptable column
            - duplicate column
            - unacceptable revision
            - unacceptable role
            - duplicate role
            - unacceptable question
            - duplicate question
            - too many rows asked for
        detail:
          type: string
          description: |
            What specifically was wrong, naming the position of the offending column where there is one. Safe to show a person: it describes the request the client sent and nothing on the player's disk.

    LibraryFailed:
      description: The request was acceptable and the snapshot could not answer it.
      type: object
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - the library snapshot has not been built yet
            - "tracks were added or removed; read the state and ask again"
        detail:
          type: string
          description: Always empty. It is present so that every library failure reads as one shape.

    Error:
      description: |
        The minimum shape every failing response carries. It says nothing about what broke inside the component, because error text leaks filesystem paths.
      type: object
      required: [error]
      properties:
        error: { type: string }
