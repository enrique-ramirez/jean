packages:
  - ui
  - site
  - contract

# pnpm's own default, in minutes. Under minimumReleaseAgeStrict pnpm fails an install that needs a
# younger version, where it would otherwise let one through and list it under minimumReleaseAgeExclude.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

catalog:
  '@biomejs/biome': 2.6.6
  '@playwright/test': 1.65.0
  '@tanstack/react-hotkeys': 0.22.0
  '@tanstack/react-query': 5.107.1
  '@tanstack/react-virtual': 3.14.26
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.2.1
  lucide-react: 1.70.0
  marked: 18.1.3
  openapi-fetch: 0.17.0
  react: 19.3.1
  react-dom: 19.3.1
  swagger-ui-dist: 5.34.1
  typescript: 7.0.2
  vite: 8.3.6
  yaml: 2.9.1

# swagger-ui-dist pulls in @scarf/scarf, whose install script reports the download to its publisher. Nothing of it is used.
allowBuilds:
  '@scarf/scarf': false
# @tanstack/react-hotkeys ships agent skills that pnpm 12 would link into .claude/skills/. Nothing of them is wanted here.
permissions:
  '@tanstack/react-hotkeys':
    skills: false
